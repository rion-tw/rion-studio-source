name: CI

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Optional ref to validate for a release or rebuild
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        continue-on-error: true
        with:
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name == 'push' }}
          shared-key: checks-${{ runner.os }}-${{ runner.arch }}

      - name: Check Rust formatting and lints
        run: pnpm run lint:rust

      - name: Test Rust workspace and generate contracts
        run: pnpm run test:rust

      - name: Verify generated Rust contracts
        run: git diff --exit-code -- src/shared/generated

      - name: Build and verify Rust Node-API core
        run: pnpm run build:rust:release && pnpm run verify:rust

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Verify v1 Rust surface behavior parity
        run: pnpm run verify:v1-parity

      - name: Lint
        run: pnpm run lint

      - name: Build app
        run: pnpm exec electron-vite build

  rust-concurrency-sanitizer:
    name: Linux Rust sanitizer and concurrency soak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install nightly Rust sanitizer toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Run macro runtime under AddressSanitizer
        run: cargo +nightly test -p rion-core --lib macro_runtime::tests --target x86_64-unknown-linux-gnu
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUSTFLAGS: -Zsanitizer=address

      - name: Repeat race-sensitive macro and health tests
        shell: bash
        run: |
          for iteration in $(seq 1 20); do
            echo "Concurrency soak iteration ${iteration}/20"
            cargo test -p rion-core --lib one_thousand_start_stop_cycles_drain_authoritative_runtime_state -- --test-threads=8
            cargo test -p rion-core --lib atomic_toggle_converges_without_a_phantom_invocation -- --test-threads=8
            cargo test -p rion-core --lib external_health_lane_does_not_block_a_later_deadline_macro_effect -- --test-threads=8
          done

  platform-package-smoke:
    name: ${{ matrix.name }} package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            package_args: --dir --mac --arm64
            packaged_core: release/0.0.0-development/mac-arm64/Rion Studio.app/Contents/Resources/native/rion-core.node
            packaged_executable: release/0.0.0-development/mac-arm64/Rion Studio.app/Contents/MacOS/Rion Studio
          - name: Windows x64
            os: windows-latest
            package_args: --dir --win --x64
            packaged_core: release/0.0.0-development/win-unpacked/resources/native/rion-core.node
            packaged_executable: release/0.0.0-development/win-unpacked/Rion Studio.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Configure macOS compiler cache
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          echo "ELECTRON_CACHE=${GITHUB_WORKSPACE}/.electron-cache" >> "${GITHUB_ENV}"
          echo "ELECTRON_BUILDER_CACHE=${GITHUB_WORKSPACE}/.electron-builder-cache" >> "${GITHUB_ENV}"

          if ! command -v ccache >/dev/null 2>&1; then
            if ! command -v brew >/dev/null 2>&1 || ! brew install ccache; then
              echo "ccache unavailable; falling back to the native clang compiler."
              echo "CC=clang" >> "${GITHUB_ENV}"
              echo "CXX=clang++" >> "${GITHUB_ENV}"
              exit 0
            fi
          fi

          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          echo "CC=ccache clang" >> "${GITHUB_ENV}"
          echo "CXX=ccache clang++" >> "${GITHUB_ENV}"

      - name: Restore macOS build caches
        if: runner.os == 'macOS'
        id: macos-build-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            .ccache
            .electron-cache
            .electron-builder-cache
            ~/Library/Caches/node-gyp
          key: macos-ccache-v1-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            macos-ccache-v1-${{ runner.arch }}-

      - name: Reset macOS compiler cache statistics
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --zero-stats
          fi

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        continue-on-error: true
        with:
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name == 'push' }}
          shared-key: platform-release-${{ runner.os }}-${{ runner.arch }}

      - name: Test Rust workspace
        run: pnpm run test:rust

      - name: Build and verify Rust Node-API core
        run: pnpm run build:rust:release && pnpm run verify:rust

      - name: Build app
        run: pnpm run build

      - name: Build and test macOS runtime tabs
        if: runner.os == 'macOS'
        run: pnpm run build:native:macos && pnpm run test:native:macos

      - name: Build unpacked application
        run: pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.package_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged Rust Node-API core
        run: node scripts/verifyPackagedRustCore.mjs "${{ matrix.packaged_executable }}" "${{ matrix.packaged_core }}"

      - name: Report macOS compiler cache statistics
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          fi

      - name: Save macOS build caches
        if: >-
          success() &&
          runner.os == 'macOS' &&
          github.event_name == 'push' &&
          steps.macos-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            .ccache
            .electron-cache
            .electron-builder-cache
            ~/Library/Caches/node-gyp
          key: macos-ccache-v1-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}
