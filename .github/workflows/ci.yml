name: Diagnostic AppKit initial presentation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact diagnostic branch or immutable SHA
        required: false
        type: string
      platform_scope:
        description: Compatibility input; this diagnostic is macOS only
        required: true
        type: choice
        default: macos
        options: [macos]

permissions:
  contents: read

jobs:
  appkit-initial-presentation:
    name: Diagnostic AppKit initial presentation (no release quality claim)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Electron Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          shared-key: electron-platform-ci-${{ runner.os }}-${{ runner.arch }}
      - name: Run exact visible Game Window journey with passive native submission evidence
        timeout-minutes: 25
        run: node scripts/runDesktopE2e.mjs --profile=chromium-macos-appkit-smoke --phase=chromium-game-window-ui-restart
        env:
          RION_STUDIO_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/.desktop-e2e-artifacts
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appkit-initial-presentation-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .desktop-e2e-artifacts
            !.desktop-e2e-artifacts/**/roles/*/browser/**
            !.desktop-e2e-artifacts/**/user-data/**

  appkit-native-restore-geometry:
    name: Diagnostic AppKit native restore geometry (no release quality claim)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Electron Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          shared-key: electron-platform-ci-${{ runner.os }}-${{ runner.arch }}
      - name: Build the exact desktop E2E native addon
        run: pnpm run build:electron:rust
        env:
          RION_STUDIO_DESKTOP_E2E_BUILD: "1"
      - name: Verify native AppKit fullscreen restore geometry
        shell: bash
        run: |
          mkdir -p .desktop-e2e-artifacts
          pnpm run probe:electron:appkit 2>&1 | tee .desktop-e2e-artifacts/appkit-native-restore-geometry.log
        env:
          RION_STUDIO_DESKTOP_E2E_BUILD: "1"
      - name: Preserve independent native geometry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appkit-native-restore-geometry-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: .desktop-e2e-artifacts/appkit-native-restore-geometry.log
