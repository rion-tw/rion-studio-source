name: Diagnostic desktop runtime evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact diagnostic branch or immutable SHA
        required: false
        type: string
      platform_scope:
        description: Select one platform for focused diagnostic evidence
        required: true
        type: choice
        default: macos
        options: [macos, windows]
      native_only:
        description: Collect only independent native probe evidence; skip the proved visible journey
        required: true
        type: boolean
        default: false
      macos_phase:
        description: Select the existing macOS visible journey without changing its prerequisites
        required: true
        type: choice
        default: game-window-ui-restart
        options: [game-window-ui-restart, keyboard, background-tab, mixed-recovery, role-reset, role-isolation, app-recovery, tabs-visible]

permissions:
  contents: read

jobs:
  appkit-initial-presentation:
    name: Diagnostic macOS focused journey (no release quality claim)
    if: ${{ inputs.platform_scope == 'macos' && !inputs.native_only }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Electron Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          shared-key: electron-platform-ci-${{ runner.os }}-${{ runner.arch }}
      - name: Preserve existing macOS keyboard preference overrides
        if: ${{ inputs.macos_phase == 'keyboard' || inputs.macos_phase == 'background-tab' }}
        shell: bash
        run: |
          mkdir -p .desktop-e2e-artifacts/runner-keyboard-preferences
          capture_domain() {
            local domain="$1"
            local name="$2"
            local root=".desktop-e2e-artifacts/runner-keyboard-preferences/$name"
            if /usr/bin/defaults export "$domain" - >"$root.plist" 2>"$root.stderr"; then
              printf '{"domain":"%s","status":"exported","meaning":"raw overrides only; unspecified bindings remain unknown"}\n' "$domain" >"$root.status.json"
            else
              local result=$?
              printf '{"domain":"%s","status":"unknown","exitCode":%s}\n' "$domain" "$result" >"$root.status.json"
            fi
          }
          capture_domain com.apple.symbolichotkeys symbolic-hotkeys
          capture_domain NSGlobalDomain global-keyboard-preferences
          capture_domain com.apple.keyboard keyboard-preferences
      - name: Compile and test exact AppKit resize method forwarding
        if: ${{ inputs.macos_phase == 'tabs-visible' }}
        shell: bash
        run: |
          root=".desktop-e2e-artifacts/native-resize-constraints-witness"
          mkdir -p "$root"
          /usr/bin/xcrun clang++ -std=c++20 -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -framework AppKit tests/fixtures/appkit-resize-diagnostic-hooks.mm \
            -o "$root/forwarding-fixture" >"$root/compile.stdout" 2>"$root/compile.stderr"
          "$root/forwarding-fixture" >"$root/forwarding-proof.json" 2>"$root/forwarding.stderr"
      - name: Compile and test the actual Swift resize endpoint quantization
        if: ${{ inputs.macos_phase == 'tabs-visible' }}
        shell: bash
        run: |
          root=".desktop-e2e-artifacts/native-resize-constraints-witness"
          mkdir -p "$root"
          node --input-type=module - "$root/quantization-fixture.swift" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const helper = readFileSync("e2e/desktop/support/workspace-window-resize.swift");
          const fixture = readFileSync("tests/fixtures/workspace-window-resize-deltas.swift");
          writeFileSync(process.argv[2], Buffer.concat([helper, Buffer.from("\n"), fixture]));
          NODE
          /usr/bin/xcrun swiftc -D RION_RESIZE_DELTA_TEST \
            "$root/quantization-fixture.swift" \
            -o "$root/resize-deltas" >"$root/quantization-compile.stdout" 2>"$root/quantization-compile.stderr"
          "$root/resize-deltas" >"$root/rawquantization-proof.json" 2>"$root/quantization.stderr"
      - name: Check the feature-enabled AppKit callback boundary
        if: ${{ inputs.macos_phase == 'tabs-visible' }}
        run: cargo clippy --locked -p rion-node --features desktop-e2e --all-targets --no-deps -- -D warnings
      - name: Test the feature-enabled AppKit callback boundary
        if: ${{ inputs.macos_phase == 'tabs-visible' }}
        run: |
          cargo test --locked -p rion-node --features desktop-e2e appkit_runtime_host::native_callback_json::
        env:
          RION_TEST_RESIZE_CHANNEL_FIXTURE: "1"
      - name: Test Rust carrier output through the diagnostic observer and production host boundary
        if: ${{ inputs.macos_phase == 'tabs-visible' }}
        run: |
          test -s .desktop-e2e-artifacts/native-resize-channel/rust-native-event.json
          pnpm exec vitest run tests/appkit-resize-diagnostic-carrier.test.mjs tests/appkit-resize-diagnostic-observer.test.ts
      - name: Read effective symbolic hotkeys through the public Carbon API
        if: ${{ inputs.macos_phase == 'keyboard' || inputs.macos_phase == 'background-tab' }}
        shell: bash
        run: |
          root=".desktop-e2e-artifacts/runner-keyboard-preferences/effective-symbolic-hotkeys"
          binary="$RUNNER_TEMP/rion-symbolic-hotkeys-$GITHUB_RUN_ID"
          cat >"$root.swift" <<'SWIFT'
          import Carbon
          import Foundation
          var unmanaged: Unmanaged<CFArray>?
          let status = CopySymbolicHotKeys(&unmanaged)
          let raw = unmanaged?.takeRetainedValue()
          let bindings = raw as? [[String: Any]]
          let modifierConstants = ["cmdKey": Int(cmdKey), "shiftKey": Int(shiftKey),
            "optionKey": Int(optionKey), "controlKey": Int(controlKey)]
          let value: [String: Any] = status == noErr && bindings != nil
            ? ["status": "captured", "osStatus": status, "bindings": bindings!, "modifierConstants": modifierConstants]
            : ["status": "unknown", "osStatus": status, "modifierConstants": modifierConstants]
          do {
            let data = try JSONSerialization.data(withJSONObject: value, options: [.prettyPrinted, .sortedKeys])
            FileHandle.standardOutput.write(data)
            FileHandle.standardOutput.write(Data([10]))
          } catch {
            print("{\"status\":\"unknown\",\"reason\":\"public-api-result-was-not-json-compatible\"}")
          }
          SWIFT
          if /usr/bin/xcrun swiftc "$root.swift" -o "$binary" >"$root.compile.stdout" 2>"$root.compile.stderr"; then
            if "$binary" >"$root.json" 2>"$root.stderr"; then
              printf '{"compile":"success","run":"success","result":"see public API JSON; unknown remains unknown"}\n' >"$root.status.json"
            else
              result=$?
              printf '{"compile":"success","run":"unknown","exitCode":%s}\n' "$result" >"$root.status.json"
            fi
          else
            result=$?
            printf '{"compile":"unknown","result":"unknown","exitCode":%s}\n' "$result" >"$root.status.json"
          fi
      - name: Run the exact selected visible macOS journey
        timeout-minutes: 25
        run: node scripts/runDesktopE2e.mjs --profile=chromium-macos-appkit-smoke --phase="$RION_STUDIO_DIAGNOSTIC_MACOS_PHASE"
        env:
          RION_STUDIO_DIAGNOSTIC_MACOS_PHASE: ${{ inputs.macos_phase == 'keyboard' && 'chromium-macro-cutover-keyboard' || inputs.macos_phase == 'background-tab' && 'chromium-macro-background-tab' || inputs.macos_phase == 'mixed-recovery' && 'chromium-mixed-recovery-restore' || inputs.macos_phase == 'role-reset' && 'chromium-role-session-reset-restart' || inputs.macos_phase == 'role-isolation' && 'chromium-role-session-isolation-restart' || inputs.macos_phase == 'app-recovery' && 'chromium-app-recovery-restore' || inputs.macos_phase == 'tabs-visible' && 'chromium-tabs-visible-restart' || 'chromium-game-window-ui-restart' }}
          RION_STUDIO_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/.desktop-e2e-artifacts
      - name: Observe the isolated plain Cocoa window with the same native resize sender
        if: ${{ always() && inputs.macos_phase == 'tabs-visible' }}
        run: node scripts/diagnoseAppKitPlainWindowResize.mjs .desktop-e2e-artifacts/native-resize-constraints-witness/plain-control
      - name: Verify the native resize carrier reached the terminal artifact
        if: ${{ always() && inputs.macos_phase == 'tabs-visible' }}
        run: node scripts/verifyAppKitResizeDiagnosticCarrier.mjs .desktop-e2e-artifacts
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appkit-initial-presentation-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .desktop-e2e-artifacts
            !.desktop-e2e-artifacts/**/roles/*/browser/**
            !.desktop-e2e-artifacts/**/user-data/**

  appkit-native-restore-geometry:
    name: Diagnostic AppKit native restore geometry (no release quality claim)
    if: ${{ inputs.platform_scope == 'macos' && (inputs.native_only || inputs.macos_phase == 'game-window-ui-restart') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Electron Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          shared-key: electron-platform-ci-${{ runner.os }}-${{ runner.arch }}
      - name: Build the exact desktop E2E native addon
        run: pnpm run build:electron:rust
        env:
          RION_STUDIO_DESKTOP_E2E_BUILD: "1"
      - name: Verify native AppKit fullscreen restore geometry
        shell: bash
        run: |
          mkdir -p .desktop-e2e-artifacts
          pnpm run probe:electron:appkit 2>&1 | tee .desktop-e2e-artifacts/appkit-native-restore-geometry.log
        env:
          RION_STUDIO_DESKTOP_E2E_BUILD: "1"
      - name: Preserve independent native geometry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appkit-native-restore-geometry-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: .desktop-e2e-artifacts/appkit-native-restore-geometry.log

  windows-terminal-cleanup:
    name: Diagnostic Windows terminal cleanup (no release quality claim)
    if: ${{ inputs.platform_scope == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Select and verify native pnpm on Windows
        shell: pwsh
        run: ./scripts/selectWindowsPnpm.ps1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Electron Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          shared-key: electron-platform-ci-${{ runner.os }}-${{ runner.arch }}
      - name: Verify desktop shell migration boundary
        run: pnpm run verify:system-only
      - name: Run visible terminal cleanup with required native prerequisite and restart
        timeout-minutes: 25
        run: node scripts/runDesktopE2e.mjs --profile=chromium-windows-smoke --phase=chromium-macro-cutover-terminal-cleanup-restart
        env:
          RION_STUDIO_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/.desktop-e2e-artifacts
          RION_STUDIO_E2E_USER_DATA_ROOT: ${{ runner.temp }}/rion-e2e-data
      - name: Preserve Windows terminal cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-terminal-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .desktop-e2e-artifacts
            !.desktop-e2e-artifacts/**/roles/*/browser/**
            !.desktop-e2e-artifacts/**/user-data/**
