name: CI

on:
  push:
    branches:
      - main
      - v4
  workflow_call:
    inputs:
      ref:
        description: Optional ref to validate for a release or rebuild
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          shared-key: checks-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri-only product boundary
        run: pnpm run verify:system-only

      - name: Check portable Rust formatting and lints
        run: pnpm run lint:rust:portable

      - name: Test portable Rust crates and generate contracts
        run: pnpm run test:rust:portable

      - name: Verify generated Rust contracts
        run: git diff --exit-code -- src/shared/generated

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test TypeScript and renderer behavior
        run: pnpm run test

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Build renderer application
        run: pnpm run build:renderer

  rust-concurrency-sanitizer:
    name: Linux Rust sanitizer and concurrency soak
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install nightly Rust sanitizer toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Run macro runtime under AddressSanitizer
        run: cargo +nightly test -p rion-core --lib macro_runtime::tests --target x86_64-unknown-linux-gnu
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUSTFLAGS: -Zsanitizer=address

      - name: Repeat race-sensitive macro and health tests
        shell: bash
        run: |
          for iteration in $(seq 1 20); do
            echo "Concurrency soak iteration ${iteration}/20"
            cargo test -p rion-core --lib one_thousand_start_stop_cycles_drain_authoritative_runtime_state -- --test-threads=8
            cargo test -p rion-core --lib atomic_toggle_converges_without_a_phantom_invocation -- --test-threads=8
            cargo test -p rion-core --lib role_lock_registries_stay_bounded_across_five_hundred_role_lifecycles -- --test-threads=8
          done

  platform-build:
    name: ${{ matrix.name }} Tauri platform build
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          shared-key: platform-tauri-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri-only product boundary
        run: pnpm run verify:system-only

      - name: Build renderer assets for Rust checks
        run: pnpm run build:renderer

      - name: Check target-platform Rust formatting and lints
        run: pnpm run lint:rust

      - name: Test target-platform Rust workspace
        run: pnpm run test:rust

      - name: Check target-platform Tauri shell
        run: cargo check -p rion-tauri --all-targets
