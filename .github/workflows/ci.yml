name: CI

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Optional ref to validate for a release or rebuild
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          shared-key: checks-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri-only product boundary
        run: pnpm run verify:system-only

      - name: Check Rust formatting and lints
        run: pnpm run lint:rust

      - name: Test Rust workspace and generate contracts
        run: pnpm run test:rust

      - name: Verify generated Rust contracts
        run: git diff --exit-code -- src/shared/generated

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test TypeScript and renderer behavior
        run: pnpm run test

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Build Tauri application
        run: pnpm run build

  rust-concurrency-sanitizer:
    name: Linux Rust sanitizer and concurrency soak
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install nightly Rust sanitizer toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Run macro runtime under AddressSanitizer
        run: cargo +nightly test -p rion-core --lib macro_runtime::tests --target x86_64-unknown-linux-gnu
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUSTFLAGS: -Zsanitizer=address

      - name: Repeat race-sensitive macro and health tests
        shell: bash
        run: |
          for iteration in $(seq 1 20); do
            echo "Concurrency soak iteration ${iteration}/20"
            cargo test -p rion-core --lib one_thousand_start_stop_cycles_drain_authoritative_runtime_state -- --test-threads=8
            cargo test -p rion-core --lib atomic_toggle_converges_without_a_phantom_invocation -- --test-threads=8
            cargo test -p rion-core --lib role_lock_registries_stay_bounded_across_five_hundred_role_lifecycles -- --test-threads=8
          done

  platform-package-smoke:
    name: ${{ matrix.name }} Tauri package smoke
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            tauri_bundle: app
          - name: Windows x64
            os: windows-latest
            tauri_bundle: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          shared-key: platform-tauri-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri-only product boundary
        run: pnpm run verify:system-only

      - name: Attest macOS System WebView behavior
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run test:native:system-input
          pnpm run test:native:runtime-restore
          pnpm run test:native:file-operations
          echo "RION_STUDIO_MACOS_INPUT_ATTESTED_MAJOR=$(sw_vers -productVersion | cut -d. -f1)" >> "${GITHUB_ENV}"

      - name: Attest Windows System WebView behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm run test:native:system-input
          pnpm run test:native:runtime-restore
          pnpm run test:native:file-operations
          "RION_STUDIO_WINDOWS_INPUT_ATTESTED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build target-platform Tauri bundle
        run: pnpm exec tauri build --bundles ${{ matrix.tauri_bundle }}

      - name: Verify packaged macOS System WebView behavior
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          executable="target/release/bundle/macos/Rion Studio.app/Contents/MacOS/rion-tauri"
          pnpm run test:native:system-input -- --executable "${executable}" --require-compiled-attestation
          pnpm run test:native:runtime-restore -- --executable "${executable}"
          pnpm run test:native:file-operations -- --executable "${executable}"

      - name: Verify packaged Windows System WebView behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm run test:native:system-input -- --executable target/release/rion-tauri.exe --require-compiled-attestation
          pnpm run test:native:runtime-restore -- --executable target/release/rion-tauri.exe
          pnpm run test:native:file-operations -- --executable target/release/rion-tauri.exe
