name: Extended desktop E2E

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable release-candidate SHA to validate
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Immutable release-candidate SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-e2e-extended-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  windows-mixed-dpi:
    name: Windows mixed-DPI multi-monitor
    runs-on: [self-hosted, Windows, X64, rion-desktop-e2e]
    timeout-minutes: 120
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify immutable checkout
        shell: pwsh
        run: |
          $expected = "${{ inputs.ref || github.sha }}"
          $actual = git rev-parse HEAD
          if ($expected -notmatch '^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$') {
            throw "Extended E2E ref must be a full immutable Git SHA: $expected"
          }
          if ($actual -ne $expected) {
            throw "Extended E2E checkout mismatch: expected $expected, actual $actual"
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hosted and extended native scenarios
        run: pnpm run test:e2e:desktop:extended
        env:
          RION_STUDIO_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/.desktop-e2e-artifacts
          RION_STUDIO_E2E_COMMIT: ${{ inputs.ref || github.sha }}

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-extended-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .desktop-e2e-artifacts

  macos-spaces:
    name: macOS multi-display fullscreen Spaces
    runs-on: [self-hosted, macOS, ARM64, rion-desktop-e2e]
    timeout-minutes: 120
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Verify immutable checkout
        shell: bash
        run: |
          expected='${{ inputs.ref || github.sha }}'
          actual="$(git rev-parse HEAD)"
          if [[ ! "$expected" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo "Extended E2E ref must be a full immutable Git SHA: $expected" >&2
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "Extended E2E checkout mismatch: expected $expected, actual $actual" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hosted and extended native scenarios
        run: pnpm run test:e2e:desktop:extended
        env:
          RION_STUDIO_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/.desktop-e2e-artifacts
          RION_STUDIO_E2E_COMMIT: ${{ inputs.ref || github.sha }}

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-e2e-extended-macos-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .desktop-e2e-artifacts
