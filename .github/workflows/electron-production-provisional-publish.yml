            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" \
            --capsule-operation "${capsule_operation}" \
            --capsule-operation-sha256 "${CAPSULE_OPERATION_SHA256}" \
            --store-seal "${store_seal}" \
            --seal-operation "${seal_operation}" \
            --seal-operation-sha256 "${SEAL_OPERATION_SHA256}" \
            > /dev/null

      - name: Independently re-verify the pinned prior candidate before exposure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RECEIPT_SHA256: ${{ inputs.prior_candidate_receipt_sha256 }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "${RION_STUDIO_UPDATER_PUBLIC_KEY}"
          run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_CANDIDATE_RUN_ID}")"
          test "$(jq -r .path <<< "${run_json}")" \
            = ".github/workflows/electron-production-candidate.yml"
          test "$(jq -r .event <<< "${run_json}")" = "workflow_dispatch"
          test "$(jq -r .conclusion <<< "${run_json}")" = "success"
          test "$(jq -r .head_branch <<< "${run_json}")" = "main"
          test "$(jq -r .head_sha <<< "${run_json}")" = "${PRIOR_CANDIDATE_CONTROL_SHA}"
          test "$(jq -r .run_attempt <<< "${run_json}")" = "${PRIOR_CANDIDATE_RUN_ATTEMPT}"
          test "$(jq -r .repository.full_name <<< "${run_json}")" \
            = "${SOURCE_CONTROL_REPOSITORY}"
          test "$(jq -r .head_repository.full_name <<< "${run_json}")" \
            = "${SOURCE_CONTROL_REPOSITORY}"

          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir publisher-prior-candidate/bundle
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-macos-arm64-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir publisher-prior-candidate/macos
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-windows-x64-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir publisher-prior-candidate/windows
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-trusted-control-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir publisher-prior-candidate/control
          cmp recovery-capsule/electron-production-prior-candidate-receipt.json \
            publisher-prior-candidate/bundle/electron-production-candidate-receipt.json
          cmp recovery-capsule/electron-production-prior-candidate-trusted-control-receipt.json \
            publisher-prior-candidate/control/electron-production-candidate-trusted-control-receipt.json
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { readTrustedControlReceipt } from
            "./scripts/electronProductionCandidateTrustedControl.mjs";
          import { verifyElectronProductionCandidateBundle } from
            "./scripts/electronProductionCandidateVerifier.mjs";
          import { assertSemanticVersionIsNewer } from
            "./scripts/electronUpdaterCompatibilityReceiptIo.mjs";

          const root = `${process.cwd()}/publisher-prior-candidate`;
          const control = await readTrustedControlReceipt({
            controlPlaneSha: process.env.PRIOR_CANDIDATE_CONTROL_SHA,
            receiptPath: `${root}/control/electron-production-candidate-trusted-control-receipt.json`,
            repository: process.env.GITHUB_REPOSITORY,
            runAttempt: Number(process.env.PRIOR_CANDIDATE_RUN_ATTEMPT),
            runId: process.env.PRIOR_CANDIDATE_RUN_ID,
            sourceSha: process.env.PRIOR_ELECTRON_SOURCE_SHA,
            version: process.env.PRIOR_ELECTRON_VERSION
          });
          const verified = await verifyElectronProductionCandidateBundle({
            candidateDirectory: `${root}/bundle/candidate`,
            candidateReceiptPath: `${root}/bundle/electron-production-candidate-receipt.json`,
            candidateReceiptSha256: process.env.PRIOR_CANDIDATE_RECEIPT_SHA256,
            macDirectory: `${root}/macos`,
            publicKey: process.env.RION_STUDIO_UPDATER_PUBLIC_KEY,
            sourceSha: process.env.PRIOR_ELECTRON_SOURCE_SHA,
            version: process.env.PRIOR_ELECTRON_VERSION,
            windowsDirectory: `${root}/windows`
          });
          if (control.receipt.candidate.publishedAt !== verified.receipt.publishedAt ||
              control.receipt.candidate.updaterBaseUrl !== verified.updaterBaseUrl ||
              control.receipt.candidate.updaterEndpoint !== verified.updaterEndpoint ||
              control.receipt.updaterTrust.publicKeySha256 !== verified.receipt.publicKeySha256) {
            throw new Error("The trusted control receipt does not bind the verified prior candidate.");
          }
          assertSemanticVersionIsNewer(
            process.env.VERSION,
            verified.version,
            "last-moment publication target relative to the independently verified prior Electron candidate"
          );
          await writeFile(`${root}/electron-production-prior-candidate-verification.json`,
            serializeCanonicalJson({
              schemaVersion: 1,
              kind: "rion-electron-production-prior-candidate-verification",
              candidate: {
                assets: verified.assets,
                receiptSha256: verified.receiptSha256,
                sourceSha: verified.sourceSha,
                version: verified.version
              },
              controlPlane: {
                ref: "refs/heads/main",
                repository: process.env.GITHUB_REPOSITORY,
                sha: process.env.PRIOR_CANDIDATE_CONTROL_SHA,
                workflow: ".github/workflows/electron-production-candidate.yml"
              },
              producer: {
                runAttempt: Number(process.env.PRIOR_CANDIDATE_RUN_ATTEMPT),
                runId: process.env.PRIOR_CANDIDATE_RUN_ID
              },
              trustedControlReceiptSha256: control.receiptSha256
            }), { flag: "wx", mode: 0o600 });
          NODE
          cmp recovery-capsule/electron-production-prior-candidate-verification.json \
            publisher-prior-candidate/electron-production-prior-candidate-verification.json

      - name: Observe the CAS precondition before creating a write token
        id: preflight
        shell: bash
        env:
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p publication-state/preflight publication-state/receipts
          capture_latest() {
            local root="${PWD}/publication-state/preflight"
            mkdir -p "${root}/assets"
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" > "${root}/release-api.json"
            local tag
            tag="$(jq -r .tag_name "${root}/release-api.json")"
            local tag_ref
            tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${tag}")"
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
            local tag_commit
            tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
            local names=(
              Rion.Studio-mac.app.tar.gz
              Rion.Studio-mac.app.tar.gz.sig
              Rion.Studio-mac.dmg
              Rion.Studio-win.exe
              Rion.Studio-win.exe.sig
              SHA256SUMS.txt
              latest.json
            )
            test "$(jq '.assets | length' "${root}/release-api.json")" = "7"
            for name in "${names[@]}"; do
              test "$(jq --arg name "${name}" '[.assets[] | select(.name == $name)] | length' \
                "${root}/release-api.json")" = "1"
              local asset_id
              asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
                "${root}/release-api.json")"
              gh api -H "Accept: application/octet-stream" \
                "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                > "${root}/assets/${name}"
            done
            RELEASE_API="${root}/release-api.json" TAG_COMMIT="${tag_commit}" \
            node --input-type=module <<'NODE' > "${root}/release-metadata.json"
            import { readFile } from "node:fs/promises";
            import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
            const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
            process.stdout.write(serializeCanonicalJson({
              repository: "rion-tw/rion-studio", id: String(release.id),
              tag: release.tag_name, targetCommitish: process.env.TAG_COMMIT,
              isLatest: true, draft: release.draft, prerelease: release.prerelease,
              assets: release.assets.map((asset) => ({
                id: String(asset.id), name: asset.name, bytes: asset.size,
                digest: asset.digest, url: asset.browser_download_url,
                contentType: asset.content_type
              }))
            }));
          NODE
            local candidate_options=()
            if test "${tag}" = "v${VERSION}"; then
              candidate_options=(
                --candidate-receipt "${PWD}/recovery-capsule/electron-production-candidate-receipt.json"
                --candidate-receipt-sha256 "${CANDIDATE_RECEIPT_SHA256}"
              )
            fi
            node scripts/electronProductionPublicationCli.mjs snapshot \
              --asset-directory "${root}/assets" \
              "${candidate_options[@]}" \
              --release-json "${root}/release-metadata.json" \
              --output "${root}/observed-latest-snapshot.json"
          }

          set +e
          (set -e; capture_latest)
          capture_status=$?
          set -e
          if test "${capture_status}" = "0" && \
             cmp -s recovery-capsule/source-public-latest-snapshot.json \
               publication-state/preflight/observed-latest-snapshot.json; then
            echo "can_publish=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if test "${capture_status}" = "0"; then
            observation_kind="snapshot"
            observed_path="${PWD}/publication-state/preflight/observed-latest-snapshot.json"
            observed_sha="$(sha256sum "${observed_path}" | cut -d ' ' -f 1)"
          else
            observation_kind="unknown"
            observed_path=""
            observed_sha=""
          fi
          ACKNOWLEDGEMENT="not-submitted" \
          CAPSULE_ROOT="${PWD}/recovery-capsule" \
          LEASE_GENERATION="${LEASE_GENERATION}" \
          LEASE_ID="${LEASE_ID}" \
          LEASE_STATUS="lost" \
          OBSERVATION_KIND="${observation_kind}" \
          OBSERVED_PATH="${observed_path}" \
          OBSERVED_SHA256="${observed_sha}" \
          OUTPUT_ROOT="${PWD}/publication-state/receipts" \
          RECORDED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          node --input-type=module <<'NODE' > publication-state/preflight-result.json
          import path from "node:path";
          import { readFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { readElectronProductionPublicLatestSnapshot } from "./scripts/electronProductionPublicLatestSnapshot.mjs";
          import { ELECTRON_PRODUCTION_PUBLICATION_RECEIPT_NAMES, readElectronProductionPublicationReceipt, writeElectronProductionPublicationReceipt } from "./scripts/electronProductionPublicationReceipt.mjs";
          import { recordElectronProductionPublicationResult } from "./scripts/electronProductionPublicationTransaction.mjs";
          const digest = async (file) => createHash("sha256").update(await readFile(file)).digest("hex");
          const root = process.env.CAPSULE_ROOT;
          const sourcePath = path.join(root, "source-public-latest-snapshot.json");
          const targetPath = path.join(root, "target-public-latest-projection.json");
          const intentPath = path.join(root, "electron-production-publication-intent-receipt.json");
          const source = (await readElectronProductionPublicLatestSnapshot({ snapshotPath: sourcePath, expectedFileSha256: await digest(sourcePath) })).snapshot;
          const target = (await readElectronProductionPublicLatestSnapshot({ snapshotPath: targetPath, expectedFileSha256: await digest(targetPath) })).snapshot;
          const previous = (await readElectronProductionPublicationReceipt({ receiptPath: intentPath, expectedSha256: await digest(intentPath) })).receipt;
          const observed = process.env.OBSERVATION_KIND === "snapshot"
            ? (await readElectronProductionPublicLatestSnapshot({ snapshotPath: process.env.OBSERVED_PATH, expectedFileSha256: process.env.OBSERVED_SHA256 })).snapshot
            : null;
          const receipt = recordElectronProductionPublicationResult({
            acknowledgement: process.env.ACKNOWLEDGEMENT,
            lease: { id: process.env.LEASE_ID, generation: Number(process.env.LEASE_GENERATION), status: process.env.LEASE_STATUS, foreignLeaseId: null, foreignLeaseGeneration: null },
            observedSnapshot: observed,
            previousReceipt: previous,
            recordedAt: process.env.RECORDED_AT,
            sourceSnapshot: source,
            targetSnapshot: target
          });
          const outputPath = path.join(process.env.OUTPUT_ROOT, ELECTRON_PRODUCTION_PUBLICATION_RECEIPT_NAMES[receipt.phase]);
          const written = await writeElectronProductionPublicationReceipt({ outputPath, receipt });
          process.stdout.write(JSON.stringify({ phase: receipt.phase, path: written.receiptPath, sha256: written.receiptIdentity.sha256 }));
          NODE
          echo "can_publish=false" >> "${GITHUB_OUTPUT}"
          echo "result_json=${PWD}/publication-state/preflight-result.json" >> "${GITHUB_OUTPUT}"

      - name: Create the narrow public-latest writer token
        if: steps.preflight.outputs.can_publish == 'true'
        id: public-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RION_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
          owner: rion-tw
          repositories: rion-studio
          permission-contents: write

      - name: Observe the exact held remote lease immediately before last-moment CAS
        if: steps.preflight.outputs.can_publish == 'true'
        id: lease-observation
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          held_lease="${PWD}/recovery-capsule/electron-production-public-latest-lease.json"
          test "$(sha256sum "${held_lease}" | cut -d ' ' -f 1)" = "${HELD_LEASE_SHA256}"
          output_root="${PWD}/publication-state/held-pre-mutation"
          mkdir -p "${output_root}"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs observe \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --output "${output_root}/electron-production-public-latest-lease.json" \
            > "${output_root}/observe-operation.json"
          cmp "${held_lease}" \
            "${output_root}/electron-production-public-latest-lease.json"
          test "$(jq -r .command "${output_root}/observe-operation.json")" = "observe"
          test "$(jq -r .outcome "${output_root}/observe-operation.json")" = "observed"
          test "$(jq -r .output.sha256 "${output_root}/observe-operation.json")" \
            = "${HELD_LEASE_SHA256}"
          echo "held=true" >> "${GITHUB_OUTPUT}"

      - name: Re-read exact target then source at the last-moment CAS boundary
        if: >-
          steps.preflight.outputs.can_publish == 'true' &&
          steps.lease-observation.outputs.held == 'true'
        id: last-moment-cas
        shell: bash
        env:
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          STAGED_SNAPSHOT_SHA256: ${{ needs.stage-target.outputs.staged_snapshot_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test "$(sha256sum recovery-capsule/source-public-latest-snapshot.json | cut -d ' ' -f 1)" \
            = "${SOURCE_SNAPSHOT_SHA256}"
          test "$(sha256sum recovery-capsule/staged-target-public-release-snapshot.json | cut -d ' ' -f 1)" \
            = "${STAGED_SNAPSHOT_SHA256}"

          capture_release() {
            local api_path="$1"
            local root="$2"
            local is_latest="$3"
            local candidate_bound="$4"
            mkdir -p "${root}/assets"
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/${api_path}" \
              > "${root}/release-api.json"
            local release_id tag tag_ref tag_commit
            release_id="$(jq -r .id "${root}/release-api.json")"
            tag="$(jq -r .tag_name "${root}/release-api.json")"
            [[ "${release_id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
            tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${tag}")"
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
            tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
            [[ "${tag_commit}" =~ ^[0-9a-f]{40}$ ]]
            local names=(
              Rion.Studio-mac.app.tar.gz
              Rion.Studio-mac.app.tar.gz.sig
              Rion.Studio-mac.dmg
              Rion.Studio-win.exe
              Rion.Studio-win.exe.sig
              SHA256SUMS.txt
              latest.json
            )
            test "$(jq '.assets | length' "${root}/release-api.json")" = "7"
            for name in "${names[@]}"; do
              test "$(jq --arg name "${name}" '[.assets[] | select(.name == $name)] | length' \
                "${root}/release-api.json")" = "1"
              local asset_id
              asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
                "${root}/release-api.json")"
              [[ "${asset_id}" =~ ^[1-9][0-9]*$ ]]
              gh api -H "Accept: application/octet-stream" \
                "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                > "${root}/assets/${name}"
            done
            RELEASE_API="${root}/release-api.json" \
            TAG_COMMIT="${tag_commit}" \
            IS_LATEST="${is_latest}" \
            node --input-type=module <<'NODE' > "${root}/release-metadata.json"
            import { readFile } from "node:fs/promises";
            import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
            const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
            process.stdout.write(serializeCanonicalJson({
              repository: "rion-tw/rion-studio",
              id: String(release.id),
              tag: release.tag_name,
              targetCommitish: process.env.TAG_COMMIT,
              isLatest: process.env.IS_LATEST === "true",
              draft: release.draft,
              prerelease: release.prerelease,
              assets: release.assets.map((asset) => ({
                id: String(asset.id), name: asset.name, bytes: asset.size,
                digest: asset.digest, url: asset.browser_download_url,
                contentType: asset.content_type
              }))
            }));
          NODE
            local candidate_options=()
            if test "${candidate_bound}" = "true"; then
              candidate_options=(
                --candidate-receipt "${PWD}/recovery-capsule/electron-production-candidate-receipt.json"
                --candidate-receipt-sha256 "${CANDIDATE_RECEIPT_SHA256}"
              )
            fi
            node scripts/electronProductionPublicationCli.mjs snapshot \
              --asset-directory "${root}/assets" \
              "${candidate_options[@]}" \
              --release-json "${root}/release-metadata.json" \
              --output "${root}/observed-release-snapshot.json"
          }

          target_root="${PWD}/publication-state/last-moment-target"
          capture_release "releases/tags/v${VERSION}" "${target_root}" false true
          test "$(jq -r .tag_name "${target_root}/release-api.json")" = "v${VERSION}"
          target_release_id="$(jq -r .id "${target_root}/release-api.json")"
          latest_release_id="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)"
          test "${target_release_id}" != "${latest_release_id}"
          cmp recovery-capsule/staged-target-public-release-snapshot.json \
            "${target_root}/observed-release-snapshot.json"
          node scripts/electronProductionPublicationCli.mjs project-target \
            --staged-snapshot "${target_root}/observed-release-snapshot.json" \
            --staged-snapshot-sha256 "$(sha256sum "${target_root}/observed-release-snapshot.json" | cut -d ' ' -f 1)" \
            --output "${target_root}/observed-target-projection.json"
          cmp recovery-capsule/target-public-latest-projection.json \
            "${target_root}/observed-target-projection.json"

          source_root="${PWD}/publication-state/last-moment-source"
          capture_release "releases/latest" "${source_root}" true false
          cmp recovery-capsule/source-public-latest-snapshot.json \
            "${source_root}/observed-release-snapshot.json"
          echo "verified=true" >> "${GITHUB_OUTPUT}"

      - name: Submit the latest mutation without converting an unknown acknowledgement to success
        if: >-
          steps.preflight.outputs.can_publish == 'true' &&
          steps.lease-observation.outputs.held == 'true' &&
          steps.last-moment-cas.outputs.verified == 'true'
        id: mutation
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p publication-work/mutation
          target_release_id="$(jq -er .release.id \
            recovery-capsule/target-public-latest-projection.json)"
          [[ "${target_release_id}" =~ ^[1-9][0-9]*$ ]]
          set +e
          gh api --method PATCH --include \
            "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${target_release_id}" \
            -f make_latest=true \
            > publication-work/mutation/response.txt \
            2> publication-work/mutation/error.txt
          mutation_status=$?
          set -e
          http_status="$(sed -nE \
            's/^HTTP\/[0-9.]+ ([0-9]{3})( .*)?$/\1/p' \
            publication-work/mutation/response.txt | tail -n 1)"
          if test "${mutation_status}" = "0" && test "${http_status}" = "200"; then
            echo "acknowledgement=confirmed" >> "${GITHUB_OUTPUT}"
          elif [[ "${http_status}" =~ ^4[0-9]{2}$ ]]; then
            echo "acknowledgement=rejected" >> "${GITHUB_OUTPUT}"
          else
            echo "acknowledgement=unknown" >> "${GITHUB_OUTPUT}"
          fi

      - name: Re-observe exact public state and close the publication event
        if: ${{ always() && steps.preflight.outputs.can_publish == 'true' }}
        id: post-result
        shell: bash
        env:
          ACKNOWLEDGEMENT: ${{ steps.mutation.outputs.acknowledgement || 'not-submitted' }}
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          LEASE_OBSERVATION_OUTCOME: ${{ steps.lease-observation.outcome }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p publication-state/post publication-state/receipts
          capture_latest() {
            local root="${PWD}/publication-state/post"
            mkdir -p "${root}/assets"
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" > "${root}/release-api.json"
            local tag
            tag="$(jq -r .tag_name "${root}/release-api.json")"
            local tag_ref
            tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${tag}")"
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
            local tag_commit
            tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
            local names=(
              Rion.Studio-mac.app.tar.gz
              Rion.Studio-mac.app.tar.gz.sig
              Rion.Studio-mac.dmg
              Rion.Studio-win.exe
              Rion.Studio-win.exe.sig
              SHA256SUMS.txt
              latest.json
            )
            test "$(jq '.assets | length' "${root}/release-api.json")" = "7"
            for name in "${names[@]}"; do
              test "$(jq --arg name "${name}" '[.assets[] | select(.name == $name)] | length' \
                "${root}/release-api.json")" = "1"
              local asset_id
              asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
                "${root}/release-api.json")"
              gh api -H "Accept: application/octet-stream" \
                "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                > "${root}/assets/${name}"
            done
            RELEASE_API="${root}/release-api.json" TAG_COMMIT="${tag_commit}" \
            node --input-type=module <<'NODE' > "${root}/release-metadata.json"
            import { readFile } from "node:fs/promises";
            import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
            const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
            process.stdout.write(serializeCanonicalJson({
              repository: "rion-tw/rion-studio", id: String(release.id),
              tag: release.tag_name, targetCommitish: process.env.TAG_COMMIT,
              isLatest: true, draft: release.draft, prerelease: release.prerelease,
              assets: release.assets.map((asset) => ({
                id: String(asset.id), name: asset.name, bytes: asset.size,
                digest: asset.digest, url: asset.browser_download_url,
                contentType: asset.content_type
              }))
            }));
          NODE
            local candidate_options=()
            if test "${tag}" = "v${VERSION}"; then
              candidate_options=(
                --candidate-receipt "${PWD}/recovery-capsule/electron-production-candidate-receipt.json"
                --candidate-receipt-sha256 "${CANDIDATE_RECEIPT_SHA256}"
              )
            fi
            node scripts/electronProductionPublicationCli.mjs snapshot \
              --asset-directory "${root}/assets" \
              "${candidate_options[@]}" \
              --release-json "${root}/release-metadata.json" \
              --output "${root}/observed-latest-snapshot.json"
          }

          capture_restorable_source() {
            local root="${PWD}/publication-state/restorable-source"
            local source_tag
            source_tag="$(jq -r .release.tag recovery-capsule/source-public-latest-snapshot.json)"
            mkdir -p "${root}/assets"
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/tags/${source_tag}" \
              > "${root}/release-api.json"
            local source_release_id latest_release_id
            source_release_id="$(jq -r .id "${root}/release-api.json")"
            latest_release_id="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)"
            test "${source_release_id}" != "${latest_release_id}"
            local tag_ref
            tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${source_tag}")"
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
            local tag_commit
            tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
            local names=(
              Rion.Studio-mac.app.tar.gz
              Rion.Studio-mac.app.tar.gz.sig
              Rion.Studio-mac.dmg
              Rion.Studio-win.exe
              Rion.Studio-win.exe.sig
              SHA256SUMS.txt
              latest.json
            )
            test "$(jq '.assets | length' "${root}/release-api.json")" = "7"
            for name in "${names[@]}"; do
              test "$(jq --arg name "${name}" '[.assets[] | select(.name == $name)] | length' \
                "${root}/release-api.json")" = "1"
              local asset_id
              asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
                "${root}/release-api.json")"
              gh api -H "Accept: application/octet-stream" \
                "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                > "${root}/assets/${name}"
            done
            RELEASE_API="${root}/release-api.json" TAG_COMMIT="${tag_commit}" \
            node --input-type=module <<'NODE' > "${root}/release-metadata.json"
            import { readFile } from "node:fs/promises";
            import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
            const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
            process.stdout.write(serializeCanonicalJson({
              repository: "rion-tw/rion-studio", id: String(release.id),
              tag: release.tag_name, targetCommitish: process.env.TAG_COMMIT,
              isLatest: false, draft: release.draft, prerelease: release.prerelease,
              assets: release.assets.map((asset) => ({
                id: String(asset.id), name: asset.name, bytes: asset.size,
                digest: asset.digest, url: asset.browser_download_url,
                contentType: asset.content_type
              }))
            }));
          NODE
            node scripts/electronProductionPublicationCli.mjs snapshot \
              --asset-directory "${root}/assets" \
              --release-json "${root}/release-metadata.json" \
              --output "${root}/observed-restorable-source-snapshot.json"
            SOURCE_PATH="${PWD}/recovery-capsule/source-public-latest-snapshot.json" \
            OBSERVED_PATH="${root}/observed-restorable-source-snapshot.json" \
            node --input-type=module <<'NODE'
            import { createHash } from "node:crypto";
            import { readFile } from "node:fs/promises";
            import {
              assertElectronProductionRestorableSourceRelease,
              readElectronProductionPublicLatestSnapshot
            } from "./scripts/electronProductionPublicLatestSnapshot.mjs";
            const digest = async (file) => createHash("sha256")
              .update(await readFile(file)).digest("hex");
            const source = (await readElectronProductionPublicLatestSnapshot({
              snapshotPath: process.env.SOURCE_PATH,
              expectedFileSha256: await digest(process.env.SOURCE_PATH)
            })).snapshot;
            const observed = (await readElectronProductionPublicLatestSnapshot({
              snapshotPath: process.env.OBSERVED_PATH,
              expectedFileSha256: await digest(process.env.OBSERVED_PATH)
            })).snapshot;
            assertElectronProductionRestorableSourceRelease({ source, observed });
          NODE
          }

          set +e
          (set -e; capture_latest)
          capture_status=$?
          set -e
          effective_acknowledgement="${ACKNOWLEDGEMENT}"
          if test "${capture_status}" = "0" && \
             test "$(jq -r .tag_name publication-state/post/release-api.json)" = "v${VERSION}"; then
            set +e
            (set -e; capture_restorable_source)
            restorable_status=$?
            set -e
            if test "${restorable_status}" != "0"; then
              effective_acknowledgement="unknown"
            fi
          fi
          if test "${capture_status}" = "0"; then
            observation_kind="snapshot"
            observed_path="${PWD}/publication-state/post/observed-latest-snapshot.json"
            observed_sha="$(sha256sum "${observed_path}" | cut -d ' ' -f 1)"
          else
            observation_kind="unknown"
            observed_path=""
            observed_sha=""
          fi
          lease_status="held"
          if test "${LEASE_OBSERVATION_OUTCOME}" != "success"; then
            lease_status="lost"
          fi
          CAPSULE_ROOT="${PWD}/recovery-capsule" \
          ACKNOWLEDGEMENT="${effective_acknowledgement}" \
          LEASE_GENERATION="${LEASE_GENERATION}" \
          LEASE_ID="${LEASE_ID}" \
          LEASE_STATUS="${lease_status}" \
          OBSERVATION_KIND="${observation_kind}" \
          OBSERVED_PATH="${observed_path}" \
          OBSERVED_SHA256="${observed_sha}" \
          OUTPUT_ROOT="${PWD}/publication-state/receipts" \
          RECORDED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          node --input-type=module <<'NODE' > publication-state/post-result.json
          import path from "node:path";
          import { readFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { classifyElectronProductionPublicLatestSnapshot, readElectronProductionPublicLatestSnapshot } from "./scripts/electronProductionPublicLatestSnapshot.mjs";
          import { ELECTRON_PRODUCTION_PUBLICATION_RECEIPT_NAMES, readElectronProductionPublicationReceipt, writeElectronProductionPublicationReceipt } from "./scripts/electronProductionPublicationReceipt.mjs";
          import { recordElectronProductionPublicationResult } from "./scripts/electronProductionPublicationTransaction.mjs";
          const digest = async (file) => createHash("sha256").update(await readFile(file)).digest("hex");
          const root = process.env.CAPSULE_ROOT;
          const sourcePath = path.join(root, "source-public-latest-snapshot.json");
          const targetPath = path.join(root, "target-public-latest-projection.json");
          const intentPath = path.join(root, "electron-production-publication-intent-receipt.json");
          const source = (await readElectronProductionPublicLatestSnapshot({ snapshotPath: sourcePath, expectedFileSha256: await digest(sourcePath) })).snapshot;
          const target = (await readElectronProductionPublicLatestSnapshot({ snapshotPath: targetPath, expectedFileSha256: await digest(targetPath) })).snapshot;
          const previous = (await readElectronProductionPublicationReceipt({ receiptPath: intentPath, expectedSha256: await digest(intentPath) })).receipt;
          const observed = process.env.OBSERVATION_KIND === "snapshot"
            ? (await readElectronProductionPublicLatestSnapshot({ snapshotPath: process.env.OBSERVED_PATH, expectedFileSha256: process.env.OBSERVED_SHA256 })).snapshot
            : null;
          const classification = observed === null
            ? "unknown"
            : classifyElectronProductionPublicLatestSnapshot({ observed, source, target });
          const receipt = recordElectronProductionPublicationResult({
            acknowledgement: process.env.ACKNOWLEDGEMENT,
            lease: { id: process.env.LEASE_ID, generation: Number(process.env.LEASE_GENERATION), status: process.env.LEASE_STATUS, foreignLeaseId: null, foreignLeaseGeneration: null },
            observedSnapshot: observed,
            previousReceipt: previous,
            recordedAt: process.env.RECORDED_AT,
            sourceSnapshot: source,
            targetSnapshot: target
          });
          const outputPath = path.join(process.env.OUTPUT_ROOT, ELECTRON_PRODUCTION_PUBLICATION_RECEIPT_NAMES[receipt.phase]);
          const written = await writeElectronProductionPublicationReceipt({ outputPath, receipt });
          process.stdout.write(JSON.stringify({
            acknowledgement: process.env.ACKNOWLEDGEMENT,
            classification,
            phase: receipt.phase,
            path: written.receiptPath,
            sha256: written.receiptIdentity.sha256
          }));
          NODE
          echo "acknowledgement=$(jq -er .acknowledgement publication-state/post-result.json)" \
            >> "${GITHUB_OUTPUT}"
          echo "classification=$(jq -er .classification publication-state/post-result.json)" \
            >> "${GITHUB_OUTPUT}"
          echo "result_json=${PWD}/publication-state/post-result.json" >> "${GITHUB_OUTPUT}"

      - name: Release the durable lease only for rejected exact-source cleanup
        id: release-lease
        if: >-
          ${{ always() &&
              steps.post-result.outputs.acknowledgement == 'rejected' &&
              steps.post-result.outputs.classification == 'source' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          held_lease="${PWD}/recovery-capsule/electron-production-public-latest-lease.json"
          test "$(sha256sum "${held_lease}" | cut -d ' ' -f 1)" = "${HELD_LEASE_SHA256}"
          observe_root="${PWD}/publication-state/held-pre-release"
          released_root="${PWD}/publication-state/released"
          mkdir -p "${observe_root}" "${released_root}"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs observe \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --output "${observe_root}/electron-production-public-latest-lease.json" \
            > "${observe_root}/observe-operation.json"
          cmp "${held_lease}" \
            "${observe_root}/electron-production-public-latest-lease.json"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs release \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --recorded-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${released_root}/electron-production-public-latest-lease.json" \
            > "${released_root}/release-operation.json"
          test "$(jq -r .command "${released_root}/release-operation.json")" = "release"
          test "$(jq -r .outcome "${released_root}/release-operation.json")" = "applied"
          test "$(jq -r .lease.status "${released_root}/release-operation.json")" = "released"
          echo "released=true" >> "${GITHUB_OUTPUT}"

      - name: Select the closed publication receipt and artifact name
        if: always()
        id: select-receipt
        shell: bash
        env:
          CAN_PUBLISH: ${{ steps.preflight.outputs.can_publish }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.result_json }}
          POST_RESULT: ${{ steps.post-result.outputs.result_json }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if test "${CAN_PUBLISH}" = "true"; then
            result_json="${POST_RESULT}"
          else
            result_json="${PREFLIGHT_RESULT}"
          fi
          test -f "${result_json}"
          receipt_phase="$(jq -r .phase "${result_json}")"
          receipt_path="$(jq -r .path "${result_json}")"
          receipt_sha256="$(jq -r .sha256 "${result_json}")"
          test "$(sha256sum "${receipt_path}" | cut -d ' ' -f 1)" = "${receipt_sha256}"
          mkdir publication-output
          cp "${receipt_path}" publication-output/
          if test "${receipt_phase}" = "provisional"; then
            artifact_name="electron-production-publication-provisional-${VERSION}-${SOURCE_SHA}-attempt-${GITHUB_RUN_ATTEMPT}"
          else
            artifact_name="electron-production-publication-recovery-required-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "receipt_phase=${receipt_phase}" >> "${GITHUB_OUTPUT}"
          echo "receipt_sha256=${receipt_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact provisional or fail-closed recovery receipt
        if: always() && steps.select-receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.select-receipt.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: publication-output

      - name: Upload only the closed remote lease observation evidence
        if: ${{ always() && steps.lease-observation.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-public-latest-lease-operations-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            publication-state/held-pre-mutation
            publication-state/held-pre-release
            publication-state/released

      - name: Require a confirmed exact-target provisional state with its held lease retained
        if: always()
        shell: bash
        env:
          RECEIPT_PHASE: ${{ steps.select-receipt.outputs.receipt_phase }}
          RELEASE_OUTCOME: ${{ steps.release-lease.outcome }}
        run: |
          set -euo pipefail
          test "${RELEASE_OUTCOME}" = "skipped"
          test "${RECEIPT_PHASE}" = "provisional"

  attest-provisional:
    name: Attest the non-terminal provisional receipt without release credentials
    needs: publish-provisional
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download the exact provisional receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-provisional-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-provisional

      - name: Verify the receipt identity selected by the writer
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.publish-provisional.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/publication-provisional/electron-production-publication-provisional-receipt.json"
          test "$(sha256sum "${receipt}" | cut -d ' ' -f 1)" = "${EXPECTED_SHA256}"

      - name: Attest the exact non-terminal provisional publication receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-provisional/electron-production-publication-provisional-receipt.json

  cleanup-held-lease-after-store-failure:
    name: Release an unmutated source lease after recovery-store failure
    # This cleanup is a public mutation and remains disabled. When enabled, it
    # is eligible only after the private persistence job fails before publish.
    if: ${{ false && always() && needs.persist-recovery-capsule.result == 'failure' }}
    needs:
      - verify-plan
      - acquire-public-latest-lease
      - create-intent
      - attest-intent
      - persist-recovery-capsule
    runs-on: ubuntu-latest
    environment: electron-production-release
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested recovery capsule directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: store-failure-cleanup/capsule

      - name: Download the attested canonical packed recovery capsule
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-package-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: store-failure-cleanup/package

      - name: Verify the exact capsule and attestations before public credentials
        shell: bash
        env:
          CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.candidate_control_sha }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.create-intent.outputs.capsule_sha256 }}
          EXPECTED_INTENT_SHA256: ${{ needs.create-intent.outputs.intent_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.create-intent.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          LEASE_EVENT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.lease_event_sha256 }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          root="${PWD}/store-failure-cleanup"
          capsule="${root}/package/electron-production-publication-recovery-capsule.capsule.json"
          manifest="${root}/capsule/electron-production-publication-recovery-capsule-manifest.json"
          intent="${root}/capsule/electron-production-publication-intent-receipt.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${capsule}" "${manifest}" "${intent}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          node scripts/electronProductionRecoveryCapsuleCli.mjs verify \
            --source-root "${root}/capsule" \
            --capsule-path "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --lease-id "${LEASE_ID}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-event-sha256 "${LEASE_EVENT_SHA256}" \
            --control-head-sha "${CONTROL_SHA}" \
            --control-run-id "${GITHUB_RUN_ID}" \
            --control-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --candidate-source-sha "${SOURCE_SHA}" \
            --candidate-version "${VERSION}" \
            --candidate-control-sha "${CANDIDATE_CONTROL_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --prior-candidate-source-sha "${PRIOR_ELECTRON_SOURCE_SHA}" \
            --prior-candidate-version "${PRIOR_ELECTRON_VERSION}" \
            --prior-candidate-control-sha "${PRIOR_CANDIDATE_CONTROL_SHA}" \
            --prior-candidate-run-id "${PRIOR_CANDIDATE_RUN_ID}" \
            --prior-candidate-run-attempt "${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            > /dev/null
          test "$(sha256sum "${intent}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_INTENT_SHA256}"

      - name: Fresh-observe exact source and the held lease before credentials
        id: safe-source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          root="${PWD}/store-failure-cleanup"
          held_lease="${root}/capsule/electron-production-public-latest-lease.json"
          source_snapshot="${root}/capsule/source-public-latest-snapshot.json"
          target_snapshot="${root}/capsule/target-public-latest-projection.json"
          mkdir -p "${root}/evidence/pre-source"
          mkdir -p "${root}/evidence/held"
          node scripts/electronProductionPublicLatestRecoveryCli.mjs observe \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${root}/evidence/pre-source/electron-production-public-latest-recovery-observation.json" \
            > "${root}/evidence/pre-source/observe-summary.json"
          test "$(jq -er .evidence.observationTransport "${root}/evidence/pre-source/observe-summary.json")" \
            = "observed"
          test "$(jq -er .evidence.observation "${root}/evidence/pre-source/observe-summary.json")" \
            = "source"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs observe \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --output "${root}/evidence/held/electron-production-public-latest-lease.json" \
            > "${root}/evidence/held/observe-operation.json"
          cmp "${held_lease}" \
            "${root}/evidence/held/electron-production-public-latest-lease.json"
          test "$(jq -er .outcome "${root}/evidence/held/observe-operation.json")" \
            = "observed"
          observation_sha256="$(sha256sum "${root}/evidence/pre-source/electron-production-public-latest-recovery-observation.json" | cut -d ' ' -f 1)"
          echo "observation_sha256=${observation_sha256}" >> "${GITHUB_OUTPUT}"
          echo "safe=true" >> "${GITHUB_OUTPUT}"

      - name: Create the narrow public lease-cleanup token
        if: steps.safe-source.outputs.safe == 'true'
        id: public-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RION_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
          owner: rion-tw
          repositories: rion-studio
          permission-contents: write

      - name: Release the exact held lease from a fresh exact source
        if: steps.safe-source.outputs.safe == 'true'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
          OBSERVATION_SHA256: ${{ steps.safe-source.outputs.observation_sha256 }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          root="${PWD}/store-failure-cleanup"
          mkdir -p "${root}/evidence/release"
          set +e
          node scripts/electronProductionPublicLatestRecoveryCli.mjs release-lease \
            --held-lease "${root}/capsule/electron-production-public-latest-lease.json" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --operation "${root}/evidence/pre-source/electron-production-public-latest-recovery-observation.json" \
            --operation-sha256 "${OBSERVATION_SHA256}" \
            --source-snapshot "${root}/capsule/source-public-latest-snapshot.json" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${root}/capsule/target-public-latest-projection.json" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --attempted-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --released-lease-output "${root}/evidence/release/electron-production-public-latest-lease.json" \
            --output "${root}/evidence/release/electron-production-public-latest-lease-release-operation.json" \
            > "${root}/evidence/release/release-summary.json"
          release_status=$?
          set -e
          acknowledgement="pre-fence-failed"
          operation="${root}/evidence/release/electron-production-public-latest-lease-release-operation.json"
          if test -f "${operation}"; then
            acknowledgement="$(jq -er .acknowledgement "${operation}")"
          fi
          echo "acknowledgement=${acknowledgement}" >> "${GITHUB_OUTPUT}"
          echo "release_status=${release_status}" >> "${GITHUB_OUTPUT}"

      - name: Record a fresh post-cleanup public observation
        if: always() && steps.public-token.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          root="${PWD}/store-failure-cleanup"
          mkdir -p "${root}/evidence/post-source"
          node scripts/electronProductionPublicLatestRecoveryCli.mjs observe \
            --source-snapshot "${root}/capsule/source-public-latest-snapshot.json" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${root}/capsule/target-public-latest-projection.json" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${root}/evidence/post-source/electron-production-public-latest-recovery-observation.json" \
            > "${root}/evidence/post-source/observe-summary.json"

      - name: Upload cleanup evidence including indeterminate acknowledgements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-store-failure-cleanup-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: store-failure-cleanup/evidence

      - name: Require a confirmed lease release without claiming unknown success
        if: always()
        shell: bash
        env:
          ACKNOWLEDGEMENT: ${{ steps.release.outputs.acknowledgement }}
          RELEASE_STATUS: ${{ steps.release.outputs.release_status }}
        run: |
          set -euo pipefail
          test "${ACKNOWLEDGEMENT}" = "confirmed"
          test "${RELEASE_STATUS}" = "0"
