name: Electron Production Provisional Publish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Electron production-candidate source SHA
        required: true
        type: string
      version:
        description: Exact target app semantic version without a leading v
        required: true
        type: string
      tauri_version:
        description: Exact published Tauri source app semantic version
        required: true
        type: string
      prior_electron_version:
        description: Expected prior Electron app version; must match the independently verified candidate
        required: true
        type: string
      prior_candidate_run_id:
        description: Successful independently pinned prior Electron Production Candidate run ID
        required: true
        type: string
      prior_candidate_receipt_sha256:
        description: Owner-recorded SHA-256 of the exact prior candidate receipt
        required: true
        type: string
      candidate_run_id:
        description: Successful Electron Production Candidate workflow run ID
        required: true
        type: string
      candidate_receipt_sha256:
        description: Owner-recorded SHA-256 of the exact candidate receipt
        required: true
        type: string
      tauri_lineage_run_id:
        description: Successful attested public Tauri lineage workflow run ID
        required: true
        type: string
      tauri_lineage_macos_receipt_sha256:
        description: Owner-recorded SHA-256 of the attested macOS lineage receipt
        required: true
        type: string
      tauri_lineage_windows_receipt_sha256:
        description: Owner-recorded SHA-256 of the attested Windows lineage receipt
        required: true
        type: string
      lease_generation:
        description: Expected next durable public-latest lease generation
        required: true
        type: number
      owner_approval:
        description: Type STAGE ELECTRON PRODUCTION PUBLICATION
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

env:
  PUBLIC_RELEASE_REPOSITORY: rion-tw/rion-studio
  SOURCE_CONTROL_REPOSITORY: rion-tw/rion-studio-source

concurrency:
  group: public-latest-rion-studio
  cancel-in-progress: false
  queue: max

jobs:
  verify-plan:
    name: Verify inputs and seal the pre-publication staging plan
    runs-on: ubuntu-latest
    environment: electron-production-release
    outputs:
      candidate_control_sha: ${{ steps.provenance.outputs.candidate_control_sha }}
      candidate_run_attempt: ${{ steps.provenance.outputs.candidate_run_attempt }}
      control_sha: ${{ steps.control-plane.outputs.control_sha }}
      lineage_run_attempt: ${{ steps.provenance.outputs.lineage_run_attempt }}
      lease_id: ${{ steps.operation-identity.outputs.lease_id }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      prior_candidate_control_sha: ${{ steps.provenance.outputs.prior_candidate_control_sha }}
      prior_candidate_run_attempt: ${{ steps.provenance.outputs.prior_candidate_run_attempt }}
      prior_electron_source_sha: ${{ steps.candidates.outputs.prior_electron_source_sha }}
      prior_electron_version: ${{ steps.candidates.outputs.prior_electron_version }}
      source_snapshot_sha256: ${{ steps.source-snapshot.outputs.snapshot_sha256 }}
      transaction_id: ${{ steps.operation-identity.outputs.transaction_id }}
    steps:
      - name: Fence dispatch to the trusted default-branch control plane
        id: control-plane
        shell: bash
        env:
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EXPECTED_WORKFLOW_REF: rion-tw/rion-studio-source/.github/workflows/electron-production-provisional-publish.yml@refs/heads/main
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${SOURCE_CONTROL_REPOSITORY}"
          test "${EVENT_REPOSITORY}" = "${SOURCE_CONTROL_REPOSITORY}"
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${EVENT_DEFAULT_BRANCH}" = "main"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_REF_NAME}" = "main"
          test "${REF_PROTECTED}" = "true"
          test "${WORKFLOW_REF}" = "${EXPECTED_WORKFLOW_REF}"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/${SOURCE_CONTROL_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          test "$(jq -r .path <<< "${run_json}")" \
            = ".github/workflows/electron-production-provisional-publish.yml"
          test "$(jq -r .event <<< "${run_json}")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<< "${run_json}")" = "main"
          test "$(jq -r .head_sha <<< "${run_json}")" = "${GITHUB_SHA}"
          test "$(jq -r .repository.full_name <<< "${run_json}")" \
            = "${SOURCE_CONTROL_REPOSITORY}"
          echo "control_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.control-plane.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Generate fresh publication transaction and lease identities
        id: operation-identity
        shell: bash
        env:
          CONTROL_SHA: ${{ steps.control-plane.outputs.control_sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          node --input-type=module <<'NODE' >> "${GITHUB_OUTPUT}"
          import { randomUUID } from "node:crypto";
          const transactionId = randomUUID();
          const leaseId = randomUUID();
          if (transactionId === leaseId) {
            throw new Error("Fresh transaction and lease UUIDs must be distinct.");
          }
          process.stdout.write(`transaction_id=${transactionId}\nlease_id=${leaseId}\n`);
          NODE

      - name: Validate owner inputs and exact producer-run provenance
        id: provenance
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          CONTROL_SHA: ${{ steps.control-plane.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          LEASE_GENERATION: ${{ inputs.lease_generation }}
          LEASE_ID: ${{ steps.operation-identity.outputs.lease_id }}
          LINEAGE_MACOS_SHA256: ${{ inputs.tauri_lineage_macos_receipt_sha256 }}
          LINEAGE_RUN_ID: ${{ inputs.tauri_lineage_run_id }}
          LINEAGE_WINDOWS_SHA256: ${{ inputs.tauri_lineage_windows_receipt_sha256 }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
          PRIOR_CANDIDATE_RECEIPT_SHA256: ${{ inputs.prior_candidate_receipt_sha256 }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_VERSION: ${{ inputs.prior_electron_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAURI_VERSION: ${{ inputs.tauri_version }}
          TRANSACTION_ID: ${{ steps.operation-identity.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "${TAURI_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "${PRIOR_ELECTRON_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PRIOR_CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${LINEAGE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${LEASE_GENERATION}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CANDIDATE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${PRIOR_CANDIDATE_RECEIPT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LINEAGE_MACOS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LINEAGE_WINDOWS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${TRANSACTION_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "${LEASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          test "${TRANSACTION_ID}" != "${LEASE_ID}"
          test "${CANDIDATE_RUN_ID}" != "${LINEAGE_RUN_ID}"
          test "${PRIOR_CANDIDATE_RUN_ID}" != "${CANDIDATE_RUN_ID}"
          test "${PRIOR_CANDIDATE_RUN_ID}" != "${LINEAGE_RUN_ID}"
          test "${OWNER_APPROVAL}" = "STAGE ELECTRON PRODUCTION PUBLICATION"
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          TARGET_VERSION="${VERSION}" \
          SOURCE_TAURI_VERSION="${TAURI_VERSION}" \
          node --input-type=module <<'NODE'
          import { assertSemanticVersionIsNewer } from
            "./scripts/electronUpdaterCompatibilityReceiptIo.mjs";
          assertSemanticVersionIsNewer(
            process.env.TARGET_VERSION,
            process.env.SOURCE_TAURI_VERSION,
            "Electron target app version relative to the published Tauri source"
          );
          NODE

          verify_candidate_run() {
            local run_id="$1"
            local output_prefix="$2"
            local run_json
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r .path <<< "${run_json}")" \
              = ".github/workflows/electron-production-candidate.yml"
            test "$(jq -r .event <<< "${run_json}")" = "workflow_dispatch"
            test "$(jq -r .conclusion <<< "${run_json}")" = "success"
            test "$(jq -r .head_branch <<< "${run_json}")" = "main"
            test "$(jq -r .repository.full_name <<< "${run_json}")" \
              = "${SOURCE_CONTROL_REPOSITORY}"
            test "$(jq -r .head_repository.full_name <<< "${run_json}")" \
              = "${SOURCE_CONTROL_REPOSITORY}"
            local attempt control_sha
            attempt="$(jq -r .run_attempt <<< "${run_json}")"
            control_sha="$(jq -r .head_sha <<< "${run_json}")"
            [[ "${attempt}" =~ ^[1-9][0-9]*$ ]]
            [[ "${control_sha}" =~ ^[0-9a-f]{40}$ ]]
            echo "${output_prefix}_run_attempt=${attempt}" >> "${GITHUB_OUTPUT}"
            echo "${output_prefix}_control_sha=${control_sha}" >> "${GITHUB_OUTPUT}"
          }

          verify_candidate_run "${CANDIDATE_RUN_ID}" candidate
          verify_candidate_run "${PRIOR_CANDIDATE_RUN_ID}" prior_candidate

          lineage_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LINEAGE_RUN_ID}")"
          test "$(jq -r .path <<< "${lineage_json}")" \
            = ".github/workflows/electron-updater-tauri-v22-compatibility.yml"
          test "$(jq -r .event <<< "${lineage_json}")" = "workflow_dispatch"
          test "$(jq -r .conclusion <<< "${lineage_json}")" = "success"
          test "$(jq -r .head_sha <<< "${lineage_json}")" = "${SOURCE_SHA}"
          test "$(jq -r .repository.full_name <<< "${lineage_json}")" \
            = "${SOURCE_CONTROL_REPOSITORY}"
          lineage_attempt="$(jq -r .run_attempt <<< "${lineage_json}")"
          [[ "${lineage_attempt}" =~ ^[1-9][0-9]*$ ]]
          echo "lineage_run_attempt=${lineage_attempt}" >> "${GITHUB_OUTPUT}"

      - name: Download the exact attempt-bound candidate and lineage inputs
        shell: bash
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ steps.provenance.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          LINEAGE_RUN_ATTEMPT: ${{ steps.provenance.outputs.lineage_run_attempt }}
          LINEAGE_RUN_ID: ${{ inputs.tauri_lineage_run_id }}
          PRIOR_CANDIDATE_RECEIPT_SHA256: ${{ inputs.prior_candidate_receipt_sha256 }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ steps.provenance.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_VERSION: ${{ inputs.prior_electron_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p plan-input/tauri-lineage/darwin-aarch64
          mkdir -p plan-input/tauri-lineage/windows-x86_64
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir candidate-bundle
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-macos-arm64-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir platform-candidates/macos
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-windows-x64-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir platform-candidates/windows
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-trusted-control-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir candidate-trusted-control

          prior_artifacts="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_CANDIDATE_RUN_ID}/artifacts?per_page=100")"
          test "$(jq '.artifacts | length' <<< "${prior_artifacts}")" \
            = "$(jq .total_count <<< "${prior_artifacts}")"
          prior_candidate_name="$(jq -er --arg suffix "-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" '
            [.artifacts[]
              | select(.expired == false)
              | select(.name | startswith("electron-production-candidate-"))
              | select((.name | startswith("electron-production-candidate-trusted-control-")) | not)
              | select((.name | startswith("electron-production-candidate-signing-input-")) | not)
              | select(.name | endswith($suffix))]
            | if length == 1 then .[0].name else error("prior aggregate candidate artifact is not unique") end
          ' <<< "${prior_artifacts}")"
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${prior_candidate_name}" \
            --dir prior-candidate-bundle
          prior_receipt="prior-candidate-bundle/electron-production-candidate-receipt.json"
          test "$(sha256sum "${prior_receipt}" | cut -d ' ' -f 1)" \
            = "${PRIOR_CANDIDATE_RECEIPT_SHA256}"
          prior_source_sha="$(jq -er .sourceSha "${prior_receipt}")"
          prior_version="$(jq -er .version "${prior_receipt}")"
          [[ "${prior_source_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${prior_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "${prior_version}" = "${PRIOR_ELECTRON_VERSION}"
          expected_prior_candidate="electron-production-candidate-${prior_version}-${prior_source_sha}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}"
          expected_prior_macos="electron-production-macos-arm64-${prior_version}-${prior_source_sha}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}"
          expected_prior_windows="electron-production-windows-x64-${prior_version}-${prior_source_sha}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}"
          expected_prior_control="electron-production-candidate-trusted-control-${prior_version}-${prior_source_sha}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}"
          test "${prior_candidate_name}" = "${expected_prior_candidate}"
          for artifact_name in \
            "${expected_prior_macos}" \
            "${expected_prior_windows}" \
            "${expected_prior_control}"; do
            test "$(jq --arg name "${artifact_name}" \
              '[.artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "${prior_artifacts}")" = "1"
          done
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${expected_prior_macos}" \
            --dir prior-platform-candidates/macos
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${expected_prior_windows}" \
            --dir prior-platform-candidates/windows
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${expected_prior_control}" \
            --dir prior-candidate-trusted-control
          cp candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json \
            plan-input/electron-production-target-candidate-trusted-control-receipt.json
          cp prior-candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json \
            plan-input/electron-production-prior-candidate-trusted-control-receipt.json
          cp "${prior_receipt}" \
            plan-input/electron-production-prior-candidate-receipt.json
          gh run download "${LINEAGE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "tauri-v22-public-lineage-darwin-aarch64-${LINEAGE_RUN_ID}-${LINEAGE_RUN_ATTEMPT}" \
            --dir plan-input/tauri-lineage/darwin-aarch64
          gh run download "${LINEAGE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "tauri-v22-public-lineage-windows-x86_64-${LINEAGE_RUN_ID}-${LINEAGE_RUN_ATTEMPT}" \
            --dir plan-input/tauri-lineage/windows-x86_64

      - name: Verify detached attestations for both exact public lineages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAGE_RUN_ATTEMPT: ${{ steps.provenance.outputs.lineage_run_attempt }}
          LINEAGE_RUN_ID: ${{ inputs.tauri_lineage_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-updater-tauri-v22-compatibility.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${LINEAGE_RUN_ID}/attempts/${LINEAGE_RUN_ATTEMPT}"
          receipts=(
            plan-input/tauri-lineage/darwin-aarch64/tauri-v22-public-lineage-receipt.json
            plan-input/tauri-lineage/windows-x86_64/tauri-v22-public-lineage-receipt.json
          )
          for receipt in "${receipts[@]}"; do
            attestation_json="$(gh attestation verify "${receipt}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${SOURCE_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${SOURCE_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done

      - name: Rebuild and close both target and independently pinned prior candidates
        id: candidates
        shell: bash
        env:
          CANDIDATE_CONTROL_SHA: ${{ steps.provenance.outputs.candidate_control_sha }}
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.provenance.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ steps.provenance.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RECEIPT_SHA256: ${{ inputs.prior_candidate_receipt_sha256 }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ steps.provenance.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_VERSION: ${{ inputs.prior_electron_version }}
          RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "${RION_STUDIO_UPDATER_PUBLIC_KEY}"
          PRIOR_RECEIPT="${PWD}/prior-candidate-bundle/electron-production-candidate-receipt.json" \
          TARGET_RECEIPT="${PWD}/candidate-bundle/electron-production-candidate-receipt.json" \
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { readTrustedControlReceipt } from
            "./scripts/electronProductionCandidateTrustedControl.mjs";
          import { verifyElectronProductionCandidateBundle } from
            "./scripts/electronProductionCandidateVerifier.mjs";

          async function verifyCandidate(input) {
            const control = await readTrustedControlReceipt({
              controlPlaneSha: input.controlSha,
              receiptPath: input.controlReceipt,
              repository: process.env.GITHUB_REPOSITORY,
              runAttempt: Number(input.runAttempt),
              runId: input.runId,
              sourceSha: input.sourceSha,
              version: input.version
            });
            const verified = await verifyElectronProductionCandidateBundle({
              candidateDirectory: input.candidateDirectory,
              candidateReceiptPath: input.candidateReceipt,
              candidateReceiptSha256: input.candidateReceiptSha256,
              macDirectory: input.macDirectory,
              publicKey: process.env.RION_STUDIO_UPDATER_PUBLIC_KEY,
              sourceSha: input.sourceSha,
              version: input.version,
              windowsDirectory: input.windowsDirectory
            });
            if (control.receipt.candidate.publishedAt !== verified.receipt.publishedAt ||
                control.receipt.candidate.updaterBaseUrl !== verified.updaterBaseUrl ||
                control.receipt.candidate.updaterEndpoint !== verified.updaterEndpoint ||
                control.receipt.updaterTrust.publicKeySha256 !== verified.receipt.publicKeySha256) {
              throw new Error("The trusted control receipt does not bind the verified candidate.");
            }
            const receipt = {
              schemaVersion: 1,
              kind: `rion-electron-production-${input.role}-candidate-verification`,
              candidate: {
                assets: verified.assets,
                receiptSha256: verified.receiptSha256,
                sourceSha: verified.sourceSha,
                version: verified.version
              },
              controlPlane: {
                ref: "refs/heads/main",
                repository: process.env.GITHUB_REPOSITORY,
                sha: input.controlSha,
                workflow: ".github/workflows/electron-production-candidate.yml"
              },
              producer: {
                runAttempt: Number(input.runAttempt),
                runId: input.runId
              },
              trustedControlReceiptSha256: control.receiptSha256
            };
            await writeFile(input.output, serializeCanonicalJson(receipt), {
              flag: "wx",
              mode: 0o600
            });
            return verified;
          }

          const target = await verifyCandidate({
            role: "target",
            controlReceipt: `${process.cwd()}/candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json`,
            controlSha: process.env.CANDIDATE_CONTROL_SHA,
            candidateDirectory: `${process.cwd()}/candidate-bundle/candidate`,
            candidateReceipt: process.env.TARGET_RECEIPT,
            candidateReceiptSha256: process.env.CANDIDATE_RECEIPT_SHA256,
            macDirectory: `${process.cwd()}/platform-candidates/macos`,
            output: `${process.cwd()}/plan-input/electron-production-target-candidate-verification.json`,
            runAttempt: process.env.CANDIDATE_RUN_ATTEMPT,
            runId: process.env.CANDIDATE_RUN_ID,
            sourceSha: process.env.SOURCE_SHA,
            version: process.env.VERSION,
            windowsDirectory: `${process.cwd()}/platform-candidates/windows`
          });
          const priorReceipt = JSON.parse(await readFile(process.env.PRIOR_RECEIPT, "utf8"));
          const prior = await verifyCandidate({
            role: "prior",
            controlReceipt: `${process.cwd()}/prior-candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json`,
            controlSha: process.env.PRIOR_CANDIDATE_CONTROL_SHA,
            candidateDirectory: `${process.cwd()}/prior-candidate-bundle/candidate`,
            candidateReceipt: process.env.PRIOR_RECEIPT,
            candidateReceiptSha256: process.env.PRIOR_CANDIDATE_RECEIPT_SHA256,
            macDirectory: `${process.cwd()}/prior-platform-candidates/macos`,
            output: `${process.cwd()}/plan-input/electron-production-prior-candidate-verification.json`,
            runAttempt: process.env.PRIOR_CANDIDATE_RUN_ATTEMPT,
            runId: process.env.PRIOR_CANDIDATE_RUN_ID,
            sourceSha: priorReceipt.sourceSha,
            version: priorReceipt.version,
            windowsDirectory: `${process.cwd()}/prior-platform-candidates/windows`
          });
          if (target.sourceSha !== process.env.SOURCE_SHA || target.version !== process.env.VERSION) {
            throw new Error("The verified target candidate identity changed.");
          }
          if (prior.version !== process.env.PRIOR_ELECTRON_VERSION) {
            throw new Error("The owner-pinned prior version does not match the verified prior candidate.");
          }
          NODE
          prior_electron_source_sha="$(jq -r .candidate.sourceSha \
            plan-input/electron-production-prior-candidate-verification.json)"
          prior_electron_version="$(jq -r .candidate.version \
            plan-input/electron-production-prior-candidate-verification.json)"
          TARGET_VERSION="${VERSION}" \
          VERIFIED_PRIOR_ELECTRON_VERSION="${prior_electron_version}" \
          node --input-type=module <<'NODE'
          import { assertSemanticVersionIsNewer } from
            "./scripts/electronUpdaterCompatibilityReceiptIo.mjs";
          assertSemanticVersionIsNewer(
            process.env.TARGET_VERSION,
            process.env.VERIFIED_PRIOR_ELECTRON_VERSION,
            "Electron target app version relative to the independently verified prior Electron candidate"
          );
          NODE
          echo "prior_electron_source_sha=${prior_electron_source_sha}" >> "${GITHUB_OUTPUT}"
          echo "prior_electron_version=${prior_electron_version}" >> "${GITHUB_OUTPUT}"

      - name: Capture the exact observed public v22 latest snapshot
        id: source-snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          snapshot_root="${PWD}/source-latest-capture"
          mkdir -p "${snapshot_root}/assets"
          gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" \
            > "${snapshot_root}/release-api.json"
          release_id="$(jq -r .id "${snapshot_root}/release-api.json")"
          tag="$(jq -r .tag_name "${snapshot_root}/release-api.json")"
          test "${release_id}" != "null"
          [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${tag}")"
          test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
          tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
          [[ "${tag_commit}" =~ ^[0-9a-f]{40}$ ]]
          names=(
            Rion.Studio-mac.app.tar.gz
            Rion.Studio-mac.app.tar.gz.sig
            Rion.Studio-mac.dmg
            Rion.Studio-win.exe
            Rion.Studio-win.exe.sig
            SHA256SUMS.txt
            latest.json
          )
          test "$(jq '.assets | length' "${snapshot_root}/release-api.json")" = "7"
          for name in "${names[@]}"; do
            test "$(jq --arg name "${name}" '[.assets[] | select(.name == $name)] | length' \
              "${snapshot_root}/release-api.json")" = "1"
            asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
              "${snapshot_root}/release-api.json")"
            [[ "${asset_id}" =~ ^[1-9][0-9]*$ ]]
            gh api -H "Accept: application/octet-stream" \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
              > "${snapshot_root}/assets/${name}"
          done
          RELEASE_API="${snapshot_root}/release-api.json" \
          TAG_COMMIT="${tag_commit}" \
          node --input-type=module <<'NODE' > "${snapshot_root}/release-metadata.json"
          import { readFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          const metadata = {
            repository: "rion-tw/rion-studio",
            id: String(release.id),
            tag: release.tag_name,
            targetCommitish: process.env.TAG_COMMIT,
            isLatest: true,
            draft: release.draft,
            prerelease: release.prerelease,
            assets: release.assets.map((asset) => ({
              id: String(asset.id),
              name: asset.name,
              bytes: asset.size,
              digest: asset.digest,
              url: asset.browser_download_url,
              contentType: asset.content_type
            }))
          };
          process.stdout.write(serializeCanonicalJson(metadata));
          NODE
          node scripts/electronProductionPublicationCli.mjs snapshot \
            --asset-directory "${snapshot_root}/assets" \
            --release-json "${snapshot_root}/release-metadata.json" \
            --output "${PWD}/plan-input/source-public-latest-snapshot.json"
          snapshot_sha256="$(sha256sum plan-input/source-public-latest-snapshot.json | cut -d ' ' -f 1)"
          echo "snapshot_sha256=${snapshot_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Assemble the durable non-authorizing staging plan
        id: plan
        shell: bash
        env:
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.provenance.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          LEASE_GENERATION: ${{ inputs.lease_generation }}
          LEASE_ID: ${{ steps.operation-identity.outputs.lease_id }}
          LINEAGE_MACOS_SHA256: ${{ inputs.tauri_lineage_macos_receipt_sha256 }}
          LINEAGE_RUN_ATTEMPT: ${{ steps.provenance.outputs.lineage_run_attempt }}
          LINEAGE_RUN_ID: ${{ inputs.tauri_lineage_run_id }}
          LINEAGE_WINDOWS_SHA256: ${{ inputs.tauri_lineage_windows_receipt_sha256 }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
          PRIOR_ELECTRON_VERSION: ${{ steps.candidates.outputs.prior_electron_version }}
          RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SNAPSHOT_SHA256: ${{ steps.source-snapshot.outputs.snapshot_sha256 }}
          TAURI_VERSION: ${{ inputs.tauri_version }}
          TRANSACTION_ID: ${{ steps.operation-identity.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "${RION_STUDIO_UPDATER_PUBLIC_KEY}"
          test "$(sha256sum candidate-bundle/electron-production-candidate-receipt.json | cut -d ' ' -f 1)" \
            = "${CANDIDATE_RECEIPT_SHA256}"
          test "$(sha256sum plan-input/tauri-lineage/darwin-aarch64/tauri-v22-public-lineage-receipt.json | cut -d ' ' -f 1)" \
            = "${LINEAGE_MACOS_SHA256}"
          test "$(sha256sum plan-input/tauri-lineage/windows-x86_64/tauri-v22-public-lineage-receipt.json | cut -d ' ' -f 1)" \
            = "${LINEAGE_WINDOWS_SHA256}"
          test "$(jq -r .release.version plan-input/tauri-lineage/darwin-aarch64/tauri-v22-public-lineage-receipt.json)" \
            = "${TAURI_VERSION}"
          test "$(jq -r .release.version plan-input/tauri-lineage/windows-x86_64/tauri-v22-public-lineage-receipt.json)" \
            = "${TAURI_VERSION}"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/electronProductionPublicationCli.mjs staging-plan \
            --candidate-directory "${PWD}/candidate-bundle/candidate" \
            --candidate-receipt "${PWD}/candidate-bundle/electron-production-candidate-receipt.json" \
            --candidate-receipt-sha256 "${CANDIDATE_RECEIPT_SHA256}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --created-at "${created_at}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-id "${LEASE_ID}" \
            --mac-directory "${PWD}/platform-candidates/macos" \
            --macos-lineage-receipt "${PWD}/plan-input/tauri-lineage/darwin-aarch64/tauri-v22-public-lineage-receipt.json" \
            --macos-lineage-receipt-sha256 "${LINEAGE_MACOS_SHA256}" \
            --output "${PWD}/plan-input/electron-production-publication-staging-plan-receipt.json" \
            --owner-approval "${OWNER_APPROVAL}" \
            --public-key "${RION_STUDIO_UPDATER_PUBLIC_KEY}" \
            --source-sha "${SOURCE_SHA}" \
            --source-snapshot "${PWD}/plan-input/source-public-latest-snapshot.json" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --tauri-lineage-run-attempt "${LINEAGE_RUN_ATTEMPT}" \
            --tauri-lineage-run-id "${LINEAGE_RUN_ID}" \
            --transaction-id "${TRANSACTION_ID}" \
            --version "${VERSION}" \
            --windows-directory "${PWD}/platform-candidates/windows" \
            --windows-lineage-receipt "${PWD}/plan-input/tauri-lineage/windows-x86_64/tauri-v22-public-lineage-receipt.json" \
            --windows-lineage-receipt-sha256 "${LINEAGE_WINDOWS_SHA256}"
          test "$(jq -r .source.version plan-input/electron-production-publication-staging-plan-receipt.json)" \
            = "${TAURI_VERSION}"
          test "$(jq -r .target.version plan-input/electron-production-publication-staging-plan-receipt.json)" \
            = "${VERSION}"
          TARGET_VERSION="${VERSION}" \
          SOURCE_ELECTRON_VERSION="${PRIOR_ELECTRON_VERSION}" \
          node --input-type=module <<'NODE'
          import { assertSemanticVersionIsNewer } from
            "./scripts/electronUpdaterCompatibilityReceiptIo.mjs";
          assertSemanticVersionIsNewer(
            process.env.TARGET_VERSION,
            process.env.SOURCE_ELECTRON_VERSION,
            "staging-plan target app version relative to the independently verified prior Electron candidate"
          );
          NODE
          cp candidate-bundle/electron-production-candidate-receipt.json plan-input/
          plan_sha256="$(sha256sum plan-input/electron-production-publication-staging-plan-receipt.json | cut -d ' ' -f 1)"
          echo "plan_sha256=${plan_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact staging plan before any public write token exists
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-publication-staging-plan-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: plan-input

  attest-plan:
    name: Attest the pre-publication staging plan without release credentials
    needs: verify-plan
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download the exact staging-plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-staging-plan-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-staging-plan

      - name: Attest only the closed staging-plan receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-staging-plan/electron-production-publication-staging-plan-receipt.json

  stage-target:
    name: Stage and snapshot the exact target as a non-latest public release
    # Fail closed until durable recovery storage and recovery workflows can
    # persist and resume the held lease and capsule across workflow lifetime.
    if: ${{ false }}
    needs:
      - verify-plan
      - attest-plan
    runs-on: ubuntu-latest
    environment: electron-production-release
    outputs:
      staged_snapshot_sha256: ${{ steps.stage.outputs.snapshot_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested staging inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-staging-plan-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: plan-input

      - name: Verify the exact staging-plan attestation and invocation
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA256: ${{ needs.verify-plan.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          receipt="plan-input/electron-production-publication-staging-plan-receipt.json"
          test "$(sha256sum "${receipt}" | cut -d ' ' -f 1)" = "${PLAN_SHA256}"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          attestation_json="$(gh attestation verify "${receipt}" \
            --repo "${GITHUB_REPOSITORY}" \
            --format=json \
            --signer-digest "${CONTROL_SHA}" \
            --signer-workflow "${signer_workflow}" \
            --source-digest "${CONTROL_SHA}")"
          jq -e --arg invocation_uri "${invocation_uri}" '
            any(
              .[];
              .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
            )
          ' <<< "${attestation_json}" > /dev/null

      - name: Re-download and re-verify every candidate byte against the plan
        shell: bash
        env:
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.candidate_control_sha }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          LEASE_GENERATION: ${{ inputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          LINEAGE_MACOS_SHA256: ${{ inputs.tauri_lineage_macos_receipt_sha256 }}
          LINEAGE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.lineage_run_attempt }}
          LINEAGE_RUN_ID: ${{ inputs.tauri_lineage_run_id }}
          LINEAGE_WINDOWS_SHA256: ${{ inputs.tauri_lineage_windows_receipt_sha256 }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RECEIPT_SHA256: ${{ inputs.prior_candidate_receipt_sha256 }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          TAURI_VERSION: ${{ inputs.tauri_version }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "${RION_STUDIO_UPDATER_PUBLIC_KEY}"
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir candidate-bundle
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-macos-arm64-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir platform-candidates/macos
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-windows-x64-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir platform-candidates/windows
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-trusted-control-${VERSION}-${SOURCE_SHA}-attempt-${CANDIDATE_RUN_ATTEMPT}" \
            --dir candidate-trusted-control
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir prior-candidate-bundle
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-macos-arm64-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir prior-platform-candidates/macos
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-windows-x64-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir prior-platform-candidates/windows
          gh run download "${PRIOR_CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "electron-production-candidate-trusted-control-${PRIOR_ELECTRON_VERSION}-${PRIOR_ELECTRON_SOURCE_SHA}-attempt-${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            --dir prior-candidate-trusted-control
          cmp \
            plan-input/electron-production-prior-candidate-receipt.json \
            prior-candidate-bundle/electron-production-candidate-receipt.json
          cmp \
            plan-input/electron-production-target-candidate-trusted-control-receipt.json \
            candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json
          cmp \
            plan-input/electron-production-prior-candidate-trusted-control-receipt.json \
            prior-candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json
          mkdir trusted-candidate-verification
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { readTrustedControlReceipt } from
            "./scripts/electronProductionCandidateTrustedControl.mjs";
          import { verifyElectronProductionCandidateBundle } from
            "./scripts/electronProductionCandidateVerifier.mjs";

          async function verifyCandidate(input) {
            const control = await readTrustedControlReceipt({
              controlPlaneSha: input.controlSha,
              receiptPath: input.controlReceipt,
              repository: process.env.GITHUB_REPOSITORY,
              runAttempt: Number(input.runAttempt),
              runId: input.runId,
              sourceSha: input.sourceSha,
              version: input.version
            });
            const verified = await verifyElectronProductionCandidateBundle({
              candidateDirectory: input.candidateDirectory,
              candidateReceiptPath: input.candidateReceipt,
              candidateReceiptSha256: input.candidateReceiptSha256,
              macDirectory: input.macDirectory,
              publicKey: process.env.RION_STUDIO_UPDATER_PUBLIC_KEY,
              sourceSha: input.sourceSha,
              version: input.version,
              windowsDirectory: input.windowsDirectory
            });
            if (control.receipt.candidate.publishedAt !== verified.receipt.publishedAt ||
                control.receipt.candidate.updaterBaseUrl !== verified.updaterBaseUrl ||
                control.receipt.candidate.updaterEndpoint !== verified.updaterEndpoint ||
                control.receipt.updaterTrust.publicKeySha256 !== verified.receipt.publicKeySha256) {
              throw new Error("The trusted control receipt does not bind the verified candidate.");
            }
            await writeFile(input.output, serializeCanonicalJson({
              schemaVersion: 1,
              kind: `rion-electron-production-${input.role}-candidate-verification`,
              candidate: {
                assets: verified.assets,
                receiptSha256: verified.receiptSha256,
                sourceSha: verified.sourceSha,
                version: verified.version
              },
              controlPlane: {
                ref: "refs/heads/main",
                repository: process.env.GITHUB_REPOSITORY,
                sha: input.controlSha,
                workflow: ".github/workflows/electron-production-candidate.yml"
              },
              producer: { runAttempt: Number(input.runAttempt), runId: input.runId },
              trustedControlReceiptSha256: control.receiptSha256
            }), { flag: "wx", mode: 0o600 });
          }

          await verifyCandidate({
            role: "target",
            controlReceipt: `${process.cwd()}/candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json`,
            controlSha: process.env.CANDIDATE_CONTROL_SHA,
            candidateDirectory: `${process.cwd()}/candidate-bundle/candidate`,
            candidateReceipt: `${process.cwd()}/candidate-bundle/electron-production-candidate-receipt.json`,
            candidateReceiptSha256: process.env.CANDIDATE_RECEIPT_SHA256,
            macDirectory: `${process.cwd()}/platform-candidates/macos`,
            output: `${process.cwd()}/trusted-candidate-verification/electron-production-target-candidate-verification.json`,
            runAttempt: process.env.CANDIDATE_RUN_ATTEMPT,
            runId: process.env.CANDIDATE_RUN_ID,
            sourceSha: process.env.SOURCE_SHA,
            version: process.env.VERSION,
            windowsDirectory: `${process.cwd()}/platform-candidates/windows`
          });
          await verifyCandidate({
            role: "prior",
            controlReceipt: `${process.cwd()}/prior-candidate-trusted-control/electron-production-candidate-trusted-control-receipt.json`,
            controlSha: process.env.PRIOR_CANDIDATE_CONTROL_SHA,
            candidateDirectory: `${process.cwd()}/prior-candidate-bundle/candidate`,
            candidateReceipt: `${process.cwd()}/prior-candidate-bundle/electron-production-candidate-receipt.json`,
            candidateReceiptSha256: process.env.PRIOR_CANDIDATE_RECEIPT_SHA256,
            macDirectory: `${process.cwd()}/prior-platform-candidates/macos`,
            output: `${process.cwd()}/trusted-candidate-verification/electron-production-prior-candidate-verification.json`,
            runAttempt: process.env.PRIOR_CANDIDATE_RUN_ATTEMPT,
            runId: process.env.PRIOR_CANDIDATE_RUN_ID,
            sourceSha: process.env.PRIOR_ELECTRON_SOURCE_SHA,
            version: process.env.PRIOR_ELECTRON_VERSION,
            windowsDirectory: `${process.cwd()}/prior-platform-candidates/windows`
          });
          NODE
          cmp plan-input/electron-production-target-candidate-verification.json \
            trusted-candidate-verification/electron-production-target-candidate-verification.json
          cmp plan-input/electron-production-prior-candidate-verification.json \
            trusted-candidate-verification/electron-production-prior-candidate-verification.json
          created_at="$(jq -r .createdAt plan-input/electron-production-publication-staging-plan-receipt.json)"
          mkdir reverified-plan
          node scripts/electronProductionPublicationCli.mjs staging-plan \
            --candidate-directory "${PWD}/candidate-bundle/candidate" \
            --candidate-receipt "${PWD}/candidate-bundle/electron-production-candidate-receipt.json" \
            --candidate-receipt-sha256 "${CANDIDATE_RECEIPT_SHA256}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --created-at "${created_at}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-id "${LEASE_ID}" \
            --mac-directory "${PWD}/platform-candidates/macos" \
            --macos-lineage-receipt "${PWD}/plan-input/tauri-lineage/darwin-aarch64/tauri-v22-public-lineage-receipt.json" \
            --macos-lineage-receipt-sha256 "${LINEAGE_MACOS_SHA256}" \
            --output "${PWD}/reverified-plan/electron-production-publication-staging-plan-receipt.json" \
            --owner-approval "${OWNER_APPROVAL}" \
            --public-key "${RION_STUDIO_UPDATER_PUBLIC_KEY}" \
            --source-sha "${SOURCE_SHA}" \
            --source-snapshot "${PWD}/plan-input/source-public-latest-snapshot.json" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --tauri-lineage-run-attempt "${LINEAGE_RUN_ATTEMPT}" \
            --tauri-lineage-run-id "${LINEAGE_RUN_ID}" \
            --transaction-id "${TRANSACTION_ID}" \
            --version "${VERSION}" \
            --windows-directory "${PWD}/platform-candidates/windows" \
            --windows-lineage-receipt "${PWD}/plan-input/tauri-lineage/windows-x86_64/tauri-v22-public-lineage-receipt.json" \
            --windows-lineage-receipt-sha256 "${LINEAGE_WINDOWS_SHA256}"
          cmp \
            plan-input/electron-production-publication-staging-plan-receipt.json \
            reverified-plan/electron-production-publication-staging-plan-receipt.json
          test "$(jq -r .source.version reverified-plan/electron-production-publication-staging-plan-receipt.json)" \
            = "${TAURI_VERSION}"
          TARGET_VERSION="${VERSION}" \
          SOURCE_TAURI_VERSION="${TAURI_VERSION}" \
          SOURCE_ELECTRON_VERSION="${PRIOR_ELECTRON_VERSION}" \
          node --input-type=module <<'NODE'
          import { assertSemanticVersionIsNewer } from
            "./scripts/electronUpdaterCompatibilityReceiptIo.mjs";
          assertSemanticVersionIsNewer(
            process.env.TARGET_VERSION,
            process.env.SOURCE_TAURI_VERSION,
            "trusted staging target relative to the published Tauri source"
          );
          assertSemanticVersionIsNewer(
            process.env.TARGET_VERSION,
            process.env.SOURCE_ELECTRON_VERSION,
            "trusted staging target relative to the independently verified prior Electron candidate"
          );
          NODE

      - name: Re-observe the exact source latest before creating a write token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          snapshot_root="${PWD}/pre-stage-source-capture"
          mkdir -p "${snapshot_root}/assets"
          gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" \
            > "${snapshot_root}/release-api.json"
          tag="$(jq -r .tag_name "${snapshot_root}/release-api.json")"
          tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${tag}")"
          test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
          tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
          names=(
            Rion.Studio-mac.app.tar.gz
            Rion.Studio-mac.app.tar.gz.sig
            Rion.Studio-mac.dmg
            Rion.Studio-win.exe
            Rion.Studio-win.exe.sig
            SHA256SUMS.txt
            latest.json
          )
          test "$(jq '.assets | length' "${snapshot_root}/release-api.json")" = "7"
          for name in "${names[@]}"; do
            test "$(jq --arg name "${name}" '[.assets[] | select(.name == $name)] | length' \
              "${snapshot_root}/release-api.json")" = "1"
            asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
              "${snapshot_root}/release-api.json")"
            gh api -H "Accept: application/octet-stream" \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
              > "${snapshot_root}/assets/${name}"
          done
          RELEASE_API="${snapshot_root}/release-api.json" \
          TAG_COMMIT="${tag_commit}" \
          node --input-type=module <<'NODE' > "${snapshot_root}/release-metadata.json"
          import { readFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          process.stdout.write(serializeCanonicalJson({
            repository: "rion-tw/rion-studio",
            id: String(release.id),
            tag: release.tag_name,
            targetCommitish: process.env.TAG_COMMIT,
            isLatest: true,
            draft: release.draft,
            prerelease: release.prerelease,
            assets: release.assets.map((asset) => ({
              id: String(asset.id), name: asset.name, bytes: asset.size,
              digest: asset.digest, url: asset.browser_download_url,
              contentType: asset.content_type
            }))
          }));
          NODE
          node scripts/electronProductionPublicationCli.mjs snapshot \
            --asset-directory "${snapshot_root}/assets" \
            --release-json "${snapshot_root}/release-metadata.json" \
            --output "${snapshot_root}/observed-source-snapshot.json"
          test "$(sha256sum plan-input/source-public-latest-snapshot.json | cut -d ' ' -f 1)" \
            = "${SOURCE_SNAPSHOT_SHA256}"
          cmp plan-input/source-public-latest-snapshot.json \
            "${snapshot_root}/observed-source-snapshot.json"

      - name: Create the narrow public repository staging token
        id: public-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RION_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
          owner: rion-tw
          repositories: rion-studio
          permission-contents: write

      - name: Stage exactly seven immutable assets without changing latest
        id: stage
        shell: bash
        env:
          CANDIDATE_RECEIPT_SHA256: ${{ inputs.candidate_receipt_sha256 }}
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          tag="v${VERSION}"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}" --jq .visibility)" = "public"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}" --jq .default_branch)" = "main"
          for forbidden_path in src src-tauri crates tests scripts package.json pnpm-lock.yaml Cargo.toml; do
            if gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${forbidden_path}?ref=main" \
              > /dev/null 2>&1; then
              echo "Public repository contains forbidden source path: ${forbidden_path}" >&2
              exit 1
            fi
          done

          if tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
          else
            public_main_sha="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            [[ "${public_main_sha}" =~ ^[0-9a-f]{40}$ ]]
            gh api --method POST "repos/${PUBLIC_RELEASE_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${public_main_sha}" > /dev/null
          fi
          for forbidden_path in src src-tauri crates tests scripts package.json pnpm-lock.yaml Cargo.toml; do
            if gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${forbidden_path}?ref=${tag}" \
              > /dev/null 2>&1; then
              echo "Target public tag contains forbidden source path: ${forbidden_path}" >&2
              exit 1
            fi
          done

          printf '%s\n' \
            "# Rion Studio ${tag}" \
            "" \
            "Electron/Chromium production candidate staged for provisional updater evidence." \
            > public-release-notes.md
          if release_json="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
            test "$(jq -r .tag_name <<< "${release_json}")" = "${tag}"
            test "$(jq -r .prerelease <<< "${release_json}")" = "false"
            test "$(jq -r .name <<< "${release_json}")" = "${tag}"
            test "$(jq -r .body <<< "${release_json}")" = "$(cat public-release-notes.md)"
            target_release_id="$(jq -r .id <<< "${release_json}")"
            test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)" \
              != "${target_release_id}"
          else
            gh release create "${tag}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --draft \
              --latest=false \
              --title "${tag}" \
              --notes-file public-release-notes.md \
              --verify-tag
          fi

          names=(
            Rion.Studio-mac.app.tar.gz
            Rion.Studio-mac.app.tar.gz.sig
            Rion.Studio-mac.dmg
            Rion.Studio-win.exe
            Rion.Studio-win.exe.sig
            SHA256SUMS.txt
            latest.json
          )
          for name in "${names[@]}"; do
            expected="candidate-bundle/candidate/${name}"
            expected_sha="$(jq -r --arg name "${name}" '.target.assets[$name]' \
              plan-input/electron-production-publication-staging-plan-receipt.json)"
            test "$(sha256sum "${expected}" | cut -d ' ' -f 1)" = "${expected_sha}"
            release_json="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/tags/${tag}")"
            count="$(jq --arg name "${name}" '[.assets[] | select(.name == $name)] | length' \
              <<< "${release_json}")"
            if test "${count}" = "0"; then
              gh release upload "${tag}" "${expected}" \
                --repo "${PUBLIC_RELEASE_REPOSITORY}"
            else
              test "${count}" = "1"
              asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
                <<< "${release_json}")"
              mkdir -p existing-public-assets
              gh api -H "Accept: application/octet-stream" \
                "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                > "existing-public-assets/${name}"
              cmp "${expected}" "existing-public-assets/${name}"
            fi
          done

          release_json="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/tags/${tag}")"
          test "$(jq '.assets | length' <<< "${release_json}")" = "7"
          for name in "${names[@]}"; do
            test "$(jq --arg name "${name}" '[.assets[] | select(.name == $name and (.digest | startswith("sha256:")))] | length' \
              <<< "${release_json}")" = "1"
          done
          if test "$(jq -r .draft <<< "${release_json}")" = "true"; then
            gh release edit "${tag}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --draft=false \
              --latest=false \
              --notes-file public-release-notes.md \
              --verify-tag
          fi
          release_json="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/tags/${tag}")"
          test "$(jq -r .draft <<< "${release_json}")" = "false"
          test "$(jq -r .prerelease <<< "${release_json}")" = "false"
          target_release_id="$(jq -r .id <<< "${release_json}")"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)" \
            != "${target_release_id}"

          snapshot_root="${PWD}/staged-target-capture"
          mkdir -p "${snapshot_root}/assets"
          printf '%s' "${release_json}" > "${snapshot_root}/release-api.json"
          tag_ref="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${tag}")"
          test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
          tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
          for name in "${names[@]}"; do
            asset_id="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .id' \
              "${snapshot_root}/release-api.json")"
            gh api -H "Accept: application/octet-stream" \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
              > "${snapshot_root}/assets/${name}"
          done
          RELEASE_API="${snapshot_root}/release-api.json" \
          TAG_COMMIT="${tag_commit}" \
          node --input-type=module <<'NODE' > "${snapshot_root}/release-metadata.json"
          import { readFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          process.stdout.write(serializeCanonicalJson({
            repository: "rion-tw/rion-studio",
            id: String(release.id),
            tag: release.tag_name,
            targetCommitish: process.env.TAG_COMMIT,
            isLatest: false,
            draft: release.draft,
            prerelease: release.prerelease,
            assets: release.assets.map((asset) => ({
              id: String(asset.id), name: asset.name, bytes: asset.size,
              digest: asset.digest, url: asset.browser_download_url,
              contentType: asset.content_type
            }))
          }));
          NODE
          mkdir staged-target
          node scripts/electronProductionPublicationCli.mjs snapshot \
            --asset-directory "${snapshot_root}/assets" \
            --candidate-receipt "${PWD}/plan-input/electron-production-candidate-receipt.json" \
            --candidate-receipt-sha256 "${CANDIDATE_RECEIPT_SHA256}" \
            --release-json "${snapshot_root}/release-metadata.json" \
            --output "${PWD}/staged-target/staged-target-public-release-snapshot.json"
          snapshot_sha256="$(sha256sum staged-target/staged-target-public-release-snapshot.json | cut -d ' ' -f 1)"
          echo "snapshot_sha256=${snapshot_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact observed non-latest target snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-publication-staged-target-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: staged-target

  attest-staged-target:
    name: Attest the observed non-latest target without release credentials
    needs: stage-target
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download the exact staged-target snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-staged-target-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-staged-target

      - name: Attest the exact observed staged-target snapshot
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-staged-target/staged-target-public-release-snapshot.json

  acquire-public-latest-lease:
    name: Acquire and seal the exact durable public-latest lease
    # Lease acquisition is itself a public-repository write. Keep it explicitly
    # disabled with both public writers until durable recovery storage exists.
    if: ${{ false }}
    needs:
      - verify-plan
      - attest-plan
      - stage-target
      - attest-staged-target
    runs-on: ubuntu-latest
    environment: electron-production-release
    outputs:
      acquire_operation_sha256: ${{ steps.acquire.outputs.acquire_operation_sha256 }}
      evidence_sha256: ${{ steps.acquire.outputs.evidence_sha256 }}
      held_lease_sha256: ${{ steps.acquire.outputs.held_lease_sha256 }}
      lease_event_sha256: ${{ steps.acquire.outputs.lease_event_sha256 }}
      lease_generation: ${{ steps.acquire.outputs.lease_generation }}
      target_snapshot_sha256: ${{ steps.snapshots.outputs.target_snapshot_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the exact attested lease inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-staging-plan-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: lease-inputs/staging-plan

      - name: Download the exact attested staged target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-staged-target-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: lease-inputs/staged-target

      - name: Verify staged attestations before any lease credential exists
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA256: ${{ needs.verify-plan.outputs.plan_sha256 }}
          STAGED_SNAPSHOT_SHA256: ${{ needs.stage-target.outputs.staged_snapshot_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          plan="lease-inputs/staging-plan/electron-production-publication-staging-plan-receipt.json"
          staged="lease-inputs/staged-target/staged-target-public-release-snapshot.json"
          test "$(sha256sum "${plan}" | cut -d ' ' -f 1)" = "${PLAN_SHA256}"
          test "$(sha256sum "${staged}" | cut -d ' ' -f 1)" = "${STAGED_SNAPSHOT_SHA256}"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${plan}" "${staged}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done

      - name: Derive the exact source and target lease states
        id: snapshots
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          STAGED_SNAPSHOT_SHA256: ${{ needs.stage-target.outputs.staged_snapshot_sha256 }}
          TAURI_VERSION: ${{ inputs.tauri_version }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          mkdir lease-evidence
          cp lease-inputs/staging-plan/source-public-latest-snapshot.json \
            lease-evidence/source-public-latest-snapshot.json
          cp lease-inputs/staged-target/staged-target-public-release-snapshot.json \
            lease-evidence/staged-target-public-release-snapshot.json
          test "$(sha256sum lease-evidence/source-public-latest-snapshot.json | cut -d ' ' -f 1)" \
            = "${SOURCE_SNAPSHOT_SHA256}"
          test "$(sha256sum lease-evidence/staged-target-public-release-snapshot.json | cut -d ' ' -f 1)" \
            = "${STAGED_SNAPSHOT_SHA256}"
          node scripts/electronProductionPublicationCli.mjs project-target \
            --staged-snapshot "${PWD}/lease-evidence/staged-target-public-release-snapshot.json" \
            --staged-snapshot-sha256 "${STAGED_SNAPSHOT_SHA256}" \
            --output "${PWD}/lease-evidence/target-public-latest-projection.json"
          SOURCE_PATH="${PWD}/lease-evidence/source-public-latest-snapshot.json" \
          TARGET_PATH="${PWD}/lease-evidence/target-public-latest-projection.json" \
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { assertElectronProductionPublicLatestSnapshot } from
            "./scripts/electronProductionPublicLatestSnapshot.mjs";
          const source = assertElectronProductionPublicLatestSnapshot(
            JSON.parse(await readFile(process.env.SOURCE_PATH, "utf8"))
          );
          const target = assertElectronProductionPublicLatestSnapshot(
            JSON.parse(await readFile(process.env.TARGET_PATH, "utf8"))
          );
          if (source.observationKind !== "observed-release" ||
              source.release.isLatest !== true || source.candidateReceipt !== null ||
              source.latestJson.version !== process.env.TAURI_VERSION) {
            throw new Error("The durable lease source is not the exact Tauri latest state.");
          }
          if (target.observationKind !== "expected-latest-projection" ||
              target.release.isLatest !== true ||
              target.latestJson.version !== process.env.VERSION ||
              target.candidateReceipt?.sourceSha !== process.env.SOURCE_SHA ||
              target.candidateReceipt.version !== process.env.VERSION) {
            throw new Error("The durable lease target is not the exact Electron projection.");
          }
          NODE
          source_state_sha256="$(jq -er .stateSha256 \
            lease-evidence/source-public-latest-snapshot.json)"
          target_state_sha256="$(jq -er .stateSha256 \
            lease-evidence/target-public-latest-projection.json)"
          target_snapshot_sha256="$(sha256sum \
            lease-evidence/target-public-latest-projection.json | cut -d ' ' -f 1)"
          [[ "${source_state_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${target_state_sha256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${target_snapshot_sha256}" =~ ^[0-9a-f]{64}$ ]]
          echo "source_state_sha256=${source_state_sha256}" >> "${GITHUB_OUTPUT}"
          echo "target_state_sha256=${target_state_sha256}" >> "${GITHUB_OUTPUT}"
          echo "target_snapshot_sha256=${target_snapshot_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Create the narrow durable-lease repository token
        id: public-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RION_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
          owner: rion-tw
          repositories: rion-studio
          permission-contents: write

      - name: Acquire and close the exact held remote lease evidence
        id: acquire
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EXPECTED_LEASE_GENERATION: ${{ inputs.lease_generation }}
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_STATE_SHA256: ${{ steps.snapshots.outputs.source_state_sha256 }}
          TAURI_VERSION: ${{ inputs.tauri_version }}
          TARGET_STATE_SHA256: ${{ steps.snapshots.outputs.target_state_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          recorded_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs acquire \
            --transaction-id "${TRANSACTION_ID}" \
            --lease-id "${LEASE_ID}" \
            --purpose electron-v23-provisional-publication \
            --holder-workflow .github/workflows/electron-production-provisional-publish.yml \
            --holder-run-id "${GITHUB_RUN_ID}" \
            --holder-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --control-head-sha "${CONTROL_SHA}" \
            --source-runtime tauri-v22 \
            --source-version "${TAURI_VERSION}" \
            --source-state-sha256 "${SOURCE_STATE_SHA256}" \
            --target-runtime electron-v23 \
            --target-version "${VERSION}" \
            --target-state-sha256 "${TARGET_STATE_SHA256}" \
            --recorded-at "${recorded_at}" \
            --output "${PWD}/lease-evidence/electron-production-public-latest-lease.json" \
            > "${PWD}/lease-evidence/electron-production-public-latest-lease-acquire-operation.json"
          EVIDENCE_ROOT="${PWD}/lease-evidence" \
          EXPECTED_LEASE_GENERATION="${EXPECTED_LEASE_GENERATION}" \
          LEASE_ID="${LEASE_ID}" \
          SOURCE_SHA="${SOURCE_SHA}" \
          SOURCE_STATE_SHA256="${SOURCE_STATE_SHA256}" \
          TAURI_VERSION="${TAURI_VERSION}" \
          TARGET_STATE_SHA256="${TARGET_STATE_SHA256}" \
          TRANSACTION_ID="${TRANSACTION_ID}" \
          VERSION="${VERSION}" \
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { lstat, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import {
            electronProductionPublicLatestLeaseEventSha256,
            readElectronProductionPublicLatestLease
          } from "./scripts/electronProductionPublicLatestLease.mjs";
          const root = process.env.EVIDENCE_ROOT;
          const leasePath = path.join(root, "electron-production-public-latest-lease.json");
          const operationPath = path.join(
            root,
            "electron-production-public-latest-lease-acquire-operation.json"
          );
          const operationSource = await readFile(operationPath);
          const operation = JSON.parse(operationSource);
          if (!operationSource.equals(serializeCanonicalJson(operation)) ||
              operation.schemaVersion !== 1 ||
              operation.kind !== "rion-electron-production-public-latest-lease-remote-operation" ||
              operation.command !== "acquire" || operation.outcome !== "applied" ||
              operation.reason !== null || operation.lease?.status !== "held" ||
              operation.remote?.repository !== "rion-tw/rion-studio" ||
              operation.remote.ref !== "main" ||
              operation.remote.path !== "releases/electron-production-public-latest-lease.json" ||
              !/^[0-9a-f]{40}$/u.test(operation.remote.blobSha)) {
            throw new Error("The durable lease acquisition operation is not exact.");
          }
          const leaseFile = await readElectronProductionPublicLatestLease({
            leasePath,
            expectedSha256: operation.output.sha256
          });
          const lease = leaseFile.lease;
          if (lease.transactionId !== process.env.TRANSACTION_ID ||
              lease.leaseId !== process.env.LEASE_ID ||
              lease.generation !== Number(process.env.EXPECTED_LEASE_GENERATION) ||
              lease.status !== "held" ||
              lease.purpose !== "electron-v23-provisional-publication" ||
              lease.holder.repository !== process.env.GITHUB_REPOSITORY ||
              lease.holder.workflow !==
                ".github/workflows/electron-production-provisional-publish.yml" ||
              lease.holder.runId !== process.env.GITHUB_RUN_ID ||
              lease.holder.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              lease.holder.headSha !== process.env.CONTROL_SHA ||
              lease.source.runtime !== "tauri-v22" ||
              lease.source.version !== process.env.TAURI_VERSION ||
              lease.source.stateSha256 !== process.env.SOURCE_STATE_SHA256 ||
              lease.target.runtime !== "electron-v23" ||
              lease.target.version !== process.env.VERSION ||
              lease.target.stateSha256 !== process.env.TARGET_STATE_SHA256) {
            throw new Error("The held durable lease does not match its trusted acquisition.");
          }
          const paths = [
            "electron-production-public-latest-lease-acquire-operation.json",
            "electron-production-public-latest-lease.json",
            "source-public-latest-snapshot.json",
            "staged-target-public-release-snapshot.json",
            "target-public-latest-projection.json"
          ];
          const files = {};
          for (const relativePath of paths) {
            const absolutePath = path.join(root, relativePath);
            const stat = await lstat(absolutePath);
            const bytes = await readFile(absolutePath);
            if (!stat.isFile() || stat.nlink !== 1) {
              throw new Error("Durable lease evidence must be a single-link regular file.");
            }
            files[relativePath] = {
              bytes: bytes.length,
              sha256: createHash("sha256").update(bytes).digest("hex")
            };
          }
          const eventSha256 = electronProductionPublicLatestLeaseEventSha256(lease);
          if (operation.lease.transactionId !== lease.transactionId ||
              operation.lease.leaseId !== lease.leaseId ||
              operation.lease.generation !== lease.generation ||
              operation.lease.revision !== lease.revision ||
              operation.lease.eventSha256 !== eventSha256 ||
              operation.output.bytes !== files["electron-production-public-latest-lease.json"].bytes ||
              operation.output.fileName !== "electron-production-public-latest-lease.json" ||
              operation.output.sha256 !== files["electron-production-public-latest-lease.json"].sha256) {
            throw new Error("The acquisition operation does not bind the exact held lease.");
          }
          const receipt = {
            schemaVersion: 1,
            kind: "rion-electron-production-public-latest-held-lease-evidence",
            status: "held",
            purpose: "electron-v23-provisional-publication",
            producer: {
              repository: process.env.GITHUB_REPOSITORY,
              workflow: ".github/workflows/electron-production-provisional-publish.yml",
              event: "workflow_dispatch",
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              controlSha: process.env.CONTROL_SHA
            },
            candidate: { sourceSha: process.env.SOURCE_SHA, version: process.env.VERSION },
            source: {
              runtime: lease.source.runtime,
              version: lease.source.version,
              stateSha256: lease.source.stateSha256
            },
            target: {
              runtime: lease.target.runtime,
              version: lease.target.version,
              stateSha256: lease.target.stateSha256
            },
            lease: {
              transactionId: lease.transactionId,
              leaseId: lease.leaseId,
              generation: lease.generation,
              revision: lease.revision,
              eventSha256,
              remote: operation.remote
            },
            files
          };
          await writeFile(
            path.join(root, "electron-production-public-latest-held-lease-evidence.json"),
            serializeCanonicalJson(receipt),
            { flag: "wx", mode: 0o600 }
          );
          NODE
          held_lease_sha256="$(sha256sum \
            lease-evidence/electron-production-public-latest-lease.json | cut -d ' ' -f 1)"
          acquire_operation_sha256="$(sha256sum \
            lease-evidence/electron-production-public-latest-lease-acquire-operation.json | cut -d ' ' -f 1)"
          evidence_sha256="$(sha256sum \
            lease-evidence/electron-production-public-latest-held-lease-evidence.json | cut -d ' ' -f 1)"
          lease_generation="$(jq -er .generation \
            lease-evidence/electron-production-public-latest-lease.json)"
          lease_event_sha256="$(jq -er .lease.eventSha256 \
            lease-evidence/electron-production-public-latest-held-lease-evidence.json)"
          test "${lease_generation}" = "${EXPECTED_LEASE_GENERATION}"
          [[ "${lease_event_sha256}" =~ ^[0-9a-f]{64}$ ]]
          echo "held_lease_sha256=${held_lease_sha256}" >> "${GITHUB_OUTPUT}"
          echo "acquire_operation_sha256=${acquire_operation_sha256}" >> "${GITHUB_OUTPUT}"
          echo "evidence_sha256=${evidence_sha256}" >> "${GITHUB_OUTPUT}"
          echo "lease_event_sha256=${lease_event_sha256}" >> "${GITHUB_OUTPUT}"
          echo "lease_generation=${lease_generation}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact attempt-bound held lease evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-public-latest-held-lease-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: lease-evidence

  attest-public-latest-lease:
    name: Attest the exact held public-latest lease evidence without credentials
    needs: acquire-public-latest-lease
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download the exact held lease evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-public-latest-held-lease-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-held-lease

      - name: Verify the held lease evidence identity before attestation
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.acquire-public-latest-lease.outputs.evidence_sha256 }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/publication-held-lease/electron-production-public-latest-held-lease-evidence.json"
          test "$(sha256sum "${receipt}" | cut -d ' ' -f 1)" = "${EXPECTED_SHA256}"

      - name: Attest the closed held lease evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-held-lease/electron-production-public-latest-held-lease-evidence.json

  create-intent:
    name: Seal and upload the complete pre-mutation recovery capsule
    needs:
      - verify-plan
      - attest-plan
      - stage-target
      - attest-staged-target
      - acquire-public-latest-lease
      - attest-public-latest-lease
    runs-on: ubuntu-latest
    outputs:
      capsule_bytes: ${{ steps.intent.outputs.capsule_bytes }}
      capsule_sha256: ${{ steps.intent.outputs.capsule_sha256 }}
      intent_sha256: ${{ steps.intent.outputs.intent_sha256 }}
      manifest_bytes: ${{ steps.intent.outputs.manifest_bytes }}
      manifest_sha256: ${{ steps.intent.outputs.manifest_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the exact staging-plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-staging-plan-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: publication-inputs/electron-production-publication-staging-plan-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}

      - name: Download the exact staged-target artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-staged-target-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: publication-inputs/electron-production-publication-staged-target-${{ inputs.version }}-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}

      - name: Download the exact held lease evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-public-latest-held-lease-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: publication-inputs/electron-production-public-latest-held-lease-${{ github.run_id }}-attempt-${{ github.run_attempt }}

      - name: Verify all detached pre-mutation attestations
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EVIDENCE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.evidence_sha256 }}
          GH_TOKEN: ${{ github.token }}
          PLAN_SHA256: ${{ needs.verify-plan.outputs.plan_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGED_SNAPSHOT_SHA256: ${{ needs.stage-target.outputs.staged_snapshot_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          plan_root="publication-inputs/electron-production-publication-staging-plan-${VERSION}-${SOURCE_SHA}-attempt-${GITHUB_RUN_ATTEMPT}"
          staged_root="publication-inputs/electron-production-publication-staged-target-${VERSION}-${SOURCE_SHA}-attempt-${GITHUB_RUN_ATTEMPT}"
          held_root="publication-inputs/electron-production-public-latest-held-lease-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          plan_receipt="${plan_root}/electron-production-publication-staging-plan-receipt.json"
          staged_snapshot="${staged_root}/staged-target-public-release-snapshot.json"
          held_evidence="${held_root}/electron-production-public-latest-held-lease-evidence.json"
          test "$(sha256sum "${plan_receipt}" | cut -d ' ' -f 1)" = "${PLAN_SHA256}"
          test "$(sha256sum "${staged_snapshot}" | cut -d ' ' -f 1)" = "${STAGED_SNAPSHOT_SHA256}"
          test "$(sha256sum "${held_evidence}" | cut -d ' ' -f 1)" = "${EVIDENCE_SHA256}"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${plan_receipt}" "${staged_snapshot}" "${held_evidence}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          echo "PLAN_ROOT=${plan_root}" >> "${GITHUB_ENV}"
          echo "STAGED_ROOT=${staged_root}" >> "${GITHUB_ENV}"
          echo "HELD_ROOT=${held_root}" >> "${GITHUB_ENV}"

      - name: Create the exact intent and canonical recovery capsule package
        id: intent
        shell: bash
        env:
          CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.candidate_control_sha }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          ACQUIRE_OPERATION_SHA256: ${{ needs.acquire-public-latest-lease.outputs.acquire_operation_sha256 }}
          HELD_EVIDENCE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.evidence_sha256 }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_EVENT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.lease_event_sha256 }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          LINEAGE_MACOS_SHA256: ${{ inputs.tauri_lineage_macos_receipt_sha256 }}
          LINEAGE_WINDOWS_SHA256: ${{ inputs.tauri_lineage_windows_receipt_sha256 }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RECEIPT_SHA256: ${{ inputs.prior_candidate_receipt_sha256 }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          STAGED_SNAPSHOT_SHA256: ${{ needs.stage-target.outputs.staged_snapshot_sha256 }}
          TAURI_VERSION: ${{ inputs.tauri_version }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          mkdir recovery-capsule-package
          mkdir -p recovery-capsule/tauri-lineage/darwin-aarch64
          mkdir -p recovery-capsule/tauri-lineage/windows-x86_64
          cp "${PLAN_ROOT}/electron-production-publication-staging-plan-receipt.json" recovery-capsule/
          cp "${PLAN_ROOT}/source-public-latest-snapshot.json" recovery-capsule/
          cp "${PLAN_ROOT}/electron-production-candidate-receipt.json" recovery-capsule/
          cp "${PLAN_ROOT}/electron-production-target-candidate-trusted-control-receipt.json" \
            recovery-capsule/
          cp "${PLAN_ROOT}/electron-production-target-candidate-verification.json" \
            recovery-capsule/
          cp "${PLAN_ROOT}/electron-production-prior-candidate-receipt.json" \
            recovery-capsule/
          cp "${PLAN_ROOT}/electron-production-prior-candidate-trusted-control-receipt.json" \
            recovery-capsule/
          cp "${PLAN_ROOT}/electron-production-prior-candidate-verification.json" \
            recovery-capsule/
          cp "${PLAN_ROOT}/tauri-lineage/darwin-aarch64/tauri-v22-public-lineage-receipt.json" \
            recovery-capsule/tauri-lineage/darwin-aarch64/
          cp "${PLAN_ROOT}/tauri-lineage/windows-x86_64/tauri-v22-public-lineage-receipt.json" \
            recovery-capsule/tauri-lineage/windows-x86_64/
          cp "${STAGED_ROOT}/staged-target-public-release-snapshot.json" recovery-capsule/
          cmp "${PLAN_ROOT}/source-public-latest-snapshot.json" \
            "${HELD_ROOT}/source-public-latest-snapshot.json"
          cmp "${STAGED_ROOT}/staged-target-public-release-snapshot.json" \
            "${HELD_ROOT}/staged-target-public-release-snapshot.json"
          cp "${HELD_ROOT}/electron-production-public-latest-lease.json" recovery-capsule/
          cp "${HELD_ROOT}/electron-production-public-latest-lease-acquire-operation.json" \
            recovery-capsule/
          cp "${HELD_ROOT}/electron-production-public-latest-held-lease-evidence.json" \
            recovery-capsule/
          cp "${HELD_ROOT}/target-public-latest-projection.json" recovery-capsule/
          test "$(sha256sum recovery-capsule/electron-production-public-latest-lease.json | cut -d ' ' -f 1)" \
            = "${HELD_LEASE_SHA256}"
          test "$(sha256sum recovery-capsule/electron-production-public-latest-lease-acquire-operation.json | cut -d ' ' -f 1)" \
            = "${ACQUIRE_OPERATION_SHA256}"
          test "$(sha256sum recovery-capsule/electron-production-public-latest-held-lease-evidence.json | cut -d ' ' -f 1)" \
            = "${HELD_EVIDENCE_SHA256}"
          test "$(sha256sum recovery-capsule/target-public-latest-projection.json | cut -d ' ' -f 1)" \
            = "${TARGET_SNAPSHOT_SHA256}"
          mkdir target-projection-check
          node scripts/electronProductionPublicationCli.mjs project-target \
            --staged-snapshot "${PWD}/recovery-capsule/staged-target-public-release-snapshot.json" \
            --staged-snapshot-sha256 "${STAGED_SNAPSHOT_SHA256}" \
            --output "${PWD}/target-projection-check/target-public-latest-projection.json"
          cmp recovery-capsule/target-public-latest-projection.json \
            target-projection-check/target-public-latest-projection.json
          target_snapshot_sha256="$(sha256sum recovery-capsule/target-public-latest-projection.json | cut -d ' ' -f 1)"
          test "${target_snapshot_sha256}" = "${TARGET_SNAPSHOT_SHA256}"
          recorded_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/electronProductionPublicationCli.mjs intent \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-id "${LEASE_ID}" \
            --macos-lineage-receipt "${PWD}/recovery-capsule/tauri-lineage/darwin-aarch64/tauri-v22-public-lineage-receipt.json" \
            --macos-lineage-receipt-sha256 "${LINEAGE_MACOS_SHA256}" \
            --output "${PWD}/recovery-capsule/electron-production-publication-intent-receipt.json" \
            --recorded-at "${recorded_at}" \
            --source-snapshot "${PWD}/recovery-capsule/source-public-latest-snapshot.json" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${PWD}/recovery-capsule/target-public-latest-projection.json" \
            --target-snapshot-sha256 "${target_snapshot_sha256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --windows-lineage-receipt "${PWD}/recovery-capsule/tauri-lineage/windows-x86_64/tauri-v22-public-lineage-receipt.json" \
            --windows-lineage-receipt-sha256 "${LINEAGE_WINDOWS_SHA256}"

          capsule_summary="$(node scripts/electronProductionRecoveryCapsuleCli.mjs create \
            --source-root "${PWD}/recovery-capsule" \
            --capsule-output "${PWD}/recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json" \
            --transaction-id "${TRANSACTION_ID}" \
            --lease-id "${LEASE_ID}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-event-sha256 "${LEASE_EVENT_SHA256}" \
            --control-head-sha "${CONTROL_SHA}" \
            --control-run-id "${GITHUB_RUN_ID}" \
            --control-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --candidate-source-sha "${SOURCE_SHA}" \
            --candidate-version "${VERSION}" \
            --candidate-control-sha "${CANDIDATE_CONTROL_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --prior-candidate-source-sha "${PRIOR_ELECTRON_SOURCE_SHA}" \
            --prior-candidate-version "${PRIOR_ELECTRON_VERSION}" \
            --prior-candidate-control-sha "${PRIOR_CANDIDATE_CONTROL_SHA}" \
            --prior-candidate-run-id "${PRIOR_CANDIDATE_RUN_ID}" \
            --prior-candidate-run-attempt "${PRIOR_CANDIDATE_RUN_ATTEMPT}")"
          capsule_sha256="$(jq -er .capsule.sha256 <<< "${capsule_summary}")"
          capsule_bytes="$(jq -er .capsule.bytes <<< "${capsule_summary}")"
          intent_sha256="$(jq -er .intent.sha256 <<< "${capsule_summary}")"
          manifest_sha256="$(jq -er .manifest.sha256 <<< "${capsule_summary}")"
          manifest_bytes="$(jq -er .manifest.bytes <<< "${capsule_summary}")"
          test "$(sha256sum recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json | cut -d ' ' -f 1)" \
            = "${capsule_sha256}"
          test "$(wc -c < recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json | tr -d '[:space:]')" \
            = "${capsule_bytes}"
          test "$(sha256sum recovery-capsule/electron-production-publication-intent-receipt.json | cut -d ' ' -f 1)" \
            = "${intent_sha256}"
          test "$(sha256sum recovery-capsule/electron-production-publication-recovery-capsule-manifest.json | cut -d ' ' -f 1)" \
            = "${manifest_sha256}"
          test "$(wc -c < recovery-capsule/electron-production-publication-recovery-capsule-manifest.json | tr -d '[:space:]')" \
            = "${manifest_bytes}"
          echo "capsule_bytes=${capsule_bytes}" >> "${GITHUB_OUTPUT}"
          echo "capsule_sha256=${capsule_sha256}" >> "${GITHUB_OUTPUT}"
          echo "intent_sha256=${intent_sha256}" >> "${GITHUB_OUTPUT}"
          echo "manifest_bytes=${manifest_bytes}" >> "${GITHUB_OUTPUT}"
          echo "manifest_sha256=${manifest_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the complete recovery capsule before latest mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-publication-recovery-capsule-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: recovery-capsule

      - name: Upload the canonical packed recovery capsule before latest mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-publication-recovery-capsule-package-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json

  attest-intent:
    name: Attest the complete recovery capsule without release credentials
    needs:
      - verify-plan
      - acquire-public-latest-lease
      - create-intent
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the complete pre-mutation recovery capsule
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-recovery-capsule

      - name: Download the exact canonical packed recovery capsule
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-package-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-recovery-capsule-package

      - name: Reverify the canonical packed capsule and directory before attestation
        shell: bash
        env:
          CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.candidate_control_sha }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_BYTES: ${{ needs.create-intent.outputs.capsule_bytes }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.create-intent.outputs.capsule_sha256 }}
          EXPECTED_INTENT_SHA256: ${{ needs.create-intent.outputs.intent_sha256 }}
          EXPECTED_MANIFEST_BYTES: ${{ needs.create-intent.outputs.manifest_bytes }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.create-intent.outputs.manifest_sha256 }}
          LEASE_EVENT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.lease_event_sha256 }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          capsule="${RUNNER_TEMP}/publication-recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json"
          capsule_summary="$(node scripts/electronProductionRecoveryCapsuleCli.mjs verify \
            --source-root "${RUNNER_TEMP}/publication-recovery-capsule" \
            --capsule-path "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --lease-id "${LEASE_ID}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-event-sha256 "${LEASE_EVENT_SHA256}" \
            --control-head-sha "${CONTROL_SHA}" \
            --control-run-id "${GITHUB_RUN_ID}" \
            --control-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --candidate-source-sha "${SOURCE_SHA}" \
            --candidate-version "${VERSION}" \
            --candidate-control-sha "${CANDIDATE_CONTROL_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --prior-candidate-source-sha "${PRIOR_ELECTRON_SOURCE_SHA}" \
            --prior-candidate-version "${PRIOR_ELECTRON_VERSION}" \
            --prior-candidate-control-sha "${PRIOR_CANDIDATE_CONTROL_SHA}" \
            --prior-candidate-run-id "${PRIOR_CANDIDATE_RUN_ID}" \
            --prior-candidate-run-attempt "${PRIOR_CANDIDATE_RUN_ATTEMPT}")"
          test "$(jq -er .capsule.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_CAPSULE_SHA256}"
          test "$(jq -er .capsule.bytes <<< "${capsule_summary}")" \
            = "${EXPECTED_CAPSULE_BYTES}"
          test "$(jq -er .manifest.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_MANIFEST_SHA256}"
          test "$(jq -er .manifest.bytes <<< "${capsule_summary}")" \
            = "${EXPECTED_MANIFEST_BYTES}"
          test "$(jq -er .intent.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_INTENT_SHA256}"
          test "$(sha256sum "${capsule}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_CAPSULE_SHA256}"
          test "$(wc -c < "${capsule}" | tr -d '[:space:]')" \
            = "${EXPECTED_CAPSULE_BYTES}"
          test "$(sha256sum "${RUNNER_TEMP}/publication-recovery-capsule/electron-production-publication-intent-receipt.json" | cut -d ' ' -f 1)" \
            = "${EXPECTED_INTENT_SHA256}"
          test "$(sha256sum "${RUNNER_TEMP}/publication-recovery-capsule/electron-production-publication-recovery-capsule-manifest.json" | cut -d ' ' -f 1)" \
            = "${EXPECTED_MANIFEST_SHA256}"
          test "$(wc -c < "${RUNNER_TEMP}/publication-recovery-capsule/electron-production-publication-recovery-capsule-manifest.json" | tr -d '[:space:]')" \
            = "${EXPECTED_MANIFEST_BYTES}"

      - name: Attest the canonical recovery-capsule manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-recovery-capsule/electron-production-publication-recovery-capsule-manifest.json

      - name: Attest the exact pre-mutation publication intent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-recovery-capsule/electron-production-publication-intent-receipt.json

      - name: Attest the exact canonical packed recovery capsule
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/publication-recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json

  persist-recovery-capsule:
    name: Persist the attested recovery capsule and store seal privately
    # Fail closed until the owner configures and explicitly enables the
    # private recovery-store writer after an independent recovery drill.
    if: ${{ false }}
    needs:
      - verify-plan
      - acquire-public-latest-lease
      - create-intent
      - attest-intent
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      capsule_operation_sha256: ${{ steps.persist.outputs.capsule_operation_sha256 }}
      seal_operation_sha256: ${{ steps.persist.outputs.seal_operation_sha256 }}
      store_seal_sha256: ${{ steps.persist.outputs.store_seal_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested recovery capsule directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-store-input/capsule

      - name: Download the attested canonical packed recovery capsule
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-package-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-store-input/package

      - name: Verify the capsule attestations and exact binding before credentials
        shell: bash
        env:
          CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.candidate_control_sha }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_BYTES: ${{ needs.create-intent.outputs.capsule_bytes }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.create-intent.outputs.capsule_sha256 }}
          EXPECTED_INTENT_SHA256: ${{ needs.create-intent.outputs.intent_sha256 }}
          EXPECTED_MANIFEST_BYTES: ${{ needs.create-intent.outputs.manifest_bytes }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.create-intent.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          LEASE_EVENT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.lease_event_sha256 }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          capsule="${PWD}/recovery-store-input/package/electron-production-publication-recovery-capsule.capsule.json"
          manifest="${PWD}/recovery-store-input/capsule/electron-production-publication-recovery-capsule-manifest.json"
          intent="${PWD}/recovery-store-input/capsule/electron-production-publication-intent-receipt.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${capsule}" "${manifest}" "${intent}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          capsule_summary="$(node scripts/electronProductionRecoveryCapsuleCli.mjs verify \
            --source-root "${PWD}/recovery-store-input/capsule" \
            --capsule-path "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --lease-id "${LEASE_ID}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-event-sha256 "${LEASE_EVENT_SHA256}" \
            --control-head-sha "${CONTROL_SHA}" \
            --control-run-id "${GITHUB_RUN_ID}" \
            --control-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --candidate-source-sha "${SOURCE_SHA}" \
            --candidate-version "${VERSION}" \
            --candidate-control-sha "${CANDIDATE_CONTROL_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --prior-candidate-source-sha "${PRIOR_ELECTRON_SOURCE_SHA}" \
            --prior-candidate-version "${PRIOR_ELECTRON_VERSION}" \
            --prior-candidate-control-sha "${PRIOR_CANDIDATE_CONTROL_SHA}" \
            --prior-candidate-run-id "${PRIOR_CANDIDATE_RUN_ID}" \
            --prior-candidate-run-attempt "${PRIOR_CANDIDATE_RUN_ATTEMPT}")"
          test "$(jq -er .capsule.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_CAPSULE_SHA256}"
          test "$(jq -er .capsule.bytes <<< "${capsule_summary}")" \
            = "${EXPECTED_CAPSULE_BYTES}"
          test "$(jq -er .manifest.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_MANIFEST_SHA256}"
          test "$(jq -er .manifest.bytes <<< "${capsule_summary}")" \
            = "${EXPECTED_MANIFEST_BYTES}"
          test "$(jq -er .intent.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_INTENT_SHA256}"

      - name: Derive the fenced transaction paths and validate owner configuration
        id: transaction-paths
        shell: bash
        env:
          RECOVERY_APP_CLIENT_ID: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_APP_CLIENT_ID }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          test -n "${RECOVERY_APP_CLIENT_ID}"
          test "${#RECOVERY_APP_CLIENT_ID}" -le 256
          [[ "${RECOVERY_APP_CLIENT_ID}" != *[[:space:]]* ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != /* ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != */ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != *..* ]]
          [[ "${RECOVERY_OWNER}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          [[ "${RECOVERY_REPOSITORY}" =~ ^[A-Za-z0-9_.-]{1,100}$ ]]
          test "${RECOVERY_REPOSITORY}" != "."
          test "${RECOVERY_REPOSITORY}" != ".."
          paths_json="$(node --input-type=module <<'NODE'
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import {
            assertElectronProductionRecoveryStoreRemoteTarget
          } from "./scripts/electronProductionRecoveryStoreRemote.mjs";
          import { electronProductionRecoveryStoreTransactionPaths } from
            "./scripts/electronProductionRecoveryStoreTransactionPaths.mjs";
          const paths = electronProductionRecoveryStoreTransactionPaths({
            transactionId: process.env.TRANSACTION_ID
          });
          for (const storePath of [
            paths.capsulePath,
            paths.storeSealPath,
            paths.recoveryOutcomeTerminalPath
          ]) {
            assertElectronProductionRecoveryStoreRemoteTarget({
              owner: process.env.RECOVERY_OWNER,
              repo: process.env.RECOVERY_REPOSITORY,
              ref: process.env.RECOVERY_DEFAULT_BRANCH,
              path: storePath,
              repositoryPolicy: {
                defaultBranch: process.env.RECOVERY_DEFAULT_BRANCH,
                visibility: "private"
              }
            });
          }
          process.stdout.write(serializeCanonicalJson(paths));
          NODE
          )"
          capsule_path="$(jq -er .capsulePath <<< "${paths_json}")"
          store_seal_path="$(jq -er .storeSealPath <<< "${paths_json}")"
          recovery_outcome_path="$(jq -er .recoveryOutcomeTerminalPath <<< "${paths_json}")"
          test "$(dirname "${capsule_path}")" = "transactions/${TRANSACTION_ID}"
          test "$(dirname "${store_seal_path}")" = "transactions/${TRANSACTION_ID}"
          test "$(dirname "${recovery_outcome_path}")" \
            = "transactions/${TRANSACTION_ID}/recovery-outcomes"
          echo "capsule_path=${capsule_path}" >> "${GITHUB_OUTPUT}"
          echo "store_seal_path=${store_seal_path}" >> "${GITHUB_OUTPUT}"

      - name: Create the narrow private recovery-store writer token
        id: recovery-store-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: write

      - name: Read the exact private default-branch head after credential creation
        id: recovery-store-head
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recovery-store-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_json="$(gh api "repos/${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}")"
          test "$(jq -er .full_name <<< "${repository_json}")" \
            = "${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}"
          test "$(jq -er .owner.login <<< "${repository_json}")" = "${RECOVERY_OWNER}"
          test "$(jq -er .name <<< "${repository_json}")" = "${RECOVERY_REPOSITORY}"
          test "$(jq -er .private <<< "${repository_json}")" = "true"
          test "$(jq -er .visibility <<< "${repository_json}")" = "private"
          default_branch="$(jq -er .default_branch <<< "${repository_json}")"
          test "${default_branch}" = "${RECOVERY_DEFAULT_BRANCH}"
          ref_json="$(gh api \
            "repos/${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}/git/ref/heads/${default_branch}")"
          test "$(jq -er .object.type <<< "${ref_json}")" = "commit"
          expected_head_sha="$(jq -er .object.sha <<< "${ref_json}")"
          [[ "${expected_head_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "default_branch=${default_branch}" >> "${GITHUB_OUTPUT}"
          echo "expected_head_sha=${expected_head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create-new persist the capsule then its bound store seal
        id: persist
        shell: bash
        env:
          CAPSULE_PATH: ${{ steps.transaction-paths.outputs.capsule_path }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          DEFAULT_BRANCH: ${{ steps.recovery-store-head.outputs.default_branch }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.create-intent.outputs.capsule_sha256 }}
          EXPECTED_HEAD_SHA: ${{ steps.recovery-store-head.outputs.expected_head_sha }}
          EXPECTED_INTENT_SHA256: ${{ needs.create-intent.outputs.intent_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.create-intent.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ steps.recovery-store-token.outputs.token }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          SEAL_PATH: ${{ steps.transaction-paths.outputs.store_seal_path }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          mkdir -p recovery-store-evidence/capsule-write
          mkdir -p recovery-store-evidence/seal-write
          mkdir recovery-store-work
          capsule="${PWD}/recovery-store-input/package/electron-production-publication-recovery-capsule.capsule.json"
          manifest="${PWD}/recovery-store-input/capsule/electron-production-publication-recovery-capsule-manifest.json"
          intent="${PWD}/recovery-store-input/capsule/electron-production-publication-intent-receipt.json"
          held_lease="${PWD}/recovery-store-input/capsule/electron-production-public-latest-lease.json"
          source_snapshot="${PWD}/recovery-store-input/capsule/source-public-latest-snapshot.json"
          target_snapshot="${PWD}/recovery-store-input/capsule/target-public-latest-projection.json"
          capsule_operation="${PWD}/recovery-store-evidence/capsule-write/electron-production-recovery-store-remote-operation.json"
          store_seal="${PWD}/recovery-store-evidence/electron-production-publication-recovery-store-seal.json"
          seal_operation="${PWD}/recovery-store-evidence/seal-write/electron-production-recovery-store-remote-operation.json"
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs create \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --output "${capsule_operation}" \
            --owner "${RECOVERY_OWNER}" \
            --package "${capsule}" \
            --path "${CAPSULE_PATH}" \
            --ref "${DEFAULT_BRANCH}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --repository-default-branch "${DEFAULT_BRANCH}" \
            --repository-visibility private > /dev/null
          capsule_operation_sha256="$(sha256sum "${capsule_operation}" | cut -d ' ' -f 1)"
          test "$(jq -er .terminal.classification "${capsule_operation}")" = "applied"
          capsule_commit_sha="$(jq -er .applied.commitSha "${capsule_operation}")"
          test "$(jq -er .applied.parentCommitSha "${capsule_operation}")" \
            = "${EXPECTED_HEAD_SHA}"
          [[ "${capsule_commit_sha}" =~ ^[0-9a-f]{40}$ ]]

          recorded_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          materialization_input="${PWD}/recovery-store-work/store-seal-materialization.json"
          MATERIALIZATION_INPUT="${materialization_input}" \
          RECORDED_AT="${recorded_at}" node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          await writeFile(process.env.MATERIALIZATION_INPUT, serializeCanonicalJson({
            schemaVersion: 1,
            kind: "rion-electron-production-publication-recovery-store-seal-materialization",
            committedAt: process.env.RECORDED_AT,
            writer: {
              repository: process.env.GITHUB_REPOSITORY,
              workflow: ".github/workflows/electron-production-provisional-publish.yml",
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              controlSha: process.env.CONTROL_SHA
            },
            sealedAt: process.env.RECORDED_AT
          }), { flag: "wx", mode: 0o600 });
          NODE
          materialization_sha256="$(sha256sum "${materialization_input}" | cut -d ' ' -f 1)"
          seal_summary="$(node scripts/electronProductionPublicationRecoveryCli.mjs \
            materialize-store-seal \
            --capsule "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --capsule-manifest "${manifest}" \
            --capsule-manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --input "${materialization_input}" \
            --input-sha256 "${materialization_sha256}" \
            --output "${store_seal}" \
            --publication-intent "${intent}" \
            --publication-intent-sha256 "${EXPECTED_INTENT_SHA256}" \
            --remote-operation "${capsule_operation}" \
            --remote-operation-sha256 "${capsule_operation_sha256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}")"
          store_seal_sha256="$(jq -er .output.sha256 <<< "${seal_summary}")"
          test "$(sha256sum "${store_seal}" | cut -d ' ' -f 1)" \
            = "${store_seal_sha256}"
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs create \
            --expected-head-sha "${capsule_commit_sha}" \
            --output "${seal_operation}" \
            --owner "${RECOVERY_OWNER}" \
            --package "${store_seal}" \
            --path "${SEAL_PATH}" \
            --ref "${DEFAULT_BRANCH}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --repository-default-branch "${DEFAULT_BRANCH}" \
            --repository-visibility private > /dev/null
          seal_operation_sha256="$(sha256sum "${seal_operation}" | cut -d ' ' -f 1)"
          test "$(jq -er .terminal.classification "${seal_operation}")" = "applied"
          test "$(jq -er .applied.parentCommitSha "${seal_operation}")" \
            = "${capsule_commit_sha}"
          echo "capsule_operation_sha256=${capsule_operation_sha256}" >> "${GITHUB_OUTPUT}"
          echo "seal_operation_sha256=${seal_operation_sha256}" >> "${GITHUB_OUTPUT}"
          echo "store_seal_sha256=${store_seal_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact durable recovery-store evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-publication-recovery-store-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: recovery-store-evidence

  attest-recovery-capsule-store:
    name: Attest the durable recovery-store evidence without credentials
    needs:
      - verify-plan
      - acquire-public-latest-lease
      - create-intent
      - attest-intent
      - persist-recovery-capsule
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested recovery capsule directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-store-attestation/capsule

      - name: Download the attested canonical packed recovery capsule
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-package-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-store-attestation/package

      - name: Download the exact durable recovery-store evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-store-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-store-attestation/evidence

      - name: Reverify every durable binding before detached attestation
        shell: bash
        env:
          CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.candidate_control_sha }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CAPSULE_OPERATION_SHA256: ${{ needs.persist-recovery-capsule.outputs.capsule_operation_sha256 }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.create-intent.outputs.capsule_sha256 }}
          EXPECTED_INTENT_SHA256: ${{ needs.create-intent.outputs.intent_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.create-intent.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
          LEASE_EVENT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.lease_event_sha256 }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          SEAL_OPERATION_SHA256: ${{ needs.persist-recovery-capsule.outputs.seal_operation_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          STORE_SEAL_SHA256: ${{ needs.persist-recovery-capsule.outputs.store_seal_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          root="${PWD}/recovery-store-attestation"
          capsule="${root}/package/electron-production-publication-recovery-capsule.capsule.json"
          manifest="${root}/capsule/electron-production-publication-recovery-capsule-manifest.json"
          intent="${root}/capsule/electron-production-publication-intent-receipt.json"
          held_lease="${root}/capsule/electron-production-public-latest-lease.json"
          source_snapshot="${root}/capsule/source-public-latest-snapshot.json"
          target_snapshot="${root}/capsule/target-public-latest-projection.json"
          capsule_operation="${root}/evidence/capsule-write/electron-production-recovery-store-remote-operation.json"
          store_seal="${root}/evidence/electron-production-publication-recovery-store-seal.json"
          seal_operation="${root}/evidence/seal-write/electron-production-recovery-store-remote-operation.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${capsule}" "${manifest}" "${intent}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          node scripts/electronProductionRecoveryCapsuleCli.mjs verify \
            --source-root "${root}/capsule" \
            --capsule-path "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --lease-id "${LEASE_ID}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-event-sha256 "${LEASE_EVENT_SHA256}" \
            --control-head-sha "${CONTROL_SHA}" \
            --control-run-id "${GITHUB_RUN_ID}" \
            --control-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --candidate-source-sha "${SOURCE_SHA}" \
            --candidate-version "${VERSION}" \
            --candidate-control-sha "${CANDIDATE_CONTROL_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --prior-candidate-source-sha "${PRIOR_ELECTRON_SOURCE_SHA}" \
            --prior-candidate-version "${PRIOR_ELECTRON_VERSION}" \
            --prior-candidate-control-sha "${PRIOR_CANDIDATE_CONTROL_SHA}" \
            --prior-candidate-run-id "${PRIOR_CANDIDATE_RUN_ID}" \
            --prior-candidate-run-attempt "${PRIOR_CANDIDATE_RUN_ATTEMPT}" \
            > /dev/null
          node scripts/electronProductionPublicationRecoveryCli.mjs verify-store-seal \
            --capsule "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --capsule-manifest "${manifest}" \
            --capsule-manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --publication-intent "${intent}" \
            --publication-intent-sha256 "${EXPECTED_INTENT_SHA256}" \
            --remote-operation "${capsule_operation}" \
            --remote-operation-sha256 "${CAPSULE_OPERATION_SHA256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${STORE_SEAL_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            > /dev/null
          node scripts/electronProductionRecoveryStoreCreateChainCli.mjs \
            verify-create-chain \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" \
            --capsule-operation "${capsule_operation}" \
            --capsule-operation-sha256 "${CAPSULE_OPERATION_SHA256}" \
            --store-seal "${store_seal}" \
            --seal-operation "${seal_operation}" \
            --seal-operation-sha256 "${SEAL_OPERATION_SHA256}" \
            > /dev/null

      - name: Attest the applied capsule-write operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovery-store-attestation/evidence/capsule-write/electron-production-recovery-store-remote-operation.json

      - name: Attest the bound durable recovery store seal
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovery-store-attestation/evidence/electron-production-publication-recovery-store-seal.json

      - name: Attest the applied seal-write operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovery-store-attestation/evidence/seal-write/electron-production-recovery-store-remote-operation.json

  publish-provisional:
    name: Compare-and-swap public latest into non-terminal provisional state
    # Fail closed until durable recovery storage and recovery workflows can
    # persist and resume the held lease and capsule across workflow lifetime.
    if: ${{ false }}
    needs:
      - verify-plan
      - stage-target
      - acquire-public-latest-lease
      - create-intent
      - attest-intent
      - persist-recovery-capsule
      - attest-recovery-capsule-store
    runs-on: ubuntu-latest
    environment: electron-production-release
    outputs:
      receipt_phase: ${{ steps.select-receipt.outputs.receipt_phase }}
      receipt_sha256: ${{ steps.select-receipt.outputs.receipt_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested recovery capsule
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-capsule

      - name: Download the attested canonical packed recovery capsule
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-capsule-package-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-capsule-package

      - name: Download the attested durable recovery-store evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-publication-recovery-store-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery-store-evidence

      - name: Verify all capsule attestations and the exact canonical binding
        shell: bash
        env:
          CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.candidate_control_sha }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.candidate_run_attempt }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_BYTES: ${{ needs.create-intent.outputs.capsule_bytes }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.create-intent.outputs.capsule_sha256 }}
          EXPECTED_INTENT_SHA256: ${{ needs.create-intent.outputs.intent_sha256 }}
          EXPECTED_MANIFEST_BYTES: ${{ needs.create-intent.outputs.manifest_bytes }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.create-intent.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          LEASE_EVENT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.lease_event_sha256 }}
          LEASE_GENERATION: ${{ needs.acquire-public-latest-lease.outputs.lease_generation }}
          LEASE_ID: ${{ needs.verify-plan.outputs.lease_id }}
          PRIOR_CANDIDATE_CONTROL_SHA: ${{ needs.verify-plan.outputs.prior_candidate_control_sha }}
          PRIOR_CANDIDATE_RUN_ATTEMPT: ${{ needs.verify-plan.outputs.prior_candidate_run_attempt }}
          PRIOR_CANDIDATE_RUN_ID: ${{ inputs.prior_candidate_run_id }}
          PRIOR_ELECTRON_SOURCE_SHA: ${{ needs.verify-plan.outputs.prior_electron_source_sha }}
          PRIOR_ELECTRON_VERSION: ${{ needs.verify-plan.outputs.prior_electron_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          capsule="recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json"
          manifest="recovery-capsule/electron-production-publication-recovery-capsule-manifest.json"
          intent="recovery-capsule/electron-production-publication-intent-receipt.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${capsule}" "${manifest}" "${intent}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          capsule_summary="$(node scripts/electronProductionRecoveryCapsuleCli.mjs verify \
            --source-root "${PWD}/recovery-capsule" \
            --capsule-path "${PWD}/${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --lease-id "${LEASE_ID}" \
            --lease-generation "${LEASE_GENERATION}" \
            --lease-event-sha256 "${LEASE_EVENT_SHA256}" \
            --control-head-sha "${CONTROL_SHA}" \
            --control-run-id "${GITHUB_RUN_ID}" \
            --control-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --candidate-source-sha "${SOURCE_SHA}" \
            --candidate-version "${VERSION}" \
            --candidate-control-sha "${CANDIDATE_CONTROL_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --prior-candidate-source-sha "${PRIOR_ELECTRON_SOURCE_SHA}" \
            --prior-candidate-version "${PRIOR_ELECTRON_VERSION}" \
            --prior-candidate-control-sha "${PRIOR_CANDIDATE_CONTROL_SHA}" \
            --prior-candidate-run-id "${PRIOR_CANDIDATE_RUN_ID}" \
            --prior-candidate-run-attempt "${PRIOR_CANDIDATE_RUN_ATTEMPT}")"
          test "$(jq -er .capsule.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_CAPSULE_SHA256}"
          test "$(jq -er .capsule.bytes <<< "${capsule_summary}")" \
            = "${EXPECTED_CAPSULE_BYTES}"
          test "$(jq -er .manifest.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_MANIFEST_SHA256}"
          test "$(jq -er .manifest.bytes <<< "${capsule_summary}")" \
            = "${EXPECTED_MANIFEST_BYTES}"
          test "$(jq -er .intent.sha256 <<< "${capsule_summary}")" \
            = "${EXPECTED_INTENT_SHA256}"
          test "$(sha256sum "${capsule}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_CAPSULE_SHA256}"
          test "$(wc -c < "${capsule}" | tr -d '[:space:]')" \
            = "${EXPECTED_CAPSULE_BYTES}"
          test "$(sha256sum "${manifest}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_MANIFEST_SHA256}"
          test "$(wc -c < "${manifest}" | tr -d '[:space:]')" \
            = "${EXPECTED_MANIFEST_BYTES}"
          test "$(sha256sum "${intent}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_INTENT_SHA256}"

      - name: Verify the durable recovery-store evidence before public credentials
        shell: bash
        env:
          CAPSULE_OPERATION_SHA256: ${{ needs.persist-recovery-capsule.outputs.capsule_operation_sha256 }}
          CONTROL_SHA: ${{ needs.verify-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.create-intent.outputs.capsule_sha256 }}
          EXPECTED_INTENT_SHA256: ${{ needs.create-intent.outputs.intent_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.create-intent.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.acquire-public-latest-lease.outputs.held_lease_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          SEAL_OPERATION_SHA256: ${{ needs.persist-recovery-capsule.outputs.seal_operation_sha256 }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-plan.outputs.source_snapshot_sha256 }}
          STORE_SEAL_SHA256: ${{ needs.persist-recovery-capsule.outputs.store_seal_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.acquire-public-latest-lease.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          capsule="${PWD}/recovery-capsule-package/electron-production-publication-recovery-capsule.capsule.json"
          manifest="${PWD}/recovery-capsule/electron-production-publication-recovery-capsule-manifest.json"
          intent="${PWD}/recovery-capsule/electron-production-publication-intent-receipt.json"
          held_lease="${PWD}/recovery-capsule/electron-production-public-latest-lease.json"
          source_snapshot="${PWD}/recovery-capsule/source-public-latest-snapshot.json"
          target_snapshot="${PWD}/recovery-capsule/target-public-latest-projection.json"
          capsule_operation="${PWD}/recovery-store-evidence/capsule-write/electron-production-recovery-store-remote-operation.json"
          store_seal="${PWD}/recovery-store-evidence/electron-production-publication-recovery-store-seal.json"
          seal_operation="${PWD}/recovery-store-evidence/seal-write/electron-production-recovery-store-remote-operation.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${capsule_operation}" "${store_seal}" "${seal_operation}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          node scripts/electronProductionPublicationRecoveryCli.mjs verify-store-seal \
            --capsule "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --capsule-manifest "${manifest}" \
            --capsule-manifest-sha256 "${EXPECTED_MANIFEST_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --publication-intent "${intent}" \
            --publication-intent-sha256 "${EXPECTED_INTENT_SHA256}" \
            --remote-operation "${capsule_operation}" \
            --remote-operation-sha256 "${CAPSULE_OPERATION_SHA256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${STORE_SEAL_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            > /dev/null
