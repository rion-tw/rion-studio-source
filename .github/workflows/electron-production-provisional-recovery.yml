name: Electron Production Provisional Recovery

on:
  workflow_dispatch:
    inputs:
      transaction_id:
        description: Exact UUID-fenced provisional publication transaction ID
        required: true
        type: string
      owner_approval:
        description: Type RECOVER ELECTRON PROVISIONAL PUBLICATION
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

env:
  PUBLIC_RELEASE_REPOSITORY: rion-tw/rion-studio
  SOURCE_CONTROL_REPOSITORY: rion-tw/rion-studio-source

concurrency:
  group: public-latest-rion-studio
  cancel-in-progress: false
  queue: max

jobs:
  verify-recovery-plan:
    name: Verify the protected-main recovery request
    # The complete recovery path remains disabled until an independent drill.
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      control_sha: ${{ steps.control.outputs.control_sha }}
      started_at: ${{ steps.request.outputs.started_at }}
      transaction_id: ${{ steps.request.outputs.transaction_id }}
    steps:
      - name: Fence the dispatch to protected trusted main
        id: control
        shell: bash
        env:
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EXPECTED_WORKFLOW_REF: rion-tw/rion-studio-source/.github/workflows/electron-production-provisional-recovery.yml@refs/heads/main
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${SOURCE_CONTROL_REPOSITORY}"
          test "${EVENT_REPOSITORY}" = "${SOURCE_CONTROL_REPOSITORY}"
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${EVENT_DEFAULT_BRANCH}" = "main"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_REF_NAME}" = "main"
          test "${REF_PROTECTED}" = "true"
          test "${WORKFLOW_REF}" = "${EXPECTED_WORKFLOW_REF}"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/${SOURCE_CONTROL_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          test "$(jq -r .path <<< "${run_json}")" \
            = ".github/workflows/electron-production-provisional-recovery.yml"
          test "$(jq -r .event <<< "${run_json}")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<< "${run_json}")" = "main"
          test "$(jq -r .head_sha <<< "${run_json}")" = "${GITHUB_SHA}"
          test "$(jq -r .repository.full_name <<< "${run_json}")" \
            = "${SOURCE_CONTROL_REPOSITORY}"
          echo "control_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ steps.control.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Validate the narrow transaction recovery request
        id: request
        shell: bash
        env:
          CONTROL_SHA: ${{ steps.control.outputs.control_sha }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
          TRANSACTION_ID: ${{ inputs.transaction_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          test "${OWNER_APPROVAL}" = "RECOVER ELECTRON PROVISIONAL PUBLICATION"
          TRANSACTION_ID="${TRANSACTION_ID}" node --input-type=module <<'NODE'
          import { electronProductionRecoveryStoreTransactionPaths } from
            "./scripts/electronProductionRecoveryStoreTransactionPaths.mjs";
          electronProductionRecoveryStoreTransactionPaths({
            transactionId: process.env.TRANSACTION_ID
          });
          NODE
          echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            >> "${GITHUB_OUTPUT}"
          echo "transaction_id=${TRANSACTION_ID}" >> "${GITHUB_OUTPUT}"

  read-private-recovery-store:
    name: Read the exact private recovery-store foundation
    # Private reads stay disabled together with every recovery mutation.
    if: ${{ false }}
    needs: verify-recovery-plan
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store-read
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      capsule_sha256: ${{ steps.read.outputs.capsule_sha256 }}
      capsule_read_operation_sha256: ${{ steps.read.outputs.capsule_read_operation_sha256 }}
      intent_observation_sha256: ${{ steps.read.outputs.intent_observation_sha256 }}
      intent_presence: ${{ steps.read.outputs.intent_presence }}
      outcome_discovery_sha256: ${{ steps.read.outputs.outcome_discovery_sha256 }}
      seal_read_operation_sha256: ${{ steps.read.outputs.seal_read_operation_sha256 }}
      store_seal_sha256: ${{ steps.read.outputs.store_seal_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Derive exact transaction paths and validate protected store coordinates
        id: store-target
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          RECOVERY_APP_CLIENT_ID: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          test -n "${RECOVERY_APP_CLIENT_ID}"
          test "${#RECOVERY_APP_CLIENT_ID}" -le 256
          [[ "${RECOVERY_APP_CLIENT_ID}" != *[[:space:]]* ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != /* ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != */ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != *..* ]]
          [[ "${RECOVERY_OWNER}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          [[ "${RECOVERY_REPOSITORY}" =~ ^[A-Za-z0-9_.-]{1,100}$ ]]
          test "${RECOVERY_REPOSITORY}" != "."
          test "${RECOVERY_REPOSITORY}" != ".."
          paths_json="$(TRANSACTION_ID="${TRANSACTION_ID}" node --input-type=module <<'NODE'
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { electronProductionRecoveryStoreTransactionPaths } from
            "./scripts/electronProductionRecoveryStoreTransactionPaths.mjs";
          process.stdout.write(serializeCanonicalJson(
            electronProductionRecoveryStoreTransactionPaths({
              transactionId: process.env.TRANSACTION_ID
            })
          ));
          NODE
          )"
          capsule_path="$(jq -er .capsulePath <<< "${paths_json}")"
          store_seal_path="$(jq -er .storeSealPath <<< "${paths_json}")"
          test "${capsule_path}" = \
            "transactions/${TRANSACTION_ID}/electron-production-publication-recovery-capsule.capsule.json"
          test "${store_seal_path}" = \
            "transactions/${TRANSACTION_ID}/electron-production-publication-recovery-store-seal.json"
          echo "capsule_path=${capsule_path}" >> "${GITHUB_OUTPUT}"
          echo "store_seal_path=${store_seal_path}" >> "${GITHUB_OUTPUT}"

      - name: Create a narrow private recovery-store read token
        id: recovery-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_READER_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: read

      - name: Fence the private repository and configured default branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_json="$(gh api "repos/${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}")"
          test "$(jq -er .full_name <<< "${repository_json}")" \
            = "${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}"
          test "$(jq -er .private <<< "${repository_json}")" = "true"
          test "$(jq -er .visibility <<< "${repository_json}")" = "private"
          test "$(jq -er .default_branch <<< "${repository_json}")" \
            = "${RECOVERY_DEFAULT_BRANCH}"

      - name: Create-new read the exact capsule and store seal
        id: read
        shell: bash
        env:
          CAPSULE_PATH: ${{ steps.store-target.outputs.capsule_path }}
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          STORE_SEAL_PATH: ${{ steps.store-target.outputs.store_seal_path }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p recovery-store-readback/capsule
          mkdir -p recovery-store-readback/capsule-read
          mkdir -p recovery-store-readback/intent-observation
          mkdir -p recovery-store-readback/outcomes
          mkdir -p recovery-store-readback/store-seal
          mkdir -p recovery-store-readback/seal-read
          capsule="${PWD}/recovery-store-readback/capsule/electron-production-publication-recovery-capsule.capsule.json"
          capsule_read="${PWD}/recovery-store-readback/capsule-read/electron-production-recovery-store-remote-read-operation.json"
          store_seal="${PWD}/recovery-store-readback/store-seal/electron-production-publication-recovery-store-seal.json"
          seal_read="${PWD}/recovery-store-readback/seal-read/electron-production-recovery-store-remote-read-operation.json"
          outcome_discovery="${PWD}/recovery-store-readback/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          intent_observation="${PWD}/recovery-store-readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --path "${CAPSULE_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --content-output "${capsule}" \
            --operation-output "${capsule_read}" > /dev/null
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --path "${STORE_SEAL_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --content-output "${store_seal}" \
            --operation-output "${seal_read}" > /dev/null
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            discover \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${outcome_discovery}" > /dev/null
          outcome_discovery_sha256="$(sha256sum "${outcome_discovery}" | cut -d ' ' -f 1)"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            observe \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --discovery "${outcome_discovery}" \
            --discovery-sha256 "${outcome_discovery_sha256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${intent_observation}" > /dev/null
          capsule_sha256="$(sha256sum "${capsule}" | cut -d ' ' -f 1)"
          store_seal_sha256="$(sha256sum "${store_seal}" | cut -d ' ' -f 1)"
          capsule_read_operation_sha256="$(sha256sum "${capsule_read}" | cut -d ' ' -f 1)"
          seal_read_operation_sha256="$(sha256sum "${seal_read}" | cut -d ' ' -f 1)"
          intent_observation_sha256="$(sha256sum "${intent_observation}" | cut -d ' ' -f 1)"
          intent_presence="$(jq -er .intent.status "${intent_observation}")"
          echo "capsule_sha256=${capsule_sha256}" >> "${GITHUB_OUTPUT}"
          echo "capsule_read_operation_sha256=${capsule_read_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "seal_read_operation_sha256=${seal_read_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_discovery_sha256=${outcome_discovery_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_observation_sha256=${intent_observation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_presence=${intent_presence}" >> "${GITHUB_OUTPUT}"
          echo "store_seal_sha256=${store_seal_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact private readback without credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: recovery-store-readback

  verify-recovered-foundation:
    name: Verify, materialize, and attest the recovered foundation without private credentials
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      held_lease_sha256: ${{ steps.foundation.outputs.held_lease_sha256 }}
      intent_action: ${{ steps.foundation.outputs.intent_action }}
      intent_observation_verification_sha256: ${{ steps.foundation.outputs.intent_observation_verification_sha256 }}
      lease_release_intent_bytes: ${{ steps.foundation.outputs.lease_release_intent_bytes }}
      lease_release_intent_sha256: ${{ steps.foundation.outputs.lease_release_intent_sha256 }}
      outcome_chain_proof_sha256: ${{ steps.foundation.outputs.outcome_chain_proof_sha256 }}
      outcome_chain_status: ${{ steps.foundation.outputs.outcome_chain_status }}
      readback_outcome_binding_sha256: ${{ steps.foundation.outputs.readback_outcome_binding_sha256 }}
      recovery_action: ${{ steps.foundation.outputs.recovery_action }}
      recovered_verification_sha256: ${{ steps.foundation.outputs.recovered_verification_sha256 }}
      source_snapshot_sha256: ${{ steps.foundation.outputs.source_snapshot_sha256 }}
      target_snapshot_sha256: ${{ steps.foundation.outputs.target_snapshot_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the exact private recovery-store readback
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovered-foundation/readback

      - name: Reprove readback, store bindings, publisher identity, and attestations
        id: foundation
        shell: bash
        env:
          CAPSULE_READ_OPERATION_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_read_operation_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          GH_TOKEN: ${{ github.token }}
          INTENT_OBSERVATION_SHA256: ${{ needs.read-private-recovery-store.outputs.intent_observation_sha256 }}
          OUTCOME_DISCOVERY_SHA256: ${{ needs.read-private-recovery-store.outputs.outcome_discovery_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          SEAL_READ_OPERATION_SHA256: ${{ needs.read-private-recovery-store.outputs.seal_read_operation_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          root="${PWD}/recovered-foundation"
          readback="${root}/readback"
          capsule="${readback}/capsule/electron-production-publication-recovery-capsule.capsule.json"
          capsule_read="${readback}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
          store_seal="${readback}/store-seal/electron-production-publication-recovery-store-seal.json"
          seal_read="${readback}/seal-read/electron-production-recovery-store-remote-read-operation.json"
          intent_observation="${readback}/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            verify \
            --discovery "${readback}/outcomes/electron-production-publication-recovery-outcome-discovery.json" \
            --discovery-sha256 "${OUTCOME_DISCOVERY_SHA256}" \
            --observation "${intent_observation}" \
            --observation-sha256 "${INTENT_OBSERVATION_SHA256}" \
            > "${root}/electron-production-recovery-store-optional-intent-verification.json"
          node scripts/electronProductionRecoveryStoreReadbackFoundationCli.mjs \
            verify-readback-foundation \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" \
            --capsule-read-operation "${capsule_read}" \
            --capsule-read-operation-sha256 "${CAPSULE_READ_OPERATION_SHA256}" \
            --store-seal "${store_seal}" \
            --seal-read-operation "${seal_read}" \
            --seal-read-operation-sha256 "${SEAL_READ_OPERATION_SHA256}" \
            > "${root}/electron-production-recovery-store-readback-foundation.json"
          node scripts/electronProductionRecoveredCapsuleCli.mjs verify-recovered \
            --capsule "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            > "${root}/electron-production-recovered-capsule-verification.json"
          verification="${root}/electron-production-recovered-capsule-verification.json"
          test "$(jq -er .status "${verification}")" = "verified"
          test "$(jq -er .verification.status "${verification}")" \
            = "verified-store-foundation"
          test "$(jq -er .verification.transactionId "${verification}")" \
            = "${TRANSACTION_ID}"
          test "$(jq -er .verification.capsule.sha256 "${verification}")" \
            = "${EXPECTED_CAPSULE_SHA256}"
          test "$(jq -er .verification.storeSeal.sha256 "${verification}")" \
            = "${EXPECTED_STORE_SEAL_SHA256}"
          test "$(jq -er .verification.publisher.repository "${verification}")" \
            = "${SOURCE_CONTROL_REPOSITORY}"
          test "$(jq -er .verification.publisher.workflow "${verification}")" \
            = ".github/workflows/electron-production-provisional-publish.yml"
          publisher_control_sha="$(jq -er .verification.publisher.controlSha "${verification}")"
          publisher_run_id="$(jq -er .verification.publisher.runId "${verification}")"
          publisher_run_attempt="$(jq -er .verification.publisher.runAttempt "${verification}")"
          [[ "${publisher_control_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${publisher_run_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${publisher_run_attempt}" =~ ^[1-9][0-9]*$ ]]
          signer_workflow="${SOURCE_CONTROL_REPOSITORY}/.github/workflows/electron-production-provisional-publish.yml"
          invocation_uri="https://github.com/${SOURCE_CONTROL_REPOSITORY}/actions/runs/${publisher_run_id}/attempts/${publisher_run_attempt}"
          for subject in "${capsule}" "${store_seal}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${SOURCE_CONTROL_REPOSITORY}" \
              --format=json \
              --signer-digest "${publisher_control_sha}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${publisher_control_sha}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          node scripts/electronProductionRecoveredCapsuleCli.mjs materialize-recovered \
            --capsule "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --output-root "${root}/materialized" > "${root}/materialization-summary.json"
          test "$(jq -er .verification.status "${root}/materialization-summary.json")" \
            = "verified-store-foundation"
          held_lease_sha256="$(jq -er .verification.foundation.heldLease.sha256 "${verification}")"
          source_snapshot_sha256="$(jq -er .verification.foundation.sourceSnapshot.sha256 "${verification}")"
          target_snapshot_sha256="$(jq -er .verification.foundation.targetSnapshot.sha256 "${verification}")"
          held_lease="${root}/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${root}/materialized/source-public-latest-snapshot.json"
          target_snapshot="${root}/materialized/target-public-latest-projection.json"
          outcome_discovery="${readback}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          mkdir -p "${root}/outcome-chain/latest"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            verify-chain \
            --discovery "${outcome_discovery}" \
            --discovery-sha256 "${OUTCOME_DISCOVERY_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${held_lease_sha256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${source_snapshot_sha256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${target_snapshot_sha256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --latest-outcome-output-directory "${root}/outcome-chain/latest" \
            --output "${root}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json" \
            > "${root}/outcome-chain-summary.json"
          outcome_chain_proof="${root}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          outcome_chain_status="$(jq -er .status "${outcome_chain_proof}")"
          case "${outcome_chain_status}" in
            empty|open) recovery_action="continue-recovery" ;;
            terminal) recovery_action="verified-terminal-no-mutation" ;;
            *) exit 1 ;;
          esac
          outcome_chain_proof_sha256="$(sha256sum "${outcome_chain_proof}" | cut -d ' ' -f 1)"
          node scripts/electronProductionRecoveryStoreReadbackOutcomeBindingCli.mjs \
            verify-readback-outcome-binding \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" \
            --capsule-read-operation "${capsule_read}" \
            --capsule-read-operation-sha256 "${CAPSULE_READ_OPERATION_SHA256}" \
            --store-seal "${store_seal}" \
            --seal-read-operation "${seal_read}" \
            --seal-read-operation-sha256 "${SEAL_READ_OPERATION_SHA256}" \
            --outcome-chain-proof "${outcome_chain_proof}" \
            --outcome-chain-proof-sha256 "${outcome_chain_proof_sha256}" \
            > "${root}/electron-production-recovery-store-readback-outcome-binding.json"
          readback_outcome_binding_sha256="$(sha256sum "${root}/electron-production-recovery-store-readback-outcome-binding.json" | cut -d ' ' -f 1)"
          intent_presence="$(jq -er .intent.status "${intent_observation}")"
          lease_release_intent_sha256=""
          lease_release_intent_bytes="0"
          if test "${outcome_chain_status}" = "terminal"; then
            intent_action="terminal-no-mutation"
          elif test "${intent_presence}" = "absent-at-head"; then
            intent_action="create-intent"
            mkdir "${root}/release-intent"
            node scripts/electronProductionPublicationRecoveryLeaseReleaseIntentCli.mjs \
              materialize-intent \
              --held-lease "${held_lease}" \
              --held-lease-sha256 "${held_lease_sha256}" \
              --store-seal "${store_seal}" \
              --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
              --chain-proof "${outcome_chain_proof}" \
              --chain-proof-sha256 "${outcome_chain_proof_sha256}" \
              --run-repository "${GITHUB_REPOSITORY}" \
              --run-workflow ".github/workflows/electron-production-provisional-recovery.yml" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --control-sha "${CONTROL_SHA}" \
              --run-started-at "${{ needs.verify-recovery-plan.outputs.started_at }}" \
              --authorized-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --output "${root}/release-intent/electron-production-publication-recovery-lease-release-intent.json" \
              > "${root}/release-intent-summary.json"
            lease_release_intent_sha256="$(sha256sum "${root}/release-intent/electron-production-publication-recovery-lease-release-intent.json" | cut -d ' ' -f 1)"
            lease_release_intent_bytes="$(wc -c < "${root}/release-intent/electron-production-publication-recovery-lease-release-intent.json" | tr -d ' ')"
          elif test "${intent_presence}" = "present-at-head"; then
            intent_action="resume-intent"
            lease_release_intent_sha256="$(jq -er .intent.file.sha256 "${intent_observation}")"
            lease_release_intent_bytes="$(jq -er .intent.file.byteLength "${intent_observation}")"
          else
            exit 1
          fi
          intent_observation_verification_sha256="$(sha256sum "${root}/electron-production-recovery-store-optional-intent-verification.json" | cut -d ' ' -f 1)"
          recovered_verification_sha256="$(sha256sum "${verification}" | cut -d ' ' -f 1)"
          echo "held_lease_sha256=${held_lease_sha256}" >> "${GITHUB_OUTPUT}"
          echo "intent_action=${intent_action}" >> "${GITHUB_OUTPUT}"
          echo "intent_observation_verification_sha256=${intent_observation_verification_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "lease_release_intent_sha256=${lease_release_intent_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "lease_release_intent_bytes=${lease_release_intent_bytes}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_chain_proof_sha256=${outcome_chain_proof_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_chain_status=${outcome_chain_status}" >> "${GITHUB_OUTPUT}"
          echo "readback_outcome_binding_sha256=${readback_outcome_binding_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "recovery_action=${recovery_action}" >> "${GITHUB_OUTPUT}"
          echo "source_snapshot_sha256=${source_snapshot_sha256}" >> "${GITHUB_OUTPUT}"
          echo "target_snapshot_sha256=${target_snapshot_sha256}" >> "${GITHUB_OUTPUT}"
          echo "recovered_verification_sha256=${recovered_verification_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload the closed tokenless recovery foundation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-foundation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: recovered-foundation

      - name: Attest the capsule read operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/readback/capsule-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the store-seal read operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/readback/seal-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the tokenless readback verification
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/electron-production-recovery-store-readback-foundation.json

      - name: Attest the recovered capsule cross-binding
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/electron-production-recovered-capsule-verification.json

      - name: Attest the exact materialized capsule manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/materialized/electron-production-publication-recovery-capsule-manifest.json

      - name: Attest the bounded outcome discovery
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json

      - name: Attest the complete outcome chain proof
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json

      - name: Attest the same-head readback and outcome binding
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/electron-production-recovery-store-readback-outcome-binding.json

      - name: Attest the same-head optional intent observation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json

      - name: Attest the tokenless optional intent verification
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/electron-production-recovery-store-optional-intent-verification.json

      - name: Attest a create-new lease-release intent candidate
        if: steps.foundation.outputs.intent_action == 'create-intent'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovered-foundation/release-intent/electron-production-publication-recovery-lease-release-intent.json

  observe-public-latest:
    name: Observe exact public latest without private credentials
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      observation_classification: ${{ steps.observe.outputs.observation_classification }}
      observation_sha256: ${{ steps.observe.outputs.observation_sha256 }}
      observation_status: ${{ steps.observe.outputs.observation_status }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested initial recovery foundation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-foundation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: observation-input

      - name: Reverify the foundation then observe exact public state
        id: observe
        shell: bash
        env:
          CAPSULE_READ_OPERATION_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_read_operation_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          RECOVERY_ACTION: ${{ needs.verify-recovered-foundation.outputs.recovery_action }}
          SEAL_READ_OPERATION_SHA256: ${{ needs.read-private-recovery-store.outputs.seal_read_operation_sha256 }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          test "${RECOVERY_ACTION}" = "continue-recovery"
          initial="${PWD}/observation-input"
          readback="${initial}/readback"
          capsule="${readback}/capsule/electron-production-publication-recovery-capsule.capsule.json"
          store_seal="${readback}/store-seal/electron-production-publication-recovery-store-seal.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=(
            "${readback}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
            "${readback}/seal-read/electron-production-recovery-store-remote-read-operation.json"
            "${initial}/electron-production-recovery-store-readback-foundation.json"
            "${initial}/electron-production-recovered-capsule-verification.json"
            "${initial}/materialized/electron-production-publication-recovery-capsule-manifest.json"
            "${initial}/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json"
            "${initial}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
            "${initial}/electron-production-recovery-store-readback-outcome-binding.json"
            "${readback}/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
            "${initial}/electron-production-recovery-store-optional-intent-verification.json"
          )
          if test -f "${initial}/release-intent/electron-production-publication-recovery-lease-release-intent.json"; then
            subjects+=(
              "${initial}/release-intent/electron-production-publication-recovery-lease-release-intent.json"
            )
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          node scripts/electronProductionRecoveryStoreReadbackFoundationCli.mjs \
            verify-readback-foundation \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" \
            --capsule-read-operation "${readback}/capsule-read/electron-production-recovery-store-remote-read-operation.json" \
            --capsule-read-operation-sha256 "${CAPSULE_READ_OPERATION_SHA256}" \
            --store-seal "${store_seal}" \
            --seal-read-operation "${readback}/seal-read/electron-production-recovery-store-remote-read-operation.json" \
            --seal-read-operation-sha256 "${SEAL_READ_OPERATION_SHA256}" \
            > /dev/null
          mkdir observation-work
          node scripts/electronProductionRecoveredCapsuleCli.mjs materialize-recovered \
            --capsule "${capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --output-root "${PWD}/observation-work/materialized" > /dev/null
          held_lease="${PWD}/observation-work/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${PWD}/observation-work/materialized/source-public-latest-snapshot.json"
          target_snapshot="${PWD}/observation-work/materialized/target-public-latest-projection.json"
          test "$(sha256sum "${held_lease}" | cut -d ' ' -f 1)" = "${HELD_LEASE_SHA256}"
          test "$(sha256sum "${source_snapshot}" | cut -d ' ' -f 1)" = "${SOURCE_SNAPSHOT_SHA256}"
          test "$(sha256sum "${target_snapshot}" | cut -d ' ' -f 1)" = "${TARGET_SNAPSHOT_SHA256}"
          mkdir -p public-observation/latest
          set +e
          node scripts/electronProductionPublicLatestRecoveryCli.mjs observe \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${PWD}/public-observation/latest/electron-production-public-latest-recovery-observation.json" \
            > public-observation/latest/electron-production-public-latest-recovery-observe-summary.json
          observation_status=$?
          set -e
          test -s public-observation/latest/electron-production-public-latest-recovery-observation.json
          test -s public-observation/latest/electron-production-public-latest-recovery-observe-summary.json
          observation_sha256="$(sha256sum public-observation/latest/electron-production-public-latest-recovery-observation.json | cut -d ' ' -f 1)"
          observation_classification="$(jq -er .evidence.observation public-observation/latest/electron-production-public-latest-recovery-observe-summary.json)"
          echo "observation_classification=${observation_classification}" \
            >> "${GITHUB_OUTPUT}"
          echo "observation_sha256=${observation_sha256}" >> "${GITHUB_OUTPUT}"
          echo "observation_status=${observation_status}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact public observation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-public-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: public-observation

      - name: Attest the exact public-latest recovery observation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: public-observation/latest/electron-production-public-latest-recovery-observation.json

      - name: Attest the public-latest observation summary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: public-observation/latest/electron-production-public-latest-recovery-observe-summary.json

  reread-private-recovery-store:
    name: Fresh-read the private recovery store before public mutation
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - observe-public-latest
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store-read
    permissions:
      actions: read
      contents: read
    outputs:
      capsule_read_operation_sha256: ${{ steps.read.outputs.capsule_read_operation_sha256 }}
      intent_observation_sha256: ${{ steps.read.outputs.intent_observation_sha256 }}
      intent_presence: ${{ steps.read.outputs.intent_presence }}
      outcome_discovery_sha256: ${{ steps.read.outputs.outcome_discovery_sha256 }}
      seal_read_operation_sha256: ${{ steps.read.outputs.seal_read_operation_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Re-derive the exact paths and validate reader-only configuration
        id: store-target
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          RECOVERY_APP_CLIENT_ID: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          test -n "${RECOVERY_APP_CLIENT_ID}"
          test "${#RECOVERY_APP_CLIENT_ID}" -le 256
          [[ "${RECOVERY_APP_CLIENT_ID}" != *[[:space:]]* ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != /* ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != */ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != *..* ]]
          [[ "${RECOVERY_OWNER}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          [[ "${RECOVERY_REPOSITORY}" =~ ^[A-Za-z0-9_.-]{1,100}$ ]]
          test "${RECOVERY_REPOSITORY}" != "."
          test "${RECOVERY_REPOSITORY}" != ".."
          paths_json="$(TRANSACTION_ID="${TRANSACTION_ID}" node --input-type=module <<'NODE'
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { electronProductionRecoveryStoreTransactionPaths } from
            "./scripts/electronProductionRecoveryStoreTransactionPaths.mjs";
          process.stdout.write(serializeCanonicalJson(
            electronProductionRecoveryStoreTransactionPaths({
              transactionId: process.env.TRANSACTION_ID
            })
          ));
          NODE
          )"
          echo "capsule_path=$(jq -er .capsulePath <<< "${paths_json}")" \
            >> "${GITHUB_OUTPUT}"
          echo "store_seal_path=$(jq -er .storeSealPath <<< "${paths_json}")" \
            >> "${GITHUB_OUTPUT}"

      - name: Create a fresh narrow private recovery-store read token
        id: recovery-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_READER_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: read

      - name: Re-fence the private repository and configured default branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_json="$(gh api "repos/${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}")"
          test "$(jq -er .full_name <<< "${repository_json}")" \
            = "${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}"
          test "$(jq -er .private <<< "${repository_json}")" = "true"
          test "$(jq -er .visibility <<< "${repository_json}")" = "private"
          test "$(jq -er .default_branch <<< "${repository_json}")" \
            = "${RECOVERY_DEFAULT_BRANCH}"

      - name: Create-new fresh-read the exact capsule and store seal
        id: read
        shell: bash
        env:
          CAPSULE_PATH: ${{ steps.store-target.outputs.capsule_path }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          STORE_SEAL_PATH: ${{ steps.store-target.outputs.store_seal_path }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p fresh-recovery-store-readback/capsule
          mkdir -p fresh-recovery-store-readback/capsule-read
          mkdir -p fresh-recovery-store-readback/intent-observation
          mkdir -p fresh-recovery-store-readback/outcomes
          mkdir -p fresh-recovery-store-readback/store-seal
          mkdir -p fresh-recovery-store-readback/seal-read
          capsule="${PWD}/fresh-recovery-store-readback/capsule/electron-production-publication-recovery-capsule.capsule.json"
          capsule_read="${PWD}/fresh-recovery-store-readback/capsule-read/electron-production-recovery-store-remote-read-operation.json"
          store_seal="${PWD}/fresh-recovery-store-readback/store-seal/electron-production-publication-recovery-store-seal.json"
          seal_read="${PWD}/fresh-recovery-store-readback/seal-read/electron-production-recovery-store-remote-read-operation.json"
          outcome_discovery="${PWD}/fresh-recovery-store-readback/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          intent_observation="${PWD}/fresh-recovery-store-readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --path "${CAPSULE_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-content-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --content-output "${capsule}" \
            --operation-output "${capsule_read}" > /dev/null
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --path "${STORE_SEAL_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-content-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --content-output "${store_seal}" \
            --operation-output "${seal_read}" > /dev/null
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            discover \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${outcome_discovery}" > /dev/null
          outcome_discovery_sha256="$(sha256sum "${outcome_discovery}" | cut -d ' ' -f 1)"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            observe \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --discovery "${outcome_discovery}" \
            --discovery-sha256 "${outcome_discovery_sha256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${intent_observation}" > /dev/null
          capsule_read_operation_sha256="$(sha256sum "${capsule_read}" | cut -d ' ' -f 1)"
          seal_read_operation_sha256="$(sha256sum "${seal_read}" | cut -d ' ' -f 1)"
          intent_observation_sha256="$(sha256sum "${intent_observation}" | cut -d ' ' -f 1)"
          intent_presence="$(jq -er .intent.status "${intent_observation}")"
          echo "capsule_read_operation_sha256=${capsule_read_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "seal_read_operation_sha256=${seal_read_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_discovery_sha256=${outcome_discovery_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_observation_sha256=${intent_observation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_presence=${intent_presence}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact fresh private readback without credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-fresh-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: fresh-recovery-store-readback

  seal-fresh-recovery-evidence:
    name: Seal unchanged private readback evidence without credentials
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - observe-public-latest
      - reread-private-recovery-store
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      continuity_sha256: ${{ steps.continuity.outputs.continuity_sha256 }}
      outcome_chain_continuity_sha256: ${{ steps.continuity.outputs.outcome_chain_continuity_sha256 }}
      outcome_chain_proof_sha256: ${{ steps.continuity.outputs.outcome_chain_proof_sha256 }}
      optional_intent_continuity_sha256: ${{ steps.continuity.outputs.optional_intent_continuity_sha256 }}
      readback_outcome_binding_sha256: ${{ steps.continuity.outputs.readback_outcome_binding_sha256 }}
      recovered_verification_sha256: ${{ steps.continuity.outputs.recovered_verification_sha256 }}
      recovery_store_head_sha: ${{ steps.continuity.outputs.recovery_store_head_sha }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested initial recovery foundation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-foundation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: continuity-input/initial

      - name: Download the fresh private recovery-store readback
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-fresh-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: continuity-input/fresh

      - name: Download the attested public observation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-public-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: continuity-input/observation

      - name: Verify initial attestations and exact readback continuity
        id: continuity
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          FRESH_CAPSULE_READ_SHA256: ${{ needs.reread-private-recovery-store.outputs.capsule_read_operation_sha256 }}
          FRESH_INTENT_OBSERVATION_SHA256: ${{ needs.reread-private-recovery-store.outputs.intent_observation_sha256 }}
          FRESH_OUTCOME_DISCOVERY_SHA256: ${{ needs.reread-private-recovery-store.outputs.outcome_discovery_sha256 }}
          FRESH_SEAL_READ_SHA256: ${{ needs.reread-private-recovery-store.outputs.seal_read_operation_sha256 }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          INITIAL_CAPSULE_READ_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_read_operation_sha256 }}
          INITIAL_INTENT_OBSERVATION_SHA256: ${{ needs.read-private-recovery-store.outputs.intent_observation_sha256 }}
          INITIAL_OUTCOME_CHAIN_PROOF_SHA256: ${{ needs.verify-recovered-foundation.outputs.outcome_chain_proof_sha256 }}
          INITIAL_OUTCOME_DISCOVERY_SHA256: ${{ needs.read-private-recovery-store.outputs.outcome_discovery_sha256 }}
          INITIAL_READBACK_OUTCOME_BINDING_SHA256: ${{ needs.verify-recovered-foundation.outputs.readback_outcome_binding_sha256 }}
          INITIAL_SEAL_READ_SHA256: ${{ needs.read-private-recovery-store.outputs.seal_read_operation_sha256 }}
          INTENT_ACTION: ${{ needs.verify-recovered-foundation.outputs.intent_action }}
          OBSERVATION_SHA256: ${{ needs.observe-public-latest.outputs.observation_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          initial="${PWD}/continuity-input/initial"
          fresh="${PWD}/continuity-input/fresh"
          observation="${PWD}/continuity-input/observation"
          initial_readback="${initial}/readback"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=(
            "${initial_readback}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
            "${initial_readback}/seal-read/electron-production-recovery-store-remote-read-operation.json"
            "${initial}/electron-production-recovery-store-readback-foundation.json"
            "${initial}/electron-production-recovered-capsule-verification.json"
            "${initial}/materialized/electron-production-publication-recovery-capsule-manifest.json"
            "${initial_readback}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
            "${initial}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
            "${initial}/electron-production-recovery-store-readback-outcome-binding.json"
            "${initial_readback}/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
            "${initial}/electron-production-recovery-store-optional-intent-verification.json"
            "${observation}/latest/electron-production-public-latest-recovery-observation.json"
            "${observation}/latest/electron-production-public-latest-recovery-observe-summary.json"
          )
          if test -f "${initial}/release-intent/electron-production-publication-recovery-lease-release-intent.json"; then
            subjects+=(
              "${initial}/release-intent/electron-production-publication-recovery-lease-release-intent.json"
            )
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          mkdir sealed-recovery-evidence
          test "$(sha256sum "${observation}/latest/electron-production-public-latest-recovery-observation.json" | cut -d ' ' -f 1)" \
            = "${OBSERVATION_SHA256}"
          node scripts/electronProductionRecoveryStoreReadbackContinuityCli.mjs \
            verify-readback-continuity \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --initial-capsule "${initial_readback}/capsule/electron-production-publication-recovery-capsule.capsule.json" \
            --initial-capsule-read-operation "${initial_readback}/capsule-read/electron-production-recovery-store-remote-read-operation.json" \
            --initial-capsule-read-operation-sha256 "${INITIAL_CAPSULE_READ_SHA256}" \
            --initial-store-seal "${initial_readback}/store-seal/electron-production-publication-recovery-store-seal.json" \
            --initial-seal-read-operation "${initial_readback}/seal-read/electron-production-recovery-store-remote-read-operation.json" \
            --initial-seal-read-operation-sha256 "${INITIAL_SEAL_READ_SHA256}" \
            --fresh-capsule "${fresh}/capsule/electron-production-publication-recovery-capsule.capsule.json" \
            --fresh-capsule-read-operation "${fresh}/capsule-read/electron-production-recovery-store-remote-read-operation.json" \
            --fresh-capsule-read-operation-sha256 "${FRESH_CAPSULE_READ_SHA256}" \
            --fresh-store-seal "${fresh}/store-seal/electron-production-publication-recovery-store-seal.json" \
            --fresh-seal-read-operation "${fresh}/seal-read/electron-production-recovery-store-remote-read-operation.json" \
            --fresh-seal-read-operation-sha256 "${FRESH_SEAL_READ_SHA256}" \
            > sealed-recovery-evidence/electron-production-recovery-store-readback-continuity.json
          fresh_capsule="${fresh}/capsule/electron-production-publication-recovery-capsule.capsule.json"
          fresh_store_seal="${fresh}/store-seal/electron-production-publication-recovery-store-seal.json"
          node scripts/electronProductionRecoveredCapsuleCli.mjs verify-recovered \
            --capsule "${fresh_capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --store-seal "${fresh_store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            > sealed-recovery-evidence/electron-production-recovered-capsule-verification.json
          cmp "${initial}/electron-production-recovered-capsule-verification.json" \
            sealed-recovery-evidence/electron-production-recovered-capsule-verification.json
          cmp "${initial_readback}/capsule/electron-production-publication-recovery-capsule.capsule.json" \
            "${fresh_capsule}"
          cmp "${initial_readback}/store-seal/electron-production-publication-recovery-store-seal.json" \
            "${fresh_store_seal}"
          node scripts/electronProductionRecoveredCapsuleCli.mjs materialize-recovered \
            --capsule "${fresh_capsule}" \
            --capsule-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --store-seal "${fresh_store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --transaction-id "${TRANSACTION_ID}" \
            --output-root "${PWD}/sealed-recovery-evidence/materialized" \
            > sealed-recovery-evidence/materialization-summary.json
          cmp "${initial}/materialized/electron-production-publication-recovery-capsule-manifest.json" \
            sealed-recovery-evidence/materialized/electron-production-publication-recovery-capsule-manifest.json
          initial_outcome_discovery="${initial_readback}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          fresh_outcome_discovery="${fresh}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          initial_outcome_chain_proof="${initial}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          initial_readback_outcome_binding="${initial}/electron-production-recovery-store-readback-outcome-binding.json"
          test "$(sha256sum "${initial_outcome_chain_proof}" | cut -d ' ' -f 1)" \
            = "${INITIAL_OUTCOME_CHAIN_PROOF_SHA256}"
          test "$(sha256sum "${initial_readback_outcome_binding}" | cut -d ' ' -f 1)" \
            = "${INITIAL_READBACK_OUTCOME_BINDING_SHA256}"
          mkdir -p sealed-recovery-evidence/outcome-chain/latest
          mkdir -p sealed-recovery-evidence/outcome-continuity/latest
          held_lease="${PWD}/sealed-recovery-evidence/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${PWD}/sealed-recovery-evidence/materialized/source-public-latest-snapshot.json"
          target_snapshot="${PWD}/sealed-recovery-evidence/materialized/target-public-latest-projection.json"
          fresh_outcome_chain_proof="${PWD}/sealed-recovery-evidence/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            verify-chain \
            --discovery "${fresh_outcome_discovery}" \
            --discovery-sha256 "${FRESH_OUTCOME_DISCOVERY_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --store-seal "${fresh_store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --latest-outcome-output-directory "${PWD}/sealed-recovery-evidence/outcome-chain/latest" \
            --output "${fresh_outcome_chain_proof}" > /dev/null
          outcome_chain_proof_sha256="$(sha256sum "${fresh_outcome_chain_proof}" | cut -d ' ' -f 1)"
          node scripts/electronProductionRecoveryStoreReadbackOutcomeBindingCli.mjs \
            verify-readback-outcome-binding \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${fresh_capsule}" \
            --capsule-read-operation "${fresh}/capsule-read/electron-production-recovery-store-remote-read-operation.json" \
            --capsule-read-operation-sha256 "${FRESH_CAPSULE_READ_SHA256}" \
            --store-seal "${fresh_store_seal}" \
            --seal-read-operation "${fresh}/seal-read/electron-production-recovery-store-remote-read-operation.json" \
            --seal-read-operation-sha256 "${FRESH_SEAL_READ_SHA256}" \
            --outcome-chain-proof "${fresh_outcome_chain_proof}" \
            --outcome-chain-proof-sha256 "${outcome_chain_proof_sha256}" \
            > sealed-recovery-evidence/electron-production-recovery-store-readback-outcome-binding.json
          readback_outcome_binding_sha256="$(sha256sum sealed-recovery-evidence/electron-production-recovery-store-readback-outcome-binding.json | cut -d ' ' -f 1)"
          outcome_chain_continuity="${PWD}/sealed-recovery-evidence/outcome-continuity/electron-production-publication-recovery-outcome-continuity.json"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            verify-continuity \
            --initial-discovery "${initial_outcome_discovery}" \
            --initial-discovery-sha256 "${INITIAL_OUTCOME_DISCOVERY_SHA256}" \
            --fresh-discovery "${fresh_outcome_discovery}" \
            --fresh-discovery-sha256 "${FRESH_OUTCOME_DISCOVERY_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --store-seal "${fresh_store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --latest-outcome-output-directory "${PWD}/sealed-recovery-evidence/outcome-continuity/latest" \
            --output "${outcome_chain_continuity}" > /dev/null
          test "$(jq -r .terminal "${outcome_chain_continuity}")" = "null"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            verify-continuity \
            --initial-observation "${initial_readback}/intent-observation/electron-production-recovery-store-optional-intent-observation.json" \
            --initial-observation-sha256 "${INITIAL_INTENT_OBSERVATION_SHA256}" \
            --fresh-observation "${fresh}/intent-observation/electron-production-recovery-store-optional-intent-observation.json" \
            --fresh-observation-sha256 "${FRESH_INTENT_OBSERVATION_SHA256}" \
            --outcome-continuity "${outcome_chain_continuity}" \
            --outcome-continuity-sha256 "$(sha256sum "${outcome_chain_continuity}" | cut -d ' ' -f 1)" \
            > sealed-recovery-evidence/electron-production-recovery-store-optional-intent-continuity.json
          intent_presence="$(jq -er .intent.status sealed-recovery-evidence/electron-production-recovery-store-optional-intent-continuity.json)"
          case "${INTENT_ACTION}:${intent_presence}" in
            create-intent:absent-at-head|resume-intent:present-at-head) ;;
            *) exit 1 ;;
          esac
          recovery_store_head_sha="$(jq -er .currentObservation.headCommitSha "${outcome_chain_continuity}")"
          [[ "${recovery_store_head_sha}" =~ ^[0-9a-f]{40}$ ]]
          mkdir sealed-recovery-evidence/readback
          cp -R "${fresh}/capsule" sealed-recovery-evidence/readback/
          cp -R "${fresh}/capsule-read" sealed-recovery-evidence/readback/
          cp -R "${fresh}/intent-observation" sealed-recovery-evidence/readback/
          cp -R "${fresh}/store-seal" sealed-recovery-evidence/readback/
          cp -R "${fresh}/seal-read" sealed-recovery-evidence/readback/
          cp -R "${fresh}/outcomes" sealed-recovery-evidence/readback/
          cp -R "${observation}" sealed-recovery-evidence/public-observation
          continuity_sha256="$(sha256sum sealed-recovery-evidence/electron-production-recovery-store-readback-continuity.json | cut -d ' ' -f 1)"
          outcome_chain_continuity_sha256="$(sha256sum "${outcome_chain_continuity}" | cut -d ' ' -f 1)"
          optional_intent_continuity_sha256="$(sha256sum sealed-recovery-evidence/electron-production-recovery-store-optional-intent-continuity.json | cut -d ' ' -f 1)"
          recovered_verification_sha256="$(sha256sum sealed-recovery-evidence/electron-production-recovered-capsule-verification.json | cut -d ' ' -f 1)"
          echo "continuity_sha256=${continuity_sha256}" >> "${GITHUB_OUTPUT}"
          echo "outcome_chain_continuity_sha256=${outcome_chain_continuity_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_chain_proof_sha256=${outcome_chain_proof_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "optional_intent_continuity_sha256=${optional_intent_continuity_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "readback_outcome_binding_sha256=${readback_outcome_binding_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "recovery_store_head_sha=${recovery_store_head_sha}" \
            >> "${GITHUB_OUTPUT}"
          echo "recovered_verification_sha256=${recovered_verification_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload only the sealed fresh recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-sealed-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: sealed-recovery-evidence

      - name: Attest the fresh capsule read operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/readback/capsule-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the fresh store-seal read operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/readback/seal-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the exact readback continuity proof
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/electron-production-recovery-store-readback-continuity.json

      - name: Attest the fresh recovered capsule cross-binding
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/electron-production-recovered-capsule-verification.json

      - name: Attest the fresh materialized capsule manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/materialized/electron-production-publication-recovery-capsule-manifest.json

      - name: Attest the fresh bounded outcome discovery
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json

      - name: Attest the fresh complete outcome chain proof
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json

      - name: Attest the fresh same-head readback and outcome binding
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/electron-production-recovery-store-readback-outcome-binding.json

      - name: Attest the complete unchanged outcome chain
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/outcome-continuity/electron-production-publication-recovery-outcome-continuity.json

      - name: Attest the fresh same-head optional intent observation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json

      - name: Attest unchanged optional intent presence and identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed-recovery-evidence/electron-production-recovery-store-optional-intent-continuity.json

  persist-recovery-release-intent:
    name: Create-new persist the durable pre-release intent
    # The private mutation remains disabled until an independent recovery drill.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - reread-private-recovery-store
      - seal-fresh-recovery-evidence
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      create_operation_sha256: ${{ steps.persist.outputs.create_operation_sha256 }}
      intent_path: ${{ steps.preflight.outputs.intent_path }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested initial foundation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-foundation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: intent-write-input/foundation

      - name: Download the attested sealed recovery evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-sealed-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: intent-write-input/sealed

      - name: Reverify the no-mutation foundation before requesting a writer token
        id: preflight
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.seal-fresh-recovery-evidence.outputs.recovery_store_head_sha }}
          EXPECTED_INTENT_BYTES: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_bytes }}
          EXPECTED_INTENT_SHA256: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_sha256 }}
          EXPECTED_OUTCOME_CHAIN_SHA256: ${{ needs.verify-recovered-foundation.outputs.outcome_chain_proof_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          FRESH_INTENT_OBSERVATION_SHA256: ${{ needs.reread-private-recovery-store.outputs.intent_observation_sha256 }}
          GH_TOKEN: ${{ github.token }}
          INITIAL_INTENT_OBSERVATION_SHA256: ${{ needs.read-private-recovery-store.outputs.intent_observation_sha256 }}
          INTENT_ACTION: ${{ needs.verify-recovered-foundation.outputs.intent_action }}
          OUTCOME_CONTINUITY_SHA256: ${{ needs.seal-fresh-recovery-evidence.outputs.outcome_chain_continuity_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          test "${INTENT_ACTION}" = "create-intent" \
            -o "${INTENT_ACTION}" = "resume-intent"
          foundation="${PWD}/intent-write-input/foundation"
          sealed="${PWD}/intent-write-input/sealed"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=(
            "${sealed}/readback/capsule-read/electron-production-recovery-store-remote-read-operation.json"
            "${sealed}/readback/seal-read/electron-production-recovery-store-remote-read-operation.json"
            "${sealed}/electron-production-recovery-store-readback-continuity.json"
            "${sealed}/electron-production-recovered-capsule-verification.json"
            "${sealed}/materialized/electron-production-publication-recovery-capsule-manifest.json"
            "${sealed}/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json"
            "${sealed}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
            "${sealed}/electron-production-recovery-store-readback-outcome-binding.json"
            "${sealed}/outcome-continuity/electron-production-publication-recovery-outcome-continuity.json"
            "${sealed}/readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
            "${sealed}/electron-production-recovery-store-optional-intent-continuity.json"
          )
          candidate="${foundation}/release-intent/electron-production-publication-recovery-lease-release-intent.json"
          if test "${INTENT_ACTION}" = "create-intent"; then
            subjects+=("${candidate}")
          else
            test ! -e "${candidate}"
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            verify-continuity \
            --initial-observation "${foundation}/readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json" \
            --initial-observation-sha256 "${INITIAL_INTENT_OBSERVATION_SHA256}" \
            --fresh-observation "${sealed}/readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json" \
            --fresh-observation-sha256 "${FRESH_INTENT_OBSERVATION_SHA256}" \
            --outcome-continuity "${sealed}/outcome-continuity/electron-production-publication-recovery-outcome-continuity.json" \
            --outcome-continuity-sha256 "${OUTCOME_CONTINUITY_SHA256}" \
            > /dev/null
          mkdir -p intent-write-evidence/preflight
          cp "${sealed}/electron-production-recovery-store-optional-intent-continuity.json" \
            intent-write-evidence/preflight/
          INTENT_PATH_OUTPUT="${GITHUB_OUTPUT}" \
          CANDIDATE="${candidate}" node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          import {
            electronProductionPublicationRecoveryLeaseReleaseIntentPath,
            readElectronProductionPublicationRecoveryLeaseReleaseIntent
          } from "./scripts/electronProductionPublicationRecoveryLeaseReleaseIntent.mjs";
          const intentPath =
            electronProductionPublicationRecoveryLeaseReleaseIntentPath({
              transactionId: process.env.TRANSACTION_ID
            });
          if (process.env.INTENT_ACTION === "create-intent") {
            const file =
              await readElectronProductionPublicationRecoveryLeaseReleaseIntent({
                receiptPath: process.env.CANDIDATE,
                expectedSha256: process.env.EXPECTED_INTENT_SHA256
              });
            const intent = file.value;
            for (const [actual, expected, label] of [
              [String(file.valueIdentity.bytes), process.env.EXPECTED_INTENT_BYTES,
                "byte length"],
              [intent.transactionId, process.env.TRANSACTION_ID, "transaction ID"],
              [intent.privateStore.path, intentPath, "fixed path"],
              [intent.privateStore.target.repository,
                `${process.env.RECOVERY_OWNER}/${process.env.RECOVERY_REPOSITORY}`,
                "private repository"],
              [intent.privateStore.target.ref, process.env.RECOVERY_DEFAULT_BRANCH,
                "private ref"],
              [intent.privateStore.expectedHeadCommitSha,
                process.env.EXPECTED_HEAD_SHA, "expected head"],
              [intent.foundation.storeSealSha256,
                process.env.EXPECTED_STORE_SEAL_SHA256, "store-seal SHA-256"],
              [intent.outcomeChain.sha256,
                process.env.EXPECTED_OUTCOME_CHAIN_SHA256,
                "outcome-chain SHA-256"]
            ]) {
              if (actual !== expected) {
                throw new Error(`The durable release-intent ${label} changed.`);
              }
            }
          }
          await appendFile(process.env.INTENT_PATH_OUTPUT,
            `intent_path=${intentPath}\n`);
          NODE

      - name: Create the narrow private recovery-store writer token
        if: needs.verify-recovered-foundation.outputs.intent_action == 'create-intent'
        id: recovery-store-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: write

      - name: Create-new persist only an absent durable release intent
        if: needs.verify-recovered-foundation.outputs.intent_action == 'create-intent'
        id: persist
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.seal-fresh-recovery-evidence.outputs.recovery_store_head_sha }}
          EXPECTED_INTENT_SHA256: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_sha256 }}
          GH_TOKEN: ${{ steps.recovery-store-token.outputs.token }}
          INTENT_PATH: ${{ steps.preflight.outputs.intent_path }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir intent-write-evidence/create
          candidate="${PWD}/intent-write-input/foundation/release-intent/electron-production-publication-recovery-lease-release-intent.json"
          operation="${PWD}/intent-write-evidence/create/electron-production-recovery-store-remote-operation.json"
          test "$(sha256sum "${candidate}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_INTENT_SHA256}"
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs create \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --output "${operation}" \
            --owner "${RECOVERY_OWNER}" \
            --package "${candidate}" \
            --path "${INTENT_PATH}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repo "${RECOVERY_REPOSITORY}" \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private > /dev/null
          test "$(jq -er .terminal.classification "${operation}")" = "applied"
          test "$(jq -er .applied.parentCommitSha "${operation}")" \
            = "${EXPECTED_HEAD_SHA}"
          create_operation_sha256="$(sha256sum "${operation}" | cut -d ' ' -f 1)"
          echo "create_operation_sha256=${create_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload the exact intent write evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-intent-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: intent-write-evidence

  read-durable-recovery-release-intent:
    name: Fresh-read the durable intent and complete private chain
    # The reader is disabled together with the recovery mutation path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - persist-recovery-release-intent
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store-read
    permissions:
      actions: read
      contents: read
    outputs:
      capsule_read_operation_sha256: ${{ steps.read.outputs.capsule_read_operation_sha256 }}
      intent_history_sha256: ${{ steps.read.outputs.intent_history_sha256 }}
      intent_observation_sha256: ${{ steps.read.outputs.intent_observation_sha256 }}
      intent_read_operation_sha256: ${{ steps.read.outputs.intent_read_operation_sha256 }}
      outcome_discovery_sha256: ${{ steps.read.outputs.outcome_discovery_sha256 }}
      seal_read_operation_sha256: ${{ steps.read.outputs.seal_read_operation_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Derive every fixed private path before requesting a reader token
        id: paths
        shell: bash
        env:
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          EXPECTED_INTENT_PATH: ${{ needs.persist-recovery-release-intent.outputs.intent_path }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          [[ "${RECOVERY_DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != /* ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != */ ]]
          [[ "${RECOVERY_DEFAULT_BRANCH}" != *..* ]]
          [[ "${RECOVERY_OWNER}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]
          [[ "${RECOVERY_REPOSITORY}" =~ ^[A-Za-z0-9_.-]{1,100}$ ]]
          paths_json="$(TRANSACTION_ID="${TRANSACTION_ID}" node --input-type=module <<'NODE'
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import {
            electronProductionPublicationRecoveryLeaseReleaseIntentPath
          } from "./scripts/electronProductionPublicationRecoveryLeaseReleaseIntent.mjs";
          import { electronProductionRecoveryStoreTransactionPaths } from
            "./scripts/electronProductionRecoveryStoreTransactionPaths.mjs";
          const transaction = electronProductionRecoveryStoreTransactionPaths({
            transactionId: process.env.TRANSACTION_ID
          });
          process.stdout.write(serializeCanonicalJson({
            capsulePath: transaction.capsulePath,
            intentPath:
              electronProductionPublicationRecoveryLeaseReleaseIntentPath({
                transactionId: process.env.TRANSACTION_ID
              }),
            storeSealPath: transaction.storeSealPath
          }));
          NODE
          )"
          test "$(jq -er .intentPath <<< "${paths_json}")" \
            = "${EXPECTED_INTENT_PATH}"
          echo "capsule_path=$(jq -er .capsulePath <<< "${paths_json}")" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_path=${EXPECTED_INTENT_PATH}" >> "${GITHUB_OUTPUT}"
          echo "store_seal_path=$(jq -er .storeSealPath <<< "${paths_json}")" \
            >> "${GITHUB_OUTPUT}"

      - name: Create a post-intent narrow private recovery-store read token
        id: recovery-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_READER_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: read

      - name: Re-fence the private repository and configured default branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_json="$(gh api "repos/${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}")"
          test "$(jq -er .full_name <<< "${repository_json}")" \
            = "${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}"
          test "$(jq -er .private <<< "${repository_json}")" = "true"
          test "$(jq -er .visibility <<< "${repository_json}")" = "private"
          test "$(jq -er .default_branch <<< "${repository_json}")" \
            = "${RECOVERY_DEFAULT_BRANCH}"

      - name: Read the exact intent and its same-head private foundation
        id: read
        shell: bash
        env:
          CAPSULE_PATH: ${{ steps.paths.outputs.capsule_path }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_INTENT_BYTES: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_bytes }}
          EXPECTED_INTENT_SHA256: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          INTENT_ACTION: ${{ needs.verify-recovered-foundation.outputs.intent_action }}
          INTENT_PATH: ${{ steps.paths.outputs.intent_path }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          STORE_SEAL_PATH: ${{ steps.paths.outputs.store_seal_path }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          root="${PWD}/post-intent-readback"
          mkdir -p "${root}/capsule" "${root}/capsule-read"
          mkdir -p "${root}/intent" "${root}/intent-read"
          mkdir -p "${root}/intent-observation" "${root}/outcomes"
          mkdir -p "${root}/store-seal" "${root}/seal-read"
          capsule="${root}/capsule/electron-production-publication-recovery-capsule.capsule.json"
          capsule_read="${root}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
          intent="${root}/intent/electron-production-publication-recovery-lease-release-intent.json"
          intent_read="${root}/intent-read/electron-production-recovery-store-remote-read-operation.json"
          intent_observation="${root}/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
          store_seal="${root}/store-seal/electron-production-publication-recovery-store-seal.json"
          seal_read="${root}/seal-read/electron-production-recovery-store-remote-read-operation.json"
          outcome_discovery="${root}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${CAPSULE_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-content-sha256 "${EXPECTED_CAPSULE_SHA256}" \
            --content-output "${capsule}" \
            --operation-output "${capsule_read}" > /dev/null
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${STORE_SEAL_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-content-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --content-output "${store_seal}" \
            --operation-output "${seal_read}" > /dev/null
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${INTENT_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-content-sha256 "${EXPECTED_INTENT_SHA256}" \
            --expected-content-bytes "${EXPECTED_INTENT_BYTES}" \
            --content-output "${intent}" \
            --operation-output "${intent_read}" > /dev/null
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            discover \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${outcome_discovery}" > /dev/null
          outcome_discovery_sha256="$(sha256sum "${outcome_discovery}" | cut -d ' ' -f 1)"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            observe \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --discovery "${outcome_discovery}" \
            --discovery-sha256 "${outcome_discovery_sha256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${intent_observation}" > /dev/null
          test "$(jq -er .intent.status "${intent_observation}")" \
            = "present-at-head"
          test "$(jq -er .intent.file.sha256 "${intent_observation}")" \
            = "${EXPECTED_INTENT_SHA256}"
          test "$(jq -er .intent.file.byteLength "${intent_observation}")" \
            = "${EXPECTED_INTENT_BYTES}"
          intent_history_sha256=""
          if test "${INTENT_ACTION}" = "resume-intent"; then
            mkdir "${root}/intent-history"
            intent_history="${root}/intent-history/electron-production-publication-recovery-lease-release-intent-history.json"
            node scripts/electronProductionPublicationRecoveryLeaseReleaseIntentCli.mjs \
              prove-existing-intent-history \
              --intent "${intent}" \
              --intent-sha256 "${EXPECTED_INTENT_SHA256}" \
              --intent-read-operation "${intent_read}" \
              --intent-read-operation-sha256 "$(sha256sum "${intent_read}" | cut -d ' ' -f 1)" \
              --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --output "${intent_history}" > /dev/null
            intent_history_sha256="$(sha256sum "${intent_history}" | cut -d ' ' -f 1)"
          else
            test "${INTENT_ACTION}" = "create-intent"
          fi
          capsule_read_operation_sha256="$(sha256sum "${capsule_read}" | cut -d ' ' -f 1)"
          seal_read_operation_sha256="$(sha256sum "${seal_read}" | cut -d ' ' -f 1)"
          intent_read_operation_sha256="$(sha256sum "${intent_read}" | cut -d ' ' -f 1)"
          intent_observation_sha256="$(sha256sum "${intent_observation}" | cut -d ' ' -f 1)"
          echo "capsule_read_operation_sha256=${capsule_read_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "seal_read_operation_sha256=${seal_read_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_read_operation_sha256=${intent_read_operation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_observation_sha256=${intent_observation_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_discovery_sha256=${outcome_discovery_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_history_sha256=${intent_history_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload the exact post-intent private readback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-post-intent-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: post-intent-readback

  authorize-durable-recovery-release:
    name: Authorize from durable intent and post-intent readback without credentials
    # Tokenless authorization remains disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - seal-fresh-recovery-evidence
      - persist-recovery-release-intent
      - read-durable-recovery-release-intent
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      authorization_sha256: ${{ steps.authorize.outputs.authorization_sha256 }}
      latest_outcome_file: ${{ steps.authorize.outputs.latest_outcome_file }}
      latest_outcome_sha256: ${{ steps.authorize.outputs.latest_outcome_sha256 }}
      outcome_chain_proof_sha256: ${{ steps.authorize.outputs.outcome_chain_proof_sha256 }}
      outcome_chain_status: ${{ steps.authorize.outputs.outcome_chain_status }}
      recovery_store_head_sha: ${{ steps.authorize.outputs.recovery_store_head_sha }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested initial foundation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-foundation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: authorization-input/foundation

      - name: Download the attested sealed recovery evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-sealed-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: authorization-input/sealed

      - name: Download the intent write evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-intent-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: authorization-input/write

      - name: Download the post-intent reader evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-post-intent-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: authorization-input/post-readback

      - name: Verify the post-intent head and materialize the authorization
        id: authorize
        shell: bash
        env:
          CAPSULE_READ_SHA256: ${{ needs.read-durable-recovery-release-intent.outputs.capsule_read_operation_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          CREATE_OPERATION_SHA256: ${{ needs.persist-recovery-release-intent.outputs.create_operation_sha256 }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_INTENT_BYTES: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_bytes }}
          EXPECTED_INTENT_SHA256: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          INTENT_ACTION: ${{ needs.verify-recovered-foundation.outputs.intent_action }}
          INTENT_HISTORY_SHA256: ${{ needs.read-durable-recovery-release-intent.outputs.intent_history_sha256 }}
          INTENT_OBSERVATION_SHA256: ${{ needs.read-durable-recovery-release-intent.outputs.intent_observation_sha256 }}
          INTENT_READ_SHA256: ${{ needs.read-durable-recovery-release-intent.outputs.intent_read_operation_sha256 }}
          OUTCOME_DISCOVERY_SHA256: ${{ needs.read-durable-recovery-release-intent.outputs.outcome_discovery_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          RECOVERY_RUN_STARTED_AT: ${{ needs.verify-recovery-plan.outputs.started_at }}
          SEAL_READ_SHA256: ${{ needs.read-durable-recovery-release-intent.outputs.seal_read_operation_sha256 }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          foundation="${PWD}/authorization-input/foundation"
          sealed="${PWD}/authorization-input/sealed"
          writer="${PWD}/authorization-input/write"
          post="${PWD}/authorization-input/post-readback"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=(
            "${sealed}/readback/capsule-read/electron-production-recovery-store-remote-read-operation.json"
            "${sealed}/readback/seal-read/electron-production-recovery-store-remote-read-operation.json"
            "${sealed}/electron-production-recovery-store-readback-continuity.json"
            "${sealed}/electron-production-recovered-capsule-verification.json"
            "${sealed}/materialized/electron-production-publication-recovery-capsule-manifest.json"
            "${sealed}/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json"
            "${sealed}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
            "${sealed}/electron-production-recovery-store-readback-outcome-binding.json"
            "${sealed}/outcome-continuity/electron-production-publication-recovery-outcome-continuity.json"
            "${sealed}/readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
            "${sealed}/electron-production-recovery-store-optional-intent-continuity.json"
          )
          candidate="${foundation}/release-intent/electron-production-publication-recovery-lease-release-intent.json"
          if test "${INTENT_ACTION}" = "create-intent"; then
            subjects+=("${candidate}")
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          cmp "${writer}/preflight/electron-production-recovery-store-optional-intent-continuity.json" \
            "${sealed}/electron-production-recovery-store-optional-intent-continuity.json"
          mkdir -p post-intent-evidence/outcome-chain/latest
          mkdir post-intent-evidence/readback
          cp -R "${post}"/* post-intent-evidence/readback/
          cp -R "${sealed}/materialized" post-intent-evidence/
          capsule="${post}/capsule/electron-production-publication-recovery-capsule.capsule.json"
          capsule_read="${post}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
          store_seal="${post}/store-seal/electron-production-publication-recovery-store-seal.json"
          seal_read="${post}/seal-read/electron-production-recovery-store-remote-read-operation.json"
          intent="${post}/intent/electron-production-publication-recovery-lease-release-intent.json"
          intent_read="${post}/intent-read/electron-production-recovery-store-remote-read-operation.json"
          intent_observation="${post}/intent-observation/electron-production-recovery-store-optional-intent-observation.json"
          outcome_discovery="${post}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          held_lease="${sealed}/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${sealed}/materialized/source-public-latest-snapshot.json"
          target_snapshot="${sealed}/materialized/target-public-latest-projection.json"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            verify \
            --discovery "${outcome_discovery}" \
            --discovery-sha256 "${OUTCOME_DISCOVERY_SHA256}" \
            --observation "${intent_observation}" \
            --observation-sha256 "${INTENT_OBSERVATION_SHA256}" \
            > post-intent-evidence/electron-production-recovery-store-optional-intent-verification.json
          test "$(jq -er .intent.status post-intent-evidence/electron-production-recovery-store-optional-intent-verification.json)" \
            = "present-at-head"
          test "$(jq -er .intent.file.sha256 post-intent-evidence/electron-production-recovery-store-optional-intent-verification.json)" \
            = "${EXPECTED_INTENT_SHA256}"
          test "$(jq -er .intent.file.byteLength post-intent-evidence/electron-production-recovery-store-optional-intent-verification.json)" \
            = "${EXPECTED_INTENT_BYTES}"
          fresh_chain="${PWD}/post-intent-evidence/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            verify-chain \
            --discovery "${outcome_discovery}" \
            --discovery-sha256 "${OUTCOME_DISCOVERY_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --latest-outcome-output-directory "${PWD}/post-intent-evidence/outcome-chain/latest" \
            --output "${fresh_chain}" > /dev/null
          outcome_chain_status="$(jq -er .status "${fresh_chain}")"
          test "${outcome_chain_status}" = "empty" \
            -o "${outcome_chain_status}" = "open"
          outcome_chain_proof_sha256="$(sha256sum "${fresh_chain}" | cut -d ' ' -f 1)"
          node scripts/electronProductionRecoveryStoreReadbackFoundationCli.mjs \
            verify-readback-foundation \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" \
            --capsule-read-operation "${capsule_read}" \
            --capsule-read-operation-sha256 "${CAPSULE_READ_SHA256}" \
            --store-seal "${store_seal}" \
            --seal-read-operation "${seal_read}" \
            --seal-read-operation-sha256 "${SEAL_READ_SHA256}" \
            > post-intent-evidence/electron-production-recovery-store-readback-foundation.json
          node scripts/electronProductionRecoveryStoreReadbackOutcomeBindingCli.mjs \
            verify-readback-outcome-binding \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" \
            --capsule-read-operation "${capsule_read}" \
            --capsule-read-operation-sha256 "${CAPSULE_READ_SHA256}" \
            --store-seal "${store_seal}" \
            --seal-read-operation "${seal_read}" \
            --seal-read-operation-sha256 "${SEAL_READ_SHA256}" \
            --outcome-chain-proof "${fresh_chain}" \
            --outcome-chain-proof-sha256 "${outcome_chain_proof_sha256}" \
            > post-intent-evidence/electron-production-recovery-store-readback-outcome-binding.json
          test "$(sha256sum "${intent}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_INTENT_SHA256}"
          test "$(wc -c < "${intent}" | tr -d ' ')" = "${EXPECTED_INTENT_BYTES}"
          authorization="${PWD}/post-intent-evidence/electron-production-publication-recovery-lease-release-authorization.json"
          common_args=(
            authorize
            --capsule "${capsule}"
            --capsule-read-operation "${capsule_read}"
            --capsule-read-operation-sha256 "${CAPSULE_READ_SHA256}"
            --owner "${RECOVERY_OWNER}"
            --repo "${RECOVERY_REPOSITORY}"
            --ref "${RECOVERY_DEFAULT_BRANCH}"
            --seal-read-operation "${seal_read}"
            --seal-read-operation-sha256 "${SEAL_READ_SHA256}"
            --store-seal "${store_seal}"
            --fresh-chain-proof "${fresh_chain}"
            --fresh-chain-proof-sha256 "${outcome_chain_proof_sha256}"
            --current-run-repository "${GITHUB_REPOSITORY}"
            --current-run-workflow ".github/workflows/electron-production-provisional-recovery.yml"
            --current-run-id "${GITHUB_RUN_ID}"
            --current-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --current-control-sha "${CONTROL_SHA}"
            --current-run-started-at "${RECOVERY_RUN_STARTED_AT}"
            --intent "${intent}"
            --intent-sha256 "${EXPECTED_INTENT_SHA256}"
            --intent-read-operation "${intent_read}"
            --intent-read-operation-sha256 "${INTENT_READ_SHA256}"
            --verified-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            --output "${authorization}"
          )
          if test "${INTENT_ACTION}" = "create-intent"; then
            cmp "${candidate}" "${intent}"
            create_operation="${writer}/create/electron-production-recovery-store-remote-operation.json"
            test "$(sha256sum "${create_operation}" | cut -d ' ' -f 1)" \
              = "${CREATE_OPERATION_SHA256}"
            node scripts/electronProductionPublicationRecoveryLeaseReleaseIntentCli.mjs \
              "${common_args[@]}" \
              --create-operation "${create_operation}" \
              --create-operation-sha256 "${CREATE_OPERATION_SHA256}" > /dev/null
            mkdir post-intent-evidence/create
            cp "${create_operation}" post-intent-evidence/create/
          else
            test "${INTENT_ACTION}" = "resume-intent"
            test -n "${INTENT_HISTORY_SHA256}"
            test -z "${CREATE_OPERATION_SHA256}"
            intent_history="${post}/intent-history/electron-production-publication-recovery-lease-release-intent-history.json"
            node scripts/electronProductionPublicationRecoveryLeaseReleaseIntentCli.mjs \
              "${common_args[@]}" \
              --intent-history-proof "${intent_history}" \
              --intent-history-proof-sha256 "${INTENT_HISTORY_SHA256}" > /dev/null
          fi
          authorization_sha256="$(sha256sum "${authorization}" | cut -d ' ' -f 1)"
          test "$(jq -er .status "${authorization}")" \
            = "verified-durable-release-authority"
          expected_mode="$(test "${INTENT_ACTION}" = "create-intent" \
            && echo created-now || echo resumed-existing)"
          test "$(jq -er .headTransition.mode "${authorization}")" \
            = "${expected_mode}"
          recovery_store_head_sha="$(jq -er .headTransition.currentHeadCommitSha "${authorization}")"
          test "${recovery_store_head_sha}" \
            = "$(jq -er .currentObservation.headCommitSha "${fresh_chain}")"
          latest_outcome_file="$(jq -r '.latestOutcome.fileName // empty' "${fresh_chain}")"
          latest_outcome_sha256="$(jq -r '.latestOutcome.sha256 // empty' "${fresh_chain}")"
          if test -n "${latest_outcome_file}"; then
            test "$(find post-intent-evidence/outcome-chain/latest -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
            test "$(sha256sum "post-intent-evidence/outcome-chain/latest/${latest_outcome_file}" | cut -d ' ' -f 1)" \
              = "${latest_outcome_sha256}"
          else
            test -z "$(find post-intent-evidence/outcome-chain/latest -maxdepth 1 -type f -print -quit)"
          fi
          echo "authorization_sha256=${authorization_sha256}" >> "${GITHUB_OUTPUT}"
          echo "latest_outcome_file=${latest_outcome_file}" >> "${GITHUB_OUTPUT}"
          echo "latest_outcome_sha256=${latest_outcome_sha256}" >> "${GITHUB_OUTPUT}"
          echo "outcome_chain_proof_sha256=${outcome_chain_proof_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_chain_status=${outcome_chain_status}" >> "${GITHUB_OUTPUT}"
          echo "recovery_store_head_sha=${recovery_store_head_sha}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload the closed post-intent authorization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: post-intent-evidence

      - name: Attest the post-intent capsule read operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/readback/capsule-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the post-intent store-seal read operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/readback/seal-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the exact durable-intent read operation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/readback/intent-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the post-intent bounded outcome discovery
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json

      - name: Attest the same-head present intent observation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/readback/intent-observation/electron-production-recovery-store-optional-intent-observation.json

      - name: Attest the tokenless present intent verification
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/electron-production-recovery-store-optional-intent-verification.json

      - name: Attest the post-intent readback foundation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/electron-production-recovery-store-readback-foundation.json

      - name: Attest the post-intent complete outcome chain
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json

      - name: Attest the post-intent same-head readback binding
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/electron-production-recovery-store-readback-outcome-binding.json

      - name: Attest the exact durable release intent
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/readback/intent/electron-production-publication-recovery-lease-release-intent.json

      - name: Attest the create-new intent operation
        if: needs.verify-recovered-foundation.outputs.intent_action == 'create-intent'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/create/electron-production-recovery-store-remote-operation.json

      - name: Attest the existing intent creation and ancestry proof
        if: needs.verify-recovered-foundation.outputs.intent_action == 'resume-intent'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/readback/intent-history/electron-production-publication-recovery-lease-release-intent-history.json

      - name: Attest the previous durable outcome chain head
        if: steps.authorize.outputs.latest_outcome_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/outcome-chain/latest/${{ steps.authorize.outputs.latest_outcome_file }}

      - name: Attest the durable lease-release authorization
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-intent-evidence/electron-production-publication-recovery-lease-release-authorization.json

  route-recovery-lease-release:
    name: Read-only route the held lease before reserving a public mutation
    # Public route observation remains disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - verify-recovered-foundation
      - observe-public-latest
      - authorize-durable-recovery-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      observation_sha256: ${{ steps.route.outputs.observation_sha256 }}
      route: ${{ steps.route.outputs.route }}
      route_status: ${{ steps.route.outputs.route_status }}
      summary_sha256: ${{ steps.route.outputs.summary_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested durable base authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: lease-route-input/authorization

      - name: Download the attested initial public observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-public-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: lease-route-input/public-observation

      - name: Reverify authority and classify the lease without mutation
        id: route
        shell: bash
        env:
          AUTHORIZATION_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          INITIAL_OBSERVATION_CLASSIFICATION: ${{ needs.observe-public-latest.outputs.observation_classification }}
          INITIAL_OBSERVATION_SHA256: ${{ needs.observe-public-latest.outputs.observation_sha256 }}
          INITIAL_OBSERVATION_STATUS: ${{ needs.observe-public-latest.outputs.observation_status }}
          LATEST_OUTCOME_FILE: ${{ needs.authorize-durable-recovery-release.outputs.latest_outcome_file }}
          LATEST_OUTCOME_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.latest_outcome_sha256 }}
          RECOVERY_RUN_STARTED_AT: ${{ needs.verify-recovery-plan.outputs.started_at }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          authorization_root="${PWD}/lease-route-input/authorization"
          initial="${PWD}/lease-route-input/public-observation/latest/electron-production-public-latest-recovery-observation.json"
          authorization="${authorization_root}/electron-production-publication-recovery-lease-release-authorization.json"
          chain_proof="${authorization_root}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=("${authorization}" "${chain_proof}" "${initial}")
          previous_args=()
          if test -n "${LATEST_OUTCOME_FILE}"; then
            previous="${authorization_root}/outcome-chain/latest/${LATEST_OUTCOME_FILE}"
            subjects+=("${previous}")
            previous_args+=(
              --previous-outcome "${previous}"
              --previous-outcome-sha256 "${LATEST_OUTCOME_SHA256}"
            )
          else
            test -z "${LATEST_OUTCOME_SHA256}"
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${authorization}" | cut -d ' ' -f 1)" \
            = "${AUTHORIZATION_SHA256}"
          test "$(sha256sum "${initial}" | cut -d ' ' -f 1)" \
            = "${INITIAL_OBSERVATION_SHA256}"
          mkdir -p lease-route-evidence/latest
          selected="${PWD}/lease-route-evidence/latest/electron-production-public-latest-recovery-observation.json"
          summary="${PWD}/lease-route-evidence/electron-production-public-latest-recovery-route-summary.json"
          route="not-applicable"
          route_status="0"
          if test "${INITIAL_OBSERVATION_STATUS}:${INITIAL_OBSERVATION_CLASSIFICATION}" \
            = "0:source"; then
            held_lease="${authorization_root}/materialized/electron-production-public-latest-lease.json"
            source_snapshot="${authorization_root}/materialized/source-public-latest-snapshot.json"
            target_snapshot="${authorization_root}/materialized/target-public-latest-projection.json"
            set +e
            node scripts/electronProductionPublicLatestRecoveryCli.mjs \
              route-lease-release \
              --source-snapshot "${source_snapshot}" \
              --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
              --target-snapshot "${target_snapshot}" \
              --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
              --held-lease "${held_lease}" \
              --held-lease-sha256 "${HELD_LEASE_SHA256}" \
              --release-authorization "${authorization}" \
              --release-authorization-sha256 "${AUTHORIZATION_SHA256}" \
              --current-run-repository "${GITHUB_REPOSITORY}" \
              --current-run-workflow ".github/workflows/electron-production-provisional-recovery.yml" \
              --current-run-id "${GITHUB_RUN_ID}" \
              --current-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --current-control-sha "${CONTROL_SHA}" \
              --current-run-started-at "${RECOVERY_RUN_STARTED_AT}" \
              "${previous_args[@]}" \
              --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --output "${selected}" > "${summary}"
            route_status=$?
            set -e
            if test -s "${summary}"; then
              route="$(jq -er .evidence.route "${summary}")"
              case "${route}" in
                release-held|reconcile-released|reconcile-pending)
                  test "${route_status}" = "0"
                  ;;
                blocked)
                  test "${route_status}" != "0"
                  ;;
                *) exit 1 ;;
              esac
            else
              test "${route_status}" != "0"
              route="blocked"
            fi
            if ! test -s "${selected}"; then
              rm -f "${selected}"
              cp "${initial}" "${selected}"
            fi
          else
            cp "${initial}" "${selected}"
          fi
          observation_sha256="$(sha256sum "${selected}" | cut -d ' ' -f 1)"
          summary_sha256=""
          if test -s "${summary}"; then
            summary_sha256="$(sha256sum "${summary}" | cut -d ' ' -f 1)"
          fi
          echo "observation_sha256=${observation_sha256}" >> "${GITHUB_OUTPUT}"
          echo "route=${route}" >> "${GITHUB_OUTPUT}"
          echo "route_status=${route_status}" >> "${GITHUB_OUTPUT}"
          echo "summary_sha256=${summary_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the read-only lease route evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-lease-route-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: lease-route-evidence

      - name: Attest the read-only lease route observation
        if: steps.route.outputs.observation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lease-route-evidence/latest/electron-production-public-latest-recovery-observation.json

      - name: Attest the read-only lease route summary
        if: steps.route.outputs.summary_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lease-route-evidence/electron-production-public-latest-recovery-route-summary.json

  prepare-recovery-public-mutation-attempt:
    name: Prepare one predecessor-fenced public mutation reservation
    # Marker preparation remains disabled with every recovery mutation.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - verify-recovered-foundation
      - observe-public-latest
      - authorize-durable-recovery-release
      - route-recovery-lease-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      attempt_bytes: ${{ steps.prepare.outputs.attempt_bytes }}
      attempt_file: ${{ steps.prepare.outputs.attempt_file }}
      attempt_operation: ${{ steps.prepare.outputs.attempt_operation }}
      attempt_path: ${{ steps.prepare.outputs.attempt_path }}
      attempt_sha256: ${{ steps.prepare.outputs.attempt_sha256 }}
      attempt_status: ${{ steps.prepare.outputs.attempt_status }}
      create_allowed: ${{ steps.prepare.outputs.create_allowed }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested durable base authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: mutation-attempt-input/authorization

      - name: Download the attested public observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-public-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: mutation-attempt-input/public-observation

      - name: Download the attested read-only lease route
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-lease-route-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: mutation-attempt-input/lease-route

      - name: Reverify the base authority and materialize at most one marker candidate
        id: prepare
        shell: bash
        env:
          AUTHORIZATION_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          LATEST_OUTCOME_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.latest_outcome_sha256 }}
          OBSERVATION_CLASSIFICATION: ${{ needs.observe-public-latest.outputs.observation_classification }}
          OBSERVATION_SHA256: ${{ needs.route-recovery-lease-release.outputs.observation_sha256 }}
          OBSERVATION_STATUS: ${{ needs.observe-public-latest.outputs.observation_status }}
          RELEASE_ROUTE: ${{ needs.route-recovery-lease-release.outputs.route }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          authorization_root="${PWD}/mutation-attempt-input/authorization"
          route_root="${PWD}/mutation-attempt-input/lease-route"
          authorization="${authorization_root}/electron-production-publication-recovery-lease-release-authorization.json"
          chain_proof="${authorization_root}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          observation="${route_root}/latest/electron-production-public-latest-recovery-observation.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${authorization}" "${chain_proof}" "${observation}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${authorization}" | cut -d ' ' -f 1)" \
            = "${AUTHORIZATION_SHA256}"
          test "$(sha256sum "${observation}" | cut -d ' ' -f 1)" \
            = "${OBSERVATION_SHA256}"
          mkdir -p mutation-attempt-candidate/evidence
          cp "${observation}" mutation-attempt-candidate/evidence/
          marker_coordinates="$(TRANSACTION_ID="${TRANSACTION_ID}" \
            PREDECESSOR_SHA256="${LATEST_OUTCOME_SHA256}" \
            node --input-type=module <<'NODE'
          import path from "node:path";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import {
            electronProductionPublicationRecoveryPublicMutationAttemptPath
          } from "./scripts/electronProductionPublicationRecoveryPublicMutationAttempt.mjs";
          const markerPath =
            electronProductionPublicationRecoveryPublicMutationAttemptPath({
              transactionId: process.env.TRANSACTION_ID,
              previousOutcomeSha256: process.env.PREDECESSOR_SHA256 || null
            });
          process.stdout.write(serializeCanonicalJson({
            fileName: path.posix.basename(markerPath),
            path: markerPath
          }));
          NODE
          )"
          attempt_file="$(jq -er .fileName <<< "${marker_coordinates}")"
          attempt_path="$(jq -er .path <<< "${marker_coordinates}")"
          attempt_operation=""
          create_allowed="false"
          if test "${OBSERVATION_STATUS}:${OBSERVATION_CLASSIFICATION}:${RELEASE_ROUTE}" \
            = "0:source:release-held"; then
            attempt_operation="release-held-lease"
            create_allowed="true"
          elif test "${OBSERVATION_STATUS}:${OBSERVATION_CLASSIFICATION}" \
            = "0:target"; then
            attempt_operation="rollback-public-latest"
            create_allowed="true"
          else
            echo "attempt_bytes=" >> "${GITHUB_OUTPUT}"
            echo "attempt_file=${attempt_file}" >> "${GITHUB_OUTPUT}"
            echo "attempt_operation=" >> "${GITHUB_OUTPUT}"
            echo "attempt_path=${attempt_path}" >> "${GITHUB_OUTPUT}"
            echo "attempt_sha256=" >> "${GITHUB_OUTPUT}"
            echo "attempt_status=probe-marker" >> "${GITHUB_OUTPUT}"
            echo "create_allowed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir mutation-attempt-candidate/attempt
          attempt="${PWD}/mutation-attempt-candidate/attempt/${attempt_file}"
          node scripts/electronProductionPublicationRecoveryPublicMutationAttemptCli.mjs \
            materialize-attempt \
            --authorization "${authorization}" \
            --authorization-sha256 "${AUTHORIZATION_SHA256}" \
            --operation "${attempt_operation}" \
            --public-observation "${observation}" \
            --public-observation-sha256 "${OBSERVATION_SHA256}" \
            --source-snapshot "${authorization_root}/materialized/source-public-latest-snapshot.json" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${authorization_root}/materialized/target-public-latest-projection.json" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --reserved-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${attempt}" \
            > mutation-attempt-candidate/electron-production-publication-recovery-public-mutation-attempt-summary.json
          attempt_sha256="$(sha256sum "${attempt}" | cut -d ' ' -f 1)"
          attempt_bytes="$(wc -c < "${attempt}" | tr -d ' ')"
          test "$(jq -er .artifact.fileName mutation-attempt-candidate/electron-production-publication-recovery-public-mutation-attempt-summary.json)" \
            = "${attempt_file}"
          test "$(jq -er .artifact.sha256 mutation-attempt-candidate/electron-production-publication-recovery-public-mutation-attempt-summary.json)" \
            = "${attempt_sha256}"
          test "$(jq -er .artifact.bytes mutation-attempt-candidate/electron-production-publication-recovery-public-mutation-attempt-summary.json)" \
            = "${attempt_bytes}"
          test "$(jq -er .authority.heldLease.fileSha256 "${attempt}")" \
            = "${HELD_LEASE_SHA256}"
          test "$(jq -er .privateStore.path "${attempt}")" = "${attempt_path}"
          echo "attempt_bytes=${attempt_bytes}" >> "${GITHUB_OUTPUT}"
          echo "attempt_file=${attempt_file}" >> "${GITHUB_OUTPUT}"
          echo "attempt_operation=${attempt_operation}" >> "${GITHUB_OUTPUT}"
          echo "attempt_path=${attempt_path}" >> "${GITHUB_OUTPUT}"
          echo "attempt_sha256=${attempt_sha256}" >> "${GITHUB_OUTPUT}"
          echo "attempt_status=candidate" >> "${GITHUB_OUTPUT}"
          echo "create_allowed=${create_allowed}" >> "${GITHUB_OUTPUT}"

      - name: Upload the public-mutation marker candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-mutation-attempt-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: mutation-attempt-candidate

      - name: Attest the predecessor-fenced public-mutation marker candidate
        if: steps.prepare.outputs.attempt_status == 'candidate'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mutation-attempt-candidate/attempt/${{ steps.prepare.outputs.attempt_file }}

      - name: Attest the marker materialization summary
        if: steps.prepare.outputs.attempt_status == 'candidate'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mutation-attempt-candidate/electron-production-publication-recovery-public-mutation-attempt-summary.json

  observe-recovery-public-mutation-attempt:
    name: Observe the predecessor marker slot at the authorized private head
    # Private marker reads remain disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - authorize-durable-recovery-release
      - prepare-recovery-public-mutation-attempt
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store-read
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      attempt_action: ${{ steps.observe.outputs.attempt_action }}
      attempt_bytes: ${{ steps.observe.outputs.attempt_bytes }}
      attempt_file: ${{ steps.observe.outputs.attempt_file }}
      attempt_operation: ${{ steps.observe.outputs.attempt_operation }}
      attempt_path: ${{ steps.observe.outputs.attempt_path }}
      attempt_sha256: ${{ steps.observe.outputs.attempt_sha256 }}
      observation_sha256: ${{ steps.observe.outputs.observation_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested durable base authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-observation-input/authorization

      - name: Download the attested marker candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-mutation-attempt-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-observation-input/candidate

      - name: Reverify the marker candidate before requesting a reader token
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        shell: bash
        env:
          ATTEMPT_FILE: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_file }}
          ATTEMPT_SHA256: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_sha256 }}
          ATTEMPT_STATUS: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status }}
          AUTHORIZATION_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          root="${PWD}/marker-observation-input"
          subjects=(
            "${root}/authorization/electron-production-publication-recovery-lease-release-authorization.json"
            "${root}/authorization/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          )
          if test "${ATTEMPT_STATUS}" = "candidate"; then
            subjects+=("${root}/candidate/attempt/${ATTEMPT_FILE}")
          else
            test "${ATTEMPT_STATUS}" = "probe-marker"
            test -z "${ATTEMPT_SHA256}"
          fi
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${root}/authorization/electron-production-publication-recovery-lease-release-authorization.json" | cut -d ' ' -f 1)" \
            = "${AUTHORIZATION_SHA256}"
          if test "${ATTEMPT_STATUS}" = "candidate"; then
            test "$(sha256sum "${root}/candidate/attempt/${ATTEMPT_FILE}" | cut -d ' ' -f 1)" \
              = "${ATTEMPT_SHA256}"
          fi

      - name: Create the narrow private recovery-store reader token
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        id: recovery-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_READER_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: read

      - name: Same-head observe the proof-derived predecessor marker slot
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        id: observe
        shell: bash
        env:
          AUTHORIZED_HEAD_SHA: ${{ needs.authorize-durable-recovery-release.outputs.recovery_store_head_sha }}
          CANDIDATE_BYTES: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_bytes }}
          CANDIDATE_FILE: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_file }}
          CANDIDATE_OPERATION: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_operation }}
          CANDIDATE_PATH: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_path }}
          CANDIDATE_SHA256: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.attempt_sha256 }}
          CHAIN_PROOF_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.outcome_chain_proof_sha256 }}
          CREATE_ALLOWED: ${{ needs.prepare-recovery-public-mutation-attempt.outputs.create_allowed }}
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          root="${PWD}/marker-observation-input/authorization"
          discovery="${root}/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          chain_proof="${root}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          discovery_sha256="$(sha256sum "${discovery}" | cut -d ' ' -f 1)"
          test "$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)" \
            = "${CHAIN_PROOF_SHA256}"
          mkdir marker-slot-observation
          observation="${PWD}/marker-slot-observation/electron-production-recovery-store-optional-public-mutation-attempt-observation.json"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            observe-mutation-attempt \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --discovery "${discovery}" \
            --discovery-sha256 "${discovery_sha256}" \
            --outcome-chain-proof "${chain_proof}" \
            --outcome-chain-proof-sha256 "${CHAIN_PROOF_SHA256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${observation}" \
            > marker-slot-observation/electron-production-recovery-store-optional-public-mutation-attempt-observe-summary.json
          test "$(jq -er .currentObservation.headCommitSha "${observation}")" \
            = "${AUTHORIZED_HEAD_SHA}"
          test "$(jq -er .path "${observation}")" = "${CANDIDATE_PATH}"
          attempt_status="$(jq -er .attempt.status "${observation}")"
          if test "${attempt_status}" = "absent-at-head"; then
            attempt_file="$(basename "${CANDIDATE_PATH}")"
            if test "${CREATE_ALLOWED}" = "true"; then
              attempt_action="create-marker"
              attempt_bytes="${CANDIDATE_BYTES}"
              attempt_operation="${CANDIDATE_OPERATION}"
              attempt_sha256="${CANDIDATE_SHA256}"
            else
              test "${CREATE_ALLOWED}" = "false"
              attempt_action="no-marker"
              attempt_bytes=""
              attempt_operation=""
              attempt_sha256=""
            fi
          else
            test "${attempt_status}" = "present-at-head"
            attempt_action="resume-marker"
            attempt_bytes="$(jq -er .attempt.file.byteLength "${observation}")"
            attempt_file="$(jq -er .attempt.file.fileName "${observation}")"
            attempt_operation="$(jq -er .attempt.operation "${observation}")"
            attempt_sha256="$(jq -er .attempt.file.sha256 "${observation}")"
          fi
          test "${attempt_file}" = "$(basename "${CANDIDATE_PATH}")"
          observation_sha256="$(sha256sum "${observation}" | cut -d ' ' -f 1)"
          echo "attempt_action=${attempt_action}" >> "${GITHUB_OUTPUT}"
          echo "attempt_bytes=${attempt_bytes}" >> "${GITHUB_OUTPUT}"
          echo "attempt_file=${attempt_file}" >> "${GITHUB_OUTPUT}"
          echo "attempt_operation=${attempt_operation}" >> "${GITHUB_OUTPUT}"
          echo "attempt_path=${CANDIDATE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "attempt_sha256=${attempt_sha256}" >> "${GITHUB_OUTPUT}"
          echo "observation_sha256=${observation_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the same-head marker-slot observation
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-marker-slot-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: marker-slot-observation

      - name: Attest the same-head predecessor marker-slot observation
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: marker-slot-observation/electron-production-recovery-store-optional-public-mutation-attempt-observation.json

      - name: Attest the marker-slot observation summary
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: marker-slot-observation/electron-production-recovery-store-optional-public-mutation-attempt-observe-summary.json

  persist-recovery-public-mutation-attempt:
    name: Create-new persist only an absent predecessor marker
    # Private marker persistence remains disabled with every recovery mutation.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - authorize-durable-recovery-release
      - prepare-recovery-public-mutation-attempt
      - observe-recovery-public-mutation-attempt
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      create_operation_classification: ${{ steps.persist.outputs.create_operation_classification }}
      create_operation_sha256: ${{ steps.persist.outputs.create_operation_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested durable base authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-write-input/authorization

      - name: Download the attested marker candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-mutation-attempt-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-write-input/candidate

      - name: Download the attested marker-slot observation
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-slot-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-write-input/observation

      - name: Reverify the exact marker decision before requesting a writer token
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        shell: bash
        env:
          ATTEMPT_ACTION: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_action }}
          ATTEMPT_FILE: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_file }}
          ATTEMPT_SHA256: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_sha256 }}
          CHAIN_PROOF_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.outcome_chain_proof_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          OBSERVATION_SHA256: ${{ needs.observe-recovery-public-mutation-attempt.outputs.observation_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          root="${PWD}/marker-write-input"
          observation="${root}/observation/electron-production-recovery-store-optional-public-mutation-attempt-observation.json"
          discovery="${root}/authorization/readback/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          chain_proof="${root}/authorization/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          candidate="${root}/candidate/attempt/${ATTEMPT_FILE}"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=("${observation}" "${chain_proof}")
          if test "${ATTEMPT_ACTION}" = "create-marker"; then
            subjects+=("${candidate}")
            test "$(sha256sum "${candidate}" | cut -d ' ' -f 1)" \
              = "${ATTEMPT_SHA256}"
          elif test "${ATTEMPT_ACTION}" = "resume-marker"; then
            test -n "${ATTEMPT_SHA256}"
          else
            test "${ATTEMPT_ACTION}" = "no-marker"
            test -z "${ATTEMPT_SHA256}"
          fi
          if test "${ATTEMPT_ACTION}" = "resume-marker"; then
            test "${ATTEMPT_ACTION}" = "resume-marker"
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            verify-mutation-attempt \
            --transaction-id "${{ needs.verify-recovery-plan.outputs.transaction_id }}" \
            --discovery "${discovery}" \
            --discovery-sha256 "$(sha256sum "${discovery}" | cut -d ' ' -f 1)" \
            --outcome-chain-proof "${chain_proof}" \
            --outcome-chain-proof-sha256 "${CHAIN_PROOF_SHA256}" \
            --observation "${observation}" \
            --observation-sha256 "${OBSERVATION_SHA256}" \
            > marker-write-input/electron-production-recovery-store-optional-public-mutation-attempt-verification.json
          expected_status="$(test "${ATTEMPT_ACTION}" = "resume-marker" \
            && echo present-at-head || echo absent-at-head)"
          test "$(jq -er .attempt.status marker-write-input/electron-production-recovery-store-optional-public-mutation-attempt-verification.json)" \
            = "${expected_status}"

      - name: Create the narrow private recovery-store writer token
        if: needs.observe-recovery-public-mutation-attempt.outputs.attempt_action == 'create-marker'
        id: recovery-write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: write

      - name: Create-new persist the predecessor marker or retain the existing slot
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        id: persist
        shell: bash
        env:
          ATTEMPT_ACTION: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_action }}
          ATTEMPT_FILE: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_file }}
          ATTEMPT_PATH: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_path }}
          EXPECTED_HEAD_SHA: ${{ needs.authorize-durable-recovery-release.outputs.recovery_store_head_sha }}
          GH_TOKEN: ${{ steps.recovery-write-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p marker-write-evidence/preflight
          cp marker-write-input/electron-production-recovery-store-optional-public-mutation-attempt-verification.json \
            marker-write-evidence/preflight/
          if test "${ATTEMPT_ACTION}" = "no-marker"; then
            echo "create_operation_classification=not-requested-route" \
              >> "${GITHUB_OUTPUT}"
            echo "create_operation_sha256=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if test "${ATTEMPT_ACTION}" = "resume-marker"; then
            echo "create_operation_classification=not-requested-existing" \
              >> "${GITHUB_OUTPUT}"
            echo "create_operation_sha256=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test "${ATTEMPT_ACTION}" = "create-marker"
          test -n "${GH_TOKEN}"
          mkdir marker-write-evidence/create
          marker="${PWD}/marker-write-input/candidate/attempt/${ATTEMPT_FILE}"
          operation="${PWD}/marker-write-evidence/create/electron-production-recovery-store-remote-operation.json"
          set +e
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs create \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${ATTEMPT_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --package "${marker}" --output "${operation}" \
            > marker-write-evidence/create/electron-production-recovery-store-remote-create-summary.json
          create_status=$?
          set -e
          test -s "${operation}"
          classification="$(jq -er .terminal.classification "${operation}")"
          if test "${create_status}" = "0"; then
            test "${classification}" = "applied"
          else
            test "${classification}" = "rejected" \
              -o "${classification}" = "unknown-acknowledgement"
          fi
          echo "create_operation_classification=${classification}" \
            >> "${GITHUB_OUTPUT}"
          echo "create_operation_sha256=$(sha256sum "${operation}" | cut -d ' ' -f 1)" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload the exact marker write or no-write evidence
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-marker-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: marker-write-evidence

      - name: Attest the exact marker create operation
        if: steps.persist.outputs.create_operation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: marker-write-evidence/create/electron-production-recovery-store-remote-operation.json

      - name: Attest the marker create-operation summary
        if: steps.persist.outputs.create_operation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: marker-write-evidence/create/electron-production-recovery-store-remote-create-summary.json

  read-durable-recovery-public-mutation-attempt:
    name: Fresh-read the marker and complete private foundation at one head
    # Post-marker private reads remain disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - authorize-durable-recovery-release
      - prepare-recovery-public-mutation-attempt
      - observe-recovery-public-mutation-attempt
      - persist-recovery-public-mutation-attempt
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store-read
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      attempt_history_sha256: ${{ steps.read.outputs.attempt_history_sha256 }}
      attempt_read_operation_sha256: ${{ steps.read.outputs.attempt_read_operation_sha256 }}
      attempt_sha256: ${{ steps.read.outputs.attempt_sha256 }}
      capsule_read_operation_sha256: ${{ steps.read.outputs.capsule_read_operation_sha256 }}
      intent_history_sha256: ${{ steps.read.outputs.intent_history_sha256 }}
      intent_read_operation_sha256: ${{ steps.read.outputs.intent_read_operation_sha256 }}
      marker_mode: ${{ steps.read.outputs.marker_mode }}
      marker_presence: ${{ steps.read.outputs.marker_presence }}
      outcome_chain_proof_sha256: ${{ steps.read.outputs.outcome_chain_proof_sha256 }}
      outcome_discovery_sha256: ${{ steps.read.outputs.outcome_discovery_sha256 }}
      seal_read_operation_sha256: ${{ steps.read.outputs.seal_read_operation_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested durable base authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: post-marker-input/authorization

      - name: Download the attested marker candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-mutation-attempt-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: post-marker-input/candidate

      - name: Download the attested initial marker-slot observation
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-slot-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: post-marker-input/initial-observation

      - name: Download the marker write evidence
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: post-marker-input/write

      - name: Create the narrow private recovery-store reader token
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        id: recovery-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_READER_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: read

      - name: Fence the private repository and configured default branch
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_json="$(gh api "repos/${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}")"
          test "$(jq -er .full_name <<< "${repository_json}")" \
            = "${RECOVERY_OWNER}/${RECOVERY_REPOSITORY}"
          test "$(jq -er .private <<< "${repository_json}")" = "true"
          test "$(jq -er .visibility <<< "${repository_json}")" = "private"
          test "$(jq -er .default_branch <<< "${repository_json}")" \
            = "${RECOVERY_DEFAULT_BRANCH}"

      - name: Fresh-read and classify the exact durable predecessor marker
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        id: read
        shell: bash
        env:
          ATTEMPT_ACTION: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_action }}
          ATTEMPT_BYTES: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_bytes }}
          ATTEMPT_FILE: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_file }}
          ATTEMPT_PATH: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_path }}
          ATTEMPT_SHA256: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          CREATE_OPERATION_CLASSIFICATION: ${{ needs.persist-recovery-public-mutation-attempt.outputs.create_operation_classification }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_INTENT_BYTES: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_bytes }}
          EXPECTED_INTENT_SHA256: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          base="${PWD}/post-marker-input/authorization"
          fixed="${base}/materialized"
          fixed_intent="${base}/readback/intent/electron-production-publication-recovery-lease-release-intent.json"
          test "$(sha256sum "${fixed_intent}" | cut -d ' ' -f 1)" \
            = "${EXPECTED_INTENT_SHA256}"
          paths_json="$(TRANSACTION_ID="${TRANSACTION_ID}" node --input-type=module <<'NODE'
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { electronProductionRecoveryStoreTransactionPaths } from
            "./scripts/electronProductionRecoveryStoreTransactionPaths.mjs";
          process.stdout.write(serializeCanonicalJson(
            electronProductionRecoveryStoreTransactionPaths({
              transactionId: process.env.TRANSACTION_ID
            })
          ));
          NODE
          )"
          capsule_path="$(jq -er .capsulePath <<< "${paths_json}")"
          seal_path="$(jq -er .storeSealPath <<< "${paths_json}")"
          intent_path="$(jq -er .privateStore.path "${fixed_intent}")"
          root="${PWD}/post-marker-readback"
          mkdir -p "${root}/capsule" "${root}/capsule-read"
          mkdir -p "${root}/intent" "${root}/intent-read" "${root}/intent-history"
          mkdir -p "${root}/marker" "${root}/marker-read" "${root}/marker-history"
          mkdir -p "${root}/marker-observation" "${root}/outcomes"
          mkdir -p "${root}/outcome-chain/latest" "${root}/store-seal" "${root}/seal-read"
          cp -R "${fixed}" "${root}/materialized"
          capsule="${root}/capsule/electron-production-publication-recovery-capsule.capsule.json"
          capsule_read="${root}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
          store_seal="${root}/store-seal/electron-production-publication-recovery-store-seal.json"
          seal_read="${root}/seal-read/electron-production-recovery-store-remote-read-operation.json"
          intent="${root}/intent/electron-production-publication-recovery-lease-release-intent.json"
          intent_read="${root}/intent-read/electron-production-recovery-store-remote-read-operation.json"
          discovery="${root}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          for specification in \
            "${capsule_path}|${EXPECTED_CAPSULE_SHA256}|${capsule}|${capsule_read}" \
            "${seal_path}|${EXPECTED_STORE_SEAL_SHA256}|${store_seal}|${seal_read}" \
            "${intent_path}|${EXPECTED_INTENT_SHA256}|${intent}|${intent_read}"; do
            IFS='|' read -r remote_path expected_sha content operation \
              <<< "${specification}"
            extra=()
            if test "${remote_path}" = "${intent_path}"; then
              extra+=(--expected-content-bytes "${EXPECTED_INTENT_BYTES}")
            fi
            node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
              --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
              --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${remote_path}" \
              --repository-visibility private \
              --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
              --expected-content-sha256 "${expected_sha}" \
              "${extra[@]}" --content-output "${content}" \
              --operation-output "${operation}" > /dev/null
          done
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            discover \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${discovery}" > /dev/null
          capsule_read_sha256="$(sha256sum "${capsule_read}" | cut -d ' ' -f 1)"
          seal_read_sha256="$(sha256sum "${seal_read}" | cut -d ' ' -f 1)"
          intent_read_sha256="$(sha256sum "${intent_read}" | cut -d ' ' -f 1)"
          discovery_sha256="$(sha256sum "${discovery}" | cut -d ' ' -f 1)"
          held_lease="${root}/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${root}/materialized/source-public-latest-snapshot.json"
          target_snapshot="${root}/materialized/target-public-latest-projection.json"
          chain_proof="${root}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            verify-chain \
            --discovery "${discovery}" --discovery-sha256 "${discovery_sha256}" \
            --held-lease "${held_lease}" --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${EXPECTED_STORE_SEAL_SHA256}" \
            --latest-outcome-output-directory "${root}/outcome-chain/latest" \
            --output "${chain_proof}" > /dev/null
          chain_proof_sha256="$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)"
          test "$(jq -er .status "${chain_proof}")" = "empty" \
            -o "$(jq -er .status "${chain_proof}")" = "open"
          node scripts/electronProductionRecoveryStoreReadbackFoundationCli.mjs \
            verify-readback-foundation \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" --capsule-read-operation "${capsule_read}" \
            --capsule-read-operation-sha256 "${capsule_read_sha256}" \
            --store-seal "${store_seal}" --seal-read-operation "${seal_read}" \
            --seal-read-operation-sha256 "${seal_read_sha256}" \
            > "${root}/electron-production-recovery-store-readback-foundation.json"
          node scripts/electronProductionRecoveryStoreReadbackOutcomeBindingCli.mjs \
            verify-readback-outcome-binding \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --capsule "${capsule}" --capsule-read-operation "${capsule_read}" \
            --capsule-read-operation-sha256 "${capsule_read_sha256}" \
            --store-seal "${store_seal}" --seal-read-operation "${seal_read}" \
            --seal-read-operation-sha256 "${seal_read_sha256}" \
            --outcome-chain-proof "${chain_proof}" \
            --outcome-chain-proof-sha256 "${chain_proof_sha256}" \
            > "${root}/electron-production-recovery-store-readback-outcome-binding.json"
          intent_history="${root}/intent-history/electron-production-publication-recovery-lease-release-intent-history.json"
          node scripts/electronProductionPublicationRecoveryLeaseReleaseIntentCli.mjs \
            prove-existing-intent-history \
            --intent "${intent}" --intent-sha256 "${EXPECTED_INTENT_SHA256}" \
            --intent-read-operation "${intent_read}" \
            --intent-read-operation-sha256 "${intent_read_sha256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${intent_history}" > /dev/null
          intent_history_sha256="$(sha256sum "${intent_history}" | cut -d ' ' -f 1)"
          marker_observation="${root}/marker-observation/electron-production-recovery-store-optional-public-mutation-attempt-observation.json"
          node scripts/electronProductionRecoveryStoreOptionalIntentObservationCli.mjs \
            observe-mutation-attempt \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --discovery "${discovery}" --discovery-sha256 "${discovery_sha256}" \
            --outcome-chain-proof "${chain_proof}" \
            --outcome-chain-proof-sha256 "${chain_proof_sha256}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${marker_observation}" > /dev/null
          marker_presence="$(jq -er .attempt.status "${marker_observation}")"
          if test "${marker_presence}" = "absent-at-head"; then
            echo "attempt_history_sha256=" >> "${GITHUB_OUTPUT}"
            echo "attempt_read_operation_sha256=" >> "${GITHUB_OUTPUT}"
            echo "attempt_sha256=" >> "${GITHUB_OUTPUT}"
            echo "marker_mode=no-durable-marker" >> "${GITHUB_OUTPUT}"
          else
            test "${marker_presence}" = "present-at-head"
            observed_sha256="$(jq -er .attempt.file.sha256 "${marker_observation}")"
            observed_bytes="$(jq -er .attempt.file.byteLength "${marker_observation}")"
            observed_file="$(jq -er .attempt.file.fileName "${marker_observation}")"
            test "${observed_file}" = "$(basename "${ATTEMPT_PATH}")"
            marker="${root}/marker/${observed_file}"
            marker_read="${root}/marker-read/electron-production-recovery-store-remote-read-operation.json"
            node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
              --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
              --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${ATTEMPT_PATH}" \
              --repository-visibility private \
              --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
              --expected-content-sha256 "${observed_sha256}" \
              --expected-content-bytes "${observed_bytes}" \
              --content-output "${marker}" --operation-output "${marker_read}" \
              > /dev/null
            marker_read_sha256="$(sha256sum "${marker_read}" | cut -d ' ' -f 1)"
            test "$(jq -er .observed.headCommitSha "${marker_read}")" \
              = "$(jq -er .currentObservation.headCommitSha "${chain_proof}")"
            if test "${ATTEMPT_ACTION}:${CREATE_OPERATION_CLASSIFICATION}:${observed_sha256}" \
              = "create-marker:applied:${ATTEMPT_SHA256}"; then
              marker_mode="created-now"
              marker_history_sha256=""
            else
              marker_mode="resumed-existing"
              marker_history="${root}/marker-history/electron-production-publication-recovery-public-mutation-attempt-history.json"
              node scripts/electronProductionPublicationRecoveryPublicMutationAttemptCli.mjs \
                prove-existing-attempt-history \
                --attempt "${marker}" --attempt-sha256 "${observed_sha256}" \
                --attempt-read-operation "${marker_read}" \
                --attempt-read-operation-sha256 "${marker_read_sha256}" \
                --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                --output "${marker_history}" > /dev/null
              marker_history_sha256="$(sha256sum "${marker_history}" | cut -d ' ' -f 1)"
            fi
            echo "attempt_history_sha256=${marker_history_sha256}" \
              >> "${GITHUB_OUTPUT}"
            echo "attempt_read_operation_sha256=${marker_read_sha256}" \
              >> "${GITHUB_OUTPUT}"
            echo "attempt_sha256=${observed_sha256}" >> "${GITHUB_OUTPUT}"
            echo "marker_mode=${marker_mode}" >> "${GITHUB_OUTPUT}"
          fi
          echo "marker_presence=${marker_presence}" >> "${GITHUB_OUTPUT}"
          echo "capsule_read_operation_sha256=${capsule_read_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_history_sha256=${intent_history_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "intent_read_operation_sha256=${intent_read_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_chain_proof_sha256=${chain_proof_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "outcome_discovery_sha256=${discovery_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "seal_read_operation_sha256=${seal_read_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload the exact post-marker private readback
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-post-marker-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: post-marker-readback

      - name: Attest the post-marker complete private foundation
        if: steps.read.outputs.outcome_chain_proof_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            post-marker-readback/capsule-read/electron-production-recovery-store-remote-read-operation.json
            post-marker-readback/seal-read/electron-production-recovery-store-remote-read-operation.json
            post-marker-readback/intent-read/electron-production-recovery-store-remote-read-operation.json
            post-marker-readback/outcomes/electron-production-publication-recovery-outcome-discovery.json
            post-marker-readback/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json
            post-marker-readback/electron-production-recovery-store-readback-foundation.json
            post-marker-readback/electron-production-recovery-store-readback-outcome-binding.json
            post-marker-readback/intent-history/electron-production-publication-recovery-lease-release-intent-history.json
            post-marker-readback/marker-observation/electron-production-recovery-store-optional-public-mutation-attempt-observation.json

      - name: Attest the exact durable public-mutation marker read
        if: steps.read.outputs.marker_presence == 'present-at-head'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            post-marker-readback/marker/${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_file }}
            post-marker-readback/marker-read/electron-production-recovery-store-remote-read-operation.json

      - name: Attest the existing marker creation and ancestry proof
        if: steps.read.outputs.marker_mode == 'resumed-existing'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: post-marker-readback/marker-history/electron-production-publication-recovery-public-mutation-attempt-history.json

  authorize-recovery-public-mutation-attempt:
    name: Authorize one durable marker without private or public credentials
    # Marker authorization remains disabled with every recovery mutation.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - authorize-durable-recovery-release
      - prepare-recovery-public-mutation-attempt
      - observe-recovery-public-mutation-attempt
      - persist-recovery-public-mutation-attempt
      - read-durable-recovery-public-mutation-attempt
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      authorization_mode: ${{ steps.authorize.outputs.authorization_mode }}
      authorization_sha256: ${{ steps.authorize.outputs.authorization_sha256 }}
      latest_outcome_file: ${{ steps.authorize.outputs.latest_outcome_file }}
      latest_outcome_sha256: ${{ steps.authorize.outputs.latest_outcome_sha256 }}
      operation: ${{ steps.authorize.outputs.operation }}
      post_marker_base_authorization_sha256: ${{ steps.authorize.outputs.post_marker_base_authorization_sha256 }}
      recovery_store_head_sha: ${{ steps.authorize.outputs.recovery_store_head_sha }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested durable base authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-authorization-input/base

      - name: Download the attested marker candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-mutation-attempt-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-authorization-input/candidate

      - name: Download the attested initial marker-slot observation
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-slot-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-authorization-input/initial-observation

      - name: Download the marker write evidence
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-authorization-input/write

      - name: Download the attested post-marker private readback
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-post-marker-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: marker-authorization-input/post

      - name: Verify provenance then close the marker authorization
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        id: authorize
        shell: bash
        env:
          ATTEMPT_FILE: ${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_file }}
          ATTEMPT_HISTORY_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.attempt_history_sha256 }}
          ATTEMPT_READ_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.attempt_read_operation_sha256 }}
          ATTEMPT_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.attempt_sha256 }}
          BASE_AUTHORIZATION_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.authorization_sha256 }}
          CAPSULE_READ_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.capsule_read_operation_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          CREATE_OPERATION_SHA256: ${{ needs.persist-recovery-public-mutation-attempt.outputs.create_operation_sha256 }}
          EXPECTED_CAPSULE_SHA256: ${{ needs.read-private-recovery-store.outputs.capsule_sha256 }}
          EXPECTED_INTENT_SHA256: ${{ needs.verify-recovered-foundation.outputs.lease_release_intent_sha256 }}
          EXPECTED_STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          INTENT_HISTORY_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.intent_history_sha256 }}
          INTENT_READ_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.intent_read_operation_sha256 }}
          MARKER_MODE: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.marker_mode }}
          MARKER_PRESENCE: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence }}
          OUTCOME_CHAIN_PROOF_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.outcome_chain_proof_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          RECOVERY_RUN_STARTED_AT: ${{ needs.verify-recovery-plan.outputs.started_at }}
          SEAL_READ_SHA256: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.seal_read_operation_sha256 }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          test "${MARKER_PRESENCE}" = "present-at-head" \
            -o "${MARKER_PRESENCE}" = "absent-at-head"
          base="${PWD}/marker-authorization-input/base"
          initial="${PWD}/marker-authorization-input/initial-observation"
          candidate_root="${PWD}/marker-authorization-input/candidate"
          writer="${PWD}/marker-authorization-input/write"
          post="${PWD}/marker-authorization-input/post"
          base_authorization="${base}/electron-production-publication-recovery-lease-release-authorization.json"
          marker="${post}/marker/${ATTEMPT_FILE}"
          marker_read="${post}/marker-read/electron-production-recovery-store-remote-read-operation.json"
          marker_observation="${post}/marker-observation/electron-production-recovery-store-optional-public-mutation-attempt-observation.json"
          intent="${post}/intent/electron-production-publication-recovery-lease-release-intent.json"
          intent_read="${post}/intent-read/electron-production-recovery-store-remote-read-operation.json"
          intent_history="${post}/intent-history/electron-production-publication-recovery-lease-release-intent-history.json"
          capsule="${post}/capsule/electron-production-publication-recovery-capsule.capsule.json"
          capsule_read="${post}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
          store_seal="${post}/store-seal/electron-production-publication-recovery-store-seal.json"
          seal_read="${post}/seal-read/electron-production-recovery-store-remote-read-operation.json"
          chain_proof="${post}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          held_lease="${post}/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${post}/materialized/source-public-latest-snapshot.json"
          target_snapshot="${post}/materialized/target-public-latest-projection.json"
          test "$(sha256sum "${base_authorization}" | cut -d ' ' -f 1)" \
            = "${BASE_AUTHORIZATION_SHA256}"
          test "$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)" \
            = "${OUTCOME_CHAIN_PROOF_SHA256}"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=(
            "${base_authorization}"
            "${initial}/electron-production-recovery-store-optional-public-mutation-attempt-observation.json"
            "${post}/capsule-read/electron-production-recovery-store-remote-read-operation.json"
            "${post}/seal-read/electron-production-recovery-store-remote-read-operation.json"
            "${intent_read}"
            "${post}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
            "${chain_proof}"
            "${post}/electron-production-recovery-store-readback-foundation.json"
            "${post}/electron-production-recovery-store-readback-outcome-binding.json"
            "${intent_history}"
            "${marker_observation}"
          )
          if test "${MARKER_PRESENCE}" = "present-at-head"; then
            test "$(sha256sum "${marker}" | cut -d ' ' -f 1)" \
              = "${ATTEMPT_SHA256}"
            subjects+=("${marker}" "${marker_read}")
            if test "${MARKER_MODE}" = "created-now"; then
              test -n "${CREATE_OPERATION_SHA256}"
              subjects+=(
                "${candidate_root}/attempt/${ATTEMPT_FILE}"
                "${writer}/create/electron-production-recovery-store-remote-operation.json"
              )
            else
              test "${MARKER_MODE}" = "resumed-existing"
              test -n "${ATTEMPT_HISTORY_SHA256}"
              subjects+=(
                "${post}/marker-history/electron-production-publication-recovery-public-mutation-attempt-history.json"
              )
            fi
          else
            test "${MARKER_MODE}" = "no-durable-marker"
            test -z "${ATTEMPT_SHA256}"
            test -z "${CREATE_OPERATION_SHA256}"
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          mkdir marker-authorization-evidence
          post_base_authorization="${PWD}/marker-authorization-evidence/electron-production-publication-recovery-lease-release-authorization.json"
          node scripts/electronProductionPublicationRecoveryLeaseReleaseIntentCli.mjs \
            authorize \
            --capsule "${capsule}" \
            --capsule-read-operation "${capsule_read}" \
            --capsule-read-operation-sha256 "${CAPSULE_READ_SHA256}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --seal-read-operation "${seal_read}" \
            --seal-read-operation-sha256 "${SEAL_READ_SHA256}" \
            --store-seal "${store_seal}" \
            --fresh-chain-proof "${chain_proof}" \
            --fresh-chain-proof-sha256 "${OUTCOME_CHAIN_PROOF_SHA256}" \
            --current-run-repository "${GITHUB_REPOSITORY}" \
            --current-run-workflow ".github/workflows/electron-production-provisional-recovery.yml" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --current-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --current-control-sha "${CONTROL_SHA}" \
            --current-run-started-at "${RECOVERY_RUN_STARTED_AT}" \
            --intent "${intent}" --intent-sha256 "${EXPECTED_INTENT_SHA256}" \
            --intent-read-operation "${intent_read}" \
            --intent-read-operation-sha256 "${INTENT_READ_SHA256}" \
            --intent-history-proof "${intent_history}" \
            --intent-history-proof-sha256 "${INTENT_HISTORY_SHA256}" \
            --verified-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${post_base_authorization}" > /dev/null
          post_base_authorization_sha256="$(sha256sum "${post_base_authorization}" | cut -d ' ' -f 1)"
          test "$(jq -er .headTransition.mode "${post_base_authorization}")" \
            = "resumed-existing"
          recovery_store_head_sha="$(jq -er .headTransition.currentHeadCommitSha "${post_base_authorization}")"
          test "${recovery_store_head_sha}" \
            = "$(jq -er .currentObservation.headCommitSha "${chain_proof}")"
          latest_outcome_file="$(jq -r '.latestOutcome.fileName // empty' "${chain_proof}")"
          latest_outcome_sha256="$(jq -r '.latestOutcome.sha256 // empty' "${chain_proof}")"
          if test "${MARKER_PRESENCE}" = "absent-at-head"; then
            echo "authorization_mode=" >> "${GITHUB_OUTPUT}"
            echo "authorization_sha256=" >> "${GITHUB_OUTPUT}"
            echo "latest_outcome_file=${latest_outcome_file}" >> "${GITHUB_OUTPUT}"
            echo "latest_outcome_sha256=${latest_outcome_sha256}" >> "${GITHUB_OUTPUT}"
            echo "operation=" >> "${GITHUB_OUTPUT}"
            echo "post_marker_base_authorization_sha256=${post_base_authorization_sha256}" \
              >> "${GITHUB_OUTPUT}"
            echo "recovery_store_head_sha=${recovery_store_head_sha}" \
              >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          marker_authorization="${PWD}/marker-authorization-evidence/electron-production-publication-recovery-public-mutation-attempt-authorization.json"
          common_args=(
            authorize-attempt
            --attempt "${marker}"
            --attempt-sha256 "${ATTEMPT_SHA256}"
            --attempt-read-operation "${marker_read}"
            --attempt-read-operation-sha256 "${ATTEMPT_READ_SHA256}"
            --post-marker-authorization "${post_base_authorization}"
            --post-marker-authorization-sha256 "${post_base_authorization_sha256}"
            --verified-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            --output "${marker_authorization}"
          )
          if test "${MARKER_MODE}" = "created-now"; then
            create_operation="${writer}/create/electron-production-recovery-store-remote-operation.json"
            test "$(sha256sum "${create_operation}" | cut -d ' ' -f 1)" \
              = "${CREATE_OPERATION_SHA256}"
            node scripts/electronProductionPublicationRecoveryPublicMutationAttemptCli.mjs \
              "${common_args[@]}" \
              --pre-marker-authorization "${base_authorization}" \
              --pre-marker-authorization-sha256 "${BASE_AUTHORIZATION_SHA256}" \
              --create-operation "${create_operation}" \
              --create-operation-sha256 "${CREATE_OPERATION_SHA256}" > /dev/null
          else
            marker_history="${post}/marker-history/electron-production-publication-recovery-public-mutation-attempt-history.json"
            node scripts/electronProductionPublicationRecoveryPublicMutationAttemptCli.mjs \
              "${common_args[@]}" \
              --attempt-history-proof "${marker_history}" \
              --attempt-history-proof-sha256 "${ATTEMPT_HISTORY_SHA256}" \
              > /dev/null
          fi
          authorization_sha256="$(sha256sum "${marker_authorization}" | cut -d ' ' -f 1)"
          test "$(jq -er .headTransition.mode "${marker_authorization}")" \
            = "${MARKER_MODE}"
          test "$(jq -er .operation "${marker_authorization}")" \
            = "${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_operation }}"
          test "$(jq -er .headTransition.currentHeadCommitSha "${marker_authorization}")" \
            = "${recovery_store_head_sha}"
          echo "authorization_mode=${MARKER_MODE}" >> "${GITHUB_OUTPUT}"
          echo "authorization_sha256=${authorization_sha256}" >> "${GITHUB_OUTPUT}"
          echo "latest_outcome_file=${latest_outcome_file}" >> "${GITHUB_OUTPUT}"
          echo "latest_outcome_sha256=${latest_outcome_sha256}" >> "${GITHUB_OUTPUT}"
          echo "operation=${{ needs.observe-recovery-public-mutation-attempt.outputs.attempt_operation }}" \
            >> "${GITHUB_OUTPUT}"
          echo "post_marker_base_authorization_sha256=${post_base_authorization_sha256}" \
            >> "${GITHUB_OUTPUT}"
          echo "recovery_store_head_sha=${recovery_store_head_sha}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload the closed one-shot marker authorization
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-marker-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: marker-authorization-evidence

      - name: Attest the post-marker durable base authorization
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: marker-authorization-evidence/electron-production-publication-recovery-lease-release-authorization.json

      - name: Attest the creator-or-resume one-shot marker authorization
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: marker-authorization-evidence/electron-production-publication-recovery-public-mutation-attempt-authorization.json

  reconcile-recovery-lease-release:
    name: Reconcile an already or possibly released lease without mutation
    # Read-only lease reconciliation remains disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - verify-recovered-foundation
      - route-recovery-lease-release
      - prepare-recovery-public-mutation-attempt
      - read-durable-recovery-public-mutation-attempt
      - authorize-recovery-public-mutation-attempt
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      command_status: ${{ steps.reconcile.outputs.command_status }}
      operation_sha256: ${{ steps.reconcile.outputs.operation_sha256 }}
      released_lease_sha256: ${{ steps.reconcile.outputs.released_lease_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the fresh no-marker authorization
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'absent-at-head'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: lease-reconciliation-input/authorization

      - name: Download the fresh no-marker private readback
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'absent-at-head'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-post-marker-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: lease-reconciliation-input/foundation

      - name: Download the attested read-only lease route
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'absent-at-head'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-lease-route-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: lease-reconciliation-input/route

      - name: Fresh reconcile the released successor with zero public writes
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'absent-at-head'
        id: reconcile
        continue-on-error: true
        shell: bash
        env:
          AUTHORIZATION_SHA256: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.post_marker_base_authorization_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          LATEST_OUTCOME_FILE: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.latest_outcome_file }}
          LATEST_OUTCOME_SHA256: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.latest_outcome_sha256 }}
          RECOVERY_RUN_STARTED_AT: ${{ needs.verify-recovery-plan.outputs.started_at }}
          RELEASE_ROUTE: ${{ needs.route-recovery-lease-release.outputs.route }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          if test "${RELEASE_ROUTE}" != "reconcile-released" \
            && test "${RELEASE_ROUTE}" != "reconcile-pending"; then
            echo "command_status=not-requested" >> "${GITHUB_OUTPUT}"
            echo "operation_sha256=" >> "${GITHUB_OUTPUT}"
            echo "released_lease_sha256=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          authorization_root="${PWD}/lease-reconciliation-input/authorization"
          foundation="${PWD}/lease-reconciliation-input/foundation"
          route_root="${PWD}/lease-reconciliation-input/route"
          authorization="${authorization_root}/electron-production-publication-recovery-lease-release-authorization.json"
          chain_proof="${foundation}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          route_observation="${route_root}/latest/electron-production-public-latest-recovery-observation.json"
          subjects=("${authorization}" "${chain_proof}" "${route_observation}")
          previous_args=()
          if test -n "${LATEST_OUTCOME_FILE}"; then
            previous="${foundation}/outcome-chain/latest/${LATEST_OUTCOME_FILE}"
            subjects+=("${previous}")
            previous_args+=(
              --previous-outcome "${previous}"
              --previous-outcome-sha256 "${LATEST_OUTCOME_SHA256}"
            )
          else
            test -z "${LATEST_OUTCOME_SHA256}"
          fi
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${authorization}" | cut -d ' ' -f 1)" \
            = "${AUTHORIZATION_SHA256}"
          held_lease="${foundation}/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${foundation}/materialized/source-public-latest-snapshot.json"
          target_snapshot="${foundation}/materialized/target-public-latest-projection.json"
          mkdir -p lease-reconciliation-evidence/operation
          mkdir lease-reconciliation-evidence/released-lease
          operation="${PWD}/lease-reconciliation-evidence/operation/electron-production-public-latest-lease-release-operation.json"
          released_lease="${PWD}/lease-reconciliation-evidence/released-lease/electron-production-public-latest-lease.json"
          summary="${PWD}/lease-reconciliation-evidence/electron-production-public-latest-recovery-reconcile-summary.json"
          set +e
          node scripts/electronProductionPublicLatestRecoveryCli.mjs \
            reconcile-lease-release \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --release-authorization "${authorization}" \
            --release-authorization-sha256 "${AUTHORIZATION_SHA256}" \
            --current-run-repository "${GITHUB_REPOSITORY}" \
            --current-run-workflow ".github/workflows/electron-production-provisional-recovery.yml" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --current-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --current-control-sha "${CONTROL_SHA}" \
            --current-run-started-at "${RECOVERY_RUN_STARTED_AT}" \
            "${previous_args[@]}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --released-lease-output "${released_lease}" \
            --output "${operation}" > "${summary}"
          command_status=$?
          set -e
          operation_sha256=""
          released_lease_sha256=""
          if test -s "${operation}"; then
            operation_sha256="$(sha256sum "${operation}" | cut -d ' ' -f 1)"
          fi
          if test -s "${released_lease}"; then
            released_lease_sha256="$(sha256sum "${released_lease}" | cut -d ' ' -f 1)"
          else
            rmdir lease-reconciliation-evidence/released-lease
          fi
          echo "command_status=${command_status}" >> "${GITHUB_OUTPUT}"
          echo "operation_sha256=${operation_sha256}" >> "${GITHUB_OUTPUT}"
          echo "released_lease_sha256=${released_lease_sha256}" >> "${GITHUB_OUTPUT}"
          if test -z "${operation_sha256}"; then
            exit 1
          fi

      - name: Upload every canonical zero-write lease reconciliation
        if: always() && steps.reconcile.outputs.operation_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-lease-reconciliation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: lease-reconciliation-evidence

      - name: Attest the canonical zero-write lease reconciliation
        if: steps.reconcile.outputs.operation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lease-reconciliation-evidence/operation/electron-production-public-latest-lease-release-operation.json

      - name: Attest the exact reconciled released successor
        if: steps.reconcile.outputs.released_lease_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lease-reconciliation-evidence/released-lease/electron-production-public-latest-lease.json

  execute-recovery-public-mutation:
    name: Execute or reconcile exactly one durable public mutation marker
    # Public recovery mutation remains disabled until the independent drill passes.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - verify-recovered-foundation
      - prepare-recovery-public-mutation-attempt
      - observe-recovery-public-mutation-attempt
      - read-durable-recovery-public-mutation-attempt
      - authorize-recovery-public-mutation-attempt
    runs-on: ubuntu-latest
    environment: electron-production-release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      acknowledgement: ${{ steps.execute.outputs.acknowledgement }}
      command_status: ${{ steps.execute.outputs.command_status }}
      final_observation: ${{ steps.execute.outputs.final_observation }}
      mode: ${{ steps.execute.outputs.mode }}
      operation_sha256: ${{ steps.execute.outputs.operation_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested one-shot marker authorization
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: public-mutation-input/authorization

      - name: Download the attested post-marker private readback
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-post-marker-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: public-mutation-input/foundation

      - name: Reverify the marker authority before requesting a public token
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head'
        shell: bash
        env:
          AUTHORIZATION_SHA256: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          authorization_root="${PWD}/public-mutation-input/authorization"
          foundation="${PWD}/public-mutation-input/foundation"
          authorization="${authorization_root}/electron-production-publication-recovery-public-mutation-attempt-authorization.json"
          post_base_authorization="${authorization_root}/electron-production-publication-recovery-lease-release-authorization.json"
          subjects=(
            "${authorization}"
            "${post_base_authorization}"
            "${foundation}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
            "${foundation}/electron-production-recovery-store-readback-outcome-binding.json"
          )
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${authorization}" | cut -d ' ' -f 1)" \
            = "${AUTHORIZATION_SHA256}"
          test "$(jq -er .currentRun.repository "${authorization}")" \
            = "${GITHUB_REPOSITORY}"
          test "$(jq -er .currentRun.workflow "${authorization}")" \
            = ".github/workflows/electron-production-provisional-recovery.yml"
          test "$(jq -er .currentRun.runId "${authorization}")" = "${GITHUB_RUN_ID}"
          test "$(jq -er .currentRun.runAttempt "${authorization}")" \
            = "${GITHUB_RUN_ATTEMPT}"

      - name: Create the narrow public-latest recovery token
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head' && needs.authorize-recovery-public-mutation-attempt.outputs.authorization_mode == 'created-now'
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RION_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
          owner: rion-tw
          repositories: rion-studio
          permission-contents: write

      - name: Execute created-now once or reconcile resumed without mutation
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head'
        id: execute
        continue-on-error: true
        shell: bash
        env:
          AUTHORIZATION_MODE: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.authorization_mode }}
          AUTHORIZATION_SHA256: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          EXPECTED_OPERATION: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.operation }}
          GH_TOKEN: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.authorization_mode == 'created-now' && steps.release-token.outputs.token || github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          RECOVERY_RUN_STARTED_AT: ${{ needs.verify-recovery-plan.outputs.started_at }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          authorization_root="${PWD}/public-mutation-input/authorization"
          foundation="${PWD}/public-mutation-input/foundation"
          authorization="${authorization_root}/electron-production-publication-recovery-public-mutation-attempt-authorization.json"
          held_lease="${foundation}/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${foundation}/materialized/source-public-latest-snapshot.json"
          target_snapshot="${foundation}/materialized/target-public-latest-projection.json"
          mkdir -p public-mutation-evidence/operation
          operation="${PWD}/public-mutation-evidence/operation/electron-production-publication-recovery-public-mutation-operation.json"
          summary="${PWD}/public-mutation-evidence/electron-production-publication-recovery-public-mutation-execution-summary.json"
          common_args=(
            execute
            --authorization "${authorization}"
            --authorization-sha256 "${AUTHORIZATION_SHA256}"
            --held-lease "${held_lease}"
            --held-lease-sha256 "${HELD_LEASE_SHA256}"
            --source-snapshot "${source_snapshot}"
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}"
            --target-snapshot "${target_snapshot}"
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}"
            --current-run-repository "${GITHUB_REPOSITORY}"
            --current-run-workflow ".github/workflows/electron-production-provisional-recovery.yml"
            --current-run-id "${GITHUB_RUN_ID}"
            --current-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --current-control-sha "${CONTROL_SHA}"
            --current-run-started-at "${RECOVERY_RUN_STARTED_AT}"
            --output "${operation}"
          )
          if test "${AUTHORIZATION_MODE}:${EXPECTED_OPERATION}" \
            = "created-now:release-held-lease"; then
            mkdir public-mutation-evidence/released-lease
            common_args+=(
              --released-lease-output
              "${PWD}/public-mutation-evidence/released-lease/electron-production-public-latest-lease.json"
            )
          fi
          set +e
          node scripts/electronProductionPublicationRecoveryPublicMutationExecutionCli.mjs \
            "${common_args[@]}" > "${summary}"
          command_status=$?
          set -e
          if ! test -s "${operation}"; then
            echo "acknowledgement=" >> "${GITHUB_OUTPUT}"
            echo "command_status=${command_status}" >> "${GITHUB_OUTPUT}"
            echo "final_observation=" >> "${GITHUB_OUTPUT}"
            echo "mode=crashed-before-canonical-operation" >> "${GITHUB_OUTPUT}"
            echo "operation_sha256=" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          test -s "${summary}"
          operation_sha256="$(sha256sum "${operation}" | cut -d ' ' -f 1)"
          verify_args=(
            verify
            --authorization "${authorization}"
            --authorization-sha256 "${AUTHORIZATION_SHA256}"
            --held-lease "${held_lease}"
            --held-lease-sha256 "${HELD_LEASE_SHA256}"
            --source-snapshot "${source_snapshot}"
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}"
            --target-snapshot "${target_snapshot}"
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}"
            --current-run-repository "${GITHUB_REPOSITORY}"
            --current-run-workflow ".github/workflows/electron-production-provisional-recovery.yml"
            --current-run-id "${GITHUB_RUN_ID}"
            --current-run-attempt "${GITHUB_RUN_ATTEMPT}"
            --current-control-sha "${CONTROL_SHA}"
            --current-run-started-at "${RECOVERY_RUN_STARTED_AT}"
            --operation "${operation}"
            --operation-sha256 "${operation_sha256}"
          )
          node scripts/electronProductionPublicationRecoveryPublicMutationExecutionCli.mjs \
            "${verify_args[@]}" \
            > public-mutation-evidence/electron-production-publication-recovery-public-mutation-verification.json
          test "$(jq -er .operation "${summary}")" = "${EXPECTED_OPERATION}"
          test "$(jq -er .output.sha256 "${summary}")" = "${operation_sha256}"
          acknowledgement="$(jq -er .acknowledgement "${summary}")"
          final_observation="$(jq -er .finalObservation "${summary}")"
          mode="$(jq -er .mode "${summary}")"
          if test "${AUTHORIZATION_MODE}" = "resumed-existing"; then
            test "${mode}" = "marker-reconciliation"
            test ! -d public-mutation-evidence/released-lease
          else
            test "${AUTHORIZATION_MODE}" = "created-now"
            test "${mode}" = "actual-transport" \
              -o "${mode}" = "precondition-rejected"
          fi
          if test "${command_status}" = "0"; then
            test "${acknowledgement}:${final_observation}" = "confirmed:source"
          fi
          echo "acknowledgement=${acknowledgement}" >> "${GITHUB_OUTPUT}"
          echo "command_status=${command_status}" >> "${GITHUB_OUTPUT}"
          echo "final_observation=${final_observation}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "operation_sha256=${operation_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload every canonical marker-bound public operation
        if: always() && needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-public-mutation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: public-mutation-evidence

      - name: Attest the marker-bound public mutation or reconciliation operation
        if: steps.execute.outputs.operation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: public-mutation-evidence/operation/electron-production-publication-recovery-public-mutation-operation.json

      - name: Attest the marker-bound execution verification
        if: steps.execute.outputs.operation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: public-mutation-evidence/electron-production-publication-recovery-public-mutation-verification.json

      - name: Attest an exact released-lease successor
        if: steps.execute.outputs.operation_sha256 != '' && steps.execute.outputs.acknowledgement == 'confirmed' && needs.authorize-recovery-public-mutation-attempt.outputs.authorization_mode == 'created-now' && needs.authorize-recovery-public-mutation-attempt.outputs.operation == 'release-held-lease'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: public-mutation-evidence/released-lease/electron-production-public-latest-lease.json

  materialize-recovery-outcome:
    name: Materialize every canonical recovery observation into one outcome
    # Outcome materialization remains disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - observe-public-latest
      - authorize-durable-recovery-release
      - route-recovery-lease-release
      - prepare-recovery-public-mutation-attempt
      - read-durable-recovery-public-mutation-attempt
      - authorize-recovery-public-mutation-attempt
      - reconcile-recovery-lease-release
      - execute-recovery-public-mutation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      attempt_bytes: ${{ steps.materialize.outputs.attempt_bytes }}
      attempt_file: ${{ steps.materialize.outputs.attempt_file }}
      attempt_path: ${{ steps.materialize.outputs.attempt_path }}
      attempt_sha256: ${{ steps.materialize.outputs.attempt_sha256 }}
      expected_head_sha: ${{ steps.materialize.outputs.expected_head_sha }}
      outcome_status: ${{ steps.materialize.outputs.outcome_status }}
      terminal: ${{ steps.materialize.outputs.terminal }}
      terminal_path: ${{ steps.materialize.outputs.terminal_path }}
      terminal_sha256: ${{ steps.materialize.outputs.terminal_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested durable base authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-input/base

      - name: Download the attested initial public observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-public-observation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-input/public-observation

      - name: Download the attested read-only lease route
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-lease-route-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-input/lease-route

      - name: Download the attested one-shot marker authorization
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-marker-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-input/marker-authorization

      - name: Download the attested post-marker private readback
        if: needs.prepare-recovery-public-mutation-attempt.outputs.attempt_status != 'no-marker'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-post-marker-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-input/post-marker

      - name: Download the canonical marker-bound public operation
        if: needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence == 'present-at-head' && needs.execute-recovery-public-mutation.outputs.operation_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-public-mutation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-input/public-operation

      - name: Download the canonical zero-write lease reconciliation
        if: needs.reconcile-recovery-lease-release.outputs.operation_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-lease-reconciliation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-input/lease-reconciliation

      - name: Reverify provenance and materialize the append-only outcome
        if: always()
        id: materialize
        shell: bash
        env:
          BASE_AUTHORIZATION_SHA256: ${{ needs.authorize-durable-recovery-release.outputs.authorization_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          GH_TOKEN: ${{ github.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          MARKER_AUTHORIZATION_SHA256: ${{ needs.authorize-recovery-public-mutation-attempt.outputs.authorization_sha256 }}
          MARKER_PRESENCE: ${{ needs.read-durable-recovery-public-mutation-attempt.outputs.marker_presence }}
          OBSERVATION_SHA256: ${{ needs.route-recovery-lease-release.outputs.observation_sha256 }}
          PUBLIC_OPERATION_SHA256: ${{ needs.execute-recovery-public-mutation.outputs.operation_sha256 }}
          RECONCILIATION_OPERATION_SHA256: ${{ needs.reconcile-recovery-lease-release.outputs.operation_sha256 }}
          RECOVERY_RUN_STARTED_AT: ${{ needs.verify-recovery-plan.outputs.started_at }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          if test "${MARKER_PRESENCE}" = "present-at-head" \
            && test -z "${PUBLIC_OPERATION_SHA256}"; then
            echo "attempt_bytes=" >> "${GITHUB_OUTPUT}"
            echo "attempt_file=" >> "${GITHUB_OUTPUT}"
            echo "attempt_path=" >> "${GITHUB_OUTPUT}"
            echo "attempt_sha256=" >> "${GITHUB_OUTPUT}"
            echo "expected_head_sha=" >> "${GITHUB_OUTPUT}"
            echo "outcome_status=no-authoritative-operation" >> "${GITHUB_OUTPUT}"
            echo "terminal=" >> "${GITHUB_OUTPUT}"
            echo "terminal_path=" >> "${GITHUB_OUTPUT}"
            echo "terminal_sha256=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${PWD}/outcome-input/base"
          observation="${PWD}/outcome-input/lease-route/latest/electron-production-public-latest-recovery-observation.json"
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          subjects=(
            "${base}/electron-production-publication-recovery-lease-release-authorization.json"
            "${base}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
            "${observation}"
          )
          lease_release_operation=""
          if test "${MARKER_PRESENCE}" = "present-at-head"; then
            marker_authorization="${PWD}/outcome-input/marker-authorization/electron-production-publication-recovery-public-mutation-attempt-authorization.json"
            public_operation="${PWD}/outcome-input/public-operation/operation/electron-production-publication-recovery-public-mutation-operation.json"
            subjects+=("${marker_authorization}" "${public_operation}")
            foundation="${PWD}/outcome-input/post-marker"
            chain_proof="${foundation}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
          else
            test -z "${MARKER_PRESENCE}" \
              -o "${MARKER_PRESENCE}" = "absent-at-head"
            marker_authorization=""
            public_operation="${observation}"
            if test "${MARKER_PRESENCE}" = "absent-at-head"; then
              foundation="${PWD}/outcome-input/post-marker"
            else
              foundation="${base}"
            fi
            chain_proof="${foundation}/outcome-chain/electron-production-publication-recovery-outcome-chain-proof.json"
            if test -n "${RECONCILIATION_OPERATION_SHA256}"; then
              lease_release_operation="${PWD}/outcome-input/lease-reconciliation/operation/electron-production-public-latest-lease-release-operation.json"
              subjects+=("${lease_release_operation}")
            fi
          fi
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${base}/electron-production-publication-recovery-lease-release-authorization.json" | cut -d ' ' -f 1)" \
            = "${BASE_AUTHORIZATION_SHA256}"
          test "$(sha256sum "${observation}" | cut -d ' ' -f 1)" \
            = "${OBSERVATION_SHA256}"
          if test "${MARKER_PRESENCE}" = "present-at-head"; then
            test "$(sha256sum "${marker_authorization}" | cut -d ' ' -f 1)" \
              = "${MARKER_AUTHORIZATION_SHA256}"
            test "$(sha256sum "${public_operation}" | cut -d ' ' -f 1)" \
              = "${PUBLIC_OPERATION_SHA256}"
          fi
          held_lease="${foundation}/materialized/electron-production-public-latest-lease.json"
          source_snapshot="${foundation}/materialized/source-public-latest-snapshot.json"
          target_snapshot="${foundation}/materialized/target-public-latest-projection.json"
          store_seal="${foundation}/store-seal/electron-production-publication-recovery-store-seal.json"
          if test -z "${MARKER_PRESENCE}"; then
            store_seal="${foundation}/readback/store-seal/electron-production-publication-recovery-store-seal.json"
          fi
          chain_proof_sha256="$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)"
          expected_head_sha="$(jq -er .currentObservation.headCommitSha "${chain_proof}")"
          mkdir -p recovery-outcome-evidence/append-foundation/latest
          mkdir recovery-outcome-evidence/authority recovery-outcome-evidence/foundation
          mkdir recovery-outcome-evidence/outcome
          materialization_input="${PWD}/recovery-outcome-evidence/electron-production-publication-recovery-outcome-materialization.json"
          paths_json="$(TRANSACTION_ID="${TRANSACTION_ID}" \
            RECOVERY_RUN_STARTED_AT="${RECOVERY_RUN_STARTED_AT}" \
            CONTROL_SHA="${CONTROL_SHA}" \
            INPUT_OUTPUT="${materialization_input}" \
            node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import {
            ELECTRON_PRODUCTION_PUBLICATION_RECOVERY_OUTCOME_INPUT_KIND
          } from "./scripts/electronProductionPublicationRecoveryCli.mjs";
          import { electronProductionRecoveryStoreOutcomePaths } from
            "./scripts/electronProductionRecoveryStoreTransactionPaths.mjs";
          const recoveryRun = {
            repository: process.env.GITHUB_REPOSITORY,
            workflow: ".github/workflows/electron-production-provisional-recovery.yml",
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            controlSha: process.env.CONTROL_SHA,
            startedAt: process.env.RECOVERY_RUN_STARTED_AT
          };
          const paths = electronProductionRecoveryStoreOutcomePaths({
            transactionId: process.env.TRANSACTION_ID,
            recoveryRun
          });
          await writeFile(process.env.INPUT_OUTPUT, serializeCanonicalJson({
            schemaVersion: 1,
            kind: ELECTRON_PRODUCTION_PUBLICATION_RECOVERY_OUTCOME_INPUT_KIND,
            recoveryRun,
            determinedAt: new Date().toISOString()
          }), { flag: "wx", mode: 0o600 });
          process.stdout.write(serializeCanonicalJson(paths));
          NODE
          )"
          input_sha256="$(sha256sum "${materialization_input}" | cut -d ' ' -f 1)"
          attempt_path="$(jq -er .attemptPath <<< "${paths_json}")"
          terminal_path="$(jq -er .terminalPath <<< "${paths_json}")"
          attempt_file="$(basename "${attempt_path}")"
          attempt_output="${PWD}/recovery-outcome-evidence/outcome/${attempt_file}"
          terminal_output="${PWD}/recovery-outcome-evidence/outcome/electron-production-publication-recovery-outcome.json"
          previous_file="$(jq -r '.latestOutcome.fileName // empty' "${chain_proof}")"
          previous_sha256="$(jq -r '.latestOutcome.sha256 // empty' "${chain_proof}")"
          previous_args=()
          if test -n "${previous_file}"; then
            previous="${foundation}/outcome-chain/latest/${previous_file}"
            test "$(sha256sum "${previous}" | cut -d ' ' -f 1)" \
              = "${previous_sha256}"
            previous_args+=(
              --previous-outcome "${previous}"
              --previous-outcome-sha256 "${previous_sha256}"
            )
            cp "${previous}" recovery-outcome-evidence/append-foundation/latest/
          fi
          common_args=(
            --input "${materialization_input}"
            --input-sha256 "${input_sha256}"
            --held-lease "${held_lease}"
            --held-lease-sha256 "${HELD_LEASE_SHA256}"
            --source-snapshot "${source_snapshot}"
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}"
            --target-snapshot "${target_snapshot}"
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}"
            --store-seal "${store_seal}"
            --store-seal-sha256 "${STORE_SEAL_SHA256}"
            --attempt-output "${attempt_output}"
            --terminal-output "${terminal_output}"
            "${previous_args[@]}"
          )
          if test "${MARKER_PRESENCE}" = "present-at-head"; then
            node scripts/electronProductionPublicationRecoveryCli.mjs \
              materialize-marker-outcome "${common_args[@]}" \
              --public-mutation-authorization "${marker_authorization}" \
              --public-mutation-authorization-sha256 "${MARKER_AUTHORIZATION_SHA256}" \
              --public-mutation-operation "${public_operation}" \
              --public-mutation-operation-sha256 "${PUBLIC_OPERATION_SHA256}" \
              > recovery-outcome-evidence/electron-production-publication-recovery-outcome-summary.json
            cp "${marker_authorization}" "${public_operation}" \
              recovery-outcome-evidence/authority/
            verify_command="verify-marker-outcome"
            verify_authority_args=(
              --public-mutation-authorization "${marker_authorization}"
              --public-mutation-authorization-sha256 "${MARKER_AUTHORIZATION_SHA256}"
              --public-mutation-operation "${public_operation}"
              --public-mutation-operation-sha256 "${PUBLIC_OPERATION_SHA256}"
            )
          else
            lease_release_args=()
            if test -n "${lease_release_operation}"; then
              test "$(sha256sum "${lease_release_operation}" | cut -d ' ' -f 1)" \
                = "${RECONCILIATION_OPERATION_SHA256}"
              lease_release_args+=(
                --lease-release-operation "${lease_release_operation}"
                --lease-release-operation-sha256 "${RECONCILIATION_OPERATION_SHA256}"
              )
            fi
            node scripts/electronProductionPublicationRecoveryCli.mjs \
              materialize-outcome "${common_args[@]}" \
              --operation "${public_operation}" \
              --operation-sha256 "${OBSERVATION_SHA256}" \
              "${lease_release_args[@]}" \
              > recovery-outcome-evidence/electron-production-publication-recovery-outcome-summary.json
            cp "${public_operation}" recovery-outcome-evidence/authority/
            if test -n "${lease_release_operation}"; then
              cp "${lease_release_operation}" recovery-outcome-evidence/authority/
            fi
            verify_command="verify-outcome"
            verify_authority_args=(
              --operation "${public_operation}"
              --operation-sha256 "${OBSERVATION_SHA256}"
              "${lease_release_args[@]}"
            )
          fi
          summary="${PWD}/recovery-outcome-evidence/electron-production-publication-recovery-outcome-summary.json"
          attempt_sha256="$(sha256sum "${attempt_output}" | cut -d ' ' -f 1)"
          attempt_bytes="$(wc -c < "${attempt_output}" | tr -d ' ')"
          test "$(jq -er .output.fileName "${summary}")" = "${attempt_file}"
          test "$(jq -er .output.sha256 "${summary}")" = "${attempt_sha256}"
          terminal="$(jq -r .outcome.terminal "${summary}")"
          terminal_sha256=""
          if test "${terminal}" = "true"; then
            terminal_sha256="$(sha256sum "${terminal_output}" | cut -d ' ' -f 1)"
            test "$(jq -er .terminalOutput.sha256 "${summary}")" \
              = "${terminal_sha256}"
            cmp "${attempt_output}" "${terminal_output}"
          else
            test "${terminal}" = "false"
            test "$(jq -r .terminalOutput "${summary}")" = "null"
            test ! -e "${terminal_output}"
          fi
          verification_args=(
            "${verify_command}"
            --held-lease "${held_lease}"
            --held-lease-sha256 "${HELD_LEASE_SHA256}"
            --source-snapshot "${source_snapshot}"
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}"
            --target-snapshot "${target_snapshot}"
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}"
            --store-seal "${store_seal}"
            --store-seal-sha256 "${STORE_SEAL_SHA256}"
            --outcome "${attempt_output}"
            --outcome-sha256 "${attempt_sha256}"
            "${verify_authority_args[@]}"
            "${previous_args[@]}"
          )
          node scripts/electronProductionPublicationRecoveryCli.mjs \
            "${verification_args[@]}" \
            > recovery-outcome-evidence/electron-production-publication-recovery-outcome-verification.json
          cp "${chain_proof}" recovery-outcome-evidence/append-foundation/
          cp "${held_lease}" "${source_snapshot}" "${target_snapshot}" \
            "${store_seal}" recovery-outcome-evidence/foundation/
          echo "attempt_bytes=${attempt_bytes}" >> "${GITHUB_OUTPUT}"
          echo "attempt_file=${attempt_file}" >> "${GITHUB_OUTPUT}"
          echo "attempt_path=${attempt_path}" >> "${GITHUB_OUTPUT}"
          echo "attempt_sha256=${attempt_sha256}" >> "${GITHUB_OUTPUT}"
          echo "expected_head_sha=${expected_head_sha}" >> "${GITHUB_OUTPUT}"
          echo "outcome_status=materialized" >> "${GITHUB_OUTPUT}"
          echo "terminal=${terminal}" >> "${GITHUB_OUTPUT}"
          echo "terminal_path=${terminal_path}" >> "${GITHUB_OUTPUT}"
          echo "terminal_sha256=${terminal_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the canonical recovery outcome evidence
        if: steps.materialize.outputs.outcome_status == 'materialized'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-outcome-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: recovery-outcome-evidence

      - name: Attest the canonical append-only recovery outcome attempt
        if: steps.materialize.outputs.outcome_status == 'materialized'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovery-outcome-evidence/outcome/${{ steps.materialize.outputs.attempt_file }}

      - name: Attest the fixed terminal recovery outcome
        if: steps.materialize.outputs.terminal == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recovery-outcome-evidence/outcome/electron-production-publication-recovery-outcome.json

      - name: Attest the recovery outcome request and local verification
        if: steps.materialize.outputs.outcome_status == 'materialized'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            recovery-outcome-evidence/electron-production-publication-recovery-outcome-materialization.json
            recovery-outcome-evidence/electron-production-publication-recovery-outcome-verification.json
            recovery-outcome-evidence/append-foundation/electron-production-publication-recovery-outcome-chain-proof.json

  persist-recovery-outcome:
    name: Append the recovery outcome to the private store with one CAS
    # Private outcome persistence remains disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - materialize-recovery-outcome
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      append_foundation_sha256: ${{ steps.preflight.outputs.append_foundation_sha256 }}
      create_chain_sha256: ${{ steps.persist.outputs.create_chain_sha256 }}
      operation_classification: ${{ steps.persist.outputs.operation_classification }}
      operation_file: ${{ steps.persist.outputs.operation_file }}
      operation_sha256: ${{ steps.persist.outputs.operation_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested canonical recovery outcome
        if: needs.materialize-recovery-outcome.outputs.outcome_status == 'materialized'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-outcome-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-write-input

      - name: Tokenless verify the exact append foundation
        if: needs.materialize-recovery-outcome.outputs.outcome_status == 'materialized'
        id: preflight
        shell: bash
        env:
          ATTEMPT_BYTES: ${{ needs.materialize-recovery-outcome.outputs.attempt_bytes }}
          ATTEMPT_FILE: ${{ needs.materialize-recovery-outcome.outputs.attempt_file }}
          ATTEMPT_PATH: ${{ needs.materialize-recovery-outcome.outputs.attempt_path }}
          ATTEMPT_SHA256: ${{ needs.materialize-recovery-outcome.outputs.attempt_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.materialize-recovery-outcome.outputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TERMINAL: ${{ needs.materialize-recovery-outcome.outputs.terminal }}
          TERMINAL_PATH: ${{ needs.materialize-recovery-outcome.outputs.terminal_path }}
          TERMINAL_SHA256: ${{ needs.materialize-recovery-outcome.outputs.terminal_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          root="${PWD}/outcome-write-input"
          attempt="${root}/outcome/${ATTEMPT_FILE}"
          chain_proof="${root}/append-foundation/electron-production-publication-recovery-outcome-chain-proof.json"
          test "$(sha256sum "${attempt}" | cut -d ' ' -f 1)" = "${ATTEMPT_SHA256}"
          test "$(wc -c < "${attempt}" | tr -d ' ')" = "${ATTEMPT_BYTES}"
          subjects=(
            "${attempt}"
            "${chain_proof}"
            "${root}/electron-production-publication-recovery-outcome-materialization.json"
            "${root}/electron-production-publication-recovery-outcome-verification.json"
          )
          terminal_args=()
          if test "${TERMINAL}" = "true"; then
            terminal="${root}/outcome/electron-production-publication-recovery-outcome.json"
            test "$(sha256sum "${terminal}" | cut -d ' ' -f 1)" \
              = "${TERMINAL_SHA256}"
            cmp "${attempt}" "${terminal}"
            subjects+=("${terminal}")
            terminal_args+=(
              --terminal-outcome "${terminal}"
              --terminal-outcome-sha256 "${TERMINAL_SHA256}"
            )
          else
            test "${TERMINAL}" = "false"
            test -z "${TERMINAL_SHA256}"
            test ! -e "${root}/outcome/electron-production-publication-recovery-outcome.json"
          fi
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          previous_args=()
          mapfile -t previous_files < <(find "${root}/append-foundation/latest" \
            -maxdepth 1 -type f -print)
          test "${#previous_files[@]}" -le 1
          if test "${#previous_files[@]}" = 1; then
            previous_sha256="$(sha256sum "${previous_files[0]}" | cut -d ' ' -f 1)"
            previous_args+=(
              --previous-outcome "${previous_files[0]}"
              --previous-outcome-sha256 "${previous_sha256}"
            )
          fi
          held_lease="${root}/foundation/electron-production-public-latest-lease.json"
          source_snapshot="${root}/foundation/source-public-latest-snapshot.json"
          target_snapshot="${root}/foundation/target-public-latest-projection.json"
          store_seal="${root}/foundation/electron-production-publication-recovery-store-seal.json"
          outcome_verification="${PWD}/outcome-write-preflight/electron-production-publication-recovery-outcome-verification.json"
          mkdir outcome-write-preflight
          marker_authorization="${root}/authority/electron-production-publication-recovery-public-mutation-attempt-authorization.json"
          marker_operation="${root}/authority/electron-production-publication-recovery-public-mutation-operation.json"
          if test -f "${marker_authorization}"; then
            node scripts/electronProductionPublicationRecoveryCli.mjs \
              verify-marker-outcome \
              --held-lease "${held_lease}" \
              --held-lease-sha256 "$(sha256sum "${held_lease}" | cut -d ' ' -f 1)" \
              --source-snapshot "${source_snapshot}" \
              --source-snapshot-sha256 "$(sha256sum "${source_snapshot}" | cut -d ' ' -f 1)" \
              --target-snapshot "${target_snapshot}" \
              --target-snapshot-sha256 "$(sha256sum "${target_snapshot}" | cut -d ' ' -f 1)" \
              --store-seal "${store_seal}" \
              --store-seal-sha256 "$(sha256sum "${store_seal}" | cut -d ' ' -f 1)" \
              --public-mutation-authorization "${marker_authorization}" \
              --public-mutation-authorization-sha256 "$(sha256sum "${marker_authorization}" | cut -d ' ' -f 1)" \
              --public-mutation-operation "${marker_operation}" \
              --public-mutation-operation-sha256 "$(sha256sum "${marker_operation}" | cut -d ' ' -f 1)" \
              --outcome "${attempt}" --outcome-sha256 "${ATTEMPT_SHA256}" \
              "${previous_args[@]}" > "${outcome_verification}"
          else
            observation="${root}/authority/electron-production-public-latest-recovery-observation.json"
            lease_operation="${root}/authority/electron-production-public-latest-lease-release-operation.json"
            lease_args=()
            if test -f "${lease_operation}"; then
              lease_args+=(
                --lease-release-operation "${lease_operation}"
                --lease-release-operation-sha256 "$(sha256sum "${lease_operation}" | cut -d ' ' -f 1)"
              )
            fi
            node scripts/electronProductionPublicationRecoveryCli.mjs \
              verify-outcome \
              --held-lease "${held_lease}" \
              --held-lease-sha256 "$(sha256sum "${held_lease}" | cut -d ' ' -f 1)" \
              --source-snapshot "${source_snapshot}" \
              --source-snapshot-sha256 "$(sha256sum "${source_snapshot}" | cut -d ' ' -f 1)" \
              --target-snapshot "${target_snapshot}" \
              --target-snapshot-sha256 "$(sha256sum "${target_snapshot}" | cut -d ' ' -f 1)" \
              --store-seal "${store_seal}" \
              --store-seal-sha256 "$(sha256sum "${store_seal}" | cut -d ' ' -f 1)" \
              --operation "${observation}" \
              --operation-sha256 "$(sha256sum "${observation}" | cut -d ' ' -f 1)" \
              "${lease_args[@]}" \
              --outcome "${attempt}" --outcome-sha256 "${ATTEMPT_SHA256}" \
              "${previous_args[@]}" > "${outcome_verification}"
          fi
          chain_proof_sha256="$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)"
          append_foundation="${PWD}/outcome-write-preflight/electron-production-recovery-store-outcome-append-foundation-verification.json"
          node scripts/electronProductionRecoveryStoreOutcomeCreateChainCli.mjs \
            verify-outcome-append-foundation \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --outcome-chain-proof "${chain_proof}" \
            --outcome-chain-proof-sha256 "${chain_proof_sha256}" \
            --attempt-outcome "${attempt}" \
            --attempt-outcome-sha256 "${ATTEMPT_SHA256}" \
            "${terminal_args[@]}" > "${append_foundation}"
          test "$(jq -er .paths.attempt "${append_foundation}")" \
            = "${ATTEMPT_PATH}"
          test "$(jq -er .attempt.file.sha256 "${append_foundation}")" \
            = "${ATTEMPT_SHA256}"
          test "$(jq -er .appendFoundation.currentObservation.headCommitSha "${append_foundation}")" \
            = "${EXPECTED_HEAD_SHA}"
          if test "${TERMINAL}" = "true"; then
            test "$(jq -er .paths.terminal "${append_foundation}")" \
              = "${TERMINAL_PATH}"
            test "$(jq -er .terminal.file.sha256 "${append_foundation}")" \
              = "${TERMINAL_SHA256}"
          else
            test "$(jq -r .paths.terminal "${append_foundation}")" = "null"
          fi
          echo "append_foundation_sha256=$(sha256sum "${append_foundation}" | cut -d ' ' -f 1)" \
            >> "${GITHUB_OUTPUT}"

      - name: Create the narrow private recovery-store writer token
        if: needs.materialize-recovery-outcome.outputs.outcome_status == 'materialized'
        id: recovery-write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: write

      - name: Create-new append the attempt or atomic terminal pair
        if: needs.materialize-recovery-outcome.outputs.outcome_status == 'materialized'
        id: persist
        continue-on-error: true
        shell: bash
        env:
          APPEND_FOUNDATION_SHA256: ${{ steps.preflight.outputs.append_foundation_sha256 }}
          ATTEMPT_FILE: ${{ needs.materialize-recovery-outcome.outputs.attempt_file }}
          ATTEMPT_PATH: ${{ needs.materialize-recovery-outcome.outputs.attempt_path }}
          ATTEMPT_SHA256: ${{ needs.materialize-recovery-outcome.outputs.attempt_sha256 }}
          EXPECTED_HEAD_SHA: ${{ needs.materialize-recovery-outcome.outputs.expected_head_sha }}
          GH_TOKEN: ${{ steps.recovery-write-token.outputs.token }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TERMINAL: ${{ needs.materialize-recovery-outcome.outputs.terminal }}
          TERMINAL_PATH: ${{ needs.materialize-recovery-outcome.outputs.terminal_path }}
          TERMINAL_SHA256: ${{ needs.materialize-recovery-outcome.outputs.terminal_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${GH_TOKEN}"
          root="${PWD}/outcome-write-input"
          attempt="${root}/outcome/${ATTEMPT_FILE}"
          chain_proof="${root}/append-foundation/electron-production-publication-recovery-outcome-chain-proof.json"
          append_foundation="${PWD}/outcome-write-preflight/electron-production-recovery-store-outcome-append-foundation-verification.json"
          test "$(sha256sum "${append_foundation}" | cut -d ' ' -f 1)" \
            = "${APPEND_FOUNDATION_SHA256}"
          mkdir -p outcome-write-evidence/operation
          if test "${TERMINAL}" = "true"; then
            operation_file="electron-production-recovery-store-remote-atomic-pair-operation.json"
            remote_command=(
              create-atomic-pair
              --first-path "${ATTEMPT_PATH}"
              --second-path "${TERMINAL_PATH}"
            )
          else
            test "${TERMINAL}" = "false"
            operation_file="electron-production-recovery-store-remote-operation.json"
            remote_command=(create --path "${ATTEMPT_PATH}")
          fi
          operation="${PWD}/outcome-write-evidence/operation/${operation_file}"
          set +e
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs \
            "${remote_command[@]}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --package "${attempt}" --output "${operation}" \
            > outcome-write-evidence/electron-production-recovery-store-outcome-create-summary.json
          command_status=$?
          set -e
          test -s "${operation}"
          operation_sha256="$(sha256sum "${operation}" | cut -d ' ' -f 1)"
          classification="$(jq -er .terminal.classification "${operation}")"
          if test "${command_status}" = "0"; then
            test "${classification}" = "applied"
          else
            test "${classification}" = "rejected" \
              -o "${classification}" = "unknown-acknowledgement"
          fi
          create_chain_sha256=""
          if test "${classification}" = "applied"; then
            terminal_args=()
            if test "${TERMINAL}" = "true"; then
              terminal_args+=(
                --terminal-outcome "${root}/outcome/electron-production-publication-recovery-outcome.json"
                --terminal-outcome-sha256 "${TERMINAL_SHA256}"
              )
            fi
            create_chain="${PWD}/outcome-write-evidence/electron-production-recovery-store-outcome-create-chain-verification.json"
            node scripts/electronProductionRecoveryStoreOutcomeCreateChainCli.mjs \
              verify-outcome-create-chain \
              --transaction-id "${TRANSACTION_ID}" \
              --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
              --ref "${RECOVERY_DEFAULT_BRANCH}" \
              --expected-head-sha "${EXPECTED_HEAD_SHA}" \
              --outcome-chain-proof "${chain_proof}" \
              --outcome-chain-proof-sha256 "$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)" \
              --attempt-outcome "${attempt}" \
              --attempt-outcome-sha256 "${ATTEMPT_SHA256}" \
              "${terminal_args[@]}" \
              --operation "${operation}" \
              --operation-sha256 "${operation_sha256}" > "${create_chain}"
            create_chain_sha256="$(sha256sum "${create_chain}" | cut -d ' ' -f 1)"
          fi
          echo "create_chain_sha256=${create_chain_sha256}" >> "${GITHUB_OUTPUT}"
          echo "operation_classification=${classification}" >> "${GITHUB_OUTPUT}"
          echo "operation_file=${operation_file}" >> "${GITHUB_OUTPUT}"
          echo "operation_sha256=${operation_sha256}" >> "${GITHUB_OUTPUT}"
          test "${classification}" = "applied"

      - name: Upload the exact private outcome append evidence
        if: always() && needs.materialize-recovery-outcome.outputs.outcome_status == 'materialized'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-outcome-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            outcome-write-preflight
            outcome-write-evidence

      - name: Attest the tokenless append foundation
        if: steps.preflight.outputs.append_foundation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: outcome-write-preflight/electron-production-recovery-store-outcome-append-foundation-verification.json

      - name: Attest the exact private outcome append operation
        if: steps.persist.outputs.operation_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: outcome-write-evidence/operation/${{ steps.persist.outputs.operation_file }}

      - name: Attest the applied outcome create chain
        if: steps.persist.outputs.create_chain_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: outcome-write-evidence/electron-production-recovery-store-outcome-create-chain-verification.json

  read-durable-recovery-outcome:
    name: Fresh-read the appended outcome and complete chain at the applied head
    # Private outcome readback remains disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - materialize-recovery-outcome
      - persist-recovery-outcome
    runs-on: ubuntu-latest
    environment: electron-production-recovery-store-read
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      attempt_read_sha256: ${{ steps.read.outputs.attempt_read_sha256 }}
      discovery_sha256: ${{ steps.read.outputs.discovery_sha256 }}
      proof_sha256: ${{ steps.read.outputs.proof_sha256 }}
      terminal_read_sha256: ${{ steps.read.outputs.terminal_read_sha256 }}
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Fail closed unless a canonical outcome append was applied
        if: always()
        shell: bash
        env:
          OPERATION_CLASSIFICATION: ${{ needs.persist-recovery-outcome.outputs.operation_classification }}
          OUTCOME_STATUS: ${{ needs.materialize-recovery-outcome.outputs.outcome_status }}
        run: |
          set -euo pipefail
          test "${OUTCOME_STATUS}" = "materialized"
          test "${OPERATION_CLASSIFICATION}" = "applied"

      - name: Download the attested canonical recovery outcome
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-outcome-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-read-input/outcome

      - name: Download the attested private outcome append evidence
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-outcome-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-read-input/write

      - name: Reverify the applied append before requesting a reader token
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        shell: bash
        env:
          ATTEMPT_FILE: ${{ needs.materialize-recovery-outcome.outputs.attempt_file }}
          ATTEMPT_SHA256: ${{ needs.materialize-recovery-outcome.outputs.attempt_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          CREATE_CHAIN_SHA256: ${{ needs.persist-recovery-outcome.outputs.create_chain_sha256 }}
          GH_TOKEN: ${{ github.token }}
          OPERATION_FILE: ${{ needs.persist-recovery-outcome.outputs.operation_file }}
          OPERATION_SHA256: ${{ needs.persist-recovery-outcome.outputs.operation_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          root="${PWD}/outcome-read-input"
          subjects=(
            "${root}/outcome/outcome/${ATTEMPT_FILE}"
            "${root}/write/outcome-write-evidence/operation/${OPERATION_FILE}"
            "${root}/write/outcome-write-evidence/electron-production-recovery-store-outcome-create-chain-verification.json"
          )
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${root}/outcome/outcome/${ATTEMPT_FILE}" | cut -d ' ' -f 1)" \
            = "${ATTEMPT_SHA256}"
          test "$(sha256sum "${root}/write/outcome-write-evidence/operation/${OPERATION_FILE}" | cut -d ' ' -f 1)" \
            = "${OPERATION_SHA256}"
          test "$(sha256sum "${root}/write/outcome-write-evidence/electron-production-recovery-store-outcome-create-chain-verification.json" | cut -d ' ' -f 1)" \
            = "${CREATE_CHAIN_SHA256}"

      - name: Create the narrow private recovery-store reader token
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        id: recovery-read-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RECOVERY_STORE_READER_APP_PRIVATE_KEY }}
          owner: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          repositories: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          permission-contents: read

      - name: Fresh-read the outcome paths and verify the complete appended chain
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        id: read
        shell: bash
        env:
          ATTEMPT_BYTES: ${{ needs.materialize-recovery-outcome.outputs.attempt_bytes }}
          ATTEMPT_FILE: ${{ needs.materialize-recovery-outcome.outputs.attempt_file }}
          ATTEMPT_PATH: ${{ needs.materialize-recovery-outcome.outputs.attempt_path }}
          ATTEMPT_SHA256: ${{ needs.materialize-recovery-outcome.outputs.attempt_sha256 }}
          GH_TOKEN: ${{ steps.recovery-read-token.outputs.token }}
          HELD_LEASE_SHA256: ${{ needs.verify-recovered-foundation.outputs.held_lease_sha256 }}
          OPERATION_FILE: ${{ needs.persist-recovery-outcome.outputs.operation_file }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          SOURCE_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.source_snapshot_sha256 }}
          STORE_SEAL_SHA256: ${{ needs.read-private-recovery-store.outputs.store_seal_sha256 }}
          TARGET_SNAPSHOT_SHA256: ${{ needs.verify-recovered-foundation.outputs.target_snapshot_sha256 }}
          TERMINAL: ${{ needs.materialize-recovery-outcome.outputs.terminal }}
          TERMINAL_PATH: ${{ needs.materialize-recovery-outcome.outputs.terminal_path }}
          TERMINAL_SHA256: ${{ needs.materialize-recovery-outcome.outputs.terminal_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          input="${PWD}/outcome-read-input"
          source="${input}/outcome"
          write="${input}/write/outcome-write-evidence"
          operation="${write}/operation/${OPERATION_FILE}"
          applied_commit="$(jq -er .applied.commitSha "${operation}")"
          root="${PWD}/outcome-readback"
          mkdir -p "${root}/attempt" "${root}/attempt-read"
          mkdir -p "${root}/outcomes" "${root}/chain/latest"
          attempt="${root}/attempt/${ATTEMPT_FILE}"
          attempt_read="${root}/attempt-read/electron-production-recovery-store-remote-read-operation.json"
          node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${ATTEMPT_PATH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-content-sha256 "${ATTEMPT_SHA256}" \
            --expected-content-bytes "${ATTEMPT_BYTES}" \
            --content-output "${attempt}" --operation-output "${attempt_read}" \
            > /dev/null
          test "$(jq -er .observed.headCommitSha "${attempt_read}")" \
            = "${applied_commit}"
          terminal_read_sha256=""
          if test "${TERMINAL}" = "true"; then
            mkdir "${root}/terminal" "${root}/terminal-read"
            terminal="${root}/terminal/electron-production-publication-recovery-outcome.json"
            terminal_read="${root}/terminal-read/electron-production-recovery-store-remote-read-operation.json"
            node scripts/electronProductionRecoveryStoreRemoteCli.mjs read \
              --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
              --ref "${RECOVERY_DEFAULT_BRANCH}" --path "${TERMINAL_PATH}" \
              --repository-visibility private \
              --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
              --expected-content-sha256 "${TERMINAL_SHA256}" \
              --expected-content-bytes "${ATTEMPT_BYTES}" \
              --content-output "${terminal}" --operation-output "${terminal_read}" \
              > /dev/null
            test "$(jq -er .observed.headCommitSha "${terminal_read}")" \
              = "${applied_commit}"
            cmp "${attempt}" "${terminal}"
            terminal_read_sha256="$(sha256sum "${terminal_read}" | cut -d ' ' -f 1)"
          else
            test "${TERMINAL}" = "false"
          fi
          discovery="${root}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            discover \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --repository-visibility private \
            --repository-default-branch "${RECOVERY_DEFAULT_BRANCH}" \
            --observed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${discovery}" > /dev/null
          discovery_sha256="$(sha256sum "${discovery}" | cut -d ' ' -f 1)"
          held_lease="${source}/foundation/electron-production-public-latest-lease.json"
          source_snapshot="${source}/foundation/source-public-latest-snapshot.json"
          target_snapshot="${source}/foundation/target-public-latest-projection.json"
          store_seal="${source}/foundation/electron-production-publication-recovery-store-seal.json"
          proof="${root}/chain/electron-production-publication-recovery-outcome-chain-proof.json"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            verify-chain \
            --discovery "${discovery}" --discovery-sha256 "${discovery_sha256}" \
            --held-lease "${held_lease}" --held-lease-sha256 "${HELD_LEASE_SHA256}" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "${SOURCE_SNAPSHOT_SHA256}" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "${TARGET_SNAPSHOT_SHA256}" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "${STORE_SEAL_SHA256}" \
            --latest-outcome-output-directory "${root}/chain/latest" \
            --output "${proof}" > /dev/null
          test "$(jq -er .currentObservation.headCommitSha "${proof}")" \
            = "${applied_commit}"
          test "$(jq -er .latestOutcome.fileName "${proof}")" = "${ATTEMPT_FILE}"
          test "$(jq -er .latestOutcome.sha256 "${proof}")" = "${ATTEMPT_SHA256}"
          if test "${TERMINAL}" = "true"; then
            test "$(jq -er .status "${proof}")" = "terminal"
            test "$(jq -er .terminal.sha256 "${proof}")" = "${TERMINAL_SHA256}"
          else
            test "$(jq -er .status "${proof}")" = "open"
            test "$(jq -r .terminal "${proof}")" = "null"
          fi
          cmp "${attempt}" "${root}/chain/latest/${ATTEMPT_FILE}"
          echo "attempt_read_sha256=$(sha256sum "${attempt_read}" | cut -d ' ' -f 1)" \
            >> "${GITHUB_OUTPUT}"
          echo "discovery_sha256=${discovery_sha256}" >> "${GITHUB_OUTPUT}"
          echo "proof_sha256=$(sha256sum "${proof}" | cut -d ' ' -f 1)" \
            >> "${GITHUB_OUTPUT}"
          echo "terminal_read_sha256=${terminal_read_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact durable outcome readback
        if: steps.read.outputs.proof_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-production-provisional-recovery-outcome-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: outcome-readback

      - name: Attest the exact outcome read and complete fresh chain
        if: steps.read.outputs.proof_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            outcome-readback/attempt-read/electron-production-recovery-store-remote-read-operation.json
            outcome-readback/outcomes/electron-production-publication-recovery-outcome-discovery.json
            outcome-readback/chain/electron-production-publication-recovery-outcome-chain-proof.json

      - name: Attest the exact fixed terminal read
        if: steps.read.outputs.terminal_read_sha256 != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: outcome-readback/terminal-read/electron-production-recovery-store-remote-read-operation.json

      - name: Require a terminal durable outcome before recovery succeeds
        if: always() && steps.read.outputs.proof_sha256 != ''
        shell: bash
        env:
          TERMINAL: ${{ needs.materialize-recovery-outcome.outputs.terminal }}
        run: |
          set -euo pipefail
          test "${TERMINAL}" = "true"
          test "$(jq -er .status outcome-readback/chain/electron-production-publication-recovery-outcome-chain-proof.json)" \
            = "terminal"

  attest-recovery-outcome-store:
    name: Detached verify and attest the durable recovery outcome
    # Detached outcome finalization remains disabled with the recovery path.
    if: ${{ false }}
    needs:
      - verify-recovery-plan
      - read-private-recovery-store
      - verify-recovered-foundation
      - materialize-recovery-outcome
      - persist-recovery-outcome
      - read-durable-recovery-outcome
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout the trusted default-branch control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-recovery-plan.outputs.control_sha }}

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download the attested canonical recovery outcome
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-outcome-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-final-input/outcome

      - name: Download the attested outcome append evidence
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-outcome-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-final-input/write

      - name: Download the attested fresh outcome readback
        if: needs.persist-recovery-outcome.outputs.operation_classification == 'applied'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-production-provisional-recovery-outcome-readback-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: outcome-final-input/readback

      - name: Fail closed unless append and fresh readback are exact
        if: always()
        shell: bash
        env:
          APPEND_FOUNDATION_SHA256: ${{ needs.persist-recovery-outcome.outputs.append_foundation_sha256 }}
          ATTEMPT_FILE: ${{ needs.materialize-recovery-outcome.outputs.attempt_file }}
          ATTEMPT_PATH: ${{ needs.materialize-recovery-outcome.outputs.attempt_path }}
          ATTEMPT_SHA256: ${{ needs.materialize-recovery-outcome.outputs.attempt_sha256 }}
          CONTROL_SHA: ${{ needs.verify-recovery-plan.outputs.control_sha }}
          CREATE_CHAIN_SHA256: ${{ needs.persist-recovery-outcome.outputs.create_chain_sha256 }}
          EXPECTED_HEAD_SHA: ${{ needs.materialize-recovery-outcome.outputs.expected_head_sha }}
          FRESH_DISCOVERY_SHA256: ${{ needs.read-durable-recovery-outcome.outputs.discovery_sha256 }}
          FRESH_PROOF_SHA256: ${{ needs.read-durable-recovery-outcome.outputs.proof_sha256 }}
          GH_TOKEN: ${{ github.token }}
          OPERATION_CLASSIFICATION: ${{ needs.persist-recovery-outcome.outputs.operation_classification }}
          OPERATION_FILE: ${{ needs.persist-recovery-outcome.outputs.operation_file }}
          OPERATION_SHA256: ${{ needs.persist-recovery-outcome.outputs.operation_sha256 }}
          RECOVERY_DEFAULT_BRANCH: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_DEFAULT_BRANCH }}
          RECOVERY_OWNER: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_OWNER }}
          RECOVERY_REPOSITORY: ${{ vars.ELECTRON_PRODUCTION_RECOVERY_STORE_REPOSITORY }}
          TERMINAL: ${{ needs.materialize-recovery-outcome.outputs.terminal }}
          TERMINAL_PATH: ${{ needs.materialize-recovery-outcome.outputs.terminal_path }}
          TERMINAL_SHA256: ${{ needs.materialize-recovery-outcome.outputs.terminal_sha256 }}
          TRANSACTION_ID: ${{ needs.verify-recovery-plan.outputs.transaction_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "${CONTROL_SHA}"
          test "${OPERATION_CLASSIFICATION}" = "applied"
          test -n "${APPEND_FOUNDATION_SHA256}"
          test -n "${CREATE_CHAIN_SHA256}"
          test -n "${FRESH_DISCOVERY_SHA256}"
          test -n "${FRESH_PROOF_SHA256}"
          root="${PWD}/outcome-final-input"
          outcome_root="${root}/outcome"
          write_root="${root}/write"
          readback="${root}/readback"
          attempt="${outcome_root}/outcome/${ATTEMPT_FILE}"
          chain_proof="${outcome_root}/append-foundation/electron-production-publication-recovery-outcome-chain-proof.json"
          operation="${write_root}/outcome-write-evidence/operation/${OPERATION_FILE}"
          create_chain="${write_root}/outcome-write-evidence/electron-production-recovery-store-outcome-create-chain-verification.json"
          append_foundation="${write_root}/outcome-write-preflight/electron-production-recovery-store-outcome-append-foundation-verification.json"
          discovery="${readback}/outcomes/electron-production-publication-recovery-outcome-discovery.json"
          fresh_proof="${readback}/chain/electron-production-publication-recovery-outcome-chain-proof.json"
          subjects=(
            "${attempt}"
            "${outcome_root}/electron-production-publication-recovery-outcome-verification.json"
            "${append_foundation}"
            "${operation}"
            "${create_chain}"
            "${readback}/attempt-read/electron-production-recovery-store-remote-read-operation.json"
            "${discovery}"
            "${fresh_proof}"
          )
          test "${TERMINAL}" = "true"
          test -n "${TERMINAL_PATH}"
          test -n "${TERMINAL_SHA256}"
          terminal_args=()
          terminal="${outcome_root}/outcome/electron-production-publication-recovery-outcome.json"
          subjects+=(
            "${terminal}"
            "${readback}/terminal-read/electron-production-recovery-store-remote-read-operation.json"
          )
          terminal_args+=(
            --terminal-outcome "${terminal}"
            --terminal-outcome-sha256 "${TERMINAL_SHA256}"
          )
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/electron-production-provisional-recovery.yml"
          invocation_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          for subject in "${subjects[@]}"; do
            attestation_json="$(gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" --format=json \
              --signer-digest "${CONTROL_SHA}" \
              --signer-workflow "${signer_workflow}" \
              --source-digest "${CONTROL_SHA}")"
            jq -e --arg invocation_uri "${invocation_uri}" '
              any(
                .[];
                .verificationResult.signature.certificate.runInvocationURI == $invocation_uri
              )
            ' <<< "${attestation_json}" > /dev/null
          done
          test "$(sha256sum "${attempt}" | cut -d ' ' -f 1)" = "${ATTEMPT_SHA256}"
          test "$(sha256sum "${operation}" | cut -d ' ' -f 1)" = "${OPERATION_SHA256}"
          test "$(sha256sum "${create_chain}" | cut -d ' ' -f 1)" \
            = "${CREATE_CHAIN_SHA256}"
          test "$(sha256sum "${append_foundation}" | cut -d ' ' -f 1)" \
            = "${APPEND_FOUNDATION_SHA256}"
          test "$(sha256sum "${discovery}" | cut -d ' ' -f 1)" \
            = "${FRESH_DISCOVERY_SHA256}"
          test "$(sha256sum "${fresh_proof}" | cut -d ' ' -f 1)" \
            = "${FRESH_PROOF_SHA256}"
          mkdir -p outcome-final-evidence/latest
          node scripts/electronProductionRecoveryStoreOutcomeCreateChainCli.mjs \
            verify-outcome-append-foundation \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --outcome-chain-proof "${chain_proof}" \
            --outcome-chain-proof-sha256 "$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)" \
            --attempt-outcome "${attempt}" \
            --attempt-outcome-sha256 "${ATTEMPT_SHA256}" \
            "${terminal_args[@]}" \
            > outcome-final-evidence/electron-production-recovery-store-outcome-append-foundation-verification.json
          node scripts/electronProductionRecoveryStoreOutcomeCreateChainCli.mjs \
            verify-outcome-create-chain \
            --transaction-id "${TRANSACTION_ID}" \
            --owner "${RECOVERY_OWNER}" --repo "${RECOVERY_REPOSITORY}" \
            --ref "${RECOVERY_DEFAULT_BRANCH}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --outcome-chain-proof "${chain_proof}" \
            --outcome-chain-proof-sha256 "$(sha256sum "${chain_proof}" | cut -d ' ' -f 1)" \
            --attempt-outcome "${attempt}" \
            --attempt-outcome-sha256 "${ATTEMPT_SHA256}" \
            "${terminal_args[@]}" \
            --operation "${operation}" \
            --operation-sha256 "${OPERATION_SHA256}" \
            > outcome-final-evidence/electron-production-recovery-store-outcome-create-chain-verification.json
          held_lease="${outcome_root}/foundation/electron-production-public-latest-lease.json"
          source_snapshot="${outcome_root}/foundation/source-public-latest-snapshot.json"
          target_snapshot="${outcome_root}/foundation/target-public-latest-projection.json"
          store_seal="${outcome_root}/foundation/electron-production-publication-recovery-store-seal.json"
          node scripts/electronProductionPublicationRecoveryOutcomeDiscoveryCli.mjs \
            verify-chain \
            --discovery "${discovery}" --discovery-sha256 "${FRESH_DISCOVERY_SHA256}" \
            --held-lease "${held_lease}" \
            --held-lease-sha256 "$(sha256sum "${held_lease}" | cut -d ' ' -f 1)" \
            --source-snapshot "${source_snapshot}" \
            --source-snapshot-sha256 "$(sha256sum "${source_snapshot}" | cut -d ' ' -f 1)" \
            --target-snapshot "${target_snapshot}" \
            --target-snapshot-sha256 "$(sha256sum "${target_snapshot}" | cut -d ' ' -f 1)" \
            --store-seal "${store_seal}" \
            --store-seal-sha256 "$(sha256sum "${store_seal}" | cut -d ' ' -f 1)" \
            --latest-outcome-output-directory "${PWD}/outcome-final-evidence/latest" \
            --output "${PWD}/outcome-final-evidence/electron-production-publication-recovery-outcome-chain-proof.json" \
            > /dev/null
          final_proof="${PWD}/outcome-final-evidence/electron-production-publication-recovery-outcome-chain-proof.json"
          applied_commit="$(jq -er .applied.commitSha "${operation}")"
          test "$(jq -er .currentObservation.headCommitSha "${final_proof}")" \
            = "${applied_commit}"
          test "$(jq -er .latestOutcome.sha256 "${final_proof}")" \
            = "${ATTEMPT_SHA256}"
          test "$(jq -er .status "${final_proof}")" = "terminal"
          test "$(jq -er .terminal.sha256 "${final_proof}")" \
            = "${TERMINAL_SHA256}"
          cmp "${attempt}" "${readback}/attempt/${ATTEMPT_FILE}"
          cmp "${attempt}" "${PWD}/outcome-final-evidence/latest/${ATTEMPT_FILE}"

      - name: Attest the detached durable outcome closure
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            outcome-final-evidence/electron-production-recovery-store-outcome-append-foundation-verification.json
            outcome-final-evidence/electron-production-recovery-store-outcome-create-chain-verification.json
            outcome-final-evidence/electron-production-publication-recovery-outcome-chain-proof.json
