name: Publish Public Release

on:
  workflow_call:
    inputs:
      tag:
        description: Verified private release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
    secrets:
      RION_RELEASE_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Verified private release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

env:
  PUBLIC_RELEASE_REPOSITORY: rion-tw/rion-studio

concurrency:
  group: public-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi

      - name: Checkout private release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download and verify private candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > private-release-notes.md
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets
          node scripts/releaseArtifacts.mjs release-assets "${version}" --verify-checksums
          node scripts/sanitizePublicReleaseNotes.mjs private-release-notes.md public-release-notes.md

          {
            cat public-release-notes.md
            echo
            echo "## SHA-256 checksums"
            echo
            echo '```text'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > public-release-marker.md

      - name: Create public repository token
        id: public-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RION_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
          owner: rion-tw
          repositories: rion-studio
          permission-contents: write

      - name: Verify public repository is source-free
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}" --jq .visibility)" = "public"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}" --jq .default_branch)" = "main"

          for forbidden_path in src src-tauri crates tests scripts package.json pnpm-lock.yaml Cargo.toml; do
            if gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${forbidden_path}?ref=main" >/dev/null 2>&1; then
              echo "Public repository still contains forbidden source path: ${forbidden_path}" >&2
              exit 1
            fi
          done

      - name: Create or verify public release marker tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          marker_path="releases/${TAG}.md"

          verify_marker() {
            local ref="$1"
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${marker_path}?ref=${ref}" \
              --jq .content | tr -d '\n' | base64 --decode > existing-public-marker.md
            cmp public-release-marker.md existing-public-marker.md
          }

          if gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            verify_marker "${TAG}"
            exit 0
          fi

          if gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${marker_path}?ref=main" >/dev/null 2>&1; then
            verify_marker main
            commit_sha="$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/commits?path=${marker_path}&per_page=1" --jq '.[0].sha')"
          else
            marker_content="$(base64 -w 0 public-release-marker.md)"
            commit_sha="$(
              gh api --method PUT "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${marker_path}" \
                -f message="docs(release): ${TAG}" \
                -f content="${marker_content}" \
                -f branch=main \
                --jq .commit.sha
            )"
          fi

          gh api --method POST "repos/${PUBLIC_RELEASE_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${commit_sha}" >/dev/null

      - name: Create or verify public draft release
        id: public-release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if release_json="$(gh release view "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r .isDraft <<< "${release_json}")" != "true" ]]; then
              echo "already_published=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          else
            gh release create "${TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --draft \
              --latest=false \
              --title "${TAG}" \
              --notes-file public-release-marker.md \
              --verify-tag
          fi

          echo "already_published=false" >> "${GITHUB_OUTPUT}"

      - name: Upload and verify complete public draft
        if: steps.public-release.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          immutable_assets=(
            release-assets/Rion.Studio-mac.dmg
            release-assets/Rion.Studio-mac.app.tar.gz
            release-assets/Rion.Studio-mac.app.tar.gz.sig
            release-assets/Rion.Studio-win.exe
            release-assets/Rion.Studio-win.exe.sig
            release-assets/SHA256SUMS.txt
          )
          manifests=(release-assets/latest.json)

          upload_immutable_asset() {
            local asset="$1"
            local name="${asset##*/}"
            if gh release view "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fxq "${name}"; then
              mkdir -p existing-public-assets
              gh release download "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --pattern "${name}" --dir existing-public-assets
              cmp "${asset}" "existing-public-assets/${name}"
            else
              gh release upload "${TAG}" "${asset}" --repo "${PUBLIC_RELEASE_REPOSITORY}"
            fi
          }

          for asset in "${immutable_assets[@]}"; do upload_immutable_asset "${asset}"; done
          for manifest in "${manifests[@]}"; do upload_immutable_asset "${manifest}"; done

          rm -rf verified-public-assets
          mkdir verified-public-assets
          gh release download "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --dir verified-public-assets
          node scripts/releaseArtifacts.mjs verified-public-assets "${version}" --verify-checksums
          cmp release-assets/SHA256SUMS.txt verified-public-assets/SHA256SUMS.txt

      - name: Verify already-published release is identical
        if: steps.public-release.outputs.already_published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir verified-public-assets
          gh release download "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" --dir verified-public-assets
          node scripts/releaseArtifacts.mjs verified-public-assets "${version}" --verify-checksums
          cmp release-assets/SHA256SUMS.txt verified-public-assets/SHA256SUMS.txt

      - name: Publish verified public release
        if: steps.public-release.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: >-
          gh release edit "${TAG}"
          --repo "${PUBLIC_RELEASE_REPOSITORY}"
          --draft=false
          --latest
          --notes-file public-release-marker.md
          --verify-tag

      - name: Record public release summary
        shell: bash
        run: |
          {
            echo "## Public release"
            echo
            echo "Published and verified: https://github.com/${PUBLIC_RELEASE_REPOSITORY}/releases/tag/${{ inputs.tag }}"
          } >> "${GITHUB_STEP_SUMMARY}"
