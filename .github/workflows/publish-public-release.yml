name: Publish Public Release

on:
  workflow_call:
    inputs:
      tag:
        description: Verified private release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      release_contract:
        description: Stable shell contract accepted by this generic publisher
        required: true
        type: string
    secrets:
      RION_RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  PUBLIC_RELEASE_REPOSITORY: rion-tw/rion-studio
  SOURCE_CONTROL_REPOSITORY: rion-tw/rion-studio-source

concurrency:
  group: public-latest-rion-studio
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fence the reusable publisher to a trusted main caller
        shell: bash
        env:
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_CONTRACT: ${{ inputs.release_contract }}
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${SOURCE_CONTROL_REPOSITORY}"
          test "${EVENT_REPOSITORY}" = "${SOURCE_CONTROL_REPOSITORY}"
          test "${EVENT_DEFAULT_BRANCH}" = "main"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${REF_PROTECTED}" = "true"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${WORKFLOW_SHA}" = "${GITHUB_SHA}"
          case "${GITHUB_EVENT_NAME}" in
            workflow_run)
              expected_workflow_ref="${SOURCE_CONTROL_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
              ;;
            workflow_dispatch)
              expected_workflow_ref="${SOURCE_CONTROL_REPOSITORY}/.github/workflows/resume-release.yml@refs/heads/main"
              ;;
            *)
              echo "The stable publisher caller event is not authorized." >&2
              exit 1
              ;;
          esac
          test "${WORKFLOW_REF}" = "${expected_workflow_ref}"
          test "${RELEASE_CONTRACT}" = "tauri-v22"
          [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Checkout the trusted main publication implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the checked-out control revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Capture the private release as immutable product data before public credentials
        id: private-input
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          input_root="${PWD}/stable-publication-input"
          asset_root="${input_root}/release-assets"
          docs_root="${input_root}/release-docs"
          mkdir -p "${asset_root}" "${docs_root}"
          asset_names=(
            Rion.Studio-mac.app.tar.gz
            Rion.Studio-mac.app.tar.gz.sig
            Rion.Studio-mac.dmg
            Rion.Studio-win.exe
            Rion.Studio-win.exe.sig
            SHA256SUMS.txt
            latest.json
          )
          gh api "repos/${SOURCE_CONTROL_REPOSITORY}/releases/tags/${TAG}" \
            > "${input_root}/private-release-lookup.json"
          release_id="$(jq -r .id "${input_root}/private-release-lookup.json")"
          [[ "${release_id}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${SOURCE_CONTROL_REPOSITORY}/releases/${release_id}" \
            > "${input_root}/private-release-api.json"
          test "$(jq -r .id "${input_root}/private-release-api.json")" = "${release_id}"
          test "$(jq -r .tag_name "${input_root}/private-release-api.json")" = "${TAG}"
          test "$(jq -r .prerelease "${input_root}/private-release-api.json")" = "false"
          test "$(jq '.draft | type == \"boolean\"' \
            "${input_root}/private-release-api.json")" = "true"
          test "$(jq '.assets | length' "${input_root}/private-release-api.json")" = "7"
          for name in "${asset_names[@]}"; do
            test "$(jq --arg name "${name}" \
              '[.assets[] | select(.name == $name)] | length' \
              "${input_root}/private-release-api.json")" = "1"
            asset_id="$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .id' \
              "${input_root}/private-release-api.json")"
            [[ "${asset_id}" =~ ^[1-9][0-9]*$ ]]
            test "$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .state' \
              "${input_root}/private-release-api.json")" = "uploaded"
            expected_size="$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .size' \
              "${input_root}/private-release-api.json")"
            expected_digest="$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .digest' \
              "${input_root}/private-release-api.json")"
            [[ "${expected_size}" =~ ^[1-9][0-9]*$ ]]
            [[ "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh api -H "Accept: application/octet-stream" \
              "repos/${SOURCE_CONTROL_REPOSITORY}/releases/assets/${asset_id}" \
              > "${asset_root}/${name}"
            test "$(wc -c < "${asset_root}/${name}")" = "${expected_size}"
            test "sha256:$(sha256sum "${asset_root}/${name}" | cut -d ' ' -f 1)" = \
              "${expected_digest}"
          done

          tag_ref="$(gh api "repos/${SOURCE_CONTROL_REPOSITORY}/git/ref/tags/${TAG}")"
          tag_type="$(jq -r .object.type <<< "${tag_ref}")"
          tag_object_sha="$(jq -r .object.sha <<< "${tag_ref}")"
          [[ "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]]
          if test "${tag_type}" = "commit"; then
            source_sha="${tag_object_sha}"
          elif test "${tag_type}" = "tag"; then
            tag_object="$(gh api \
              "repos/${SOURCE_CONTROL_REPOSITORY}/git/tags/${tag_object_sha}")"
            test "$(jq -r .tag <<< "${tag_object}")" = "${TAG}"
            test "$(jq -r .object.type <<< "${tag_object}")" = "commit"
            source_sha="$(jq -r .object.sha <<< "${tag_object}")"
          else
            echo "The private release tag does not peel to one commit." >&2
            exit 1
          fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "${source_sha}^{commit}")" = "${source_sha}"
          version="${TAG#v}"
          node scripts/releaseArtifacts.mjs "${asset_root}" "${version}" \
            --verify-checksums --require-tauri-v22
          jq -r 'if .body == null then "" else .body end' \
            "${input_root}/private-release-api.json" \
            > "${input_root}/private-release-notes.md"
          node scripts/sanitizePublicReleaseNotes.mjs \
            "${input_root}/private-release-notes.md" \
            "${input_root}/public-release-notes.md"
          {
            cat "${input_root}/public-release-notes.md"
            echo
            echo "## SHA-256 checksums"
            echo
            echo '```text'
            cat "${asset_root}/SHA256SUMS.txt"
            echo '```'
          } > "${input_root}/public-release-marker.md"

          document_paths=(
            README.md
            docs/README.ja.md
            docs/README.zh-CN.md
            docs/README.zh-TW.md
            NOTICE.md
            SECURITY.md
            SUPPORT.md
            docs/public-repository/CONTRIBUTING.md
            docs/legal
            .github/assets
          )
          git archive --format=tar "${source_sha}" -- "${document_paths[@]}" \
            > "${input_root}/release-documents.tar"
          tar -xf "${input_root}/release-documents.tar" -C "${docs_root}"
          if find "${docs_root}" -type l -print -quit | grep -q .; then
            echo "Release documentation must not contain symbolic links." >&2
            exit 1
          fi
          CONTROL_SHA="${GITHUB_SHA}" DOCS_ROOT="${docs_root}" \
          INPUT_ROOT="${input_root}" RELEASE_ID="${release_id}" \
          SOURCE_SHA="${source_sha}" TAG="${TAG}" \
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { collectPublicDocuments } from "./scripts/syncPublicRepositoryDocs.mjs";
          const digest = (value) => createHash("sha256").update(value).digest("hex");
          const api = JSON.parse(await readFile(
            path.join(process.env.INPUT_ROOT, "private-release-api.json"), "utf8"
          ));
          const documents = await collectPublicDocuments(process.env.DOCS_ROOT);
          const receipt = {
            schemaVersion: 1,
            kind: "rion-stable-tauri-v22-publication-input",
            controlSha: process.env.CONTROL_SHA,
            repository: "rion-tw/rion-studio-source",
            sourceSha: process.env.SOURCE_SHA,
            tag: process.env.TAG,
            version: process.env.TAG.slice(1),
            release: { id: process.env.RELEASE_ID, draft: api.draft,
              prerelease: api.prerelease },
            assets: Object.fromEntries(api.assets.map((asset) => [asset.name, {
              id: String(asset.id), bytes: asset.size,
              sha256: asset.digest.slice("sha256:".length)
            }]).sort(([left], [right]) => left.localeCompare(right))),
            publicReleaseMarker: { sha256: digest(await readFile(
              path.join(process.env.INPUT_ROOT, "public-release-marker.md")
            )) },
            documents: documents.map((entry) => ({
              targetPath: entry.targetPath, bytes: entry.content.length,
              sha256: digest(entry.content)
            }))
          };
          await writeFile(
            path.join(process.env.INPUT_ROOT, "stable-publication-input.json"),
            serializeCanonicalJson(receipt), { flag: "wx", mode: 0o600 }
          );
          NODE
          receipt_sha256="$(sha256sum \
            "${input_root}/stable-publication-input.json" | cut -d ' ' -f 1)"
          echo "receipt_sha256=${receipt_sha256}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Independently reverify the staged input before the App private key
        shell: bash
        env:
          EXPECTED_RECEIPT_SHA256: ${{ steps.private-input.outputs.receipt_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ steps.private-input.outputs.source_sha }}
          EXPECTED_VERSION: ${{ steps.private-input.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          input_root="${PWD}/stable-publication-input"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(sha256sum "${input_root}/stable-publication-input.json" | cut -d ' ' -f 1)" = \
            "${EXPECTED_RECEIPT_SHA256}"
          jq -e --arg control_sha "${GITHUB_SHA}" \
            --arg source_sha "${EXPECTED_SOURCE_SHA}" --arg tag "${TAG}" \
            --arg version "${EXPECTED_VERSION}" \
            '.schemaVersion == 1 and
             .kind == "rion-stable-tauri-v22-publication-input" and
             .controlSha == $control_sha and .sourceSha == $source_sha and
             .tag == $tag and .version == $version and
             .release.prerelease == false and (.assets | keys | length) == 7' \
            "${input_root}/stable-publication-input.json" >/dev/null
          node scripts/releaseArtifacts.mjs "${input_root}/release-assets" \
            "${EXPECTED_VERSION}" --verify-checksums --require-tauri-v22
          INPUT_ROOT="${input_root}" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import path from "node:path";
          import { collectPublicDocuments } from "./scripts/syncPublicRepositoryDocs.mjs";
          const digest = (value) => createHash("sha256").update(value).digest("hex");
          const receipt = JSON.parse(await readFile(
            path.join(process.env.INPUT_ROOT, "stable-publication-input.json"), "utf8"
          ));
          for (const [name, identity] of Object.entries(receipt.assets)) {
            const source = await readFile(path.join(
              process.env.INPUT_ROOT, "release-assets", name
            ));
            if (source.length !== identity.bytes || digest(source) !== identity.sha256) {
              throw new Error(`Staged private asset ${name} changed.`);
            }
          }
          const marker = await readFile(path.join(
            process.env.INPUT_ROOT, "public-release-marker.md"
          ));
          if (digest(marker) !== receipt.publicReleaseMarker.sha256) {
            throw new Error("The staged public release marker changed.");
          }
          const documents = await collectPublicDocuments(path.join(
            process.env.INPUT_ROOT, "release-docs"
          ));
          const observed = documents.map((entry) => ({
            targetPath: entry.targetPath, bytes: entry.content.length,
            sha256: digest(entry.content)
          }));
          if (JSON.stringify(observed) !== JSON.stringify(receipt.documents)) {
            throw new Error("The staged release documentation changed.");
          }
          NODE

      - name: Create the narrow public repository writer token
        id: public-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RION_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
          owner: rion-tw
          repositories: rion-studio
          permission-contents: write

      - name: Verify the public repository is source-free
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}" --jq .visibility)" = "public"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}" --jq .default_branch)" = "main"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/heads/main" \
            --jq .ref)" = "refs/heads/main"
          for forbidden_path in \
            src src-tauri crates tests scripts package.json pnpm-lock.yaml Cargo.toml; do
            error_path="$(mktemp)"
            if gh api \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${forbidden_path}?ref=main" \
              >/dev/null 2> "${error_path}"; then
              echo "Public repository still contains forbidden source path: ${forbidden_path}" >&2
              exit 1
            fi
            if ! grep -Fq '(HTTP 404)' "${error_path}"; then
              cat "${error_path}" >&2
              exit 1
            fi
          done

      - name: Create or verify the source-free public release marker tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          marker_path="releases/${TAG}.md"
          marker_source="stable-publication-input/public-release-marker.md"
          verify_marker() {
            local ref="$1"
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${marker_path}?ref=${ref}" \
              --jq .content | tr -d '\n' | base64 --decode > existing-public-marker.md
            cmp "${marker_source}" existing-public-marker.md
          }
          tag_error="$(mktemp)"
          if tag_ref="$(gh api \
            "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${TAG}" \
            2> "${tag_error}")"; then
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
            [[ "$(jq -r .object.sha <<< "${tag_ref}")" =~ ^[0-9a-f]{40}$ ]]
            verify_marker "${TAG}"
            exit 0
          fi
          if ! grep -Fq '(HTTP 404)' "${tag_error}"; then
            cat "${tag_error}" >&2
            exit 1
          fi
          marker_error="$(mktemp)"
          if gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${marker_path}?ref=main" \
            >/dev/null 2> "${marker_error}"; then
            verify_marker main
            commit_sha="$(gh api \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/commits?path=${marker_path}&sha=main&per_page=1" \
              --jq '.[0].sha')"
          else
            if ! grep -Fq '(HTTP 404)' "${marker_error}"; then
              cat "${marker_error}" >&2
              exit 1
            fi
            marker_content="$(base64 -w 0 "${marker_source}")"
            commit_sha="$(gh api --method PUT \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/contents/${marker_path}" \
              -f message="docs(release): ${TAG}" -f content="${marker_content}" \
              -f branch=main --jq .commit.sha)"
          fi
          [[ "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/${PUBLIC_RELEASE_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${commit_sha}" >/dev/null

      - name: Stage and capture the exact Tauri v22 target and current latest
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          evidence_root="${PWD}/stable-publication-evidence"
          work_root="${PWD}/stable-publication-work/stage"
          private_assets="${PWD}/stable-publication-input/release-assets"
          marker_source="${PWD}/stable-publication-input/public-release-marker.md"
          version="${TAG#v}"
          mkdir -p "${evidence_root}" "${work_root}"
          asset_names=(
            Rion.Studio-mac.app.tar.gz
            Rion.Studio-mac.app.tar.gz.sig
            Rion.Studio-mac.dmg
            Rion.Studio-win.exe
            Rion.Studio-win.exe.sig
            SHA256SUMS.txt
            latest.json
          )
          download_release_assets_by_id() {
            local api_file="$1"
            local output_root="$2"
            mkdir -p "${output_root}"
            test "$(jq '.assets | length' "${api_file}")" = "7"
            for name in "${asset_names[@]}"; do
              test "$(jq --arg name "${name}" \
                '[.assets[] | select(.name == $name)] | length' "${api_file}")" = "1"
              local asset_id expected_size expected_digest
              asset_id="$(jq -r --arg name "${name}" \
                '.assets[] | select(.name == $name) | .id' "${api_file}")"
              expected_size="$(jq -r --arg name "${name}" \
                '.assets[] | select(.name == $name) | .size' "${api_file}")"
              expected_digest="$(jq -r --arg name "${name}" \
                '.assets[] | select(.name == $name) | .digest' "${api_file}")"
              [[ "${asset_id}" =~ ^[1-9][0-9]*$ ]]
              [[ "${expected_size}" =~ ^[1-9][0-9]*$ ]]
              [[ "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$(jq -r --arg name "${name}" \
                '.assets[] | select(.name == $name) | .state' "${api_file}")" = "uploaded"
              gh api -H "Accept: application/octet-stream" \
                "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                > "${output_root}/${name}"
              test "$(wc -c < "${output_root}/${name}")" = "${expected_size}"
              test "sha256:$(sha256sum "${output_root}/${name}" | cut -d ' ' -f 1)" = \
                "${expected_digest}"
            done
          }
          capture_release_by_id() {
            local release_id="$1"
            local is_latest="$2"
            local root="$3"
            local snapshot_path="$4"
            mkdir -p "${root}"
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${release_id}" \
              > "${root}/release-api.json"
            test "$(jq -r .id "${root}/release-api.json")" = "${release_id}"
            test "$(jq -r .draft "${root}/release-api.json")" = "false"
            test "$(jq -r .prerelease "${root}/release-api.json")" = "false"
            test "$(jq -r .published_at "${root}/release-api.json")" != "null"
            local release_tag tag_ref tag_commit
            release_tag="$(jq -r .tag_name "${root}/release-api.json")"
            [[ "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            tag_ref="$(gh api \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${release_tag}")"
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
            tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
            [[ "${tag_commit}" =~ ^[0-9a-f]{40}$ ]]
            download_release_assets_by_id "${root}/release-api.json" "${root}/assets"
            RELEASE_API="${root}/release-api.json" IS_LATEST="${is_latest}" \
            TAG_COMMIT="${tag_commit}" node --input-type=module <<'NODE' \
              > "${root}/release-metadata.json"
          import { readFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          process.stdout.write(serializeCanonicalJson({
            repository: "rion-tw/rion-studio", id: String(release.id),
            tag: release.tag_name, targetCommitish: process.env.TAG_COMMIT,
            isLatest: process.env.IS_LATEST === "true",
            draft: release.draft, prerelease: release.prerelease,
            assets: release.assets.map((asset) => ({
              id: String(asset.id), name: asset.name, bytes: asset.size,
              digest: asset.digest, url: asset.browser_download_url,
              contentType: asset.content_type
            }))
          }));
          NODE
            node scripts/electronProductionPublicationCli.mjs snapshot \
              --asset-directory "${root}/assets" \
              --release-json "${root}/release-metadata.json" \
              --output "${snapshot_path}"
          }

          lookup_error="${work_root}/target-lookup-error.txt"
          if gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/tags/${TAG}" \
            > "${work_root}/target-lookup.json" 2> "${lookup_error}"; then
            target_id="$(jq -r .id "${work_root}/target-lookup.json")"
            [[ "${target_id}" =~ ^[1-9][0-9]*$ ]]
          else
            if ! grep -Fq '(HTTP 404)' "${lookup_error}"; then
              cat "${lookup_error}" >&2
              exit 1
            fi
            gh release create "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --draft --latest=false --title "${TAG}" \
              --notes-file "${marker_source}" --verify-tag
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/tags/${TAG}" \
              > "${work_root}/target-lookup.json"
            target_id="$(jq -r .id "${work_root}/target-lookup.json")"
            [[ "${target_id}" =~ ^[1-9][0-9]*$ ]]
          fi
          gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${target_id}" \
            > "${work_root}/target-before-stage.json"
          test "$(jq -r .id "${work_root}/target-before-stage.json")" = "${target_id}"
          test "$(jq -r .tag_name "${work_root}/target-before-stage.json")" = "${TAG}"
          test "$(jq -r .prerelease "${work_root}/target-before-stage.json")" = "false"
          jq -r 'if .body == null then "" else .body end' \
            "${work_root}/target-before-stage.json" > "${work_root}/target-notes.md"
          cmp "${marker_source}" "${work_root}/target-notes.md"
          if test "$(jq -r .draft "${work_root}/target-before-stage.json")" = "true"; then
            jq -e --argjson allowed \
              '["Rion.Studio-mac.app.tar.gz","Rion.Studio-mac.app.tar.gz.sig","Rion.Studio-mac.dmg","Rion.Studio-win.exe","Rion.Studio-win.exe.sig","SHA256SUMS.txt","latest.json"]' \
              '(.assets | length) <= 7 and
               ([.assets[].name] | length) == ([.assets[].name] | unique | length) and
               all(.assets[]; .name as $name | $allowed | index($name) != null)' \
              "${work_root}/target-before-stage.json" >/dev/null
            for name in "${asset_names[@]}"; do
              count="$(jq --arg name "${name}" \
                '[.assets[] | select(.name == $name)] | length' \
                "${work_root}/target-before-stage.json")"
              if test "${count}" = "1"; then
                asset_id="$(jq -r --arg name "${name}" \
                  '.assets[] | select(.name == $name) | .id' \
                  "${work_root}/target-before-stage.json")"
                gh api -H "Accept: application/octet-stream" \
                  "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                  > "${work_root}/existing-${name}"
                cmp "${private_assets}/${name}" "${work_root}/existing-${name}"
              else
                test "${count}" = "0"
                gh release upload "${TAG}" "${private_assets}/${name}" \
                  --repo "${PUBLIC_RELEASE_REPOSITORY}"
              fi
            done
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${target_id}" \
              > "${work_root}/target-staged-draft.json"
            test "$(jq -r .draft "${work_root}/target-staged-draft.json")" = "true"
            test "$(jq -r .prerelease "${work_root}/target-staged-draft.json")" = "false"
            download_release_assets_by_id \
              "${work_root}/target-staged-draft.json" \
              "${work_root}/target-staged-draft-assets"
            for name in "${asset_names[@]}"; do
              cmp "${private_assets}/${name}" \
                "${work_root}/target-staged-draft-assets/${name}"
            done
            node scripts/releaseArtifacts.mjs \
              "${work_root}/target-staged-draft-assets" "${version}" \
              --verify-checksums --require-tauri-v22
            gh release edit "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --draft=false --latest=false --notes-file "${marker_source}" --verify-tag
          else
            test "$(jq -r .draft "${work_root}/target-before-stage.json")" = "false"
          fi
          gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${target_id}" \
            > "${work_root}/target-published.json"
          test "$(jq -r .draft "${work_root}/target-published.json")" = "false"
          test "$(jq -r .prerelease "${work_root}/target-published.json")" = "false"
          download_release_assets_by_id \
            "${work_root}/target-published.json" "${work_root}/target-verified-assets"
          for name in "${asset_names[@]}"; do
            cmp "${private_assets}/${name}" "${work_root}/target-verified-assets/${name}"
          done
          node scripts/releaseArtifacts.mjs "${work_root}/target-verified-assets" \
            "${version}" --verify-checksums --require-tauri-v22
          jq -r 'if .body == null then "" else .body end' \
            "${work_root}/target-published.json" > "${work_root}/published-notes.md"
          cmp "${marker_source}" "${work_root}/published-notes.md"

          gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" \
            > "${work_root}/latest-lookup.json"
          latest_id="$(jq -r .id "${work_root}/latest-lookup.json")"
          [[ "${latest_id}" =~ ^[1-9][0-9]*$ ]]
          if test "${latest_id}" = "${target_id}"; then
            capture_release_by_id "${target_id}" true \
              "${work_root}/target-current-latest" \
              "${evidence_root}/target-current-latest-snapshot.json"
            for name in "${asset_names[@]}"; do
              cmp "${private_assets}/${name}" \
                "${work_root}/target-current-latest/assets/${name}"
            done
            node scripts/releaseArtifacts.mjs \
              "${work_root}/target-current-latest/assets" "${version}" \
              --verify-checksums --require-tauri-v22
            test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)" = \
              "${target_id}"
            echo "mode=idempotent-already-latest" >> "${GITHUB_OUTPUT}"
            echo "target_version=${version}" >> "${GITHUB_OUTPUT}"
            echo "target_state_sha256=$(jq -r .stateSha256 \
              "${evidence_root}/target-current-latest-snapshot.json")" \
              >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          capture_release_by_id "${target_id}" false \
            "${work_root}/target" "${evidence_root}/target-observed-snapshot.json"
          capture_release_by_id "${latest_id}" true \
            "${work_root}/source" "${evidence_root}/source-public-latest-snapshot.json"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)" = \
            "${latest_id}"
          for name in "${asset_names[@]}"; do
            cmp "${private_assets}/${name}" "${work_root}/target/assets/${name}"
          done
          source_version="$(jq -r .latestJson.version \
            "${evidence_root}/source-public-latest-snapshot.json")"
          node scripts/releaseArtifacts.mjs "${work_root}/target/assets" "${version}" \
            --verify-checksums --require-tauri-v22
          node scripts/releaseArtifacts.mjs "${work_root}/source/assets" \
            "${source_version}" --verify-checksums --require-tauri-v22
          TARGET_OBSERVED="${evidence_root}/target-observed-snapshot.json" \
          TARGET_PROJECTED="${evidence_root}/target-expected-latest-snapshot.json" \
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import {
            deriveTauriV22ExpectedLatestState,
            writeElectronProductionPublicLatestSnapshot
          } from "./scripts/electronProductionPublicLatestSnapshot.mjs";
          const observed = JSON.parse(await readFile(process.env.TARGET_OBSERVED, "utf8"));
          await writeElectronProductionPublicLatestSnapshot({
            outputPath: process.env.TARGET_PROJECTED,
            snapshot: deriveTauriV22ExpectedLatestState(observed)
          });
          NODE
          echo "mode=latest-mutation" >> "${GITHUB_OUTPUT}"
          echo "source_state_sha256=$(jq -r .stateSha256 \
            "${evidence_root}/source-public-latest-snapshot.json")" >> "${GITHUB_OUTPUT}"
          echo "source_version=${source_version}" >> "${GITHUB_OUTPUT}"
          echo "target_state_sha256=$(jq -r .stateSha256 \
            "${evidence_root}/target-expected-latest-snapshot.json")" \
            >> "${GITHUB_OUTPUT}"
          echo "target_version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Acquire the durable public-latest publication lease
        id: acquire
        if: steps.stage.outputs.mode == 'latest-mutation'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          SOURCE_STATE_SHA256: ${{ steps.stage.outputs.source_state_sha256 }}
          SOURCE_VERSION: ${{ steps.stage.outputs.source_version }}
          TARGET_STATE_SHA256: ${{ steps.stage.outputs.target_state_sha256 }}
          TARGET_VERSION: ${{ steps.stage.outputs.target_version }}
        run: |
          set -euo pipefail
          umask 077
          output_root="${PWD}/stable-publication-evidence/held-acquired"
          mkdir -p "${output_root}"
          transaction_id="$(node --input-type=module -e \
            'import { randomUUID } from "node:crypto"; console.log(randomUUID())')"
          lease_id="$(node --input-type=module -e \
            'import { randomUUID } from "node:crypto"; console.log(randomUUID())')"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs acquire \
            --transaction-id "${transaction_id}" --lease-id "${lease_id}" \
            --purpose tauri-v22-publication \
            --holder-workflow .github/workflows/publish-public-release.yml \
            --holder-run-id "${GITHUB_RUN_ID}" \
            --holder-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --control-head-sha "${GITHUB_SHA}" \
            --source-runtime tauri-v22 --source-version "${SOURCE_VERSION}" \
            --source-state-sha256 "${SOURCE_STATE_SHA256}" \
            --target-runtime tauri-v22 --target-version "${TARGET_VERSION}" \
            --target-state-sha256 "${TARGET_STATE_SHA256}" \
            --recorded-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${output_root}/electron-production-public-latest-lease.json" \
            > "${output_root}/acquire-operation.json"
          echo "held_lease=${output_root}/electron-production-public-latest-lease.json" \
            >> "${GITHUB_OUTPUT}"
          echo "held_sha256=$(jq -r .output.sha256 \
            "${output_root}/acquire-operation.json")" >> "${GITHUB_OUTPUT}"

      - name: Re-read the exact source, observe the held lease, and submit latest mutation
        id: mutation
        if: steps.stage.outputs.mode == 'latest-mutation'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          HELD_LEASE: ${{ steps.acquire.outputs.held_lease }}
          HELD_SHA256: ${{ steps.acquire.outputs.held_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          evidence_root="${PWD}/stable-publication-evidence"
          work_root="${PWD}/stable-publication-work/pre-mutation"
          mkdir -p "${work_root}/assets" "${evidence_root}/held-pre-mutation"
          source_snapshot="${evidence_root}/source-public-latest-snapshot.json"
          source_id="$(jq -r .release.id "${source_snapshot}")"
          target_id="$(jq -r .release.id \
            "${evidence_root}/target-expected-latest-snapshot.json")"
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)" = \
            "${source_id}"
          gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${source_id}" \
            > "${work_root}/source-release-api.json"
          source_tag="$(jq -r .release.tag "${source_snapshot}")"
          source_tag_ref="$(gh api \
            "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${source_tag}")"
          test "$(jq -r .object.type <<< "${source_tag_ref}")" = "commit"
          test "$(jq -r .object.sha <<< "${source_tag_ref}")" = \
            "$(jq -r .release.targetCommitish "${source_snapshot}")"
          SNAPSHOT="${source_snapshot}" RELEASE_API="${work_root}/source-release-api.json" \
          node --input-type=module <<'NODE'
          import { isDeepStrictEqual } from "node:util";
          import { readFile } from "node:fs/promises";
          const snapshot = JSON.parse(await readFile(process.env.SNAPSHOT, "utf8"));
          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          const observed = {
            id: String(release.id), tag: release.tag_name,
            draft: release.draft, prerelease: release.prerelease,
            assets: release.assets.map((asset) => ({
              id: String(asset.id), name: asset.name, bytes: asset.size,
              digest: asset.digest, url: asset.browser_download_url,
              contentType: asset.content_type
            })).sort((left, right) => left.name.localeCompare(right.name))
          };
          const expected = {
            id: snapshot.release.id, tag: snapshot.release.tag,
            draft: snapshot.release.draft, prerelease: snapshot.release.prerelease,
            assets: [...snapshot.assets].sort((left, right) =>
              left.name.localeCompare(right.name))
          };
          if (!isDeepStrictEqual(observed, expected)) {
            throw new Error("The last-moment public latest metadata changed.");
          }
          NODE
          for name in Rion.Studio-mac.app.tar.gz Rion.Studio-mac.app.tar.gz.sig \
            Rion.Studio-mac.dmg Rion.Studio-win.exe Rion.Studio-win.exe.sig \
            SHA256SUMS.txt latest.json; do
            asset_id="$(jq -r --arg name "${name}" \
              '.assets[] | select(.name == $name) | .id' \
              "${work_root}/source-release-api.json")"
            gh api -H "Accept: application/octet-stream" \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
              > "${work_root}/assets/${name}"
            cmp "${work_root}/assets/${name}" \
              "${PWD}/stable-publication-work/stage/source/assets/${name}"
          done
          test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)" = \
            "${source_id}"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs observe \
            --held-lease "${HELD_LEASE}" --held-lease-sha256 "${HELD_SHA256}" \
            --output "${evidence_root}/held-pre-mutation/electron-production-public-latest-lease.json" \
            > "${evidence_root}/held-pre-mutation/observe-operation.json"
          set +e
          gh api --method PATCH --include \
            "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${target_id}" \
            -f make_latest=true > "${work_root}/mutation-response.txt" \
            2> "${work_root}/mutation-error.txt"
          command_status=$?
          set -e
          http_status="$(sed -nE \
            's/^HTTP\/[0-9.]+ ([0-9]{3})( .*)?$/\1/p' \
            "${work_root}/mutation-response.txt" | tail -n 1)"
          acknowledgement=unknown
          if test "${command_status}" = "0" && test "${http_status}" = "200"; then
            acknowledgement=confirmed
          elif [[ "${http_status}" =~ ^4[0-9]{2}$ ]]; then
            acknowledgement=rejected
          fi
          ACKNOWLEDGEMENT="${acknowledgement}" COMMAND_STATUS="${command_status}" \
          HTTP_STATUS="${http_status}" TARGET_ID="${target_id}" \
          node --input-type=module <<'NODE' > "${evidence_root}/mutation-acknowledgement.json"
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          const status = process.env.HTTP_STATUS;
          process.stdout.write(serializeCanonicalJson({
            schemaVersion: 1,
            kind: "rion-stable-tauri-v22-latest-mutation-acknowledgement",
            acknowledgement: process.env.ACKNOWLEDGEMENT,
            commandExitCode: Number(process.env.COMMAND_STATUS),
            httpStatus: status === "" ? null : Number(status),
            releaseId: process.env.TARGET_ID
          }));
          NODE
          echo "acknowledgement=${acknowledgement}" >> "${GITHUB_OUTPUT}"

      - name: Always capture and classify a fresh public latest readback
        id: readback
        if: ${{ always() && steps.stage.outputs.mode == 'latest-mutation' && steps.acquire.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          evidence_root="${PWD}/stable-publication-evidence"
          work_root="${PWD}/stable-publication-work/readback"
          mkdir -p "${work_root}/assets"
          asset_names=(Rion.Studio-mac.app.tar.gz Rion.Studio-mac.app.tar.gz.sig \
            Rion.Studio-mac.dmg Rion.Studio-win.exe Rion.Studio-win.exe.sig \
            SHA256SUMS.txt latest.json)
          capture_fresh_latest() {
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" \
              > "${work_root}/latest-lookup.json"
            local release_id release_tag tag_ref tag_commit
            release_id="$(jq -r .id "${work_root}/latest-lookup.json")"
            [[ "${release_id}" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/${release_id}" \
              > "${work_root}/release-api.json"
            test "$(jq -r .id "${work_root}/release-api.json")" = "${release_id}"
            test "$(jq -r .draft "${work_root}/release-api.json")" = "false"
            test "$(jq -r .prerelease "${work_root}/release-api.json")" = "false"
            test "$(jq '.assets | length' "${work_root}/release-api.json")" = "7"
            release_tag="$(jq -r .tag_name "${work_root}/release-api.json")"
            tag_ref="$(gh api \
              "repos/${PUBLIC_RELEASE_REPOSITORY}/git/ref/tags/${release_tag}")"
            test "$(jq -r .object.type <<< "${tag_ref}")" = "commit"
            tag_commit="$(jq -r .object.sha <<< "${tag_ref}")"
            [[ "${tag_commit}" =~ ^[0-9a-f]{40}$ ]]
            for name in "${asset_names[@]}"; do
              test "$(jq --arg name "${name}" \
                '[.assets[] | select(.name == $name)] | length' \
                "${work_root}/release-api.json")" = "1"
              local asset_id
              asset_id="$(jq -r --arg name "${name}" \
                '.assets[] | select(.name == $name) | .id' \
                "${work_root}/release-api.json")"
              gh api -H "Accept: application/octet-stream" \
                "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/assets/${asset_id}" \
                > "${work_root}/assets/${name}"
            done
            RELEASE_API="${work_root}/release-api.json" TAG_COMMIT="${tag_commit}" \
            node --input-type=module <<'NODE' > "${work_root}/release-metadata.json"
          import { readFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          const release = JSON.parse(await readFile(process.env.RELEASE_API, "utf8"));
          process.stdout.write(serializeCanonicalJson({
            repository: "rion-tw/rion-studio", id: String(release.id),
            tag: release.tag_name, targetCommitish: process.env.TAG_COMMIT,
            isLatest: true, draft: release.draft, prerelease: release.prerelease,
            assets: release.assets.map((asset) => ({
              id: String(asset.id), name: asset.name, bytes: asset.size,
              digest: asset.digest, url: asset.browser_download_url,
              contentType: asset.content_type
            }))
          }));
          NODE
            node scripts/electronProductionPublicationCli.mjs snapshot \
              --asset-directory "${work_root}/assets" \
              --release-json "${work_root}/release-metadata.json" \
              --output "${evidence_root}/observed-fresh-latest-snapshot.json"
            test "$(gh api "repos/${PUBLIC_RELEASE_REPOSITORY}/releases/latest" --jq .id)" = \
              "${release_id}"
          }
          set +e
          (set -euo pipefail; capture_fresh_latest)
          capture_status=$?
          set -e
          CAPTURE_STATUS="${capture_status}" \
          OBSERVED="${evidence_root}/observed-fresh-latest-snapshot.json" \
          SOURCE="${evidence_root}/source-public-latest-snapshot.json" \
          TARGET="${evidence_root}/target-expected-latest-snapshot.json" \
          node --input-type=module <<'NODE' > "${evidence_root}/readback-classification.json"
          import { readFile } from "node:fs/promises";
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          import { classifyElectronProductionPublicLatestSnapshot } from
            "./scripts/electronProductionPublicLatestSnapshot.mjs";
          let classification = "unknown";
          if (process.env.CAPTURE_STATUS === "0") {
            try {
              classification = classifyElectronProductionPublicLatestSnapshot({
                observed: JSON.parse(await readFile(process.env.OBSERVED, "utf8")),
                source: JSON.parse(await readFile(process.env.SOURCE, "utf8")),
                target: JSON.parse(await readFile(process.env.TARGET, "utf8"))
              });
            } catch {
              classification = "unknown";
            }
          }
          process.stdout.write(serializeCanonicalJson({
            schemaVersion: 1,
            kind: "rion-stable-tauri-v22-publication-readback",
            captureSucceeded: process.env.CAPTURE_STATUS === "0",
            classification
          }));
          NODE
          echo "classification=$(jq -r .classification \
            "${evidence_root}/readback-classification.json")" >> "${GITHUB_OUTPUT}"

      - name: Release the lease only for a safe acknowledgement and exact readback
        id: release-lease
        if: >-
          ${{ always() && steps.stage.outputs.mode == 'latest-mutation' &&
              ((steps.mutation.outputs.acknowledgement == 'confirmed' &&
                steps.readback.outputs.classification == 'target') ||
               (steps.mutation.outputs.acknowledgement == 'rejected' &&
                steps.readback.outputs.classification == 'source')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          HELD_LEASE: ${{ steps.acquire.outputs.held_lease }}
          HELD_SHA256: ${{ steps.acquire.outputs.held_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          evidence_root="${PWD}/stable-publication-evidence"
          observe_root="${evidence_root}/held-pre-release"
          released_root="${evidence_root}/released"
          mkdir -p "${observe_root}" "${released_root}"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs observe \
            --held-lease "${HELD_LEASE}" --held-lease-sha256 "${HELD_SHA256}" \
            --output "${observe_root}/electron-production-public-latest-lease.json" \
            > "${observe_root}/observe-operation.json"
          node scripts/electronProductionPublicLatestLeaseRemoteCli.mjs release \
            --held-lease "${HELD_LEASE}" --held-lease-sha256 "${HELD_SHA256}" \
            --recorded-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "${released_root}/electron-production-public-latest-lease.json" \
            > "${released_root}/release-operation.json"

      - name: Synchronize public documentation using trusted main control code
        id: documentation
        if: >-
          ${{ steps.stage.outputs.mode == 'idempotent-already-latest' ||
              (steps.mutation.outputs.acknowledgement == 'confirmed' &&
               steps.readback.outputs.classification == 'target' &&
               steps.release-lease.outcome == 'success') }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.public-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          DOCS_ROOT="${PWD}/stable-publication-input/release-docs" TAG="${TAG}" \
          node --input-type=module <<'NODE'
          import { synchronizePublicDocuments } from
            "./scripts/syncPublicRepositoryDocs.mjs";
          const result = await synchronizePublicDocuments({
            repository: "rion-tw/rion-studio", root: process.env.DOCS_ROOT,
            tag: process.env.TAG, branch: "main"
          });
          if (result.status !== "updated" && result.status !== "unchanged") {
            throw new Error(`Public document synchronization was ${result.status}.`);
          }
          process.stdout.write(`${JSON.stringify(result)}\n`);
          NODE

      - name: Record the closed stable publication result
        if: ${{ always() }}
        shell: bash
        env:
          ACKNOWLEDGEMENT: ${{ steps.mutation.outputs.acknowledgement }}
          ACQUIRE_STEP_OUTCOME: ${{ steps.acquire.outcome }}
          CLASSIFICATION: ${{ steps.readback.outputs.classification }}
          DOCUMENTATION_STEP_OUTCOME: ${{ steps.documentation.outcome }}
          MODE: ${{ steps.stage.outputs.mode }}
          RELEASE_STEP_OUTCOME: ${{ steps.release-lease.outcome }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p stable-publication-evidence
          lease_status=not-acquired
          if test "${ACQUIRE_STEP_OUTCOME}" = "success"; then lease_status=held; fi
          if test "${RELEASE_STEP_OUTCOME}" = "success"; then lease_status=released; fi
          ACKNOWLEDGEMENT="${ACKNOWLEDGEMENT:-not-submitted}" \
          CLASSIFICATION="${CLASSIFICATION:-not-observed}" \
          DOCUMENTATION_STEP_OUTCOME="${DOCUMENTATION_STEP_OUTCOME}" \
          LEASE_STATUS="${lease_status}" MODE="${MODE:-unknown}" TAG="${TAG}" \
          node --input-type=module <<'NODE' \
            > stable-publication-evidence/final-summary.json
          import { serializeCanonicalJson } from "./scripts/canonicalJson.mjs";
          process.stdout.write(serializeCanonicalJson({
            schemaVersion: 1,
            kind: "rion-stable-tauri-v22-publication-final-summary",
            mode: process.env.MODE,
            acknowledgement: process.env.ACKNOWLEDGEMENT,
            classification: process.env.CLASSIFICATION,
            leaseStatus: process.env.LEASE_STATUS,
            documentation: process.env.DOCUMENTATION_STEP_OUTCOME,
            targetTag: process.env.TAG
          }));
          NODE
          {
            echo "## Stable Tauri v22 public release"
            echo
            echo "- Target: https://github.com/${PUBLIC_RELEASE_REPOSITORY}/releases/tag/${TAG}"
            echo "- Mode: ${MODE:-unknown}"
            echo "- Mutation acknowledgement: ${ACKNOWLEDGEMENT:-not-submitted}"
            echo "- Fresh readback: ${CLASSIFICATION:-not-observed}"
            echo "- Lease: ${lease_status}"
            echo "- Documentation: ${DOCUMENTATION_STEP_OUTCOME}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve stable publication snapshots and lease evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stable-tauri-v22-publication-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            stable-publication-evidence
            stable-publication-input/stable-publication-input.json
          if-no-files-found: error
          retention-days: 30

      - name: Require a terminal exact public latest result
        if: ${{ always() }}
        shell: bash
        env:
          ACKNOWLEDGEMENT: ${{ steps.mutation.outputs.acknowledgement }}
          CLASSIFICATION: ${{ steps.readback.outputs.classification }}
          DOCUMENTATION_STEP_OUTCOME: ${{ steps.documentation.outcome }}
          MODE: ${{ steps.stage.outputs.mode }}
          RELEASE_STEP_OUTCOME: ${{ steps.release-lease.outcome }}
        run: |
          set -euo pipefail
          test "${DOCUMENTATION_STEP_OUTCOME}" = "success"
          if test "${MODE}" = "idempotent-already-latest"; then
            test "${ACKNOWLEDGEMENT}" = ""
            test "${CLASSIFICATION}" = ""
            test "${RELEASE_STEP_OUTCOME}" = "skipped"
            exit 0
          fi
          test "${MODE}" = "latest-mutation"
          test "${ACKNOWLEDGEMENT}" = "confirmed"
          test "${CLASSIFICATION}" = "target"
          test "${RELEASE_STEP_OUTCOME}" = "success"
