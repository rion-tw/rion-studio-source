name: Private Tauri Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: private-tauri-release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  validate-ci-run:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.validate.outputs.source_ref }}
    steps:
      - name: Validate successful CI run
        id: validate
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          echo "source_ref=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  semantic-release:
    needs: validate-ci-run
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.semantic.outputs.release_version }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-ci-run.outputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create semantic release
        id: semantic
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve-release:
    needs:
      - validate-ci-run
      - semantic-release
    if: needs.semantic-release.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.resolve.outputs.has_release }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - name: Resolve private release
        id: resolve
        shell: bash
        env:
          VERSION: ${{ needs.semantic-release.outputs.release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" ]]; then
            echo "has_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tag="v${VERSION}"
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          echo "has_release=true" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build-tauri-release:
    needs:
      - validate-ci-run
      - resolve-release
    if: needs.resolve-release.outputs.has_release == 'true'
    uses: ./.github/workflows/tauri-release-candidate.yml
    with:
      tag: ${{ needs.resolve-release.outputs.release_tag }}
      updater_base_url: https://github.com/rion-tw/rion-studio/releases/latest/download
      verified_sha: ${{ needs.validate-ci-run.outputs.source_ref }}
    secrets:
      RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  verify-and-upload-private-release:
    needs:
      - resolve-release
      - build-tauri-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag }}

      - name: Validate release candidate output
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.build-tauri-release.outputs.release_artifact_name }}
          VERSION: ${{ needs.resolve-release.outputs.release_version }}
        run: test "${ARTIFACT_NAME}" = "tauri-release-assets-${VERSION}"

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build-tauri-release.outputs.release_artifact_name }}
          path: release-assets

      - name: Verify private release assets
        run: node scripts/releaseArtifacts.mjs release-assets ${{ needs.resolve-release.outputs.release_version }} --verify-checksums

      - name: Upload immutable private release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.release_tag }}
          VERSION: ${{ needs.resolve-release.outputs.release_version }}
        run: |
          set -euo pipefail
          immutable_assets=(
            release-assets/Rion.Studio-mac.dmg
            release-assets/Rion.Studio-mac.app.tar.gz
            release-assets/Rion.Studio-mac.app.tar.gz.sig
            release-assets/Rion.Studio-win.exe
            release-assets/Rion.Studio-win.exe.sig
            release-assets/SHA256SUMS.txt
          )
          manifests=(release-assets/latest.json release-assets/latest-mac.yml release-assets/latest.yml)

          upload_immutable_asset() {
            local asset="$1"
            local name="${asset##*/}"
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fxq "${name}"; then
              mkdir -p existing-assets
              gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${name}" --dir existing-assets
              cmp "${asset}" "existing-assets/${name}"
            else
              gh release upload "${TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}"
            fi
          }

          for asset in "${immutable_assets[@]}"; do upload_immutable_asset "${asset}"; done
          for manifest in "${manifests[@]}"; do upload_immutable_asset "${manifest}"; done
          rm -rf downloaded-assets
          mkdir downloaded-assets
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir downloaded-assets
          node scripts/releaseArtifacts.mjs downloaded-assets "${VERSION}" --verify-checksums
          cmp release-assets/SHA256SUMS.txt downloaded-assets/SHA256SUMS.txt

  publish-public-release:
    needs:
      - resolve-release
      - verify-and-upload-private-release
    uses: ./.github/workflows/publish-public-release.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.resolve-release.outputs.release_tag }}
    secrets:
      RION_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
