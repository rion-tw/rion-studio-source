name: Private Tauri Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: private-tauri-release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  validate-ci-run:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.validate.outputs.source_ref }}
    steps:
      - name: Validate successful CI run
        id: validate
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "source_ref=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  await-preflight:
    needs: validate-ci-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    outputs:
      has_release: ${{ steps.gate.outputs.has_release }}
      preflight_run_id: ${{ steps.gate.outputs.preflight_run_id }}
      release_artifact_name: ${{ steps.gate.outputs.release_artifact_name }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
      release_version: ${{ steps.gate.outputs.release_version }}
      source_ref: ${{ steps.gate.outputs.source_ref }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-ci-run.outputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a matching successful Tauri preflight
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ needs.validate-ci-run.outputs.source_ref }}
        run: |
          set -euo pipefail
          workflow_file="tauri-release-preflight.yml"
          artifact_name="release-preflight-${SOURCE_REF}"

          wait_for_preflight() {
            local event_name="$1"
            local expected_title="$2"
            local run_id=""
            local run_json=""
            local status=""
            local conclusion=""
            for attempt in $(seq 1 240); do
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?event=${event_name}&per_page=100")"
              if [[ -n "${expected_title}" ]]; then
                run_id="$(jq -r --arg title "${expected_title}" '[.workflow_runs[] | select(.display_title == $title)] | sort_by(.created_at) | last | .id // empty' <<< "${run_json}")"
              else
                run_id="$(jq -r --arg source_ref "${SOURCE_REF}" '[.workflow_runs[] | select(.head_sha == $source_ref)] | sort_by(.created_at) | last | .id // empty' <<< "${run_json}")"
              fi
              if [[ -n "${run_id}" ]]; then
                status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
                conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty')"
                if [[ "${status}" == completed ]]; then
                  test "${conclusion}" = success
                  printf '%s\n' "${run_id}"
                  return 0
                fi
              fi
              sleep 15
            done
            echo "Timed out waiting for ${event_name} Tauri release preflight for ${SOURCE_REF}." >&2
            return 1
          }

          read_metadata() {
            local run_id="$1"
            rm -rf preflight-metadata
            mkdir preflight-metadata
            gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name "${artifact_name}" --dir preflight-metadata
            test -f preflight-metadata/release-preflight.json
            jq -e --arg source_ref "${SOURCE_REF}" '
              .source_sha == $source_ref and
              (.has_release | type == "boolean") and
              (if .has_release
               then .build_result == "success" and
                    (.release_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$")) and
                    (.release_tag == ("v" + .release_version)) and
                    (.artifact_name == ("tauri-release-assets-" + .release_version))
               else .build_result == "skipped" and
                    .release_version == "" and .release_tag == "" and .artifact_name == ""
               end)
            ' preflight-metadata/release-preflight.json >/dev/null
          }

          preflight_run_id="$(wait_for_preflight push '')"
          read_metadata "${preflight_run_id}"
          preflight_has_release="$(jq -r '.has_release' preflight-metadata/release-preflight.json)"
          preflight_version="$(jq -r '.release_version' preflight-metadata/release-preflight.json)"

          SOURCE_REF="${SOURCE_REF}" pnpm run release:plan > current-release-plan.json
          jq -e --arg source_ref "${SOURCE_REF}" '
            .source_sha == $source_ref and
            (.has_release | type == "boolean") and
            (if .has_release
             then (.release_version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$")) and
                  (.release_tag == ("v" + .release_version))
             else .release_version == "" and .release_tag == ""
             end)
          ' current-release-plan.json >/dev/null
          current_has_release="$(jq -r '.has_release' current-release-plan.json)"
          current_version="$(jq -r '.release_version' current-release-plan.json)"

          if [[ "${current_has_release}" == false ]]; then
            echo "has_release=false" >> "${GITHUB_OUTPUT}"
            echo "source_ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${preflight_has_release}" != true || "${preflight_version}" != "${current_version}" ]]; then
            gh workflow run "${workflow_file}" --repo "${GITHUB_REPOSITORY}" --ref main -f "source_ref=${SOURCE_REF}"
            expected_title="Tauri Release Preflight (${SOURCE_REF})"
            preflight_run_id="$(wait_for_preflight workflow_dispatch "${expected_title}")"
            read_metadata "${preflight_run_id}"
          fi

          has_release="$(jq -r '.has_release' preflight-metadata/release-preflight.json)"
          release_tag="$(jq -r '.release_tag' preflight-metadata/release-preflight.json)"
          release_version="$(jq -r '.release_version' preflight-metadata/release-preflight.json)"
          release_artifact_name="$(jq -r '.artifact_name' preflight-metadata/release-preflight.json)"
          test "${has_release}" = true
          test "${release_version}" = "${current_version}"
          test "${release_tag}" = "v${release_version}"
          test "${release_artifact_name}" = "tauri-release-assets-${release_version}"
          echo "has_release=${has_release}" >> "${GITHUB_OUTPUT}"
          echo "preflight_run_id=${preflight_run_id}" >> "${GITHUB_OUTPUT}"
          echo "release_artifact_name=${release_artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"

  stage-preflight-release:
    needs:
      - await-preflight
    if: needs.await-preflight.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.await-preflight.outputs.source_ref }}

      - name: Download immutable preflight release assets
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.await-preflight.outputs.release_artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFLIGHT_RUN_ID: ${{ needs.await-preflight.outputs.preflight_run_id }}
          VERSION: ${{ needs.await-preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          test "${ARTIFACT_NAME}" = "tauri-release-assets-${VERSION}"
          [[ "${PREFLIGHT_RUN_ID}" =~ ^[0-9]+$ ]]
          gh run download "${PREFLIGHT_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir release-assets
          node scripts/releaseArtifacts.mjs release-assets "${VERSION}" --verify-checksums

      - name: Stage verified release assets for release checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.await-preflight.outputs.release_artifact_name }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets

  verify-upgrade-compatibility:
    needs:
      - await-preflight
      - stage-preflight-release
    uses: ./.github/workflows/tauri-release-compatibility.yml
    with:
      source_ref: ${{ needs.await-preflight.outputs.source_ref }}
      version: ${{ needs.await-preflight.outputs.release_version }}
      release_artifact_name: ${{ needs.await-preflight.outputs.release_artifact_name }}

  semantic-release:
    needs:
      - await-preflight
      - verify-upgrade-compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.semantic.outputs.release_version }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.await-preflight.outputs.source_ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create semantic private draft
        id: semantic
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs:
      - await-preflight
      - semantic-release
    if: needs.semantic-release.result == 'success'
    uses: ./.github/workflows/finalize-private-release.yml
    permissions:
      contents: write
    with:
      tag: v${{ needs.semantic-release.outputs.release_version }}
      version: ${{ needs.semantic-release.outputs.release_version }}
      release_artifact_name: ${{ needs.await-preflight.outputs.release_artifact_name }}
    secrets:
      RION_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RION_RELEASE_APP_PRIVATE_KEY }}
