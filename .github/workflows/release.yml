name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            build_target: --mac dmg zip --arm64
            primary_asset: Rion.Studio-mac.dmg
            required_assets: Rion.Studio-mac.dmg Rion.Studio-mac.zip Rion.Studio-mac.zip.blockmap latest-mac.yml
            optional_assets: Rion.Studio-mac.dmg.blockmap
          - os: windows-latest
            build_target: --win nsis --x64
            primary_asset: Rion.Studio-win.exe
            required_assets: Rion.Studio-win.exe Rion.Studio-win.exe.blockmap latest.yml
            optional_assets: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Build app
        run: pnpm exec electron-vite build

      - name: Build platform preflight artifact
        run: pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.build_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify platform preflight artifact
        shell: bash
        run: |
          set -euo pipefail

          release_dir="release/0.0.0-development"
          read -r -a required_assets <<< "${{ matrix.required_assets }}"

          for asset_name in "${required_assets[@]}"; do
            if [[ ! -f "${release_dir}/${asset_name}" ]]; then
              find release -maxdepth 2 -type f -print || true
              exit 1
            fi
          done

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            app_path="${release_dir}/mac-arm64/Rion Studio.app"
            codesign --verify --deep --strict --verbose=2 "${app_path}"

            signature_info="$(codesign --display --verbose=4 "${app_path}" 2>&1)"
            grep -Fx "Identifier=com.rionstudio.launcher" <<< "${signature_info}"
            grep -Fx "Signature=adhoc" <<< "${signature_info}"
            grep -Fx "TeamIdentifier=not set" <<< "${signature_info}"
            grep -E '^Sealed Resources version=[0-9]+' <<< "${signature_info}"

            verify_entitlement() {
              local signed_path="$1"
              local key="$2"
              local entitlements
              entitlements="$(codesign -d --entitlements :- "${signed_path}" 2>/dev/null)"
              grep -F "<key>${key}</key>" <<< "${entitlements}"
            }

            verify_entitlement "${app_path}" "com.apple.security.cs.allow-jit"
            verify_entitlement "${app_path}" "com.apple.security.cs.disable-library-validation"

            for helper_name in \
              "Rion Studio Helper.app" \
              "Rion Studio Helper (Renderer).app" \
              "Rion Studio Helper (GPU).app" \
              "Rion Studio Helper (Plugin).app"; do
              helper_path="${app_path}/Contents/Frameworks/${helper_name}"
              verify_entitlement "${helper_path}" "com.apple.security.cs.allow-jit"
              verify_entitlement "${helper_path}" "com.apple.security.cs.disable-library-validation"
            done
          fi

  semantic-release:
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.semantic.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create semantic release
        id: semantic
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-assets:
    needs: semantic-release
    if: needs.semantic-release.outputs.release_version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            build_target: --mac dmg zip --arm64
            primary_asset: Rion.Studio-mac.dmg
            required_assets: Rion.Studio-mac.dmg Rion.Studio-mac.zip Rion.Studio-mac.zip.blockmap latest-mac.yml
            optional_assets: Rion.Studio-mac.dmg.blockmap
          - os: windows-latest
            build_target: --win nsis --x64
            primary_asset: Rion.Studio-win.exe
            required_assets: Rion.Studio-win.exe Rion.Studio-win.exe.blockmap latest.yml
            optional_assets: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm version ${{ needs.semantic-release.outputs.release_version }} --no-git-tag-version

      - name: Build app
        run: pnpm exec electron-vite build

      - name: Build platform artifacts
        run: pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.build_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app_path="release/${{ needs.semantic-release.outputs.release_version }}/mac-arm64/Rion Studio.app"
          codesign --verify --deep --strict --verbose=2 "${app_path}"

          signature_info="$(codesign --display --verbose=4 "${app_path}" 2>&1)"
          grep -Fx "Identifier=com.rionstudio.launcher" <<< "${signature_info}"
          grep -Fx "Signature=adhoc" <<< "${signature_info}"
          grep -Fx "TeamIdentifier=not set" <<< "${signature_info}"
          grep -E '^Sealed Resources version=[0-9]+' <<< "${signature_info}"

          verify_entitlement() {
            local signed_path="$1"
            local key="$2"
            local entitlements
            entitlements="$(codesign -d --entitlements :- "${signed_path}" 2>/dev/null)"
            grep -F "<key>${key}</key>" <<< "${entitlements}"
          }

          verify_entitlement "${app_path}" "com.apple.security.cs.allow-jit"
          verify_entitlement "${app_path}" "com.apple.security.cs.disable-library-validation"

          for helper_name in \
            "Rion Studio Helper.app" \
            "Rion Studio Helper (Renderer).app" \
            "Rion Studio Helper (GPU).app" \
            "Rion Studio Helper (Plugin).app"; do
            helper_path="${app_path}/Contents/Frameworks/${helper_name}"
            verify_entitlement "${helper_path}" "com.apple.security.cs.allow-jit"
            verify_entitlement "${helper_path}" "com.apple.security.cs.disable-library-validation"
          done

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.semantic-release.outputs.release_version }}"
          tag="v${version}"
          release_dir="release/${version}"
          read -r -a required_asset_names <<< "${{ matrix.required_assets }}"
          read -r -a optional_asset_names <<< "${{ matrix.optional_assets }}"
          assets=()

          for asset_name in "${required_asset_names[@]}"; do
            asset_path="${release_dir}/${asset_name}"
            if [[ ! -f "${asset_path}" ]]; then
              find "${release_dir}" -maxdepth 1 -type f -print || true
              exit 1
            fi
            assets+=("${asset_path}")
          done

          for asset_name in "${optional_asset_names[@]}"; do
            asset_path="${release_dir}/${asset_name}"
            if [[ -f "${asset_path}" ]]; then
              assets+=("${asset_path}")
            fi
          done

          gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fx "${{ matrix.primary_asset }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
