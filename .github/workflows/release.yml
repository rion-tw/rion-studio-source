name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            build_target: --mac zip
            installer_name: Rion.Studio-mac.zip
          - os: windows-latest
            build_target: --win
            installer_name: Rion.Studio-win.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Build app
        run: pnpm exec electron-vite build

      - name: Build platform preflight artifact
        run: pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.build_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify platform preflight artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact="release/0.0.0-development/${{ matrix.installer_name }}"
          if [[ ! -f "${artifact}" ]]; then
            find release -maxdepth 2 -type f -print || true
            exit 1
          fi

  semantic-release:
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.semantic.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create semantic release
        id: semantic
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-assets:
    needs: semantic-release
    if: needs.semantic-release.outputs.release_version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            build_target: --mac zip
            installer_name: Rion.Studio-mac.zip
            metadata_name: latest-mac.yml
          - os: windows-latest
            build_target: --win
            installer_name: Rion.Studio-win.exe
            metadata_name: latest.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm version ${{ needs.semantic-release.outputs.release_version }} --no-git-tag-version

      - name: Build app
        run: pnpm exec electron-vite build

      - name: Build platform artifacts
        run: pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.build_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.semantic-release.outputs.release_version }}"
          tag="v${version}"
          release_dir="release/${version}"
          installer="${release_dir}/${{ matrix.installer_name }}"

          if [[ ! -f "${installer}" ]]; then
            find "${release_dir}" -maxdepth 1 -type f -print || true
            exit 1
          fi

          assets=("${installer}")
          for optional_asset in \
            "${installer}.blockmap" \
            "${release_dir}/${{ matrix.metadata_name }}"; do
            if [[ -f "${optional_asset}" ]]; then
              assets+=("${optional_asset}")
            fi
          done

          gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fx "${{ matrix.installer_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
