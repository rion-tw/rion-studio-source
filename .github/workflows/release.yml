name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Build app
        run: pnpm run build

  semantic-release:
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.semantic.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create semantic release
        id: semantic
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release-assets:
    needs: semantic-release
    if: needs.semantic-release.outputs.release_version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_target: --mac
          - os: windows-latest
            build_target: --win
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm version ${{ needs.semantic-release.outputs.release_version }} --no-git-tag-version

      - name: Build app
        run: pnpm exec electron-vite build

      - name: Build platform artifacts
        run: pnpm exec electron-builder --config electron-builder.config.mjs ${{ matrix.build_target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.semantic-release.outputs.release_version }}"
          tag="v${version}"
          release_dir="release/${version}"
          installer="${release_dir}/Rion Studio-mac.dmg"

          if [[ ! -f "${installer}" ]]; then
            ls -la "${release_dir}"
            exit 1
          fi

          assets=("${installer}")
          for optional_asset in \
            "${release_dir}/Rion Studio-mac.dmg.blockmap" \
            "${release_dir}/Rion Studio-mac.zip" \
            "${release_dir}/Rion Studio-mac.zip.blockmap" \
            "${release_dir}/latest-mac.yml"; do
            if [[ -f "${optional_asset}" ]]; then
              assets+=("${optional_asset}")
            fi
          done

          gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fx "Rion Studio-mac.dmg"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.semantic-release.outputs.release_version }}"
          tag="v${version}"
          release_dir="release/${version}"
          installer="${release_dir}/Rion Studio-win.exe"

          if [[ ! -f "${installer}" ]]; then
            ls -la "${release_dir}"
            exit 1
          fi

          assets=("${installer}")
          for optional_asset in \
            "${release_dir}/Rion Studio-win.exe.blockmap" \
            "${release_dir}/latest.yml"; do
            if [[ -f "${optional_asset}" ]]; then
              assets+=("${optional_asset}")
            fi
          done

          gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -Fx "Rion Studio-win.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
