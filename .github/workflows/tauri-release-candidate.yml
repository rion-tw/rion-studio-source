name: Tauri Release Candidate

on:
  workflow_call:
    inputs:
      tag:
        description: Existing private release tag to build, for example v2.4.0
        required: true
        type: string
      updater_base_url:
        description: HTTPS directory where the release assets will be published
        required: true
        type: string
      verified_sha:
        description: CI SHA that must match the requested release tag
        required: true
        type: string
    outputs:
      release_artifact_name:
        description: Name of the complete verified release artifact
        value: ${{ jobs.build.outputs.release_artifact_name }}
    secrets:
      RION_STUDIO_UPDATER_PUBLIC_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private tag to build, for example v2.4.0
        required: true
        type: string
      updater_base_url:
        description: HTTPS directory where the release assets will be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout requested release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Resolve immutable candidate source
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERIFIED_SHA: ${{ inputs.verified_sha || '' }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          source_ref="$(git rev-parse HEAD)"
          [[ "${source_ref}" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${VERIFIED_SHA}" ]]; then
            [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$ ]]
            test "${source_ref}" = "${VERIFIED_SHA}"
          fi
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve
    uses: ./.github/workflows/tauri-release-build.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      version: ${{ needs.resolve.outputs.version }}
      updater_base_url: ${{ inputs.updater_base_url }}
      run_quality: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  compatibility:
    needs:
      - resolve
      - build
    uses: ./.github/workflows/tauri-release-compatibility.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      version: ${{ needs.build.outputs.version }}
      release_artifact_name: ${{ needs.build.outputs.release_artifact_name }}
