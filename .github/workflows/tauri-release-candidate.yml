name: Tauri Release Candidate

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      updater_base_url:
        required: true
        type: string
      verified_sha:
        required: true
        type: string
    outputs:
      release_artifact_name:
        description: Name of the complete verified release artifact
        value: ${{ jobs.manifest.outputs.release_artifact_name }}
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      RION_STUDIO_UPDATER_PUBLIC_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      WINDOWS_CERTIFICATE:
        required: true
      WINDOWS_CERTIFICATE_PASSWORD:
        required: true
      WINDOWS_TIMESTAMP_URL:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private tag to build, for example v2.4.0
        required: true
        type: string
      updater_base_url:
        description: HTTPS directory where the release assets will be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Validate immutable release inputs
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          UPDATER_BASE_URL: ${{ inputs.updater_base_url }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is required for updater-signed release artifacts."
              exit 1
            fi
          }
          require_secret RION_STUDIO_UPDATER_PUBLIC_KEY
          require_secret TAURI_SIGNING_PRIVATE_KEY
          require_secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          require_secret APPLE_CERTIFICATE
          require_secret APPLE_CERTIFICATE_PASSWORD
          require_secret APPLE_ID
          require_secret APPLE_PASSWORD
          require_secret APPLE_TEAM_ID
          require_secret WINDOWS_CERTIFICATE
          require_secret WINDOWS_CERTIFICATE_PASSWORD
          require_secret WINDOWS_TIMESTAMP_URL
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "${UPDATER_BASE_URL}" == https://* ]]
          [[ "${WINDOWS_TIMESTAMP_URL}" == https://* ]]
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          if [[ -n "${VERIFIED_SHA}" ]]; then
            [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
          fi
          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs:
      - validate
      - quality
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            name: windows-x64
            bundles: nsis
    env:
      RION_STUDIO_UPDATER_ENDPOINT: https://github.com/rion-tw/rion-studio/releases/latest/download/latest.json
      RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          shared-key: platform-tauri-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm run release:version -- ${{ needs.validate.outputs.version }}

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/rion-apple-certificate.p12"
          keychain_path="${RUNNER_TEMP}/rion-release.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'rm -f "${certificate_path}"' EXIT
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -t 3600 -u "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          signing_identity="$(
            security find-identity -v -p codesigning "${keychain_path}" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -n 1
          )"
          test -n "${signing_identity}"
          echo "APPLE_SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $encodedCertificatePath = Join-Path $env:RUNNER_TEMP "rion-windows-certificate.txt"
          $certificatePath = Join-Path $env:RUNNER_TEMP "rion-windows-certificate.pfx"
          try {
            Set-Content -Path $encodedCertificatePath -Value $env:WINDOWS_CERTIFICATE -NoNewline
            certutil -decode $encodedCertificatePath $certificatePath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Unable to decode the Windows code-signing certificate." }
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $importedCertificates = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $certificate = $importedCertificates | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
              throw "The Windows code-signing certificate or private key is unavailable."
            }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item $encodedCertificatePath -Force -ErrorAction SilentlyContinue
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Build signed macOS release candidate
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run dist -- --bundles ${{ matrix.bundles }}

      - name: Build signed Windows release candidate
        if: runner.os == 'Windows'
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: pnpm run dist -- --bundles ${{ matrix.bundles }}

      - name: Verify packaged macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="target/release/bundle/macos/Rion Studio.app"
          dmg_path="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign_details="$(codesign --display --verbose=4 "${app_path}" 2>&1)"
          ! grep -F "Signature=adhoc" <<< "${codesign_details}"
          grep -F "TeamIdentifier=${APPLE_TEAM_ID}" <<< "${codesign_details}"
          spctl --assess --type execute --verbose=4 "${app_path}"
          xcrun stapler validate "${app_path}"
          xcrun stapler validate "${dmg_path}"
          test -s "${app_path}.tar.gz"
          test -s "${app_path}.tar.gz.sig"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = (Resolve-Path "target/release/rion-tauri.exe").Path
          $bytes = [System.IO.File]::ReadAllBytes($executable)
          if ($bytes.Length -lt 64) { throw "Windows executable is too small to contain a PE header." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 94 -gt $bytes.Length) { throw "Windows executable has an invalid PE header offset." }
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Windows executable is missing the PE signature." }
          $optionalHeaderOffset = $peOffset + 24
          $optionalHeaderMagic = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset)
          if ($optionalHeaderMagic -notin @(0x010b, 0x020b)) { throw "Windows executable has an unsupported PE optional header." }
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset + 68)
          if ($subsystem -ne 2) { throw "Windows executable must use IMAGE_SUBSYSTEM_WINDOWS_GUI; found subsystem $subsystem." }
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer is missing." }
          $expectedThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          foreach ($signedPath in @($executable, $installer.FullName)) {
            $signature = Get-AuthenticodeSignature $signedPath
            if ($signature.Status -ne "Valid") {
              throw "Authenticode signature is not valid for $signedPath: $($signature.Status)"
            }
            $actualThumbprint = $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant()
            if ($actualThumbprint -ne $expectedThumbprint) {
              throw "Authenticode signer does not match the imported release certificate for $signedPath."
            }
          }
          if (-not (Test-Path "$($installer.FullName).sig" -PathType Leaf)) { throw "Updater signature is missing." }

      - name: Normalize release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            cp "$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)" candidate/Rion.Studio-mac.dmg
            cp "target/release/bundle/macos/Rion Studio.app.tar.gz" candidate/Rion.Studio-mac.app.tar.gz
            cp "target/release/bundle/macos/Rion Studio.app.tar.gz.sig" candidate/Rion.Studio-mac.app.tar.gz.sig
          else
            installer="$(find target/release/bundle/nsis -maxdepth 1 -name '*.exe' -print -quit)"
            cp "${installer}" candidate/Rion.Studio-win.exe
            cp "${installer}.sig" candidate/Rion.Studio-win.exe.sig
          fi

      - name: Upload verified platform candidate
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.name }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: candidate

  manifest:
    needs:
      - validate
      - build
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download verified candidates
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-*-${{ needs.validate.outputs.version }}
          path: candidate
          merge-multiple: true

      - name: Create updater-signed and legacy manifests
        shell: bash
        env:
          UPDATER_BASE_URL: ${{ inputs.updater_base_url }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/createTauriUpdaterManifest.mjs \
            --version "${VERSION}" \
            --base-url "${UPDATER_BASE_URL}" \
            --mac-archive candidate/Rion.Studio-mac.app.tar.gz \
            --windows-installer candidate/Rion.Studio-win.exe \
            --output candidate/latest.json
          node scripts/createLegacyUpdateManifests.mjs \
            --version "${VERSION}" \
            --mac-dmg candidate/Rion.Studio-mac.dmg \
            --windows-installer candidate/Rion.Studio-win.exe \
            --output-directory candidate
          node scripts/releaseArtifacts.mjs candidate "${VERSION}" --write-checksums

      - name: Record verified release artifact
        id: artifact
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: echo "name=tauri-release-assets-${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          retention-days: 14
          path: candidate

  upgrade-compatibility:
    needs:
      - validate
      - manifest
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.manifest.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download complete signed candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.manifest.outputs.release_artifact_name }}
          path: candidate

      - name: Verify dual updater manifests and immutable checksums
        run: node scripts/releaseArtifacts.mjs candidate ${{ needs.validate.outputs.version }} --verify-checksums

      - name: Verify macOS manual replacement preserves shared data
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount_path="${RUNNER_TEMP}/rion-dmg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          applications_path="${RUNNER_TEMP}/rion-applications-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          user_data_path="${RUNNER_TEMP}/rion-user-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${mount_path}" "${applications_path}/Rion Studio.app/Contents" "${user_data_path}/roles/legacy/browser"
          printf 'legacy-app' > "${applications_path}/Rion Studio.app/Contents/legacy-marker"
          printf 'preserve-browser-data' > "${user_data_path}/roles/legacy/browser/data.marker"
          hdiutil attach candidate/Rion.Studio-mac.dmg -nobrowse -readonly -mountpoint "${mount_path}"
          trap 'hdiutil detach "${mount_path}" >/dev/null' EXIT
          test -d "${mount_path}/Rion Studio.app"
          mv "${applications_path}/Rion Studio.app" "${applications_path}/Rion Studio.previous.app"
          ditto "${mount_path}/Rion Studio.app" "${applications_path}/Rion Studio.app"
          test ! -e "${applications_path}/Rion Studio.app/Contents/legacy-marker"
          test -f "${user_data_path}/roles/legacy/browser/data.marker"
          codesign --verify --deep --strict "${applications_path}/Rion Studio.app"

      - name: Verify Windows clean install and legacy in-place upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)][string] $FilePath,
              [Parameter(Mandatory = $true)][string[]] $ArgumentList,
              [Parameter(Mandatory = $true)][string] $Stage,
              [int] $TimeoutSeconds = 120
            )

            Write-Host "${Stage}: starting"
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            try {
              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                try { $process.Kill($true) } catch { Write-Warning "${Stage}: failed to terminate timed-out process tree: $_" }
                throw "${Stage} timed out after ${TimeoutSeconds} seconds."
              }
              if ($process.ExitCode -ne 0) { throw "${Stage} failed with exit code $($process.ExitCode)." }
            } finally {
              $process.Dispose()
            }
            Write-Host "${Stage}: completed"
          }

          $root = Join-Path $env:RUNNER_TEMP "rion-upgrade-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cleanPath = Join-Path $root "clean-install"
          $installPath = Join-Path $root "custom-install"
          $userData = Join-Path ([Environment]::GetFolderPath("ApplicationData")) "Rion Studio"
          $installer = (Resolve-Path candidate/Rion.Studio-win.exe).Path
          if (Test-Path $userData) { throw "The fresh Windows runner already contains Rion Studio user data." }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          Invoke-BoundedProcess -FilePath $installer -ArgumentList @("/S", "/D=$cleanPath") -Stage "Clean NSIS installation"
          if (-not (Test-Path (Join-Path $cleanPath "rion-tauri.exe") -PathType Leaf)) { throw "Clean NSIS installation did not create the executable." }
          $cleanUninstaller = Get-ChildItem $cleanPath -Filter "*uninstall*.exe" | Select-Object -First 1
          if ($null -eq $cleanUninstaller) { throw "Clean installation did not create an uninstaller." }
          Invoke-BoundedProcess -FilePath $cleanUninstaller.FullName -ArgumentList "/S" -Stage "Clean NSIS uninstallation"

          New-Item -ItemType Directory -Force -Path (Join-Path $installPath "resources/native"), (Join-Path $userData "roles/legacy/browser") | Out-Null
          Set-Content -NoNewline -Path (Join-Path $installPath "resources/app.asar") -Value "legacy-runtime"
          Set-Content -NoNewline -Path (Join-Path $installPath "resources/native/rion-webview2.node") -Value "legacy-helper"
          Set-Content -NoNewline -Path (Join-Path $installPath "Uninstall Rion Studio.exe") -Value "legacy-uninstaller"
          Set-Content -NoNewline -Path (Join-Path $userData "roles/legacy/browser/data.marker") -Value "preserve-browser-data"
          Set-Content -NoNewline -Path (Join-Path $userData "games.json") -Value '{"games":[]}'
          Set-Content -NoNewline -Path (Join-Path $userData "roles.json") -Value '{"roles":[]}'
          Set-Content -NoNewline -Path (Join-Path $userData "macros.json") -Value '{"macros":[]}'
          Set-Content -NoNewline -Path (Join-Path $userData "launch-workspaces.json") -Value '{"schemaVersion":7,"workspaces":[]}'

          # Start-Process -Wait waits for the whole descendant tree. --force-run launches
          # the app as an installer descendant, so wait only for the installer process.
          Invoke-BoundedProcess -FilePath $installer -ArgumentList @("/S", "--updated", "--force-run", "/D=$installPath") -Stage "Legacy-compatible NSIS installation"
          $installedExecutable = Join-Path $installPath "rion-tauri.exe"
          if (-not (Test-Path $installedExecutable -PathType Leaf)) { throw "The Tauri executable was not installed to the custom path." }
          if (Test-Path (Join-Path $installPath "resources/app.asar")) { throw "Legacy app.asar residue was not removed." }
          if (Test-Path (Join-Path $installPath "Uninstall Rion Studio.exe")) { throw "The legacy uninstaller was not removed." }

          $launched = $null
          for ($attempt = 0; $attempt -lt 30 -and $null -eq $launched; $attempt += 1) {
            Start-Sleep -Seconds 1
            $launched = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $installedExecutable } | Select-Object -First 1
          }
          if ($null -eq $launched) { throw "--force-run did not launch the installed Tauri executable." }
          for ($attempt = 0; $attempt -lt 30 -and -not (Test-Path (Join-Path $userData "rion-studio.sqlite3")); $attempt += 1) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path (Join-Path $userData "rion-studio.sqlite3") -PathType Leaf)) { throw "The shared data migration did not create the SQLite store." }
          Stop-Process -Id $launched.ProcessId -Force

          $uninstaller = Get-ChildItem $installPath -Filter "*uninstall*.exe" | Select-Object -First 1
          if ($null -eq $uninstaller) { throw "The upgraded installation did not create an uninstaller." }
          Invoke-BoundedProcess -FilePath $uninstaller.FullName -ArgumentList "/S" -Stage "Upgraded NSIS uninstallation"
          if (-not (Test-Path (Join-Path $userData "roles/legacy/browser/data.marker") -PathType Leaf)) { throw "Uninstallation removed role browser data." }
          if (-not (Test-Path (Join-Path $userData "rion-studio.sqlite3") -PathType Leaf)) { throw "Uninstallation removed the SQLite store." }

  release-ready:
    needs:
      - validate
      - quality
      - build
      - manifest
      - upgrade-compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every release-specific verification
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          UPGRADE_RESULT: ${{ needs.upgrade-compatibility.result }}
        run: |
          set -euo pipefail
          test "${VALIDATE_RESULT}" = "success"
          [[ "${QUALITY_RESULT}" == "success" || "${QUALITY_RESULT}" == "skipped" ]]
          test "${BUILD_RESULT}" = "success"
          test "${MANIFEST_RESULT}" = "success"
          test "${UPGRADE_RESULT}" = "success"
