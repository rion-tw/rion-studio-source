name: Tauri Signed Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private tag to build (for example v2.4.0)
        required: true
        type: string
      updater_base_url:
        description: HTTPS directory where the candidate assets will be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Validate immutable release inputs
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          UPDATER_BASE_URL: ${{ inputs.updater_base_url }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "${UPDATER_BASE_URL}" == https://* ]]
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}"
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            name: windows-x64
            bundles: nsis
    env:
      RION_STUDIO_UPDATER_ENDPOINT: https://github.com/rion-tw/rion-studio/releases/latest/download/latest.json
      RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RION_STUDIO_WINDOWS_TIMESTAMP_URL: ${{ vars.RION_STUDIO_WINDOWS_TIMESTAMP_URL }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          shared-key: tauri-signed-candidate-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify system-only product boundary
        run: pnpm run verify:system-only

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${APPLE_CERTIFICATE}"
          test -n "${APPLE_CERTIFICATE_PASSWORD}"
          test -n "${KEYCHAIN_PASSWORD}"
          certificate_path="${RUNNER_TEMP}/rion-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/rion-build.keychain-db"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}" | grep -F "${APPLE_SIGNING_IDENTITY}"

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { throw "WINDOWS_CERTIFICATE is required." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "WINDOWS_CERTIFICATE_PASSWORD is required." }
          $certificatePath = Join-Path $env:RUNNER_TEMP "rion-authenticode.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) { throw "The Authenticode certificate could not be imported." }
          "RION_STUDIO_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest macOS System WebView input
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:native:macos
          pnpm run test:native:macos
          pnpm run test:native:system-input
          pnpm run test:native:runtime-restore
          pnpm run test:native:file-operations
          echo "RION_STUDIO_MACOS_INPUT_ATTESTED_MAJOR=$(sw_vers -productVersion | cut -d. -f1)" >> "${GITHUB_ENV}"

      - name: Build and verify Windows System WebView adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm run build:native:windows
          pnpm run test:native:windows
          pnpm run test:native:system-input
          pnpm run test:native:runtime-restore
          pnpm run test:native:file-operations
          "RION_STUDIO_WINDOWS_INPUT_ATTESTED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed Tauri candidate
        run: pnpm run build:tauri:release -- --bundles ${{ matrix.bundles }}

      - name: Verify packaged macOS System WebView input
        if: runner.os == 'macOS'
        run: pnpm run test:native:system-input -- --executable "target/release/bundle/macos/Rion Studio Preview.app/Contents/MacOS/rion-tauri" --require-compiled-attestation

      - name: Verify packaged macOS runtime restore
        if: runner.os == 'macOS'
        run: pnpm run test:native:runtime-restore -- --executable "target/release/bundle/macos/Rion Studio Preview.app/Contents/MacOS/rion-tauri"

      - name: Verify packaged macOS file operations
        if: runner.os == 'macOS'
        run: pnpm run test:native:file-operations -- --executable "target/release/bundle/macos/Rion Studio Preview.app/Contents/MacOS/rion-tauri"

      - name: Verify packaged Windows System WebView input
        if: runner.os == 'Windows'
        run: pnpm run test:native:system-input -- --executable target/release/rion-tauri.exe --require-compiled-attestation

      - name: Verify packaged Windows runtime restore
        if: runner.os == 'Windows'
        run: pnpm run test:native:runtime-restore -- --executable target/release/rion-tauri.exe

      - name: Verify packaged Windows file operations
        if: runner.os == 'Windows'
        run: pnpm run test:native:file-operations -- --executable target/release/rion-tauri.exe

      - name: Verify notarized macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="target/release/bundle/macos/Rion Studio Preview.app"
          dmg_path="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "${dmg_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"
          xcrun stapler validate "${dmg_path}"
          test -s "${app_path}.tar.gz"
          test -s "${app_path}.tar.gz.sig"

      - name: Verify signed Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer is missing." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Authenticode verification failed: $($signature.Status)" }
          if (-not (Test-Path "$($installer.FullName).sig" -PathType Leaf)) { throw "Updater signature is missing." }

      - name: Upload signed platform candidate
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.name }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig

  manifest:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download signed candidates
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-*-${{ needs.validate.outputs.version }}
          path: candidate
          merge-multiple: true

      - name: Create static updater manifest
        shell: bash
        env:
          UPDATER_BASE_URL: ${{ inputs.updater_base_url }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mac_archive="$(find candidate -type f -name '*.app.tar.gz' -print -quit)"
          windows_installer="$(find candidate -type f -name '*.exe' -print -quit)"
          test -n "${mac_archive}"
          test -n "${windows_installer}"
          node scripts/createTauriUpdaterManifest.mjs \
            --version "${VERSION}" \
            --base-url "${UPDATER_BASE_URL}" \
            --mac-archive "${mac_archive}" \
            --windows-installer "${windows_installer}" \
            --output candidate/latest.json

      - name: Upload verified updater manifest
        uses: actions/upload-artifact@v7
        with:
          name: tauri-updater-manifest-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: candidate/latest.json
