name: Tauri Release Candidate

on:
  workflow_call:
    inputs:
      tag:
        description: Existing private release tag to build, for example v2.4.0
        required: true
        type: string
      updater_base_url:
        description: HTTPS directory where the release assets will be published
        required: true
        type: string
      verified_sha:
        description: CI SHA that must match the requested release tag
        required: true
        type: string
    outputs:
      release_artifact_name:
        description: Name of the complete verified release artifact
        value: ${{ jobs.build.outputs.release_artifact_name }}
    secrets:
      RION_STUDIO_UPDATER_PUBLIC_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private tag to build, for example v2.4.0
        required: true
        type: string
      updater_base_url:
        description: HTTPS directory where the release assets will be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/tauri-release-build.yml
    with:
      tag: ${{ inputs.tag }}
      updater_base_url: ${{ inputs.updater_base_url }}
      verified_sha: ${{ inputs.verified_sha || '' }}
      run_quality: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  compatibility:
    needs: build
    uses: ./.github/workflows/tauri-release-compatibility.yml
    with:
      tag: ${{ inputs.tag }}
      version: ${{ needs.build.outputs.version }}
      release_artifact_name: ${{ needs.build.outputs.release_artifact_name }}
