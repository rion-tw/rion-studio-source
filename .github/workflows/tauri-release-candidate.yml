name: Tauri Release Candidate

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      updater_base_url:
        required: true
        type: string
      verified_sha:
        required: true
        type: string
    secrets:
      RION_STUDIO_UPDATER_PUBLIC_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing private tag to build, for example v2.4.0
        required: true
        type: string
      updater_base_url:
        description: HTTPS directory where the release assets will be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Validate immutable release inputs
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          UPDATER_BASE_URL: ${{ inputs.updater_base_url }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is required for updater-signed release artifacts."
              exit 1
            fi
          }
          require_secret RION_STUDIO_UPDATER_PUBLIC_KEY
          require_secret TAURI_SIGNING_PRIVATE_KEY
          require_secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "${UPDATER_BASE_URL}" == https://* ]]
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          if [[ -n "${VERIFIED_SHA}" ]]; then
            [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
          fi
          echo "version=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs:
      - validate
      - quality
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            name: windows-x64
            bundles: nsis
    env:
      RION_STUDIO_UPDATER_ENDPOINT: https://github.com/rion-tw/rion-studio/releases/latest/download/latest.json
      RION_STUDIO_UPDATER_PUBLIC_KEY: ${{ secrets.RION_STUDIO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
          shared-key: tauri-release-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: pnpm run release:version -- ${{ needs.validate.outputs.version }}

      - name: Build Tauri release candidate
        run: pnpm run dist -- --bundles ${{ matrix.bundles }}

      - name: Verify packaged macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="target/release/bundle/macos/Rion Studio.app"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign_details="$(codesign --display --verbose=4 "${app_path}" 2>&1)"
          grep -F "Signature=adhoc" <<< "${codesign_details}"
          grep -F "TeamIdentifier=not set" <<< "${codesign_details}"
          test -s "${app_path}.tar.gz"
          test -s "${app_path}.tar.gz.sig"

      - name: Verify packaged Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer is missing." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") { throw "Windows candidate must remain unsigned like the legacy release." }
          if (-not (Test-Path "$($installer.FullName).sig" -PathType Leaf)) { throw "Updater signature is missing." }

      - name: Normalize release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            cp "$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)" candidate/Rion.Studio-mac.dmg
            cp "target/release/bundle/macos/Rion Studio.app.tar.gz" candidate/Rion.Studio-mac.app.tar.gz
            cp "target/release/bundle/macos/Rion Studio.app.tar.gz.sig" candidate/Rion.Studio-mac.app.tar.gz.sig
          else
            installer="$(find target/release/bundle/nsis -maxdepth 1 -name '*.exe' -print -quit)"
            cp "${installer}" candidate/Rion.Studio-win.exe
            cp "${installer}.sig" candidate/Rion.Studio-win.exe.sig
          fi

      - name: Upload verified platform candidate
        uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.name }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: candidate

  manifest:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download verified candidates
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-*-${{ needs.validate.outputs.version }}
          path: candidate
          merge-multiple: true

      - name: Create updater-signed and legacy manifests
        shell: bash
        env:
          UPDATER_BASE_URL: ${{ inputs.updater_base_url }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/createTauriUpdaterManifest.mjs \
            --version "${VERSION}" \
            --base-url "${UPDATER_BASE_URL}" \
            --mac-archive candidate/Rion.Studio-mac.app.tar.gz \
            --windows-installer candidate/Rion.Studio-win.exe \
            --output candidate/latest.json
          node scripts/createLegacyUpdateManifests.mjs \
            --version "${VERSION}" \
            --mac-dmg candidate/Rion.Studio-mac.dmg \
            --windows-installer candidate/Rion.Studio-win.exe \
            --output-directory candidate
          node scripts/releaseArtifacts.mjs candidate "${VERSION}" --write-checksums

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: tauri-release-assets-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: candidate

  upgrade-compatibility:
    needs:
      - validate
      - manifest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download complete signed candidate
        uses: actions/download-artifact@v8
        with:
          name: tauri-release-assets-${{ needs.validate.outputs.version }}
          path: candidate

      - name: Verify dual updater manifests and immutable checksums
        run: node scripts/releaseArtifacts.mjs candidate ${{ needs.validate.outputs.version }} --verify-checksums

      - name: Verify macOS manual replacement preserves shared data
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount_path="${RUNNER_TEMP}/rion-dmg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          applications_path="${RUNNER_TEMP}/rion-applications-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          user_data_path="${RUNNER_TEMP}/rion-user-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${mount_path}" "${applications_path}/Rion Studio.app/Contents" "${user_data_path}/roles/legacy/browser"
          printf 'legacy-app' > "${applications_path}/Rion Studio.app/Contents/legacy-marker"
          printf 'preserve-browser-data' > "${user_data_path}/roles/legacy/browser/data.marker"
          hdiutil attach candidate/Rion.Studio-mac.dmg -nobrowse -readonly -mountpoint "${mount_path}"
          trap 'hdiutil detach "${mount_path}" >/dev/null' EXIT
          test -d "${mount_path}/Rion Studio.app"
          mv "${applications_path}/Rion Studio.app" "${applications_path}/Rion Studio.previous.app"
          ditto "${mount_path}/Rion Studio.app" "${applications_path}/Rion Studio.app"
          test ! -e "${applications_path}/Rion Studio.app/Contents/legacy-marker"
          test -f "${user_data_path}/roles/legacy/browser/data.marker"
          codesign --verify --deep --strict "${applications_path}/Rion Studio.app"

      - name: Verify Windows clean install and legacy in-place upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "rion-upgrade-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cleanPath = Join-Path $root "clean-install"
          $installPath = Join-Path $root "custom-install"
          $userData = Join-Path $root "shared-user-data"
          $installer = (Resolve-Path candidate/Rion.Studio-win.exe).Path
          New-Item -ItemType Directory -Force -Path $root, $userData | Out-Null

          $clean = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$cleanPath") -Wait -PassThru
          if ($clean.ExitCode -ne 0 -or -not (Test-Path (Join-Path $cleanPath "rion-tauri.exe") -PathType Leaf)) { throw "Clean NSIS installation failed." }
          $cleanUninstaller = Get-ChildItem $cleanPath -Filter "*uninstall*.exe" | Select-Object -First 1
          if ($null -eq $cleanUninstaller) { throw "Clean installation did not create an uninstaller." }
          $cleanRemoval = Start-Process -FilePath $cleanUninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($cleanRemoval.ExitCode -ne 0) { throw "Clean NSIS uninstallation failed." }

          New-Item -ItemType Directory -Force -Path (Join-Path $installPath "resources/native"), (Join-Path $userData "roles/legacy/browser") | Out-Null
          Set-Content -NoNewline -Path (Join-Path $installPath "resources/app.asar") -Value "legacy-runtime"
          Set-Content -NoNewline -Path (Join-Path $installPath "resources/native/rion-webview2.node") -Value "legacy-helper"
          Set-Content -NoNewline -Path (Join-Path $installPath "Uninstall Rion Studio.exe") -Value "legacy-uninstaller"
          Set-Content -NoNewline -Path (Join-Path $userData "roles/legacy/browser/data.marker") -Value "preserve-browser-data"
          Set-Content -NoNewline -Path (Join-Path $userData "games.json") -Value '{"games":[]}'
          Set-Content -NoNewline -Path (Join-Path $userData "roles.json") -Value '{"roles":[]}'
          Set-Content -NoNewline -Path (Join-Path $userData "macros.json") -Value '{"macros":[]}'
          Set-Content -NoNewline -Path (Join-Path $userData "launch-workspaces.json") -Value '{"schemaVersion":7,"workspaces":[]}'
          $env:RION_STUDIO_USER_DATA_DIR = $userData

          $upgrade = Start-Process -FilePath $installer -ArgumentList @("/S", "--updated", "--force-run", "/D=$installPath") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Legacy-compatible NSIS installation failed." }
          $installedExecutable = Join-Path $installPath "rion-tauri.exe"
          if (-not (Test-Path $installedExecutable -PathType Leaf)) { throw "The Tauri executable was not installed to the custom path." }
          if (Test-Path (Join-Path $installPath "resources/app.asar")) { throw "Legacy app.asar residue was not removed." }
          if (Test-Path (Join-Path $installPath "Uninstall Rion Studio.exe")) { throw "The legacy uninstaller was not removed." }

          $launched = $null
          for ($attempt = 0; $attempt -lt 30 -and $null -eq $launched; $attempt += 1) {
            Start-Sleep -Seconds 1
            $launched = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $installedExecutable } | Select-Object -First 1
          }
          if ($null -eq $launched) { throw "--force-run did not launch the installed Tauri executable." }
          for ($attempt = 0; $attempt -lt 30 -and -not (Test-Path (Join-Path $userData "rion-studio.sqlite3")); $attempt += 1) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path (Join-Path $userData "rion-studio.sqlite3") -PathType Leaf)) { throw "The shared data migration did not create the SQLite store." }
          Stop-Process -Id $launched.ProcessId -Force

          $uninstaller = Get-ChildItem $installPath -Filter "*uninstall*.exe" | Select-Object -First 1
          if ($null -eq $uninstaller) { throw "The upgraded installation did not create an uninstaller." }
          $removal = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($removal.ExitCode -ne 0) { throw "Upgraded NSIS uninstallation failed." }
          if (-not (Test-Path (Join-Path $userData "roles/legacy/browser/data.marker") -PathType Leaf)) { throw "Uninstallation removed role browser data." }
          if (-not (Test-Path (Join-Path $userData "rion-studio.sqlite3") -PathType Leaf)) { throw "Uninstallation removed the SQLite store." }
