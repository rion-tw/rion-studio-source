[workspace]
members = [
  "crates/rion-appkit",
  "crates/rion-core",
  "crates/rion-node",
  "crates/rion-platform",
  "crates/rion-updater",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "UNLICENSED"

[workspace.dependencies]
base64 = "0.23.1"
aes = "0.9.3"
aes-gcm = "0.11.1"
cbc = { version = "0.2.1", features = ["block-padding", "alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
crossbeam-channel = "0.5.17"
fs2 = "0.4.3"
getrandom = "0.4.3"
hex = "0.4.3"
napi = { version = "=3.12.2", default-features = false, features = ["napi8", "async", "serde-json", "tokio_rt", "dyn-symbols"] }
napi-build = "2.4.1"
napi-derive = "=3.6.3"
minisign-verify = "0.2.5"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
semver = "1.0.28"
pbkdf2 = "0.13.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
rusty-leveldb = "4.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha1 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

[profile.test]
debug = 1
