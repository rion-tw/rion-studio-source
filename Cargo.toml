[workspace]
members = [
  "crates/rion-core",
  "crates/rion-platform",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
base64 = "0.22.1"
aes = "0.8.4"
aes-gcm = "0.10.3"
cbc = { version = "0.1.2", features = ["block-padding", "alloc"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
crossbeam-channel = "0.5.15"
futures-util = "0.3.31"
fs2 = "0.4.3"
regex = "1.12.2"
pbkdf2 = "0.12.2"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled-full", "serde_json"] }
rusty-leveldb = "4.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sha1 = "0.10.6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = "=2.11.5"
tauri-build = "=2.6.3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28.0"
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
url = "2.5.7"
uuid = { version = "1.20.0", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1

[profile.test]
debug = 1
