[package]
name = "rion-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "rion-node-native-integration-fixture"
path = "src/bin/native_integration_fixture.rs"
required-features = ["native-integration-fixture"]
test = false
bench = false

[dependencies]
napi.workspace = true
napi-derive.workspace = true
rion-appkit = { path = "../rion-appkit" }
rion-core = { path = "../rion-core", default-features = false }
rion-platform = { path = "../rion-platform", default-features = false }
rion-updater = { path = "../rion-updater" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build.workspace = true

[features]
default = []
desktop-e2e = ["rion-appkit/desktop-e2e"]
native-integration-fixture = []
