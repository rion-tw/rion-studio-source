[package]
name = "rion-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "rion_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
cc = "=1.3.0"
embed-resource = "=3.0.11"
tauri-build.workspace = true

[dependencies]
rion-core = { path = "../crates/rion-core" }
rion-platform = { path = "../crates/rion-platform" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { workspace = true, features = ["macos-private-api", "unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tokio.workspace = true
uuid.workspace = true
url.workspace = true
tauri-plugin-updater = "=2.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "=0.3.1"
muda = "=0.19.3"
objc2 = "=0.6.4"
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebViewConfiguration"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.24.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
