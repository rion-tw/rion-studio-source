[package]
name = "rion-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "rion_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
cc = "=1.4.5"
embed-resource = "=3.0.11"
tauri-build.workspace = true

[dependencies]
hex.workspace = true
rion-appkit = { path = "../crates/rion-appkit" }
rion-core = { path = "../crates/rion-core", features = ["system-webview-probe"] }
rion-platform = { path = "../crates/rion-platform", features = ["system-webview-probe"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { workspace = true, features = ["macos-private-api", "unstable", "tray-icon"] }
tauri-plugin-dialog = "2.7.3"
tokio.workspace = true
uuid.workspace = true
url.workspace = true
tauri-plugin-updater = "=2.11.0"
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
muda = "=0.19.3"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSDate", "NSSet", "NSString"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2"] }

[target.'cfg(windows)'.dependencies]
# Tauri 2.11 / Wry 0.55 expose these COM and Win32 types directly. Keep their
# compatible lines until upstream migrates its public types.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop-e2e = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
  "rion-appkit/desktop-e2e",
]
