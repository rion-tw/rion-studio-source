<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      (() => {
        try {
          const themeKey = "rion-studio-theme";
          const storedTheme = localStorage.getItem(themeKey);
          const resolvedTheme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="status" aria-label="Loading Rion Studio" aria-live="polite" aria-busy="true" data-startup-loading>
        <div class="boot-fallback-content">
          <img class="boot-fallback-icon" src="/src/assets/app-icon.png" alt="" aria-hidden="true" draggable="false" />
          <div class="boot-fallback-spinner" aria-hidden="true"></div>
          <span class="boot-fallback-label" data-startup-loading-label>Loading Rion Studio</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/startupFallback.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
