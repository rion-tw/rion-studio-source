<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title></title>
    <script>
      (() => {
        try {
          const themeKey = "rion-studio-theme";
          const storedTheme = localStorage.getItem(themeKey);
          const resolvedTheme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <style>
      :root {
        --boot-background: 210 25% 95%;
        --boot-foreground: 222 15% 10%;
        --boot-muted: 222 8% 39%;
        --boot-panel: 0 0% 100% / 0.42;
        --boot-border: 0 0% 100% / 0.38;
        --boot-highlight: 0 0% 100% / 0.2;
        --boot-shadow: 222 32% 14% / 0.08;
        --boot-error: 0 64% 48%;
      }

      :root[data-theme="dark"] {
        --boot-background: 0 0% 4%;
        --boot-foreground: 0 0% 90%;
        --boot-muted: 0 0% 58%;
        --boot-panel: 0 0% 100% / 0.072;
        --boot-border: 0 0% 100% / 0.09;
        --boot-highlight: 0 0% 100% / 0.03;
        --boot-shadow: 0 0% 0% / 0.14;
        --boot-error: 0 72% 68%;
      }

      * { box-sizing: border-box; }

      html,
      body {
        min-width: 960px;
        min-height: 640px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: hsl(var(--boot-foreground));
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-variant-numeric: lining-nums tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100vh;
      }

      .boot-fallback {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: linear-gradient(
          180deg,
          hsl(var(--boot-background) / 0.58) 0%,
          hsl(var(--boot-background) / 0.36) 100%
        );
        box-sizing: border-box;
        -webkit-app-region: drag;
      }

      .boot-fallback-content {
        display: grid;
        width: min(420px, calc(100vw - 48px));
        justify-items: center;
        gap: 20px;
        text-align: center;
      }

      .boot-fallback-error {
        display: grid;
        width: 100%;
        justify-items: center;
        gap: 16px;
        overflow: hidden;
        border: 1px solid hsl(var(--boot-border));
        border-radius: 8px;
        padding: 20px;
        background:
          linear-gradient(180deg, hsl(var(--boot-highlight)) 0%, transparent 54%),
          hsl(var(--boot-panel));
        box-shadow:
          inset 0 1px 0 hsl(var(--boot-highlight)),
          0 6px 18px hsl(var(--boot-shadow));
        -webkit-backdrop-filter: blur(24px) saturate(1.16);
        backdrop-filter: blur(24px) saturate(1.16);
        -webkit-app-region: no-drag;
      }

      .boot-fallback-error h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        line-height: 20px;
      }

      .boot-fallback-error p {
        margin: 0;
        color: hsl(var(--boot-muted));
        font-size: 12px;
        line-height: 20px;
        overflow-wrap: anywhere;
      }

      .boot-fallback-error-mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid hsl(var(--boot-error) / 0.32);
        border-radius: 999px;
        color: hsl(var(--boot-error));
        font-size: 15px;
        font-weight: 700;
      }

      .boot-fallback-status {
        display: grid;
        gap: 4px;
      }

      .boot-fallback-icon {
        width: 64px;
        height: 64px;
        border-radius: 10px;
        box-shadow: 0 8px 22px hsl(var(--boot-shadow));
        object-fit: cover;
      }

      .boot-fallback-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid hsl(var(--boot-muted) / 0.24);
        border-top-color: hsl(var(--boot-muted));
        border-radius: 999px;
        animation: boot-fallback-spin 0.9s linear infinite;
      }

      .boot-fallback-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes boot-fallback-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-fallback-spinner {
          animation: none;
        }
      }

      @media (max-width: 1040px) {
        html,
        body {
          min-width: 0;
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="status" aria-label="Loading Rion Studio" aria-live="polite" aria-busy="true" data-startup-loading>
        <div class="boot-fallback-content">
          <img class="boot-fallback-icon" src="/src/assets/app-icon.png" alt="" aria-hidden="true" draggable="false" />
          <div class="boot-fallback-spinner" aria-hidden="true"></div>
          <span class="boot-fallback-label" data-startup-loading-label>Loading Rion Studio</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/startupFallback.ts"></script>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
