<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      (() => {
        try {
          const themeKey = "rion-studio-theme";
          const storedTheme = localStorage.getItem(themeKey);
          const resolvedTheme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
        const platform = navigator.platform.toLowerCase();
        const userAgent = navigator.userAgent.toLowerCase();
        document.documentElement.dataset.platform =
          platform.includes("mac") || userAgent.includes("mac os")
            ? "mac"
            : platform.includes("win") || userAgent.includes("windows")
              ? "windows"
              : "linux";
        document.documentElement.dataset.windowFullscreen = "false";
        document.documentElement.dataset.windowMaximized = "false";
        document.documentElement.dataset.windowFocused = "true";
        document.documentElement.dataset.windowsMica = "fallback";
      })();
    </script>
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body>
    <div class="windows-window-controls" data-windows-window-controls>
      <button type="button" data-window-control="minimize" aria-label="Minimize" title="Minimize">
        <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 8.5h10" /></svg>
      </button>
      <button type="button" data-window-control="maximize" aria-label="Maximize" title="Maximize">
        <svg aria-hidden="true" data-window-control-glyph="maximize" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" /></svg>
        <svg aria-hidden="true" data-window-control-glyph="restore" viewBox="0 0 16 16"><path d="M5.5 5.5V3.5h7v7h-2M3.5 5.5h7v7h-7z" /></svg>
      </button>
      <button type="button" data-window-control="close" aria-label="Close" title="Close">
        <svg aria-hidden="true" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8" /></svg>
      </button>
    </div>
    <div id="root">
      <div class="boot-fallback" role="status" aria-label="Loading Rion Studio" aria-live="polite" aria-busy="true" data-startup-loading>
        <div class="boot-fallback-content">
          <img class="boot-fallback-icon" src="/src/assets/app-icon.png" alt="" aria-hidden="true" draggable="false" />
          <div class="boot-fallback-spinner" aria-hidden="true"></div>
          <span class="boot-fallback-label" data-startup-loading-label>Loading Rion Studio</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/startupFallback.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
