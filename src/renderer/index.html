<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title></title>
    <script>
      (() => {
        try {
          const themeKey = "rion-studio-theme";
          const storedTheme = localStorage.getItem(themeKey);
          const resolvedTheme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <style>
      :root {
        --boot-background: 210 25% 95%;
        --boot-muted: 222 8% 39%;
        --boot-shadow: 222 32% 14% / 0.075;
      }

      :root[data-theme="dark"] {
        --boot-background: 0 0% 4%;
        --boot-muted: 0 0% 58%;
        --boot-shadow: 0 0% 0% / 0.12;
      }

      html,
      body {
        min-width: 960px;
        min-height: 640px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .boot-fallback {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: linear-gradient(
          180deg,
          hsl(var(--boot-background) / 0.58) 0%,
          hsl(var(--boot-background) / 0.36) 100%
        );
        box-sizing: border-box;
        -webkit-app-region: drag;
      }

      .boot-fallback-content {
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .boot-fallback-error {
        max-width: 560px;
        border: 1px solid hsl(var(--boot-muted) / 0.2);
        border-radius: 16px;
        padding: 28px;
        background: hsl(var(--boot-background) / 0.82);
        box-shadow: 0 18px 54px hsl(var(--boot-shadow));
        color: hsl(var(--boot-muted));
        text-align: center;
        -webkit-app-region: no-drag;
      }

      .boot-fallback-error h1 {
        margin: 0 0 10px;
        color: CanvasText;
        font-size: 20px;
      }

      .boot-fallback-error p {
        margin: 0;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .boot-fallback-icon {
        width: 64px;
        height: 64px;
        border-radius: 10px;
        box-shadow: 0 8px 22px hsl(var(--boot-shadow));
        object-fit: cover;
      }

      .boot-fallback-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid hsl(var(--boot-muted) / 0.24);
        border-top-color: hsl(var(--boot-muted));
        border-radius: 999px;
        animation: boot-fallback-spin 0.9s linear infinite;
      }

      @keyframes boot-fallback-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-fallback-spinner {
          animation: none;
        }
      }

      @media (max-width: 1040px) {
        html,
        body {
          min-width: 0;
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="status" aria-label="Loading Rion Studio" aria-live="polite">
        <div class="boot-fallback-content">
          <img class="boot-fallback-icon" src="/src/assets/app-icon.png" alt="" aria-hidden="true" draggable="false" />
          <div class="boot-fallback-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script>
      window.__rionShowStartupFailure = (message) => {
        const root = document.getElementById("root");
        if (!root) return;
        const shell = document.createElement("div");
        shell.className = "boot-fallback";
        shell.setAttribute("data-tauri-drag-region", "");
        const panel = document.createElement("section");
        panel.className = "boot-fallback-error";
        panel.setAttribute("role", "alert");
        const title = document.createElement("h1");
        title.textContent = "Rion Studio could not start";
        const detail = document.createElement("p");
        detail.textContent = typeof message === "string" && message ? message : "The desktop renderer did not become ready.";
        panel.append(title, detail);
        shell.append(panel);
        root.replaceChildren(shell);
      };
    </script>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
