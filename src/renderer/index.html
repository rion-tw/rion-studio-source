<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Rion Studio</title>
    <script>
      (() => {
        try {
          const themeKey = "rion-studio-theme";
          const storedTheme = localStorage.getItem(themeKey);
          const resolvedTheme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          document.documentElement.dataset.theme = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <style>
      :root {
        --boot-background: 210 25% 95%;
        --boot-foreground: 222 15% 10%;
        --boot-muted: 222 8% 39%;
        --boot-panel: 0 0% 100% / 0.38;
        --boot-border: 0 0% 100% / 0.32;
        --boot-shadow: 222 32% 14% / 0.075;
        --boot-highlight: 0 0% 100% / 0.16;
      }

      :root[data-theme="dark"] {
        --boot-background: 0 0% 4%;
        --boot-foreground: 0 0% 90%;
        --boot-muted: 0 0% 58%;
        --boot-panel: 0 0% 100% / 0.068;
        --boot-border: 0 0% 100% / 0.085;
        --boot-shadow: 0 0% 0% / 0.12;
        --boot-highlight: 0 0% 100% / 0.026;
      }

      html,
      body {
        min-width: 960px;
        min-height: 640px;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: hsl(var(--boot-foreground));
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .boot-fallback {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: linear-gradient(
          180deg,
          hsl(var(--boot-background) / 0.58) 0%,
          hsl(var(--boot-background) / 0.36) 100%
        );
        box-sizing: border-box;
        -webkit-app-region: drag;
      }

      .boot-fallback-card {
        display: grid;
        width: min(420px, calc(100vw - 48px));
        justify-items: center;
        gap: 16px;
        border: 1px solid hsl(var(--boot-border));
        border-radius: 8px;
        padding: 24px;
        background:
          linear-gradient(180deg, hsl(var(--boot-highlight)) 0%, transparent 54%),
          hsl(var(--boot-panel));
        box-shadow:
          inset 0 1px 0 hsl(var(--boot-highlight)),
          0 6px 18px hsl(var(--boot-shadow));
        text-align: center;
        -webkit-backdrop-filter: blur(24px) saturate(1.16);
        backdrop-filter: blur(24px) saturate(1.16);
      }

      .boot-fallback-mark {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border: 1px solid hsl(var(--boot-border));
        border-radius: 8px;
        background: hsl(var(--boot-panel));
        color: hsl(var(--boot-foreground));
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
      }

      .boot-fallback-title {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        line-height: 28px;
      }

      .boot-fallback-status {
        margin: 0;
        color: hsl(var(--boot-muted));
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
      }

      .boot-fallback-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid hsl(var(--boot-muted) / 0.24);
        border-top-color: hsl(var(--boot-muted));
        border-radius: 999px;
        animation: boot-fallback-spin 0.9s linear infinite;
      }

      @keyframes boot-fallback-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-fallback-spinner {
          animation: none;
        }
      }

      @media (max-width: 1040px) {
        html,
        body {
          min-width: 0;
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="status" aria-live="polite">
        <div class="boot-fallback-card">
          <div class="boot-fallback-mark" aria-hidden="true">F</div>
          <div>
            <p class="boot-fallback-title">Rion Studio</p>
            <p class="boot-fallback-status">Preparing role workspace</p>
          </div>
          <div class="boot-fallback-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
