<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'none'; style-src 'self'; img-src 'self' data:; connect-src 'none'" />
    <title>Rion Studio Role Slot</title>
    <link rel="stylesheet" href="/runtime-role-placeholder.css" />
  </head>
  <body data-rion-runtime-role-placeholder>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1 id="role-name"></h1>
      <p id="message"></p>
      <button id="claim" type="button" disabled>Opening…</button>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>
