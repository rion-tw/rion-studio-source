<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src ipc: http://ipc.localhost" />
    <title>Rion Studio Tabs</title>
    <link rel="stylesheet" href="/runtime-tabs.css" />
  </head>
  <body>
    <div id="window-identity" class="window-drag-surface" title="Rion Studio">
      <img id="window-icon" src="/src/assets/app-icon.png" alt="" aria-hidden="true" draggable="false" />
      <span id="window-name">Rion Studio</span>
    </div>
    <button id="scroll-left" class="scroll" type="button" aria-controls="tabs" hidden></button>
    <div id="tabs" role="tablist"></div>
    <button id="scroll-right" class="scroll" type="button" aria-controls="tabs" hidden></button>
    <button id="add" type="button" aria-label="Open role or workspace"></button>
    <div id="window-drag-region" class="window-drag-surface" aria-hidden="true"></div>
    <div id="window-controls" aria-label="Window controls">
      <button id="window-minimize" class="window-control" type="button" aria-label="Minimize">
        <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 8.5h10" /></svg>
      </button>
      <button id="window-maximize" class="window-control" type="button" aria-label="Maximize">
        <svg aria-hidden="true" data-window-control-glyph="maximize" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" /></svg>
        <svg aria-hidden="true" data-window-control-glyph="restore" viewBox="0 0 16 16"><path d="M5.5 5.5V3.5h7v7h-2M3.5 5.5h7v7h-7z" /></svg>
      </button>
      <button id="window-close" class="window-control close-window" type="button" aria-label="Close">
        <svg aria-hidden="true" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8" /></svg>
      </button>
    </div>
    <script type="module" src="/runtime-shell/runtimeTabStrip.ts"></script>
  </body>
</html>
